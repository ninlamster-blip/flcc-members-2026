<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Spiritual Battle: Devour the Darkness</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <a href="../" class="back-btn">← App</a>

  <div id="game-wrap">
    <div id="hud">
      <span id="score-val">0</span>
      <span id="level-val">LVL 1</span>
      <span id="hi-val">BEST: 0</span>
    </div>

    <div id="canvas-wrap">
      <canvas id="c"></canvas>
      <div id="power-banner"></div>
      <div id="level-flash" class="hidden">LEVEL UP!</div>
    </div>

    <div id="start-screen" class="overlay active">
      <div class="card">
        <div class="logo">⚔️</div>
        <h1>SPIRITUAL<br>BATTLE</h1>
        <p class="tagline">Devour the darkness. Advance in faith.</p>
        <div id="start-best">RECORD &nbsp;<span id="hi-display">0</span></div>
        <button id="btn-start" class="btn">ADVANCE</button>
        <p class="hint">Arrow keys / WASD / Swipe</p>
      </div>
    </div>

    <div id="over-screen" class="overlay">
      <div class="card">
        <h2>FALLEN</h2>
        <div class="stat">Victories <span id="over-score">0</span></div>
        <div class="stat">Battles Won <span id="over-level">1</span></div>
        <div id="new-rec" class="hidden">NEW RECORD ✝</div>
        <button id="btn-restart" class="btn">RISE AGAIN</button>
      </div>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
