    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <script type="module" crossorigin src="/run-the-race/dist/assets/index-LsRHjPlx.js"></script>
    <link rel="modulepreload" crossorigin href="/run-the-race/dist/assets/state-dg_CLfd2.js">
    <link rel="modulepreload" crossorigin href="/run-the-race/dist/assets/three-kX_EKA9e.js">
    <link rel="modulepreload" crossorigin href="/run-the-race/dist/assets/r3f-CotsnrkQ.js">
    <link rel="stylesheet" crossorigin href="/run-the-race/dist/assets/index-B9bMeHHI.css">
  </head>
  <body style="margin:0;background:#000;overflow:hidden;">
    <div id="root"></div>
    <div id="pre-load" style="position:fixed;inset:0;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;font-family:Georgia,serif;text-align:center;padding:24px">
      <div style="font-size:2.5rem;margin-bottom:16px">✝</div>
      <div style="font-size:1rem;letter-spacing:.15em;opacity:.6">Loading…</div>
    </div>
    <script>
      function showErr(msg) {
        var el = document.getElementById('pre-load');
        if (el) { el.innerHTML = '<div style="font-size:2rem;margin-bottom:12px">✝</div><div style="font-size:1rem;font-weight:700;margin-bottom:8px">Could not load game</div><div style="font-size:0.7rem;opacity:0.5;margin-bottom:20px;max-width:280px">' + msg + '</div><button onclick="location.reload()" style="padding:12px 28px;background:#FBBF24;color:#000;border:none;border-radius:12px;font-weight:700;font-size:0.9rem;cursor:pointer">Try Again</button>'; el.style.display='flex'; }
      }
      window.addEventListener('error', function(e) { showErr(e.message || 'Script error'); });
      window.addEventListener('unhandledrejection', function(e) { showErr((e.reason && (e.reason.message || String(e.reason))) || 'Module load failed'); });
      setTimeout(function() { if (document.getElementById('pre-load')) showErr('Timed out — tap Try Again'); }, 10000);
    </script>
  </body>
</html>
