<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Global Faith &amp; Intercession — FLCC</title>

  <!-- Same fonts as the main FLCC app -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,600;0,9..144,700;1,9..144,400&family=Geist:wght@300;400;500;600;700&display=swap" rel="stylesheet" />

  <script src="https://d3js.org/d3.v7.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/topojson-client@3/dist/topojson-client.min.js"></script>

  <style>
    /* ── Design tokens — identical to main FLCC app ─────────────── */
    :root {
      --bg:            #FAFAF5;
      --surface:       #FFFFFF;
      --ink:           #18181B;
      --ink-muted:     #52525B;
      --ink-subtle:    #A1A1AA;
      --border:        #E7E5DE;
      --border-strong: #D4D4D0;
      --accent:        #A33B2A;
      --accent-hover:  #8B2E20;
      --accent-soft:   #FBEBE7;
      --shadow-sm: 0 1px 2px rgba(0,0,0,.04), 0 4px 12px rgba(0,0,0,.06);
      --shadow:    0 1px 3px rgba(0,0,0,.06), 0 8px 24px rgba(0,0,0,.09);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--ink);
      font-family: 'Geist', ui-sans-serif, system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
      overflow: hidden;
    }

    /* ── App shell ────────────────────────────────────────────────── */
    #app {
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ── Header ───────────────────────────────────────────────────── */
    #header {
      flex-shrink: 0;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 10px 20px 9px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 7px;
    }

    #header h1 {
      font-family: 'Fraunces', Georgia, serif;
      font-size: clamp(0.9rem, 1.8vw, 1.2rem);
      font-weight: 700;
      letter-spacing: -0.02em;
      color: var(--ink);
    }

    #header p {
      font-size: 0.73rem;
      color: var(--ink-subtle);
      letter-spacing: 0.03em;
    }

    /* Mode toggle — matches app's btn style */
    #mode-toggle { display: flex; gap: 6px; }

    .mode-btn {
      font-family: 'Geist', sans-serif;
      font-size: 0.78rem;
      font-weight: 500;
      padding: 5px 14px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--ink-muted);
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .mode-btn.active   { background: var(--accent); border-color: var(--accent); color: #fff; }
    .mode-btn:hover:not(.active) { background: #F4F4F0; color: var(--ink); }

    /* Legend */
    #legend { display: flex; align-items: center; gap: 5px; font-size: 0.68rem; color: var(--ink-muted); }
    .legend-swatch { display: inline-block; width: 18px; height: 7px; border-radius: 2px; }

    /* ── Map ──────────────────────────────────────────────────────── */
    #map-wrap { flex: 1; min-height: 0; overflow: hidden; position: relative; }
    #world-map { width: 100%; height: 100%; display: block; }

    .country {
      stroke: #D0CAC0;
      stroke-width: 0.4;
      cursor: pointer;
      transition: stroke 0.15s, stroke-width 0.15s;
    }
    .country:hover { stroke: var(--accent); stroke-width: 1.2; }

    /* Persecution glow — uses the app's red accent family */
    @keyframes persecutionPulse {
      0%   { filter: drop-shadow(0 0 1px rgba(163,59,42,0.3)); }
      50%  { filter: drop-shadow(0 0 7px rgba(138,18,32,0.75)) drop-shadow(0 0 14px rgba(163,59,42,0.3)); }
      100% { filter: drop-shadow(0 0 1px rgba(163,59,42,0.3)); }
    }
    .glow-extreme  { animation: persecutionPulse 2.4s ease-in-out infinite; }
    .glow-veryhigh { animation: persecutionPulse 3.2s ease-in-out infinite; }
    .glow-high     { animation: persecutionPulse 4.2s ease-in-out infinite; }

    /* ── Tooltip ──────────────────────────────────────────────────── */
    #tooltip {
      position: fixed;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 6px 10px;
      font-size: 0.76rem;
      color: var(--ink);
      pointer-events: none;
      z-index: 500;
      display: none;
      box-shadow: var(--shadow-sm);
      line-height: 1.55;
    }

    /* ── Detail Sidebar ───────────────────────────────────────────── */
    #detail-panel {
      position: fixed;
      top: 0; right: -390px;
      width: min(360px, 94vw);
      height: 100vh;
      background: var(--surface);
      border-left: 1px solid var(--border);
      z-index: 300;
      transition: right 0.45s cubic-bezier(0.22, 1, 0.36, 1);
      display: flex;
      flex-direction: column;
      box-shadow: -4px 0 20px rgba(0,0,0,0.07);
    }
    #detail-panel.open { right: 0; }

    #panel-scroll {
      flex: 1;
      overflow-y: auto;
      padding: 18px 16px 80px;
    }
    #panel-scroll::-webkit-scrollbar { width: 4px; }
    #panel-scroll::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

    #close-panel {
      position: absolute;
      top: 12px; right: 12px;
      width: 28px; height: 28px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--ink-muted);
      cursor: pointer;
      font-size: 0.78rem;
      display: flex; align-items: center; justify-content: center;
      transition: all 0.15s;
      z-index: 5;
    }
    #close-panel:hover { background: var(--border); color: var(--ink); }

    /* Panel content styles — match app cards/typography */
    .panel-title {
      font-family: 'Fraunces', Georgia, serif;
      font-size: 1.25rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: var(--ink);
      line-height: 1.2;
      padding-right: 30px;
    }

    .persecution-badge {
      display: inline-block;
      padding: 2px 9px;
      border-radius: 999px;
      font-size: 0.67rem;
      font-weight: 600;
      letter-spacing: 0.04em;
      margin-top: 5px;
    }
    .badge-extreme  { background: #FEE2E2; color: #991B1B; }
    .badge-veryhigh { background: #FFEDD5; color: #9A3412; }
    .badge-high     { background: #FEF3C7; color: #92400E; }
    .badge-moderate { background: #F0FDF4; color: #166534; }
    .badge-low      { background: #F4F4F0; color: var(--ink-muted); }

    .divider { height: 1px; background: var(--border); margin: 12px 0; }

    .section-label {
      font-size: 0.63rem;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--ink-subtle);
      margin-bottom: 8px;
      margin-top: 14px;
    }

    .summary-text {
      font-size: 0.86rem;
      line-height: 1.65;
      color: var(--ink-muted);
    }

    .stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 7px; }
    .stat-card {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 8px 10px;
    }
    .stat-label { font-size: 0.63rem; color: var(--ink-subtle); margin-bottom: 3px; font-weight: 500; }
    .stat-value { font-size: 1rem; font-weight: 700; color: var(--ink); }
    .stat-value.accent { color: var(--accent); }

    .persecution-bar-track { height: 5px; background: var(--border); border-radius: 3px; overflow: hidden; margin-top: 4px; }
    .persecution-bar-fill  { height: 100%; border-radius: 3px; background: linear-gradient(90deg, #C88878, #8A1220); transition: width 0.9s ease; }

    .prayer-req-item {
      display: flex; align-items: flex-start; gap: 8px;
      padding: 6px 0; border-bottom: 1px solid var(--border);
    }
    .prayer-req-item:last-child { border-bottom: none; }
    .prayer-dot { flex-shrink: 0; width: 5px; height: 5px; border-radius: 50%; background: var(--accent); margin-top: 6px; }
    .prayer-req-text { font-size: 0.86rem; line-height: 1.55; color: var(--ink-muted); }

    .prayer-counter-wrap { text-align: center; padding: 12px 0 4px; }
    .prayer-number {
      font-family: 'Fraunces', Georgia, serif;
      font-size: 2rem; font-weight: 700;
      letter-spacing: -0.02em;
      color: var(--accent);
      transition: transform 0.25s ease;
    }
    .prayer-number.pulse { transform: scale(1.28); }

    .join-prayer-btn {
      width: 100%; padding: 10px 0;
      border-radius: 8px; border: none;
      background: var(--accent); color: #fff;
      font-family: 'Geist', sans-serif;
      font-size: 0.875rem; font-weight: 600;
      cursor: pointer;
      transition: all 0.15s ease;
      margin-top: 10px;
    }
    .join-prayer-btn:hover  { background: var(--accent-hover); transform: translateY(-1px); }
    .join-prayer-btn:active { transform: translateY(0); }

    /* ── Scripture banner ─────────────────────────────────────────── */
    #scripture-banner {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      height: 34px;
      background: var(--surface);
      border-top: 1px solid var(--border);
      display: flex; align-items: center;
      overflow: hidden; z-index: 200;
    }
    #scripture-track {
      display: flex; align-items: center;
      gap: 3.5rem; white-space: nowrap;
      will-change: transform;
    }
    .scripture-item {
      font-family: 'Fraunces', Georgia, serif;
      font-style: italic;
      font-size: 0.76rem;
      color: var(--ink-muted);
    }
    .scripture-ref { font-style: normal; font-weight: 600; color: var(--accent); margin-left: 4px; }
    .stream-prayer-item { font-size: 0.7rem; color: var(--ink-subtle); }

    /* ── Loading ──────────────────────────────────────────────────── */
    #loading {
      position: fixed; inset: 0;
      background: var(--bg);
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      z-index: 1000;
      transition: opacity 0.7s ease;
    }

    /* ── Fade-in ──────────────────────────────────────────────────── */
    @keyframes fadeSlideUp {
      from { opacity: 0; transform: translateY(12px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .fade-in-up { animation: fadeSlideUp 0.45s ease both; }

    ::-webkit-scrollbar { width: 5px; }
    ::-webkit-scrollbar-track { background: var(--bg); }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
  </style>
</head>

  8:"Albania",12:"Algeria",24:"Angola",32:"Argentina",36:"Australia",40:"Austria",50:"Bangladesh",56:"Belgium",64:"Bhutan",68:"Bolivia",70:"Bosnia & Herzegovina",76:"Brazil",96:"Brunei",100:"Bulgaria",104:"Myanmar",108:"Burundi",112:"Belarus",116:"Cambodia",120:"Cameroon",124:"Canada",140:"Central African Republic",144:"Sri Lanka",152:"Chile",156:"China",158:"Taiwan",170:"Colombia",178:"Republic of Congo",180:"DR Congo",188:"Costa Rica",191:"Croatia",192:"Cuba",203:"Czech Republic",204:"Benin",208:"Denmark",214:"Dominican Republic",218:"Ecuador",222:"El Salvador",231:"Ethiopia",232:"Eritrea",233:"Estonia",246:"Finland",250:"France",262:"Djibouti",266:"Gabon",268:"Georgia",276:"Germany",288:"Ghana",300:"Greece",320:"Guatemala",324:"Guinea",332:"Haiti",340:"Honduras",348:"Hungary",352:"Iceland",356:"India",360:"Indonesia",364:"Iran",368:"Iraq",372:"Ireland",376:"Israel",380:"Italy",384:"Côte d'Ivoire",388:"Jamaica",392:"Japan",398:"Kazakhstan",400:"Jordan",404:"Kenya",408:"North Korea",410:"South Korea",414:"Kuwait",417:"Kyrgyzstan",418:"Laos",422:"Lebanon",426:"Lesotho",428:"Latvia",430:"Liberia",434:"Libya",440:"Lithuania",450:"Madagascar",454:"Malawi",458:"Malaysia",462:"Maldives",466:"Mali",478:"Mauritania",484:"Mexico",496:"Mongolia",498:"Moldova",499:"Montenegro",504:"Morocco",508:"Mozambique",512:"Oman",516:"Namibia",524:"Nepal",528:"Netherlands",554:"New Zealand",558:"Nicaragua",562:"Niger",566:"Nigeria",578:"Norway",586:"Pakistan",591":"Panama",598:"Papua New Guinea",600:"Paraguay",604:"Peru",608:"Philippines",616:"Poland",620:"Portugal",626:"Timor-Leste",630:"Puerto Rico",634:"Qatar",642:"Romania",643:"Russia",646:"Rwanda",682:"Saudi Arabia",686:"Senegal",688:"Serbia",694:"Sierra Leone",702:"Singapore",703:"Slovakia",704:"Vietnam",706:"Somalia",708:"Somalia",710:"South Africa",716:"Zimbabwe",724:"Spain",728:"South Sudan",729:"Sudan",734:"Tanzania",740:"Suriname",748:"Eswatini",752:"Sweden",756:"Switzerland",760:"Syria",762:"Tajikistan",764:"Thailand",768:"Togo",780:"Trinidad & Tobago",784:"United Arab Emirates",792:"Turkey",795:"Turkmenistan",800:"Uganda",804:"Ukraine",807:"North Macedonia",818:"Egypt",826:"United Kingdom",834:"Tanzania",840:"United States",854:"Burkina Faso",858:"Uruguay",860:"Uzbekistan",862:"Venezuela",887:"Yemen",894:"Zambia",4:"Afghanistan",24:"Angola",31:"Azerbaijan",48:"Bahrain",51:"Armenia",76:"Brazil"
};

/* ============================================================
   SCRIPTURES for prayer stream banner
============================================================ */
const SCRIPTURES = [
  { ref:"Hebrews 13:3",        text:"Continue to remember those in prison as if you were together with them in prison, and those who are mistreated as if you yourselves were suffering." },
  { ref:"Matthew 5:10",        text:"Blessed are those who are persecuted because of righteousness, for theirs is the kingdom of heaven." },
  { ref:"1 Corinthians 12:26", text:"If one part suffers, every part suffers with it; if one part is honored, every part rejoices with it." },
  { ref:"Romans 8:18",         text:"I consider that our present sufferings are not worth comparing with the glory that will be revealed in us." },
  { ref:"Psalm 9:9",           text:"The LORD is a refuge for the oppressed, a stronghold in times of trouble." },
  { ref:"Isaiah 41:10",        text:"Do not fear, for I am with you; do not be dismayed, for I am your God. I will strengthen you and help you." },
  { ref:"Revelation 2:10",     text:"Be faithful, even to the point of death, and I will give you life as your victor's crown." },
  { ref:"Psalm 46:1",          text:"God is our refuge and strength, an ever-present help in trouble." },
  { ref:"Acts 4:29",           text:"Now, Lord, consider their threats and enable your servants to speak your word with great boldness." },
  { ref:"Romans 12:12",        text:"Be joyful in hope, patient in affliction, faithful in prayer." },
];

/* ── App state ──────────────────────────────────────────────── */
let currentMode = 'presence';
let selectedId  = null;
let prayerCounts = {};
let globalPrayers = 0;
let worldData = null;
let svg, g, projection, pathGen;

/* ============================================================
   COLOR SCALES — warm tones matching the app's aesthetic
============================================================ */
// Mode A: Christian presence % → neutral-to-amber scale
const presenceScale = d3.scaleThreshold()
  .domain([3, 10, 25, 45, 65, 80])
  .range([
    '#EAE6DE',  // 0–3%:   warm neutral (near-empty)
    '#DDD3BB',  // 3–10%:  light tan
    '#CEB882',  // 10–25%: straw
    '#BE9E50',  // 25–45%: amber
    '#A88430',  // 45–65%: deep amber
    '#8C6818',  // 65–80%: warm brown
    '#704E0A'   // 80%+:   dark amber-brown
  ]);

// Mode B: Persecution index → white-to-red scale (uses app's --accent family)
const persecutionScale = d3.scaleThreshold()
  .domain([15, 35, 55, 75])
  .range([
    '#EAE6DE',  // 0–15:   peaceful
    '#EDD4CC',  // 15–35:  low
    '#D09080',  // 35–55:  moderate
    '#B04840',  // 55–75:  high
    '#8A1220'   // 75+:    extreme (matches wwl2026 accent)
  ]);

/* ============================================================
   INIT
============================================================ */
async function init() {
  try {
    worldData = await d3.json('https://cdn.jsdelivr.net/npm/world-atlas@2/countries-110m.json');
    buildMap();
    buildLegend();
    buildScriptureBanner();
    const lo = document.getElementById('loading');
    lo.style.opacity = '0';
    setTimeout(() => lo.style.display = 'none', 700);
  } catch(e) {
    document.getElementById('loading').innerHTML =
      `<p style="color:var(--accent);padding:2rem;text-align:center;font-size:0.9rem;">Failed to load map data.<br>Please check your connection.</p>`;
    console.error(e);
  }
}

/* ============================================================
   MAP
============================================================ */
function buildMap() {
  const wrap = document.getElementById('map-wrap');
  const W = wrap.clientWidth, H = wrap.clientHeight;

  d3.select('#world-map').selectAll('*').remove();
  svg = d3.select('#world-map').attr('width', W).attr('height', H);

  // Ocean
  svg.append('rect').attr('width', W).attr('height', H).attr('fill', '#D8ECF4');

  projection = d3.geoNaturalEarth1().scale(W / 6.3).translate([W / 2, H / 2]);
  pathGen    = d3.geoPath().projection(projection);

  // Graticule
  svg.append('path')
    .datum(d3.geoGraticule()())
    .attr('d', pathGen)
    .attr('fill', 'none').attr('stroke', '#C0D4E0').attr('stroke-width', 0.35);

  // Sphere outline
  svg.append('path')
    .datum({ type:'Sphere' })
    .attr('d', pathGen)
    .attr('fill', 'none').attr('stroke', '#A8C4D4').attr('stroke-width', 0.7);

  g = svg.append('g').attr('class', 'countries-layer');

  const features = topojson.feature(worldData, worldData.objects.countries).features;
  const tooltip  = document.getElementById('tooltip');

  g.selectAll('.country')
    .data(features)
    .enter()
    .append('path')
    .attr('class', 'country')
    .attr('id', d => `c${d.id}`)
    .attr('d', pathGen)
    .attr('fill', d => colorFor(d.id))
    .on('mouseover', function(event, d) {
      const cd = COUNTRY_DATA[String(d.id)];
      const name = cd?.name || COUNTRY_NAMES[d.id] || null;
      if (!name) return;
      tooltip.style.display = 'block';
      tooltip.innerHTML =
        `<strong>${name}</strong><br/>` +
        (currentMode === 'presence'
          ? (cd ? `Christians: <strong>${cd.christianPercent}%</strong>` : 'Data not available')
          : (cd ? `Persecution index: <strong>${cd.persecutionIndex}/100</strong>` : 'Data not available'));
      d3.select(this).raise().attr('stroke', '#A33B2A').attr('stroke-width', 1.2);
    })
    .on('mousemove', e => {
      tooltip.style.left = (e.clientX + 12) + 'px';
      tooltip.style.top  = (e.clientY - 28) + 'px';
    })
    .on('mouseout', function() {
      tooltip.style.display = 'none';
      d3.select(this).attr('stroke', '#D0CAC0').attr('stroke-width', 0.4);
    })
    .on('click', (event, d) => {
      const id = String(d.id);
      const cd = COUNTRY_DATA[id];
      const name = cd?.name || COUNTRY_NAMES[d.id];
      if (name) showPanel(id, name);
    });

  // Zoom & pan
  svg.call(d3.zoom().scaleExtent([1, 10]).on('zoom', e => g.attr('transform', e.transform)));

  applyGlowClasses();
}

function colorFor(rawId) {
  const cd = COUNTRY_DATA[String(rawId)];
  if (!cd) return '#E4E0D8'; // no data: neutral
  return currentMode === 'presence'
    ? presenceScale(cd.christianPercent || 0)
    : persecutionScale(cd.persecutionIndex || 0);
}

function applyGlowClasses() {
  d3.selectAll('.country')
    .classed('glow-extreme', false)
    .classed('glow-veryhigh', false)
    .classed('glow-high', false);
  if (currentMode !== 'persecution') return;
  Object.entries(COUNTRY_DATA).forEach(([id, cd]) => {
    const sel = d3.select(`#c${id}`);
    if (sel.empty()) return;
    if      (cd.persecutionIndex >= 85) sel.classed('glow-extreme', true);
    else if (cd.persecutionIndex >= 65) sel.classed('glow-veryhigh', true);
    else if (cd.persecutionIndex >= 45) sel.classed('glow-high', true);
  });
}

/* ============================================================
   MODE TOGGLE
============================================================ */
function setMode(mode) {
  currentMode = mode;
  document.getElementById('btn-presence').classList.toggle('active', mode === 'presence');
  document.getElementById('btn-persecution').classList.toggle('active', mode === 'persecution');
  d3.selectAll('.country')
    .transition().duration(850).ease(d3.easeCubicInOut)
    .attr('fill', d => colorFor(d.id));
  applyGlowClasses();
  buildLegend();
}

/* ============================================================
   LEGEND
============================================================ */
function buildLegend() {
  const el = document.getElementById('legend');
  const [swatches, left, right] = currentMode === 'presence'
    ? [['#EAE6DE','#DDD3BB','#CEB882','#BE9E50','#A88430','#8C6818','#704E0A'], 'Fewer', 'More Christian']
    : [['#EAE6DE','#EDD4CC','#D09080','#B04840','#8A1220'], 'Peaceful', 'Extreme Persecution'];
  el.innerHTML =
    `<span>${left}</span>` +
    swatches.map(c => `<span class="legend-swatch" style="background:${c};border:1px solid #D4D0C8;"></span>`).join('') +
    `<span style="color:${currentMode==='presence'?'var(--ink-muted)':'var(--accent)'}">${right}</span>`;
}

/* ============================================================
   DETAIL PANEL
============================================================ */
function showPanel(id, fallbackName) {
  const cd   = COUNTRY_DATA[id];
  const name = cd?.name || fallbackName || 'Unknown Country';
  selectedId = id;
  if (!prayerCounts[id]) prayerCounts[id] = 0;

  const badgeMap = {
    extreme:  ['badge-extreme',  'Extreme Persecution'],
    veryhigh: ['badge-veryhigh', 'Very High Persecution'],
    high:     ['badge-high',     'High Persecution'],
    moderate: ['badge-moderate', 'Moderate Pressure'],
    low:      ['badge-low',      'Low Restriction'],
  };
  const level = cd?.persecutionLevel || 'low';
  const [badgeClass, badgeText] = badgeMap[level] || badgeMap.low;

  const pop          = cd?.population   || null;
  const pct          = cd != null ? cd.christianPercent : null;
  const persIdx      = cd?.persecutionIndex || 0;
  const christianCount = (pop && pct != null) ? Math.round((pop * pct) / 100) : null;

  // Determine whether this is a detailed entry (has prayerRequests), basic (only demographics), or no-data
  const hasDetail     = cd?.prayerRequests?.length > 0;
  const hasDemographics = (pop != null);

  // Generate generic prayer points for basic entries
  const genericPrayers = cd ? [
    `Lord, we lift up the people of ${name}. May Your kingdom come and Your will be done in this nation.`,
    pct <= 5
      ? `Open hearts across ${name} to hear the Gospel and respond to Your love.`
      : `Strengthen and deepen the faith of believers in ${name}.`,
    persIdx >= 50
      ? `Protect and comfort Christians facing persecution in ${name}.`
      : `May the church in ${name} be a light to its communities.`,
    `Raise up faithful leaders, pastors, and missionaries to serve the people of ${name}.`,
  ] : [];

  document.getElementById('panel-content').innerHTML = `
    <div class="fade-in-up">
      <div class="panel-title">${name}</div>
      ${cd ? `<span class="persecution-badge ${badgeClass}">${badgeText}</span>` : ''}

      <div class="divider"></div>

      ${cd?.summary ? `<p class="summary-text">${cd.summary}</p>` : ''}
      ${!cd ? `<p class="summary-text" style="color:var(--ink-subtle);font-style:italic;">Detailed data not yet available for this country. You can still stand in prayer.</p>` : ''}

      ${hasDemographics ? `
        <p class="section-label">Demographics</p>
        <div class="stat-grid">
          <div class="stat-card">
            <div class="stat-label">Total Population</div>
            <div class="stat-value">${fmtNum(pop)}</div>
          </div>
          <div class="stat-card">
            <div class="stat-label">Christian</div>
            <div class="stat-value accent">${pct != null ? pct + '%' : '—'}</div>
          </div>
          <div class="stat-card" style="grid-column:span 2;">
            <div class="stat-label">Estimated Believers</div>
            <div class="stat-value">${christianCount != null ? fmtNum(christianCount) : '—'}</div>
          </div>
        </div>
      ` : ''}

      ${persIdx > 5 ? `
        <div style="margin-top:12px;">
          <div style="display:flex;justify-content:space-between;font-size:0.65rem;color:var(--ink-subtle);margin-bottom:4px;font-weight:500;">
            <span>PERSECUTION INDEX</span><span>${persIdx} / 100</span>
          </div>
          <div class="persecution-bar-track">
            <div class="persecution-bar-fill" style="width:${persIdx}%;"></div>
          </div>
        </div>
      ` : ''}

      <p class="section-label">Prayer Requests</p>
      <div>
        ${(hasDetail ? cd.prayerRequests : genericPrayers).map(r => `
          <div class="prayer-req-item">
            <span class="prayer-dot"></span>
            <span class="prayer-req-text">${r}</span>
          </div>
        `).join('')}
      </div>

      <div class="divider"></div>

      <div class="prayer-counter-wrap">
        <div style="font-size:0.65rem;font-weight:600;letter-spacing:0.08em;color:var(--ink-subtle);margin-bottom:4px;">STANDING IN SOLIDARITY</div>
        <div class="prayer-number" id="prayer-num">${prayerCounts[id].toLocaleString()}</div>
        <div style="font-size:0.68rem;color:var(--ink-subtle);margin-top:2px;">prayers joined</div>
      </div>

      <button class="join-prayer-btn" onclick="joinPrayer('${id}', '${name.replace(/'/g,"\\'")}')">
        ✦ &nbsp; Join in Prayer
      </button>

      <div style="text-align:center;font-size:0.65rem;color:var(--ink-subtle);margin-top:8px;">
        ${globalPrayers.toLocaleString()} prayers across all nations
      </div>
    </div>
  `;

  document.getElementById('detail-panel').classList.add('open');
}

function closePanel() {
  document.getElementById('detail-panel').classList.remove('open');
  selectedId = null;
}

function joinPrayer(id, countryName) {
  if (!prayerCounts[id]) prayerCounts[id] = 0;
  prayerCounts[id]++;
  globalPrayers++;

  const el = document.getElementById('prayer-num');
  if (el) {
    el.textContent = prayerCounts[id].toLocaleString();
    el.classList.add('pulse');
    setTimeout(() => el.classList.remove('pulse'), 300);
  }

  const footer = document.querySelector('.join-prayer-btn + div');
  if (footer) footer.textContent = `${globalPrayers.toLocaleString()} prayers across all nations`;

  pushToStream(`🙏 Someone just prayed for ${countryName}`);
}

/* ============================================================
   SCRIPTURE BANNER
============================================================ */
function buildScriptureBanner() {
  const track = document.getElementById('scripture-track');
  const items = SCRIPTURES.map(s =>
    `<span class="scripture-item">"${s.text}"<span class="scripture-ref"> — ${s.ref}</span></span>`
  ).join('');
  track.innerHTML = items + items; // duplicate for seamless loop

  let offset = 0;
  (function scroll() {
    offset += 0.32;
    const half = track.scrollWidth / 2;
    if (offset >= half) offset = 0;
    track.style.transform = `translateX(-${offset}px)`;
    requestAnimationFrame(scroll);
  })();
}

function pushToStream(text) {
  const track = document.getElementById('scripture-track');
  const s = document.createElement('span');
  s.className = 'stream-prayer-item';
  s.textContent = text;
  track.appendChild(s);
  track.appendChild(s.cloneNode(true));
}

/* ── Utilities ────────────────────────────────────────────── */
function fmtNum(n) {
  if (!n && n !== 0) return '—';
  if (n >= 1e9) return (n / 1e9).toFixed(1) + 'B';
  if (n >= 1e6) return (n / 1e6).toFixed(1) + 'M';
  if (n >= 1e3) return Math.round(n / 1e3) + 'K';
  return n.toLocaleString();
}

let _resizeTimer;
window.addEventListener('resize', () => {
  clearTimeout(_resizeTimer);
  _resizeTimer = setTimeout(() => { if (worldData) buildMap(); }, 280);
});

init();
</script>
