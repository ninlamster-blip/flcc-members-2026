<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Global Faith &amp; Intercession — FLCC</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,600;0,9..144,700;1,9..144,400&family=Geist:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    /* ── Design tokens — identical to main FLCC app ──────────────── */
    :root {
      --bg:            #FAFAF5;
      --surface:       #FFFFFF;
      --ink:           #18181B;
      --ink-muted:     #52525B;
      --ink-subtle:    #A1A1AA;
      --border:        #E7E5DE;
      --border-strong: #D4D4D0;
      --accent:        #A33B2A;
      --accent-hover:  #8B2E20;
      --shadow-sm: 0 1px 2px rgba(0,0,0,.04), 0 4px 12px rgba(0,0,0,.06);
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--ink);
      font-family: 'Geist', ui-sans-serif, system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
      overflow: hidden;
    }
    #app { height: 100vh; display: flex; flex-direction: column; }

    /* ── Header ───────────────────────────────────────────────────── */
    #header {
      flex-shrink: 0;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 10px 20px 9px;
      display: flex; flex-direction: column; align-items: center; gap: 7px;
    }
    #header h1 {
      font-family: 'Fraunces', Georgia, serif;
      font-size: clamp(0.9rem, 1.8vw, 1.2rem);
      font-weight: 700; letter-spacing: -0.02em; color: var(--ink);
    }
    #header p { font-size: 0.73rem; color: var(--ink-subtle); letter-spacing: 0.03em; }
    #mode-toggle { display: flex; gap: 6px; }
    .mode-btn {
      font-family: 'Geist', sans-serif; font-size: 0.78rem; font-weight: 500;
      padding: 5px 14px; border-radius: 8px; border: 1px solid var(--border);
      background: var(--surface); color: var(--ink-muted); cursor: pointer;
      transition: all 0.15s ease;
    }
    .mode-btn.active   { background: var(--accent); border-color: var(--accent); color: #fff; }
    .mode-btn:hover:not(.active) { background: #F4F4F0; color: var(--ink); }
    #legend { display: flex; align-items: center; gap: 5px; font-size: 0.68rem; color: var(--ink-muted); }
    .legend-swatch { display: inline-block; width: 18px; height: 7px; border-radius: 2px; border: 1px solid rgba(0,0,0,0.07); }

    /* ── Map ──────────────────────────────────────────────────────── */
    #map-wrap { flex: 1; min-height: 0; overflow: hidden; position: relative; background: #D8ECF4; cursor: grab; }
    #map-wrap.dragging { cursor: grabbing; }
    #world-map { width: 100%; height: 100%; display: block; }
    /* Fill transitions handled by CSS — no JS animation library needed */
    .country {
      stroke: #D0CAC0; stroke-width: 0.4; cursor: pointer;
      transition: fill 0.7s ease, stroke 0.12s, stroke-width 0.12s;
    }
    .country:hover { stroke: var(--accent); stroke-width: 1.2; }

    /* Persecution pulse — app red accent family */
    @keyframes persecutionPulse {
      0%   { filter: drop-shadow(0 0 1px rgba(163,59,42,0.3)); }
      50%  { filter: drop-shadow(0 0 7px rgba(138,18,32,0.75)) drop-shadow(0 0 14px rgba(163,59,42,0.3)); }
      100% { filter: drop-shadow(0 0 1px rgba(163,59,42,0.3)); }
    }
    .glow-extreme  { animation: persecutionPulse 2.4s ease-in-out infinite; }
    .glow-veryhigh { animation: persecutionPulse 3.2s ease-in-out infinite; }
    .glow-high     { animation: persecutionPulse 4.2s ease-in-out infinite; }

    /* ── Tooltip ──────────────────────────────────────────────────── */
    #tooltip {
      position: fixed; background: var(--surface); border: 1px solid var(--border);
      border-radius: 8px; padding: 6px 10px; font-size: 0.76rem; color: var(--ink);
      pointer-events: none; z-index: 500; display: none;
      box-shadow: var(--shadow-sm); line-height: 1.55;
    }

    /* ── Sidebar ──────────────────────────────────────────────────── */
    #detail-panel {
      position: fixed; top: 0; right: -390px;
      width: min(360px, 94vw); height: 100vh;
      background: var(--surface); border-left: 1px solid var(--border);
      z-index: 300; transition: right 0.45s cubic-bezier(0.22,1,0.36,1);
      display: flex; flex-direction: column;
      box-shadow: -4px 0 20px rgba(0,0,0,.07);
    }
    #detail-panel.open { right: 0; }
    #panel-scroll { flex: 1; overflow-y: auto; padding: 18px 16px 80px; }
    #panel-scroll::-webkit-scrollbar { width: 4px; }
    #panel-scroll::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
    #close-panel {
      position: absolute; top: 12px; right: 12px;
      width: 28px; height: 28px; border-radius: 8px;
      border: 1px solid var(--border); background: var(--bg);
      color: var(--ink-muted); cursor: pointer; font-size: 0.78rem;
      display: flex; align-items: center; justify-content: center;
      transition: all 0.15s; z-index: 5;
    }
    #close-panel:hover { background: var(--border); color: var(--ink); }
    .panel-title {
      font-family: 'Fraunces', Georgia, serif; font-size: 1.25rem; font-weight: 700;
      letter-spacing: -0.02em; color: var(--ink); line-height: 1.2; padding-right: 30px;
    }
    .persecution-badge {
      display: inline-block; padding: 2px 9px; border-radius: 999px;
      font-size: 0.67rem; font-weight: 600; letter-spacing: 0.04em; margin-top: 5px;
    }
    .badge-extreme  { background: #FEE2E2; color: #991B1B; }
    .badge-veryhigh { background: #FFEDD5; color: #9A3412; }
    .badge-high     { background: #FEF3C7; color: #92400E; }
    .badge-moderate { background: #F0FDF4; color: #166534; }
    .badge-low      { background: #F4F4F0; color: var(--ink-muted); }
    .divider { height: 1px; background: var(--border); margin: 12px 0; }
    .section-label {
      font-size: 0.63rem; font-weight: 600; letter-spacing: 0.1em;
      text-transform: uppercase; color: var(--ink-subtle);
      margin-bottom: 8px; margin-top: 14px;
    }
    .summary-text { font-size: 0.86rem; line-height: 1.65; color: var(--ink-muted); }
    .stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 7px; }
    .stat-card {
      background: var(--bg); border: 1px solid var(--border); border-radius: 10px; padding: 8px 10px;
    }
    .stat-label { font-size: 0.63rem; color: var(--ink-subtle); margin-bottom: 3px; font-weight: 500; }
    .stat-value { font-size: 1rem; font-weight: 700; color: var(--ink); }
    .stat-value.accent { color: var(--accent); }
    .persecution-bar-track { height: 5px; background: var(--border); border-radius: 3px; overflow: hidden; margin-top: 4px; }
    .persecution-bar-fill  { height: 100%; border-radius: 3px; background: linear-gradient(90deg,#C88878,#8A1220); transition: width 0.9s ease; }
    .prayer-req-item {
      display: flex; align-items: flex-start; gap: 8px;
      padding: 6px 0; border-bottom: 1px solid var(--border);
    }
    .prayer-req-item:last-child { border-bottom: none; }
    .prayer-dot { flex-shrink: 0; width: 5px; height: 5px; border-radius: 50%; background: var(--accent); margin-top: 6px; }
    .prayer-req-text { font-size: 0.86rem; line-height: 1.55; color: var(--ink-muted); }
    .prayer-counter-wrap { text-align: center; padding: 12px 0 4px; }
    .prayer-number {
      font-family: 'Fraunces', Georgia, serif; font-size: 2rem; font-weight: 700;
      letter-spacing: -0.02em; color: var(--accent); transition: transform 0.25s ease;
    }
    .prayer-number.pulse { transform: scale(1.28); }
    .join-prayer-btn {
      width: 100%; padding: 10px 0; border-radius: 8px; border: none;
      background: var(--accent); color: #fff;
      font-family: 'Geist', sans-serif; font-size: 0.875rem; font-weight: 600;
      cursor: pointer; transition: all 0.15s ease; margin-top: 10px;
    }
    .join-prayer-btn:hover  { background: var(--accent-hover); transform: translateY(-1px); }
    .join-prayer-btn:active { transform: translateY(0); }

    /* ── Scripture banner ─────────────────────────────────────────── */
    #scripture-banner {
      position: fixed; bottom: 0; left: 0; right: 0; height: 34px;
      background: var(--surface); border-top: 1px solid var(--border);
      display: flex; align-items: center; overflow: hidden; z-index: 200;
    }
    #scripture-track {
      display: flex; align-items: center; gap: 3.5rem;
      white-space: nowrap; will-change: transform;
    }
    .scripture-item {
      font-family: 'Fraunces', Georgia, serif; font-style: italic;
      font-size: 0.76rem; color: var(--ink-muted);
    }
    .scripture-ref { font-style: normal; font-weight: 600; color: var(--accent); margin-left: 4px; }
    .stream-prayer-item { font-size: 0.7rem; color: var(--ink-subtle); }

    @keyframes fadeSlideUp {
      from { opacity: 0; transform: translateY(12px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .fade-in-up { animation: fadeSlideUp 0.45s ease both; }
    ::-webkit-scrollbar { width: 5px; }
    ::-webkit-scrollbar-track { background: var(--bg); }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

    /* ── Iframe-embed: hide redundant title when loaded inside main app ── */
    .in-iframe #header h1,
    .in-iframe #header > p { display: none; }
    .in-iframe #header { padding: 6px 20px 8px; }

  </style>
</head>
<body>
<div id="tooltip"></div>

<div id="app">
  <div id="header">
    <h1>Global Faith &amp; Intercession</h1>
    <p>Visualizing Global Christianity &amp; Persecuted Communities</p>
    <div id="mode-toggle">
      <button class="mode-btn active" id="btn-presence"    onclick="setMode('presence')">✦ Christian Presence</button>
      <button class="mode-btn"        id="btn-persecution" onclick="setMode('persecution')">🔥 Persecution Alert</button>
    </div>
    <div id="legend"></div>
    <div style="font-size:0.6rem;color:var(--ink-subtle);letter-spacing:0.05em;">v2025-06-13</div>
  </div>
  <div id="map-wrap">
    <svg id="world-map" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet"></svg>
  </div>
</div>

<div id="detail-panel">
  <button id="close-panel" onclick="closePanel()" title="Close">✕</button>
  <div id="panel-scroll"><div id="panel-content"></div></div>
</div>

<div id="scripture-banner"><div id="scripture-track"></div></div>

/* ── Color scales (tiny threshold function — no D3 needed) ── */
function makeScale(domain, range) {
  return v => range[domain.findIndex(t => v < t) + (domain.findIndex(t => v < t) === -1 ? 0 : 0)] ||
    (() => { for (let i = 0; i < domain.length; i++) if (v < domain[i]) return range[i]; return range[range.length - 1]; })();
}
// Simpler:
function threshold(domain, range) {
  return function(v) {
    for (let i = 0; i < domain.length; i++) if (v < domain[i]) return range[i];
    return range[range.length - 1];
  };
}

const presenceScale = threshold(
  [3, 10, 25, 45, 65, 80],
  ['#EAE6DE','#DDD3BB','#CEB882','#BE9E50','#A88430','#8C6818','#704E0A']
);
const persecutionScale = threshold(
  [15, 35, 55, 75],
  ['#EAE6DE','#EDD4CC','#D09080','#B04840','#8A1220']
);

function colorFor(id) {
  const cd = COUNTRY_DATA[String(id)];
  if (!cd) return '#E4E0D8';
  return currentMode === 'presence'
    ? presenceScale(cd.christianPercent || 0)
    : persecutionScale(cd.persecutionIndex || 0);
}

/* ── SVG rendering ───────────────────────────────────────── */
const NS = 'http://www.w3.org/2000/svg';

function buildMap() {
  const svgEl  = document.getElementById('world-map');
  const wrapEl = document.getElementById('map-wrap');

  svgEl.innerHTML = '';
  svgEl.setAttribute('viewBox', MAP_DATA.viewBox);

  // Ocean background (outside zoomed group so it fills the viewport)
  const ocean = document.createElementNS(NS, 'rect');
  ocean.setAttribute('width', '960'); ocean.setAttribute('height', '500');
  ocean.setAttribute('fill', '#D8ECF4');
  svgEl.appendChild(ocean);

  // Zoom/pan group
  const gEl = document.createElementNS(NS, 'g');
  gEl.setAttribute('id', 'map-g');

  // Graticule
  const grat = document.createElementNS(NS, 'path');
  grat.setAttribute('d', MAP_DATA.graticule);
  grat.setAttribute('fill', 'none');
  grat.setAttribute('stroke', '#C0D4E0');
  grat.setAttribute('stroke-width', '0.35');
  gEl.appendChild(grat);

  // Sphere outline
  const sphere = document.createElementNS(NS, 'path');
  sphere.setAttribute('d', MAP_DATA.sphere);
  sphere.setAttribute('fill', 'none');
  sphere.setAttribute('stroke', '#A8C4D4');
  sphere.setAttribute('stroke-width', '0.7');
  gEl.appendChild(sphere);

  // Countries
  for (const c of MAP_DATA.countries) {
    const p = document.createElementNS(NS, 'path');
    p.setAttribute('id', 'c' + c.id);
    p.setAttribute('class', 'country');
    p.setAttribute('d', c.d);
    p.setAttribute('fill', colorFor(c.id));
    p.dataset.id = c.id;
    gEl.appendChild(p);
  }

  svgEl.appendChild(gEl);
  setupZoom(svgEl, gEl, wrapEl);
  setupHover(svgEl);
  applyGlowClasses();
}

/* ── Zoom & pan (no D3 zoom needed) ─────────────────────── */
function setupZoom(svgEl, gEl, wrapEl) {
  let scale = 1, tx = 0, ty = 0;
  let dragging = false, lastX = 0, lastY = 0;
  let pinchDist = 0;

  function svgCoord(clientX, clientY) {
    const r = svgEl.getBoundingClientRect();
    return {
      x: (clientX - r.left) / r.width  * 960,
      y: (clientY - r.top)  / r.height * 500
    };
  }

  function constrain() {
    const minTx = -(scale - 1) * 960, maxTx = 0;
    const minTy = -(scale - 1) * 500, maxTy = 0;
    tx = Math.min(maxTx, Math.max(minTx, tx));
    ty = Math.min(maxTy, Math.max(minTy, ty));
  }

  function apply() {
    gEl.setAttribute('transform', `translate(${tx},${ty}) scale(${scale})`);
  }

  // Mouse wheel zoom
  svgEl.addEventListener('wheel', e => {
    e.preventDefault();
    const c = svgCoord(e.clientX, e.clientY);
    const factor = e.deltaY < 0 ? 1.15 : 1 / 1.15;
    const newScale = Math.min(8, Math.max(1, scale * factor));
    if (newScale === scale) return;
    const r = newScale / scale;
    tx = c.x - r * (c.x - tx);
    ty = c.y - r * (c.y - ty);
    scale = newScale;
    constrain();
    apply();
  }, { passive: false });

  // Pointer drag
  svgEl.addEventListener('pointerdown', e => {
    if (e.pointerType === 'touch') return; // handled by touch events
    dragging = true;
    lastX = e.clientX; lastY = e.clientY;
    svgEl.setPointerCapture(e.pointerId);
    wrapEl.classList.add('dragging');
  });
  svgEl.addEventListener('pointermove', e => {
    if (!dragging || e.pointerType === 'touch') return;
    const dx = (e.clientX - lastX) / svgEl.getBoundingClientRect().width  * 960;
    const dy = (e.clientY - lastY) / svgEl.getBoundingClientRect().height * 500;
    tx += dx; ty += dy;
    lastX = e.clientX; lastY = e.clientY;
    constrain(); apply();
  });
  svgEl.addEventListener('pointerup', e => {
    dragging = false;
    wrapEl.classList.remove('dragging');
  });

  // Touch pinch + drag
  let touches = {};
  svgEl.addEventListener('touchstart', e => {
    e.preventDefault();
    for (const t of e.changedTouches) touches[t.identifier] = { x: t.clientX, y: t.clientY };
    if (e.touches.length === 2) {
      const ts = Object.values(touches);
      pinchDist = Math.hypot(ts[1].x - ts[0].x, ts[1].y - ts[0].y);
    }
  }, { passive: false });

  svgEl.addEventListener('touchmove', e => {
    e.preventDefault();
    if (e.touches.length === 2) {
      const t0 = e.touches[0], t1 = e.touches[1];
      const newDist = Math.hypot(t1.clientX - t0.clientX, t1.clientY - t0.clientY);
      if (pinchDist > 0) {
        const r = newDist / pinchDist;
        const cx = (t0.clientX + t1.clientX) / 2;
        const cy = (t0.clientY + t1.clientY) / 2;
        const c = svgCoord(cx, cy);
        const newScale = Math.min(8, Math.max(1, scale * r));
        const ratio = newScale / scale;
        tx = c.x - ratio * (c.x - tx);
        ty = c.y - ratio * (c.y - ty);
        scale = newScale;
        constrain(); apply();
      }
      pinchDist = newDist;
    } else if (e.touches.length === 1) {
      const t = e.touches[0];
      const old = touches[t.identifier];
      if (old) {
        const dx = (t.clientX - old.x) / svgEl.getBoundingClientRect().width  * 960;
        const dy = (t.clientY - old.y) / svgEl.getBoundingClientRect().height * 500;
        tx += dx; ty += dy;
        constrain(); apply();
      }
      touches[t.identifier] = { x: t.clientX, y: t.clientY };
    }
  }, { passive: false });

  svgEl.addEventListener('touchend', e => {
    for (const t of e.changedTouches) delete touches[t.identifier];
    pinchDist = 0;
  });
}

/* ── Hover & click ───────────────────────────────────────── */
function setupHover(svgEl) {
  const tip = document.getElementById('tooltip');

  svgEl.addEventListener('mouseover', e => {
    const p = e.target.closest('.country');
    if (!p) return;
    hoveredEl = p;
    const id = p.dataset.id;
    const cd = COUNTRY_DATA[id];
    const name = cd?.name || COUNTRY_NAMES[+id] || null;
    if (!name) return;
    tip.style.display = 'block';
    tip.innerHTML = `<strong>${name}</strong><br/>` +
      (currentMode === 'presence'
        ? (cd ? `Christians: <strong>${cd.christianPercent}%</strong>` : 'Data not available')
        : (cd ? `Persecution index: <strong>${cd.persecutionIndex}/100</strong>` : 'Data not available'));
    p.setAttribute('stroke', '#A33B2A');
    p.setAttribute('stroke-width', '1.2');
  });
  svgEl.addEventListener('mouseout', e => {
    const p = e.target.closest('.country');
    if (!p) return;
    tip.style.display = 'none';
    p.setAttribute('stroke', '#D0CAC0');
    p.setAttribute('stroke-width', '0.4');
    hoveredEl = null;
  });
  svgEl.addEventListener('mousemove', e => {
    tip.style.left = (e.clientX + 12) + 'px';
    tip.style.top  = (e.clientY - 28) + 'px';
  });
  svgEl.addEventListener('click', e => {
    const p = e.target.closest('.country');
    if (!p) return;
    const id = p.dataset.id;
    const cd = COUNTRY_DATA[id];
    const name = cd?.name || COUNTRY_NAMES[+id];
    if (name) showPanel(id, name);
  });
}

/* ── Mode toggle ─────────────────────────────────────────── */
function setMode(mode) {
  currentMode = mode;
  document.getElementById('btn-presence').classList.toggle('active', mode === 'presence');
  document.getElementById('btn-persecution').classList.toggle('active', mode === 'persecution');
  // CSS transition on .country handles the fill animation
  document.querySelectorAll('.country').forEach(p => {
    p.setAttribute('fill', colorFor(p.dataset.id));
  });
  applyGlowClasses();
  buildLegend();
}

function applyGlowClasses() {
  document.querySelectorAll('.country').forEach(p => {
    p.classList.remove('glow-extreme', 'glow-veryhigh', 'glow-high');
  });
  if (currentMode !== 'persecution') return;
  Object.entries(COUNTRY_DATA).forEach(([id, cd]) => {
    const el = document.getElementById('c' + id);
    if (!el) return;
    if      (cd.persecutionIndex >= 85) el.classList.add('glow-extreme');
    else if (cd.persecutionIndex >= 65) el.classList.add('glow-veryhigh');
    else if (cd.persecutionIndex >= 45) el.classList.add('glow-high');
  });
}

/* ── Legend ──────────────────────────────────────────────── */
function buildLegend() {
  const el = document.getElementById('legend');
  const [swatches, left, right] = currentMode === 'presence'
    ? [['#EAE6DE','#DDD3BB','#CEB882','#BE9E50','#A88430','#8C6818','#704E0A'], 'Fewer', 'More Christian']
    : [['#EAE6DE','#EDD4CC','#D09080','#B04840','#8A1220'], 'Peaceful', 'Extreme Persecution'];
  el.innerHTML = `<span>${left}</span>` +
    swatches.map(c => `<span class="legend-swatch" style="background:${c};"></span>`).join('') +
    `<span style="color:${currentMode==='presence'?'var(--ink-muted)':'var(--accent)'}">${right}</span>`;
}

/* ── Detail Panel ────────────────────────────────────────── */
function showPanel(id, fallbackName) {
  const _base = COUNTRY_DATA[id];
  const cd    = _base ? { ..._base, ...(COUNTRY_EXTRA[id] || {}) } : null;
  const name = cd?.name || fallbackName || 'Unknown Country';
  selectedId = id;
  if (!prayerCounts[id]) prayerCounts[id] = 0;

  const badgeMap = {
    extreme:  ['badge-extreme',  'Extreme Persecution'],
    veryhigh: ['badge-veryhigh', 'Very High Persecution'],
    high:     ['badge-high',     'High Persecution'],
    moderate: ['badge-moderate', 'Moderate Pressure'],
    low:      ['badge-low',      'Low Restriction'],
  };
  const [badgeClass, badgeText] = badgeMap[cd?.persecutionLevel || 'low'] || badgeMap.low;
  const pop  = cd?.population   || null;
  const pct  = cd != null ? cd.christianPercent : null;
  const pidx = cd?.persecutionIndex || 0;
  const est  = (pop && pct != null) ? Math.round(pop * pct / 100) : null;
  const hasPrayers = cd?.prayerRequests?.length > 0;

  const genericPrayers = cd ? [
    `Lord, we lift up the people of ${name}. May Your kingdom come and Your will be done in this nation.`,
    pct <= 5 ? `Open hearts across ${name} to hear the Gospel and respond to Your love.`
             : `Strengthen and deepen the faith of believers in ${name}.`,
    pidx >= 50 ? `Protect and comfort Christians facing persecution in ${name}.`
               : `May the church in ${name} be a light to its communities.`,
    `Raise up faithful leaders, pastors, and missionaries to serve the people of ${name}.`,
  ] : [`Lord, we stand in prayer for the people of ${name}. Let Your kingdom come.`];

  document.getElementById('panel-content').innerHTML = `
    <div class="fade-in-up">
      <div class="panel-title">${name}</div>
      ${cd ? `<span class="persecution-badge ${badgeClass}">${badgeText}</span>` : ''}
      <div class="divider"></div>

      <p class="section-label">How to Pray</p>
      <div>${(hasPrayers ? cd.prayerRequests : genericPrayers).map(r =>
        `<div class="prayer-req-item"><span class="prayer-dot"></span><span class="prayer-req-text">${r}</span></div>`
      ).join('')}</div>
      <button class="join-prayer-btn" style="margin-top:14px;" onclick="joinPrayer('${id}','${name.replace(/'/g,"\\'")}')">✦ &nbsp; Join in Prayer</button>

      <div class="divider" style="margin-top:14px;"></div>

      ${cd?.summary ? `<p class="section-label">Background</p><p class="summary-text">${cd.summary}</p>` : ''}
      ${pop != null ? `
        <p class="section-label">Demographics</p>
        <div class="stat-grid">
          <div class="stat-card"><div class="stat-label">Total Population</div><div class="stat-value">${fmt(pop)}</div></div>
          <div class="stat-card"><div class="stat-label">Christian</div><div class="stat-value accent">${pct != null ? pct + '%' : '\u2014'}</div></div>
          <div class="stat-card" style="grid-column:span 2;"><div class="stat-label">Estimated Believers</div><div class="stat-value">${est != null ? fmt(est) : '\u2014'}</div></div>
        </div>
      ` : ''}
      ${pidx > 5 ? `
        <div style="margin-top:12px;">
          <div style="display:flex;justify-content:space-between;font-size:0.65rem;color:var(--ink-subtle);margin-bottom:4px;font-weight:500;">
            <span>PERSECUTION INDEX</span><span>${pidx} / 100</span></div>
          <div class="persecution-bar-track"><div class="persecution-bar-fill" style="width:${pidx}%;"></div></div>
        </div>
      ` : ''}
      <div class="prayer-counter-wrap" style="margin-top:16px;">
        <div style="font-size:0.65rem;font-weight:600;letter-spacing:0.08em;color:var(--ink-subtle);margin-bottom:4px;">STANDING IN SOLIDARITY</div>
        <div class="prayer-number" id="prayer-num">${prayerCounts[id].toLocaleString()}</div>
        <div style="font-size:0.68rem;color:var(--ink-subtle);margin-top:2px;">prayers joined</div>
      </div>
      <div style="text-align:center;font-size:0.65rem;color:var(--ink-subtle);margin-top:8px;" id="global-count">
        ${globalPrayers.toLocaleString()} prayers across all nations
      </div>
    </div>
  `;
  document.getElementById('detail-panel').classList.add('open');
}

function closePanel() {
  document.getElementById('detail-panel').classList.remove('open');
  selectedId = null;
}

function joinPrayer(id, name) {
  if (!prayerCounts[id]) prayerCounts[id] = 0;
  prayerCounts[id]++; globalPrayers++;
  const el = document.getElementById('prayer-num');
  if (el) { el.textContent = prayerCounts[id].toLocaleString(); el.classList.add('pulse'); setTimeout(() => el.classList.remove('pulse'), 300); }
  const gc = document.getElementById('global-count');
  if (gc) gc.textContent = globalPrayers.toLocaleString() + ' prayers across all nations';
  pushToStream('🙏 Someone just prayed for ' + name);
}

/* ── Scripture Banner ────────────────────────────────────── */
function buildBanner() {
  const track = document.getElementById('scripture-track');
  track.innerHTML = SCRIPTURES.map(s =>
    `<span class="scripture-item">"${s.text}"<span class="scripture-ref"> — ${s.ref}</span></span>`
  ).join('') + SCRIPTURES.map(s =>
    `<span class="scripture-item">"${s.text}"<span class="scripture-ref"> — ${s.ref}</span></span>`
  ).join('');
  let offset = 0;
  (function scroll() {
    offset += 0.32;
    if (offset >= track.scrollWidth / 2) offset = 0;
    track.style.transform = `translateX(-${offset}px)`;
    requestAnimationFrame(scroll);
  })();
}

function pushToStream(text) {
  const track = document.getElementById('scripture-track');
  [0, 1].forEach(() => {
    const s = document.createElement('span');
    s.className = 'stream-prayer-item'; s.textContent = text;
    track.appendChild(s);
  });
}

/* ── Utilities ───────────────────────────────────────────── */
function fmt(n) {
  if (n == null) return '—';
  if (n >= 1e9) return (n/1e9).toFixed(1)+'B';
  if (n >= 1e6) return (n/1e6).toFixed(1)+'M';
  if (n >= 1e3) return Math.round(n/1e3)+'K';
  return n.toLocaleString();
}

/* ── Boot ────────────────────────────────────────────────── */
buildMap();
buildLegend();
buildBanner();
</script>
</body>
</html>
