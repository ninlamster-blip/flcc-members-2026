<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Global Faith & Intercession: Visualizing Global Christianity and Persecuted Communities</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://d3js.org/d3.v7.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/topojson-client@3/dist/topojson-client.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Crimson+Pro:ital,wght@0,300;0,400;1,300;1,400&family=Lato:wght@300;400;700&display=swap" rel="stylesheet" />
  <style>
    /* ── Reset & Base ─────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg-deep:      #080c12;
      --bg-mid:       #0d1520;
      --bg-surface:   #111d2e;
      --bg-card:      rgba(17,29,46,0.85);
      --gold-bright:  #d4a53a;
      --gold-mid:     #a87c28;
      --gold-dim:     #5e4415;
      --ember:        #c0390f;
      --ember-dim:    #6b1e07;
      --text-main:    #e8dfc8;
      --text-muted:   #7a8a9a;
      --text-subtle:  #3a4a5a;
      --border:       #1e2d3e;
    }

    html, body {
      height: 100%;
      background: var(--bg-deep);
      color: var(--text-main);
      font-family: 'Lato', sans-serif;
      overflow: hidden;
    }

    /* ── Fonts ────────────────────────────────────────────────── */
    .font-cinzel   { font-family: 'Cinzel', serif; }
    .font-crimson  { font-family: 'Crimson Pro', serif; }

    /* ── Particle Canvas ──────────────────────────────────────── */
    #particle-canvas {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
    }

    /* ── App Shell ────────────────────────────────────────────── */
    #app {
      position: relative;
      z-index: 1;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ── Header ───────────────────────────────────────────────── */
    #header {
      flex-shrink: 0;
      padding: 14px 20px 10px;
      background: linear-gradient(180deg, rgba(8,12,18,0.98) 0%, rgba(8,12,18,0) 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }

    #header h1 {
      font-family: 'Cinzel', serif;
      font-size: clamp(1rem, 2.2vw, 1.6rem);
      color: var(--gold-bright);
      letter-spacing: 0.12em;
      text-align: center;
    }

    #header p {
      font-family: 'Crimson Pro', serif;
      font-size: clamp(0.75rem, 1.2vw, 0.9rem);
      color: var(--text-muted);
      letter-spacing: 0.08em;
      font-style: italic;
    }

    .gold-line {
      width: min(480px, 80vw);
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--gold-mid), transparent);
    }

    /* ── Mode Toggle Buttons ──────────────────────────────────── */
    #mode-toggle {
      display: flex;
      gap: 8px;
      margin-top: 4px;
    }

    .mode-btn {
      font-family: 'Lato', sans-serif;
      font-size: 0.75rem;
      letter-spacing: 0.06em;
      padding: 5px 16px;
      border-radius: 20px;
      border: 1px solid var(--border);
      background: rgba(255,255,255,0.03);
      color: var(--text-muted);
      cursor: pointer;
      transition: all 0.35s ease;
    }

    .mode-btn.active {
      background: linear-gradient(135deg, rgba(139,94,60,0.3), rgba(201,168,76,0.25));
      border-color: var(--gold-mid);
      color: var(--gold-bright);
    }

    .mode-btn:hover:not(.active) {
      border-color: var(--gold-dim);
      color: var(--text-main);
    }

    /* ── Legend ───────────────────────────────────────────────── */
    #legend {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-top: 2px;
      font-size: 0.68rem;
      color: var(--text-muted);
    }

    .legend-swatch {
      display: inline-block;
      width: 20px;
      height: 8px;
      border-radius: 2px;
    }

    /* ── Map Container ────────────────────────────────────────── */
    #map-wrap {
      flex: 1;
      min-height: 0;
      position: relative;
      overflow: hidden;
    }

    #world-map {
      width: 100%;
      height: 100%;
      display: block;
    }

    /* ── Country SVG paths ────────────────────────────────────── */
    .country {
      stroke: #1a2535;
      stroke-width: 0.4;
      cursor: pointer;
      transition: stroke 0.2s, stroke-width 0.2s;
    }

    .country:hover {
      stroke: var(--gold-bright);
      stroke-width: 1.2;
    }

    /* Persecution pulse keyframe — applied via JS class */
    @keyframes persecutionPulse {
      0%   { filter: drop-shadow(0 0 1px rgba(192,57,15,0.3)); }
      50%  { filter: drop-shadow(0 0 8px rgba(220,80,20,0.85)) drop-shadow(0 0 18px rgba(180,40,0,0.45)); }
      100% { filter: drop-shadow(0 0 1px rgba(192,57,15,0.3)); }
    }

    .glow-extreme  { animation: persecutionPulse 2.4s ease-in-out infinite; }
    .glow-veryhigh { animation: persecutionPulse 3.2s ease-in-out infinite; }
    .glow-high     { animation: persecutionPulse 4.0s ease-in-out infinite; }

    /* ── Tooltip ──────────────────────────────────────────────── */
    #tooltip {
      position: fixed;
      background: rgba(10,16,26,0.95);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 7px 11px;
      font-size: 0.78rem;
      color: var(--text-main);
      pointer-events: none;
      z-index: 500;
      display: none;
      max-width: 200px;
      line-height: 1.5;
      box-shadow: 0 4px 20px rgba(0,0,0,0.6);
    }

    /* ── Sidebar Panel ────────────────────────────────────────── */
    #detail-panel {
      position: fixed;
      top: 0;
      right: -400px;
      width: min(380px, 96vw);
      height: 100vh;
      background: linear-gradient(180deg, #0c1620 0%, #080e18 100%);
      border-left: 1px solid var(--border);
      z-index: 300;
      transition: right 0.55s cubic-bezier(0.22, 1, 0.36, 1);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    #detail-panel.open { right: 0; }

    #panel-scroll {
      flex: 1;
      overflow-y: auto;
      padding: 20px 18px 80px;
    }

    #panel-scroll::-webkit-scrollbar { width: 4px; }
    #panel-scroll::-webkit-scrollbar-track { background: transparent; }
    #panel-scroll::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

    #close-panel {
      position: absolute;
      top: 14px;
      right: 14px;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      border: 1px solid var(--border);
      background: rgba(255,255,255,0.06);
      color: var(--text-muted);
      cursor: pointer;
      font-size: 0.8rem;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
      z-index: 10;
    }

    #close-panel:hover { background: rgba(255,255,255,0.14); color: var(--text-main); }

    /* Panel inner elements */
    .panel-country-name {
      font-family: 'Cinzel', serif;
      font-size: 1.25rem;
      color: var(--gold-bright);
      line-height: 1.3;
      padding-right: 32px;
    }

    .persecution-badge {
      display: inline-block;
      padding: 2px 10px;
      border-radius: 12px;
      font-size: 0.68rem;
      font-weight: 700;
      letter-spacing: 0.05em;
      margin-top: 6px;
    }

    .badge-extreme  { background: rgba(192,57,15,0.18); color: #f87060; border: 1px solid rgba(192,57,15,0.4); }
    .badge-veryhigh { background: rgba(220,100,20,0.15); color: #fb8c50; border: 1px solid rgba(220,100,20,0.35); }
    .badge-high     { background: rgba(200,160,20,0.15); color: #f5c842; border: 1px solid rgba(200,160,20,0.35); }
    .badge-moderate { background: rgba(80,140,100,0.15); color: #72c28a; border: 1px solid rgba(80,140,100,0.3); }
    .badge-low      { background: rgba(80,100,120,0.15); color: #90a8b8; border: 1px solid rgba(80,100,120,0.3); }

    .section-label {
      font-family: 'Cinzel', serif;
      font-size: 0.65rem;
      letter-spacing: 0.14em;
      color: var(--gold-mid);
      margin-bottom: 8px;
      margin-top: 14px;
    }

    .summary-text {
      font-family: 'Crimson Pro', serif;
      font-size: 0.95rem;
      line-height: 1.6;
      color: #c0ccd8;
    }

    .stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }

    .stat-card {
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.07);
      border-radius: 7px;
      padding: 8px 10px;
    }

    .stat-label { font-size: 0.65rem; color: var(--text-muted); margin-bottom: 3px; }
    .stat-value { font-size: 1.05rem; font-weight: 700; color: var(--text-main); }
    .stat-value.gold  { color: var(--gold-bright); }
    .stat-value.amber { color: #fbbf24; }

    .persecution-bar-track {
      height: 5px;
      background: rgba(255,255,255,0.07);
      border-radius: 3px;
      overflow: hidden;
      margin-top: 4px;
    }

    .persecution-bar-fill {
      height: 100%;
      border-radius: 3px;
      background: linear-gradient(90deg, #7a2010, #c0390f);
      transition: width 1s ease;
    }

    .prayer-req-item {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      padding: 6px 0;
      border-bottom: 1px solid rgba(255,255,255,0.04);
    }

    .prayer-req-item:last-child { border-bottom: none; }

    .prayer-dot {
      flex-shrink: 0;
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: var(--gold-mid);
      margin-top: 6px;
    }

    .prayer-req-text {
      font-family: 'Crimson Pro', serif;
      font-size: 0.88rem;
      line-height: 1.55;
      color: #b8c8d4;
    }

    /* Prayer counter */
    .prayer-counter-wrap {
      text-align: center;
      padding: 12px 0 4px;
    }

    .prayer-number {
      font-family: 'Cinzel', serif;
      font-size: 2.2rem;
      color: var(--gold-bright);
      transition: transform 0.25s ease, color 0.25s ease;
    }

    .prayer-number.pulse {
      transform: scale(1.3);
      color: #fde68a;
    }

    .join-prayer-btn {
      width: 100%;
      padding: 11px 0;
      border-radius: 8px;
      border: none;
      background: linear-gradient(135deg, #7a4e20 0%, #c9a84c 100%);
      color: #fff;
      font-family: 'Cinzel', serif;
      font-size: 0.85rem;
      letter-spacing: 0.08em;
      cursor: pointer;
      transition: all 0.3s ease;
      margin-top: 12px;
    }

    .join-prayer-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 24px rgba(201,168,76,0.45);
    }

    .join-prayer-btn:active { transform: translateY(0); }

    /* ── Scripture Banner ─────────────────────────────────────── */
    #scripture-banner {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: 38px;
      background: linear-gradient(90deg, #080c12, #0d1826, #080c12);
      border-top: 1px solid var(--border);
      display: flex;
      align-items: center;
      overflow: hidden;
      z-index: 200;
    }

    #scripture-track {
      display: flex;
      align-items: center;
      gap: 3.5rem;
      white-space: nowrap;
      /* Width/animation set by JS after content is measured */
      will-change: transform;
    }

    .scripture-item {
      font-family: 'Crimson Pro', serif;
      font-style: italic;
      font-size: 0.8rem;
      color: var(--gold-mid);
      opacity: 0.85;
    }

    .scripture-ref {
      font-style: normal;
      color: var(--gold-bright);
      margin-left: 4px;
    }

    .stream-prayer-item {
      font-family: 'Lato', sans-serif;
      font-size: 0.72rem;
      color: #5a8aaa;
      letter-spacing: 0.03em;
    }

    /* ── Cross icon in loading screen ────────────────────────── */
    #loading {
      position: fixed;
      inset: 0;
      background: var(--bg-deep);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      transition: opacity 0.9s ease;
    }

    @keyframes crossGlow {
      0%, 100% { filter: drop-shadow(0 0 4px rgba(212,165,58,0.4)); }
      50%       { filter: drop-shadow(0 0 14px rgba(212,165,58,0.9)); }
    }

    #loading-cross { animation: crossGlow 2.5s ease-in-out infinite; }

    @keyframes fadeSlideUp {
      from { opacity: 0; transform: translateY(16px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .fade-in-up { animation: fadeSlideUp 0.6s ease both; }

    /* ── Responsive panel close on small screens ──────────────── */
    @media (max-width: 480px) {
      #detail-panel { width: 96vw; }
    }

    /* ── Custom scrollbars for body ───────────────────────────── */
    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-track { background: var(--bg-deep); }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
  </style>
</head>
<body>

<!-- ════════════════════════════════════════════════════════════
     LOADING SCREEN
════════════════════════════════════════════════════════════ -->
<div id="loading">
  <svg id="loading-cross" width="56" height="56" viewBox="0 0 56 56" fill="none">
    <rect x="22" y="4"  width="12" height="48" rx="3" fill="#d4a53a" opacity="0.92"/>
    <rect x="6"  y="18" width="44" height="12" rx="3" fill="#d4a53a" opacity="0.92"/>
  </svg>

</div>

<!-- ════════════════════════════════════════════════════════════

<div id="tooltip"></div>

<!-- ════════════════════════════════════════════════════════════
     MAIN APP
════════════════════════════════════════════════════════════ -->
<div id="app">

  <!-- Header -->
  <div id="header">
    <h1>Global Faith &amp; Intercession</h1>
    <p>Visualizing Global Christianity &amp; Persecuted Communities</p>
    <div class="gold-line"></div>
    <div id="mode-toggle">

  <div id="map-wrap">

</div>

<!-- ════════════════════════════════════════════════════════════
     DETAIL SIDEBAR
════════════════════════════════════════════════════════════ -->
<div id="detail-panel">
  <button id="close-panel" onclick="closePanel()" title="Close">✕</button>
  <div id="panel-scroll">

</div>

<!-- ════════════════════════════════════════════════════════════

════════════════════════════════════════════════════════════ -->
<div id="scripture-banner">
  <div id="scripture-track"></div>
</div>

    lo.style.opacity = '0';
    setTimeout(() => { lo.style.display = 'none'; }, 900);
  } catch(e) {
    document.getElementById('loading').innerHTML =
      `<p style="color:#f87171;font-family:Lato,sans-serif;padding:2rem;text-align:center;">
        Failed to load world data.<br>Please check your internet connection.
      </p>`;
    console.error(e);
  }
}

/* ============================================================
   MAP BUILD
============================================================ */
function buildMap() {
  const wrap  = document.getElementById('map-wrap');
  const W     = wrap.clientWidth;
  const H     = wrap.clientHeight;

  d3.select('#world-map').selectAll('*').remove();

  svg = d3.select('#world-map')
    .attr('width', W)
    .attr('height', H);

  // Ocean fill
  svg.append('rect')
    .attr('width', W).attr('height', H)
    .attr('fill', '#06090f');

  // Graticule (subtle grid)
  const graticule = d3.geoGraticule();
  projection = d3.geoNaturalEarth1()
    .scale(W / 6.3)
    .translate([W / 2, H / 2]);
  pathGen = d3.geoPath().projection(projection);

  svg.append('path')
    .datum(graticule())
    .attr('d', pathGen)
    .attr('fill', 'none')
    .attr('stroke', '#0c1520')
    .attr('stroke-width', 0.4);

  // Sphere outline
  svg.append('path')
    .datum({ type: 'Sphere' })
    .attr('d', pathGen)
    .attr('fill', 'none')
    .attr('stroke', '#1a2535')
    .attr('stroke-width', 0.8);

  g = svg.append('g').attr('class', 'countries-layer');

  const features = topojson.feature(worldData, worldData.objects.countries).features;
  const tooltip  = document.getElementById('tooltip');

  g.selectAll('.country')
    .data(features)
    .enter()
    .append('path')
    .attr('class', 'country')
    .attr('id', d => `c${d.id}`)
    .attr('d', pathGen)
    .attr('fill', d => colorForCountry(d.id))
    .on('mouseover', function(event, d) {
      const cd = COUNTRY_DATA[String(d.id)];
      if (!cd) return;
      tooltip.style.display = 'block';
      tooltip.innerHTML =
        `<strong style="color:#d4a53a;">${cd.name}</strong><br/>` +
        (currentMode === 'presence'
          ? `Christian pop: <span style="color:#fbbf24;">${cd.christianPercent}%</span>`
          : `Persecution index: <span style="color:#f87171;">${cd.persecutionIndex}/100</span>`);
      d3.select(this)
        .raise()
        .attr('stroke', '#d4a53a')
        .attr('stroke-width', 1.4);
    })
    .on('mousemove', event => {
      tooltip.style.left = (event.clientX + 14) + 'px';
      tooltip.style.top  = (event.clientY - 30) + 'px';
    })
    .on('mouseout', function() {
      tooltip.style.display = 'none';
      d3.select(this)
        .attr('stroke', '#1a2535')
        .attr('stroke-width', 0.4);
    })
    .on('click', (event, d) => {
      const cd = COUNTRY_DATA[String(d.id)];
      if (cd) showPanel(String(d.id));
    });

  // Zoom & pan
  const zoom = d3.zoom()
    .scaleExtent([1, 10])
    .on('zoom', e => g.attr('transform', e.transform));
  svg.call(zoom);

  applyGlowClasses();
}

function colorForCountry(rawId) {
  const cd = COUNTRY_DATA[String(rawId)];
  if (!cd) return '#0d1522';
  return currentMode === 'presence'
    ? presenceScale(cd.christianPercent || 0)
    : persecutionScale(cd.persecutionIndex || 0);
}

/* Apply CSS glow animation classes to persecuted countries */
function applyGlowClasses() {
  // Remove all glow classes first
  d3.selectAll('.country')
    .classed('glow-extreme', false)
    .classed('glow-veryhigh', false)
    .classed('glow-high', false);

  if (currentMode !== 'persecution') return;

  Object.entries(COUNTRY_DATA).forEach(([id, cd]) => {
    const sel = d3.select(`#c${id}`);
    if (sel.empty()) return;
    if (cd.persecutionIndex >= 85)      sel.classed('glow-extreme', true);
    else if (cd.persecutionIndex >= 65) sel.classed('glow-veryhigh', true);
    else if (cd.persecutionIndex >= 45) sel.classed('glow-high', true);
  });
}

/* ============================================================
   MODE TOGGLE
============================================================ */
function setMode(mode) {
  currentMode = mode;
  document.getElementById('btn-presence').classList.toggle('active', mode === 'presence');
  document.getElementById('btn-persecution').classList.toggle('active', mode === 'persecution');

  d3.selectAll('.country')
    .transition()
    .duration(900)
    .ease(d3.easeCubicInOut)
    .attr('fill', d => colorForCountry(d.id));

  applyGlowClasses();
  buildLegend();
}

/* ============================================================
   LEGEND
============================================================ */
function buildLegend() {
  const el = document.getElementById('legend');
  const swatches = currentMode === 'presence'
    ? ['#0e1620','#132030','#1a3050','#1e4570','#4a4018','#7a6020','#a88030']
    : ['#0e1620','#1a1a20','#3a1e18','#6a1a10','#a01010'];

  const [leftLabel, rightLabel] = currentMode === 'presence'
    ? ['Fewer Christians', 'More Christians']
    : ['Peaceful', 'Extreme Persecution'];

  el.innerHTML =
    `<span>${leftLabel}</span>` +
    swatches.map(c =>
      `<span class="legend-swatch" style="background:${c};"></span>`
    ).join('') +
    `<span style="color:${currentMode === 'presence' ? '#d4a53a' : '#f87171'}">${rightLabel}</span>`;
}

/* ============================================================
   COUNTRY DETAIL PANEL
============================================================ */
function showPanel(id) {
  const cd = COUNTRY_DATA[id];
  if (!cd) return;
  selectedId = id;
  if (!prayerCounts[id]) prayerCounts[id] = 0;

  const badgeMap = {
    extreme:  ['badge-extreme',  'Extreme Persecution'],
    veryhigh: ['badge-veryhigh', 'Very High Persecution'],
    high:     ['badge-high',     'High Persecution'],
    moderate: ['badge-moderate', 'Moderate Pressure'],
    low:      ['badge-low',      'Low Restriction']
  };
  const [badgeClass, badgeText] = badgeMap[cd.persecutionLevel] || badgeMap.low;

  const christianCount = Math.round((cd.population * cd.christianPercent) / 100);

  document.getElementById('panel-content').innerHTML = `
    <div class="fade-in-up">
      <div class="panel-country-name">${cd.name}</div>
      <span class="persecution-badge ${badgeClass}">${badgeText}</span>

      <div class="gold-line" style="width:100%;margin:12px 0;"></div>

      <p class="summary-text">${cd.summary}</p>

      <p class="section-label">DEMOGRAPHICS</p>
      <div class="stat-grid">
        <div class="stat-card">
          <div class="stat-label">Total Population</div>
          <div class="stat-value">${fmtNum(cd.population)}</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">Christian %</div>
          <div class="stat-value gold">${cd.christianPercent}%</div>
        </div>
        <div class="stat-card" style="grid-column:span 2;">
          <div class="stat-label">Estimated Believers</div>
          <div class="stat-value amber">${fmtNum(christianCount)}</div>
        </div>
      </div>

      ${cd.persecutionIndex > 5 ? `
      <div style="margin-top:12px;">
        <div style="display:flex;justify-content:space-between;font-size:0.68rem;color:var(--text-muted);margin-bottom:4px;">
          <span>Persecution Index</span>
          <span>${cd.persecutionIndex} / 100</span>
        </div>
        <div class="persecution-bar-track">
          <div class="persecution-bar-fill" style="width:${cd.persecutionIndex}%;"></div>
        </div>
      </div>
      ` : ''}

      <p class="section-label">PRAYER REQUESTS</p>
      <div>
        ${cd.prayerRequests.map(r => `
          <div class="prayer-req-item">
            <span class="prayer-dot"></span>
            <span class="prayer-req-text">${r}</span>
          </div>
        `).join('')}
      </div>

      <div class="gold-line" style="width:100%;margin:14px 0;"></div>

      <div class="prayer-counter-wrap">
        <div style="font-size:0.7rem;color:var(--text-muted);margin-bottom:4px;letter-spacing:0.06em;">
          STANDING IN SOLIDARITY
        </div>
        <div class="prayer-number" id="prayer-num">${prayerCounts[id].toLocaleString()}</div>
        <div style="font-size:0.68rem;color:var(--text-muted);margin-top:2px;">prayers joined</div>
      </div>

      <button class="join-prayer-btn" onclick="joinPrayer('${id}')">
        ✦ &nbsp; Join in Prayer
      </button>

      <div style="text-align:center;font-size:0.65rem;color:var(--text-subtle);margin-top:10px;">
        ${globalPrayers.toLocaleString()} total prayers across all nations
      </div>
    </div>
  `;

  document.getElementById('detail-panel').classList.add('open');
}

function closePanel() {
  document.getElementById('detail-panel').classList.remove('open');
  selectedId = null;
}

function joinPrayer(id) {
  if (!prayerCounts[id]) prayerCounts[id] = 0;
  prayerCounts[id]++;
  globalPrayers++;

  const el = document.getElementById('prayer-num');
  if (el) {
    el.textContent = prayerCounts[id].toLocaleString();
    el.classList.add('pulse');
    setTimeout(() => el.classList.remove('pulse'), 350);
  }

  // Update global count footer
  const footer = document.querySelector('.join-prayer-btn + div');
  if (footer) footer.textContent = `${globalPrayers.toLocaleString()} total prayers across all nations`;

  // Add to live stream
  pushToStream(`🙏 Someone just prayed for ${COUNTRY_DATA[id]?.name || 'a nation'}`);
}

/* ============================================================
   SCRIPTURE BANNER
   Smooth infinite-scroll using JS animation for reliability
============================================================ */
function buildScriptureBanner() {
  const track = document.getElementById('scripture-track');

  // Build items: scriptural verses + a few live-prayer placeholders
  const itemsHTML = SCRIPTURES.map(s =>
    `<span class="scripture-item">"${s.text}" <span class="scripture-ref">— ${s.ref}</span></span>`
  ).join('');

  // Duplicate for seamless loop
  track.innerHTML = itemsHTML + itemsHTML;

  // Animate with JS requestAnimationFrame (more reliable than pure CSS for dynamic content)
  let offset = 0;
  const speed = 0.35; // px per frame

  function scrollBanner() {
    offset += speed;
    const half = track.scrollWidth / 2;
    if (offset >= half) offset = 0;
    track.style.transform = `translateX(-${offset}px)`;
    requestAnimationFrame(scrollBanner);
  }

  requestAnimationFrame(scrollBanner);
}

function pushToStream(text) {
  const track = document.getElementById('scripture-track');
  const span = document.createElement('span');
  span.className = 'stream-prayer-item';
  span.textContent = text;
  track.appendChild(span);
  // Clone into the duplicate half for seamless loop
  track.appendChild(span.cloneNode(true));
}

/* ============================================================
   PARTICLE SYSTEM
   Ambient floating particles — two hues: gold & deep blue
============================================================ */
function startParticles() {
  const canvas = document.getElementById('particle-canvas');
  const ctx    = canvas.getContext('2d');

  function resize() {
    canvas.width  = window.innerWidth;
    canvas.height = window.innerHeight;
  }
  resize();
  window.addEventListener('resize', resize);

  // Spawn particles
  const particles = Array.from({ length: 90 }, () => ({
    x:     Math.random() * canvas.width,
    y:     Math.random() * canvas.height,
    r:     Math.random() * 1.4 + 0.3,
    vx:    (Math.random() - 0.5) * 0.25,
    vy:    (Math.random() - 0.5) * 0.25,
    alpha: Math.random() * 0.45 + 0.07,
    hue:   Math.random() > 0.65 ? 42 : 215  // gold | steel-blue
  }));

  function frame() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    particles.forEach(p => {
      p.x += p.vx;
      p.y += p.vy;
      if (p.x < 0) p.x = canvas.width;
      if (p.x > canvas.width)  p.x = 0;
      if (p.y < 0) p.y = canvas.height;
      if (p.y > canvas.height) p.y = 0;

      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      ctx.fillStyle = `hsla(${p.hue}, 55%, 55%, ${p.alpha})`;
      ctx.fill();
    });
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
}

/* ============================================================
   UTILITY
============================================================ */
function fmtNum(n) {
  if (n >= 1e9) return (n / 1e9).toFixed(1) + 'B';
  if (n >= 1e6) return (n / 1e6).toFixed(1) + 'M';
  if (n >= 1e3) return Math.round(n / 1e3) + 'K';
  return n.toLocaleString();
}

// Rebuild map on window resize
let resizeTimer;
window.addEventListener('resize', () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => { if (worldData) buildMap(); }, 300);
});

/* ── Boot ── */
init();
</script>
