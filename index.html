// ── Sermon Notes Modal ────────────────────────────────────────────
function SermonNotesModal({ noteId, meta, sermonNotes, onSave, onDelete, onClose }) {
  const existing  = sermonNotes[noteId] || {};
  const formRef   = useRef({
    title: existing.title || '', body: existing.body || '',
    keyVerse: existing.keyVerse || '', prayerRequests: existing.prayerRequests || '',
    actionPoints: existing.actionPoints || '', favoriteQuote: existing.favoriteQuote || '',
  });
  const [form, setFormState] = useState(formRef.current);
  const setForm = patch => { formRef.current = { ...formRef.current, ...patch }; setFormState(f => ({ ...f, ...patch })); };

  const [view,       setView]        = useState('editor');
  const [sectOpen,   setSectOpen]    = useState(!!(existing.keyVerse || existing.prayerRequests || existing.actionPoints || existing.favoriteQuote));
  const [saveStatus, setSaveStatus]  = useState('');
  const [closing,    setClosing]     = useState(false);
  const [jSearch,    setJSearch]     = useState('');
  const saveTimer   = useRef(null);

  // ── Camera / AI scan state ──────────────────────────────────────────────────
  const cameraInputRef = useRef(null);
  const [scanState,    setScanState]    = useState('idle');
  const [scanResult,   setScanResult]   = useState('');
  const [scanPreview,  setScanPreview]  = useState('');
  const [scanProgress, setScanProgress] = useState(0);
  const [scanMsg,      setScanMsg]      = useState('');

  // ── Live speech transcription (Web Speech API) ──────────────────────────────
  const recognitionRef = useRef(null);
  const liveBufferRef  = useRef('');   // accumulates confirmed words
  const txBodyRef      = useRef(form.body); // tracks latest body for append
  const [txState,   setTxState]   = useState('idle'); // idle | listening | error
  const [txInterim, setTxInterim] = useState('');
  const [txError,   setTxError]   = useState('');
  const [txLang,    setTxLang]    = useState('fil-PH'); // fil-PH = Filipino/Taglish, en-PH = English
  const SpeechRec = typeof window !== 'undefined' &&
    (window.SpeechRecognition || window.webkitSpeechRecognition);

  // Keep txBodyRef in sync
  useEffect(() => { txBodyRef.current = form.body; }, [form.body]);

  const startTranscription = () => {
    if (!SpeechRec) {
      setTxError('Speech recognition not supported. Use Safari on iPhone or Chrome on Android.');
      setTxState('error'); return;
    }
    if (recognitionRef.current) { try { recognitionRef.current.stop(); } catch {} }

    const r = new SpeechRec();
    r.continuous     = true;
    r.interimResults = true;
    r.lang           = txLang;  // fil-PH handles Tagalog/Taglish; en-PH for English-only

    r.onresult = evt => {
      let interim = '';
      for (let i = evt.resultIndex; i < evt.results.length; i++) {
        const t = evt.results[i][0].transcript;
        if (evt.results[i].isFinal) {
          liveBufferRef.current += (liveBufferRef.current ? ' ' : '') + t.trim();
        } else {
          interim += t;
        }
      }
      setTxInterim(interim);
    };

    r.onerror = evt => {
      if (evt.error === 'no-speech' || evt.error === 'aborted') return;
      if (evt.error === 'not-allowed') {
        setTxError('Microphone blocked. Allow mic access in Settings → Safari → Microphone.');
        setTxState('error'); return;
      }
      setTxError('Mic error: ' + evt.error);
      setTxState('error');
    };

    r.onend = () => {
      // iOS times out after ~60s — auto-restart to stay alive
      if (r._alive) { try { r.start(); } catch {} }
    };

    r._alive = true;
    recognitionRef.current = r;
    liveBufferRef.current = '';
    setTxInterim(''); setTxError('');
    try { r.start(); setTxState('listening'); }
    catch (e) { setTxError('Could not start mic. ' + e.message); setTxState('error'); }
  };

  const stopAndSave = () => {
    if (recognitionRef.current) {
      recognitionRef.current._alive = false;
      try { recognitionRef.current.stop(); } catch {}
      recognitionRef.current = null;
    }
    setTxState('idle'); setTxInterim('');
    const captured = liveBufferRef.current.trim();
    if (captured) {
      const newBody = txBodyRef.current
        ? txBodyRef.current.trimEnd() + '\n\n' + captured
        : captured;
      setForm({ body: newBody });
      triggerSave({ body: newBody });
    }
    liveBufferRef.current = '';
  };

  const discardTranscription = () => {
    if (recognitionRef.current) {
      recognitionRef.current._alive = false;
      try { recognitionRef.current.stop(); } catch {}
      recognitionRef.current = null;
    }
    setTxState('idle'); setTxInterim('');
    liveBufferRef.current = '';
  };

  // Cleanup on unmount
  useEffect(() => () => {
    if (recognitionRef.current) {
      recognitionRef.current._alive = false;
      try { recognitionRef.current.stop(); } catch {}
    }
  }, []);
  const preprocessImage = (file) => new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = ev => {
      const img = new Image();
      img.onload = () => {
        const MAX = 1920;
        const ratio = Math.min(MAX / img.width, MAX / img.height, 1);
        const W = Math.round(img.width  * ratio);
        const H = Math.round(img.height * ratio);

        const canvas = document.createElement('canvas');
        canvas.width = W; canvas.height = H;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, W, H);

        const imageData = ctx.getImageData(0, 0, W, H);
        const d = imageData.data;

        // ── Step 1: detect dark-background slide (projector screen) ──────
        // Sample ~500 pixels and measure average luminance
        let totalLum = 0, samples = 0;
        const step = Math.max(1, Math.floor(d.length / (4 * 500)));
        for (let i = 0; i < d.length; i += 4 * step) {
          totalLum += 0.2126 * d[i] + 0.7152 * d[i+1] + 0.0722 * d[i+2];
          samples++;
        }
        const avgLum = totalLum / (samples || 1);
        // Dark background if average luminance < 110
        const isDarkSlide = avgLum < 110;

        // ── Step 2: pixel-level processing ───────────────────────────────
        for (let i = 0; i < d.length; i += 4) {
          let r = d[i], g = d[i+1], b = d[i+2];

          // Boost yellow text first — very common in Tagalog church slides
          // Yellow: high R+G, low B
          if (r > 180 && g > 150 && b < 100) {
            r = 255; g = 255; b = 0;
          }

          // Weighted greyscale
          let grey = 0.2126 * r + 0.7152 * g + 0.0722 * b;

          if (isDarkSlide) {
            // INVERT so text becomes dark on white — Tesseract reads this best
            grey = 255 - grey;
            // Extra contrast: push text darker, background whiter
            if (grey < 140) grey = Math.max(0,   grey - 50);
            else            grey = Math.min(255, grey + 40);
          } else {
            // Light slide — normal contrast boost
            const contrast = 1.7;
            const f = (259 * (contrast + 255)) / (255 * (259 - contrast));
            grey = Math.max(0, Math.min(255, f * (grey - 128) + 128));
            if      (grey < 90)  grey = Math.max(0,   grey - 30);
            else if (grey > 180) grey = Math.min(255, grey + 30);
          }

          d[i] = d[i+1] = d[i+2] = grey;
          d[i+3] = 255;
        }

        ctx.putImageData(imageData, 0, 0);
        resolve({ dataUrl: canvas.toDataURL('image/png', 1.0), isDarkSlide });
      };
      img.onerror = () => reject(new Error('Could not load image'));
      img.src = ev.target.result;
    };
    reader.onerror = () => reject(new Error('Could not read file'));
    reader.readAsDataURL(file);
  });

  // ── Post-process OCR text — clean common recognition errors ───────────────
  const cleanOCRText = (raw) => raw
    .replace(/\f/g, '\n')
    .replace(/\r\n/g, '\n')
    .replace(/[ \t]+\n/g, '\n')
    .replace(/\n{3,}/g, '\n\n')
    .replace(/[|}{\\]/g, '')
    .replace(/(\w)\s*[：:]\s*(\d)/g, '$1:$2')   // fix "John 3 : 16" → "John 3:16"
    .replace(/\b0([A-Za-z])/g, 'O$1')            // 0God → OGod
    .replace(/l([A-Z][a-z])/g, 'I$1')            // lowercase l before capital → I
    .trim();

  // ── Main scan handler ──────────────────────────────────────────────────────
  const handleCameraCapture = async (e) => {
    const file = e.target.files?.[0];
    if (!file) return;
    e.target.value = '';   // allow same file to be re-scanned

    setScanState('scanning');
    setScanResult('');
    setScanPreview('');
    setScanProgress(0);
    setScanMsg('Preparing image…');

    // Tesseract.js v5 CDN URLs — all dependencies explicit so Safari doesn't lose them
    const TESS_CDN  = 'https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js';
    const WORK_PATH = 'https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/worker.min.js';
    const CORE_PATH = 'https://cdn.jsdelivr.net/npm/tesseract.js-core@5.1.0/tesseract-core-simd.wasm.js';
    const LANG_PATH = 'https://tessdata.projectnaptha.com/4.0.0';

    let worker = null;
    try {
      // ── Step 1: preprocess image ──────────────────────────────────────────
      setScanProgress(8);
      const { dataUrl, isDarkSlide } = await preprocessImage(file);
      setScanPreview(dataUrl);
      setScanMsg(isDarkSlide ? 'Detected projection screen — inverting…' : 'Detected light slide…');
      setScanProgress(15);

      // ── Step 2: load Tesseract.js from CDN (once, then cached) ───────────
      if (!window.Tesseract) {
        setScanMsg('Loading OCR engine… (first time only ~2 MB)');
        await new Promise((res, rej) => {
          const s = document.createElement('script');
          s.src = TESS_CDN;
          s.onload = res;
          s.onerror = () => rej(new Error('Failed to load OCR library. Check internet connection.'));
          document.head.appendChild(s);
        });
      }
      setScanProgress(22);
      setScanMsg('Initializing OCR engine…');

      // ── Step 3: create worker with all explicit CDN paths ─────────────────
      // This is the critical fix — v5 needs explicit paths when loaded from CDN
      // eng+fil: bilingual model handles English and Tagalog text on slides
      worker = await window.Tesseract.createWorker('eng+fil', 1, {
        workerPath: WORK_PATH,
        corePath:   CORE_PATH,
        langPath:   LANG_PATH,
        logger: m => {
          if (m.status === 'loading tesseract core') {
            setScanMsg('Loading OCR core…'); setScanProgress(25);
          } else if (m.status === 'initializing tesseract') {
            setScanMsg('Starting OCR…'); setScanProgress(32);
          } else if (m.status === 'loading language traineddata') {
            setScanMsg('Loading English + Filipino language data…'); setScanProgress(38);
          } else if (m.status === 'initializing api') {
            setScanMsg('Almost ready…'); setScanProgress(44);
          } else if (m.status === 'recognizing text') {
            const pct = Math.round(44 + m.progress * 50);
            setScanProgress(pct);
            setScanMsg(`Reading text… ${Math.round(m.progress * 100)}%`);
          }
        },
      });

      // PSM 3: fully automatic without OSD — more reliable for phone-angle photos of slides
      await worker.setParameters({
        tessedit_pageseg_mode:    '3',
        tessedit_char_blacklist:  '`~^',
        preserve_interword_spaces:'1',
      });

      setScanProgress(50);
      setScanMsg('Reading your notes…');

      // ── Step 4: run recognition ───────────────────────────────────────────
      const { data } = await worker.recognize(dataUrl);
      setScanProgress(96);

      const text = cleanOCRText(data.text || '');
      if (!text || text.length < 2) throw new Error('No readable text found. Try better lighting or hold the camera steady.');

      setScanResult(text);
      setScanState('result');
      setScanProgress(100);
      setScanMsg('');

    } catch (err) {
      console.error('Camera scan error:', err);
      setScanState('error');
      setScanMsg(err.message || 'Scan failed. Please try again.');
      setScanProgress(0);
    } finally {
      // Always terminate worker to free memory
      if (worker) {
        try { await worker.terminate(); } catch (_) {}
      }
    }
  };

  const applyScan = (mode) => {
    // mode: 'append' | 'replace'
    const newBody = mode === 'replace'
      ? scanResult
      : [formRef.current.body, scanResult].filter(Boolean).join('\n\n');
    setForm({ body: newBody });
    triggerSave({ body: newBody });
    setScanState('idle');
    setScanResult('');
    setScanPreview('');
  };

  const handleClose = () => { setClosing(true); setTimeout(onClose, 290); };

  const triggerSave = (patch = {}) => {
    if (saveTimer.current) clearTimeout(saveTimer.current);
    setSaveStatus('saving');
    saveTimer.current = setTimeout(() => {
      onSave(noteId, {
        ...existing, ...formRef.current, ...patch,
        updatedAt: new Date().toISOString(),
        createdAt: existing.createdAt || new Date().toISOString(),
      });
      setSaveStatus('saved');
      setTimeout(() => setSaveStatus(''), 2600);
    }, 700);
  };

  const allNotes = useMemo(() => {
    const q = jSearch.toLowerCase().trim();
    return Object.entries(sermonNotes)
      .map(([id, n]) => { const [d, s] = id.split('|'); return { id, date: d, service: s, ...n }; })
      .filter(n => !q || [n.title, n.body, n.keyVerse, n.favoriteQuote].some(v => (v || '').toLowerCase().includes(q)))
      .sort((a, b) => b.date.localeCompare(a.date));
  }, [sermonNotes, jSearch]);

  const byMonth = useMemo(() => {
    const m = new Map();
    for (const n of allNotes) {
      const mk = n.date.slice(0, 7);
      if (!m.has(mk)) m.set(mk, []);
      m.get(mk).push(n);
    }
    return m;
  }, [allNotes]);

  const wordCount   = (form.body || '').trim().split(/\s+/).filter(Boolean).length;
  const hasContent  = !!(form.body || form.keyVerse || form.prayerRequests || form.actionPoints || form.favoriteQuote || form.title);
  const hasExisting = !!(existing.body || existing.title);

  const inputStyle = (extra = {}) => ({
    ...extra,
    width: '100%', border: 'none', outline: 'none', background: 'transparent',
    fontFamily: '"Geist", sans-serif', color: 'var(--ink)', boxSizing: 'border-box',
    transition: 'border-color .15s',
  });

  const sectionFields = [
    { key: 'keyVerse',       label: '✦ Key Verse',                   placeholder: '"For I can do all things through Christ…" — Phil 4:13', multi: false },
    { key: 'prayerRequests', label: '🙏 Prayer Requests',             placeholder: 'People to pray for, personal needs…',                   multi: true  },
    { key: 'actionPoints',   label: '⚡ Action Points / Application', placeholder: 'What will you do differently this week?',                multi: true  },
    { key: 'favoriteQuote',  label: '💬 Favorite Quote',              placeholder: 'A line from the sermon that stayed with you…',           multi: false },
  ];

  return ReactDOM.createPortal(
    <div
      style={{ position: 'fixed', inset: 0, zIndex: 70, display: 'flex', alignItems: 'flex-end', justifyContent: 'center', background: closing ? 'rgba(24,24,27,0)' : 'rgba(24,24,27,0.38)', backdropFilter: 'blur(7px)', transition: 'background .28s ease', padding: '0' }}
      onClick={handleClose}
    >
      <div className={`sn-sheet${closing ? ' closing' : ''}`} onClick={e => e.stopPropagation()}>

        {/* Drag handle */}
        <div style={{ display: 'flex', justifyContent: 'center', paddingTop: 11, paddingBottom: 4 }}>
          <div style={{ width: 42, height: 4, borderRadius: 2, background: 'var(--border-strong)', opacity: .6 }} />
        </div>

        {/* Header bar */}
        <div style={{ padding: '6px 18px 12px', display: 'flex', alignItems: 'center', justifyContent: 'space-between', borderBottom: '1px solid var(--border)', gap: 8 }}>
          <div style={{ display: 'flex', gap: 4 }}>
            {[['editor', '✏️ Notes'], ['journal', '📅 Journal']].map(([v, lbl]) => (
              <button key={v} onClick={() => setView(v)} style={{
                padding: '4px 13px', borderRadius: 999, border: 'none', cursor: 'pointer',
                fontSize: '0.8125rem', fontWeight: view === v ? 600 : 400,
                background: view === v ? 'var(--ink)' : '#F4F4F0',
                color: view === v ? 'white' : 'var(--ink-muted)',
                transition: 'all .22s cubic-bezier(.34,1.56,.64,1)',
                transform: view === v ? 'scale(1.03)' : 'scale(1)',
              }}>{lbl}</button>
            ))}
          </div>
          <div style={{ display: 'flex', alignItems: 'center', gap: 10 }}>
            {saveStatus === 'saving' && <span style={{ fontSize: '0.6875rem', color: 'var(--ink-subtle)', transition: 'opacity .2s' }}>Saving…</span>}
            {saveStatus === 'saved'  && <span style={{ fontSize: '0.6875rem', color: SN_NOTES_GREEN, animation: 'snSaveFlash 2.6s ease-out both' }}>✓ Saved</span>}
            <button onClick={handleClose} style={{ background: '#F4F4F0', border: 'none', borderRadius: 8, padding: '4px 10px', fontSize: '0.8125rem', cursor: 'pointer', color: 'var(--ink-muted)', transition: 'background .15s' }}
              onMouseEnter={e => e.currentTarget.style.background='#EBEBEB'}
              onMouseLeave={e => e.currentTarget.style.background='#F4F4F0'}
            >✕</button>
          </div>
        </div>

        {/* ─── EDITOR VIEW ─────────────────────────────────── */}
        {view === 'editor' && (
          <div style={{ overflowY: 'auto', flex: 1, padding: '20px 20px 36px', WebkitOverflowScrolling: 'touch' }}>
            {/* Service meta chip */}
            <div style={{ display: 'flex', gap: 10, alignItems: 'flex-start', padding: '11px 14px', borderRadius: 12, background: SN_NOTES_TINT, border: `1px solid ${SN_NOTES_GREEN}28`, marginBottom: 22, animation: 'snFadeUp .22s ease-out both' }}>
              <div style={{ fontSize: '1.25rem', marginTop: 1 }}>📖</div>
              <div>
                <div style={{ fontWeight: 600, fontSize: '0.875rem', color: 'var(--ink)' }}>{meta.dateLabel} · {meta.service} Service</div>
                {meta.preacher && <div style={{ fontSize: '0.8125rem', color: 'var(--ink-muted)', marginTop: 1 }}>🎤 {meta.preacher}</div>}
                {meta.myRole   && <div style={{ fontSize: '0.8125rem', color: 'var(--ink-muted)', marginTop: 1 }}>🎭 Your role: {meta.myRole}</div>}
              </div>
            </div>

            {/* Title input */}
            <input
              value={form.title}
              onChange={e => { setForm({ title: e.target.value }); triggerSave({ title: e.target.value }); }}
              placeholder="Sermon title or topic…"
              style={{ ...inputStyle({ fontSize: '1.25rem', fontFamily: '"Fraunces", Georgia, serif', fontWeight: 600, letterSpacing: '-.01em', padding: '0 0 10px', marginBottom: 20, borderBottom: '2px solid var(--border)' }) }}
              onFocus={e => e.target.style.borderBottomColor = SN_NOTES_GREEN}
              onBlur={e => e.target.style.borderBottomColor = 'var(--border)'}
            />

            {/* Notes label + toolbar buttons */}
            <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', marginBottom: 8 }}>
              <div style={{ fontSize: '0.6875rem', fontWeight: 700, letterSpacing: '.08em', textTransform: 'uppercase', color: 'var(--ink-subtle)' }}>Sermon Notes</div>
              <div style={{ display: 'flex', alignItems: 'center', gap: 6 }}>

                {/* 🎙 Transcribe button + language toggle */}
                {txState === 'idle' && scanState === 'idle' && (
                  <div style={{ display: 'flex', alignItems: 'center', gap: 4 }}>
                    <button
                      onClick={startTranscription}
                      title={txLang === 'fil-PH' ? 'Transcribe in Filipino/Taglish' : 'Transcribe in English'}
                      style={{ display: 'flex', alignItems: 'center', gap: 5, padding: '4px 11px', borderRadius: 999, background: '#FEF3C7', border: '1px solid #FDE68A', color: '#92400E', fontSize: '0.75rem', fontWeight: 600, cursor: 'pointer', transition: 'all .15s' }}
                      onMouseEnter={e => e.currentTarget.style.background='#FDE68A'}
                      onMouseLeave={e => e.currentTarget.style.background='#FEF3C7'}
                    >
                      <span style={{ fontSize: '0.875rem' }}>🎙</span> Transcribe
                    </button>
                    {/* Language toggle: FIL (Tagalog/Taglish) ↔ EN */}
                    <button
                      onClick={() => setTxLang(l => l === 'fil-PH' ? 'en-PH' : 'fil-PH')}
                      title={txLang === 'fil-PH' ? 'Currently: Filipino/Taglish — tap to switch to English' : 'Currently: English — tap to switch to Filipino/Taglish'}
                      style={{ padding: '3px 8px', borderRadius: 999, background: txLang === 'fil-PH' ? '#DBEAFE' : '#F3F4F6', border: `1px solid ${txLang === 'fil-PH' ? '#93C5FD' : '#D1D5DB'}`, color: txLang === 'fil-PH' ? '#1D4ED8' : '#6B7280', fontSize: '0.7rem', fontWeight: 700, cursor: 'pointer', letterSpacing: '.02em', transition: 'all .15s' }}
                    >
                      {txLang === 'fil-PH' ? 'FIL' : 'EN'}
                    </button>
                  </div>
                )}

                {/* Listening state */}
                {txState === 'listening' && (
                  <button
                    onClick={stopAndSave}
                    title="Tap to stop and save transcription to notes"
                    style={{ display: 'flex', alignItems: 'center', gap: 6, padding: '5px 12px', borderRadius: 999, background: '#DC2626', border: 'none', color: 'white', fontSize: '0.75rem', fontWeight: 700, cursor: 'pointer', animation: 'snPulse 1.4s ease-in-out infinite' }}
                  >
                    <span style={{ width: 7, height: 7, borderRadius: '50%', background: 'white', display: 'inline-block', flexShrink: 0 }}/>
                    Stop &amp; Save
                  </button>
                )}

                {/* Scan button — only when not transcribing */}
                {txState === 'idle' && scanState === 'idle' && (
                  <button
                    onClick={() => cameraInputRef.current?.click()}
                    title="Point at the presentation screen to scan slide text"
                    style={{ display: 'flex', alignItems: 'center', gap: 5, padding: '4px 11px', borderRadius: 999, background: '#F0FDF4', border: '1px solid #BBF7D0', color: '#15803D', fontSize: '0.75rem', fontWeight: 600, cursor: 'pointer', transition: 'all .15s' }}
                    onMouseEnter={e => e.currentTarget.style.background='#DCFCE7'}
                    onMouseLeave={e => e.currentTarget.style.background='#F0FDF4'}
                  >
                    <span style={{ fontSize: '0.875rem' }}>📷</span> Scan
                  </button>
                )}

                {/* Scan states */}
                {scanState === 'scanning' && (
                  <div style={{ display: 'flex', flexDirection: 'column', gap: 4, minWidth: 180 }}>
                    <div style={{ display: 'flex', alignItems: 'center', gap: 6 }}>
                      <div style={{ width: 8, height: 8, borderRadius: 4, background: '#16A34A', animation: 'snPulse 1.2s ease-in-out infinite', flexShrink: 0 }} />
                      <span style={{ fontSize: '0.75rem', fontWeight: 600, color: '#15803D' }}>{scanMsg || 'Processing…'}</span>
                    </div>
                    <div style={{ height: 3, borderRadius: 2, background: '#DCFCE7', overflow: 'hidden' }}>
                      <div style={{ height: 3, borderRadius: 2, background: '#16A34A', width: `${scanProgress}%`, transition: 'width .4s ease' }} />
                    </div>
                  </div>
                )}
                {scanState === 'error' && (
                  <div style={{ display: 'flex', flexDirection: 'column', gap: 4 }}>
                    <div style={{ display: 'flex', alignItems: 'center', gap: 6 }}>
                      <span style={{ fontSize: '0.75rem', color: 'var(--danger)', fontWeight: 500 }}>⚠ {scanMsg || 'Scan failed'}</span>
                    </div>
                    <div style={{ display: 'flex', gap: 8 }}>
                      <button onClick={() => cameraInputRef.current?.click()} style={{ fontSize: '0.75rem', color: '#15803D', background: 'none', border: 'none', cursor: 'pointer', textDecoration: 'underline', padding: 0 }}>Try again</button>
                      <button onClick={() => { setScanState('idle'); setScanMsg(''); }} style={{ fontSize: '0.75rem', color: 'var(--ink-subtle)', background: 'none', border: 'none', cursor: 'pointer', padding: 0 }}>Dismiss</button>
                    </div>
                  </div>
                )}
              </div>
            </div>

            {/* ── Live transcription panel ── */}
            {txState === 'listening' && (
              <div style={{ marginBottom: 14, borderRadius: 12, overflow: 'hidden', border: '1.5px solid #FCA5A5', background: '#FFF5F5' }}>
                {/* Header */}
                <div style={{ padding: '8px 14px', background: '#DC2626', display: 'flex', alignItems: 'center', gap: 8 }}>
                  <div style={{ width: 8, height: 8, borderRadius: '50%', background: 'white', animation: 'snPulse 1.2s ease-in-out infinite', flexShrink: 0 }}/>
                  <span style={{ fontSize: '0.75rem', fontWeight: 700, color: 'white', letterSpacing: '.04em' }}>LIVE — Listening to sermon…</span>
                  <span style={{ fontSize: '0.7rem', color: 'rgba(255,255,255,.85)', marginLeft: 'auto' }}>{txLang === 'fil-PH' ? '🇵🇭 Tagalog/Taglish' : '🇬🇧 English'}</span>
                </div>

                {/* Live text preview */}
                <div style={{ padding: '10px 14px', minHeight: 64 }}>
                  {/* Confirmed words so far */}
                  {liveBufferRef.current && (
                    <p style={{ fontSize: '0.875rem', lineHeight: 1.7, color: 'var(--ink)', marginBottom: txInterim ? 4 : 0 }}>
                      {liveBufferRef.current}
                    </p>
                  )}
                  {/* Interim (unconfirmed) words */}
                  {txInterim && (
                    <p style={{ fontSize: '0.875rem', lineHeight: 1.7, color: '#9CA3AF', fontStyle: 'italic' }}>
                      {txInterim}
                    </p>
                  )}
                  {!liveBufferRef.current && !txInterim && (
                    <p style={{ fontSize: '0.875rem', color: '#9CA3AF', fontStyle: 'italic' }}>
                      Waiting for speech… speak clearly or move closer to the speaker.
                    </p>
                  )}
                </div>

                {/* Actions */}
                <div style={{ padding: '8px 14px 12px', display: 'flex', gap: 8, borderTop: '1px solid #FCA5A5' }}>
                  <button onClick={stopAndSave} style={{ padding: '7px 16px', borderRadius: 8, background: '#DC2626', color: 'white', border: 'none', fontSize: '0.8125rem', fontWeight: 700, cursor: 'pointer' }}>
                    ⏹ Stop &amp; Add to Notes
                  </button>
                  <button onClick={discardTranscription} style={{ padding: '7px 12px', borderRadius: 8, background: '#F4F4F0', color: 'var(--ink-muted)', border: 'none', fontSize: '0.8125rem', cursor: 'pointer' }}>
                    Discard
                  </button>
                </div>
              </div>
            )}

            {/* Transcription error */}
            {txState === 'error' && (
              <div style={{ marginBottom: 14, padding: '10px 14px', borderRadius: 10, background: '#FEE2E2', border: '1px solid #FCA5A5', fontSize: '0.8125rem', color: '#991B1B' }}>

                <button onClick={() => { setTxState('idle'); setTxError(''); }} style={{ fontSize: '0.75rem', color: '#991B1B', textDecoration: 'underline', background: 'none', border: 'none', cursor: 'pointer', padding: 0 }}>Dismiss</button>
              </div>
            )}

            {/* Hidden camera input */}
            <input
              ref={cameraInputRef}
              type="file"
              accept="image/*"
              capture="environment"
              style={{ display: 'none' }}
              onChange={handleCameraCapture}
            />

            {/* Scan result pane */}
            {scanState === 'result' && (
              <div className="sn-scan-result" style={{ marginBottom: 14, borderRadius: 12, overflow: 'hidden', border: '1px solid #BBF7D0', background: '#F0FDF4' }}>
                {scanPreview && (
                  <div style={{ display: 'flex', justifyContent: 'center', background: '#DCFCE7', padding: '10px' }}>
                    <img src={scanPreview} alt="Captured notes" style={{ maxHeight: 120, maxWidth: '100%', borderRadius: 8, objectFit: 'contain', boxShadow: '0 2px 8px rgba(0,0,0,.12)' }} />
                  </div>
                )}
                <div style={{ padding: '12px 14px' }}>
                  <div style={{ display: 'flex', alignItems: 'center', gap: 6, marginBottom: 8 }}>
                    <span style={{ fontSize: '0.6875rem', fontWeight: 700, letterSpacing: '.08em', textTransform: 'uppercase', color: '#15803D' }}>✦ Slide Transcription</span>
                    <span style={{ fontSize: '0.6875rem', color: 'var(--ink-subtle)' }}>— review &amp; edit before adding</span>
                  </div>
                  <textarea
                    value={scanResult}
                    onChange={e => setScanResult(e.target.value)}
                    rows={5}
                    style={{ width: '100%', border: 'none', outline: 'none', background: 'transparent', fontFamily: '"Geist", sans-serif', fontSize: '0.875rem', color: 'var(--ink)', lineHeight: 1.7, resize: 'vertical', boxSizing: 'border-box' }}
                  />

                      onClick={() => applyScan('append')}
                      style={{ padding: '6px 14px', borderRadius: 8, background: '#16A34A', color: 'white', border: 'none', fontSize: '0.8125rem', fontWeight: 600, cursor: 'pointer', transition: 'background .15s' }}
                      onMouseEnter={e => e.currentTarget.style.background='#15803D'}
                      onMouseLeave={e => e.currentTarget.style.background='#16A34A'}
                    >+ Add to notes</button>
                    <button
                      onClick={() => applyScan('replace')}
                      style={{ padding: '6px 14px', borderRadius: 8, background: '#F4F4F0', color: 'var(--ink)', border: 'none', fontSize: '0.8125rem', fontWeight: 500, cursor: 'pointer' }}
                    >↺ Replace notes</button>
                    <button
                      onClick={() => cameraInputRef.current?.click()}
                      style={{ padding: '6px 14px', borderRadius: 8, background: '#F4F4F0', color: 'var(--ink)', border: 'none', fontSize: '0.8125rem', fontWeight: 500, cursor: 'pointer' }}
                    >📷 Scan again</button>
                    <button
                      onClick={() => { setScanState('idle'); setScanResult(''); setScanPreview(''); }}
                      style={{ padding: '6px 10px', borderRadius: 8, background: 'none', color: 'var(--ink-subtle)', border: 'none', fontSize: '0.8125rem', cursor: 'pointer', marginLeft: 'auto' }}

                  </div>
                </div>
              </div>
            )}

            {/* Body textarea */}
            <div style={{ marginBottom: 8 }}>
              <textarea
                value={form.body}
                onChange={e => { setForm({ body: e.target.value }); triggerSave({ body: e.target.value }); }}
                placeholder={"Write your notes here…\n\nWhat spoke to you today?\nWhat is God saying through His Word?"}

            <button
              onClick={() => setSectOpen(o => !o)}

            </div>
          </div>
        )}

                {jSearch ? 'No notes match your search.' : 'No sermon notes yet.\nSwitch to Notes to write your first entry.'}
              </div>
            ) : (
              <div style={{ animation: 'snFadeUp .22s ease-out both' }}>
                {Array.from(byMonth.entries()).map(([mk, notes]) => (
                  <div key={mk} style={{ marginBottom: 28 }}>
                    <div style={{ fontSize: '0.6875rem', fontWeight: 700, letterSpacing: '.08em', textTransform: 'uppercase', color: 'var(--ink-subtle)', marginBottom: 10 }}>
                      {formatMonthLabel(mk)}
                    </div>
                    <div style={{ display: 'flex', flexDirection: 'column', gap: 8 }}>
                      {notes.map(n => {
                        const preview   = (n.body || '').slice(0, 110).trim();
                        const isCurrent = n.id === noteId;
                        return (
                          <div key={n.id} style={{ padding: '14px 16px', borderRadius: 14, background: isCurrent ? SN_NOTES_TINT : 'var(--bg)', border: `1px solid ${isCurrent ? SN_NOTES_GREEN + '50' : 'var(--border)'}`, transition: 'border-color .2s' }}>
                            <div style={{ display: 'flex', justifyContent: 'space-between', gap: 8, marginBottom: 4, flexWrap: 'wrap' }}>
                              <div style={{ fontWeight: 600, fontSize: '0.875rem', color: isCurrent ? SN_NOTES_GREEN : 'var(--ink)' }}>
                                {n.title || <span style={{ fontStyle: 'italic', color: 'var(--ink-subtle)', fontWeight: 400 }}>Untitled</span>}
                              </div>
                              <div style={{ fontSize: '0.75rem', color: 'var(--ink-subtle)', flexShrink: 0 }}>
                                {formatDateShort(n.date)} · {n.service}
                              </div>
                            </div>
                            {preview && <div style={{ fontSize: '0.8125rem', color: 'var(--ink-muted)', lineHeight: 1.55, marginBottom: 8 }}>{preview}{(n.body||'').length > 110 ? '…' : ''}</div>}
                            <div style={{ display: 'flex', gap: 5, flexWrap: 'wrap' }}>
                              {n.keyVerse       && <span className="pill pill-default" style={{ fontSize: '0.6875rem' }}>✦ Verse</span>}
                              {n.prayerRequests && <span className="pill pill-default" style={{ fontSize: '0.6875rem' }}>🙏 Prayer</span>}
                              {n.actionPoints   && <span className="pill pill-default" style={{ fontSize: '0.6875rem' }}>⚡ Actions</span>}
                              {n.favoriteQuote  && <span className="pill pill-default" style={{ fontSize: '0.6875rem' }}>💬 Quote</span>}
                              {isCurrent && <span className="pill" style={{ fontSize: '0.6875rem', background: SN_NOTES_SOFT, color: SN_NOTES_GREEN }}>← current</span>}
                            </div>
                          </div>
                        );
                      })}
                    </div>
                  </div>
                ))}
                <div style={{ textAlign: 'center', fontSize: '0.75rem', color: 'var(--ink-subtle)', marginTop: 12 }}>
                  {allNotes.length} note{allNotes.length !== 1 ? 's' : ''} · tap a service card to edit
                </div>
              </div>
            )}
          </div>
        )}
      </div>
    </div>,
    document.body
  );
}

// ─── Helpers ──────────────────────────────────────────────────────────────────
function loadGamesState()  { try { return JSON.parse(localStorage.getItem(GAMES_KEY)||'{}'); } catch { return {}; } }
function saveGamesState(s) { try { localStorage.setItem(GAMES_KEY, JSON.stringify(s)); } catch {} }

function buildWSGrid(words, SIZE = 10) {
  const DIRS = [[0,1],[1,0],[1,1],[0,-1],[-1,0],[-1,-1],[1,-1],[-1,1]];
  const grid = Array.from({length:SIZE}, () => Array(SIZE).fill(''));
  const placed = [];
  const ALPHA = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
  const sorted = [...words].filter(w => w.length <= SIZE).sort((a,b) => b.length - a.length);
  for (const word of sorted) {
    let ok = false;
    for (let t = 0; t < 80 && !ok; t++) {
      const [dr,dc] = DIRS[Math.floor(Math.random()*DIRS.length)];
      const r = Math.floor(Math.random()*SIZE), c = Math.floor(Math.random()*SIZE);
      let fits = true;
      const cells = [];
      for (let i = 0; i < word.length; i++) {
        const nr = r+dr*i, nc = c+dc*i;
        if (nr<0||nr>=SIZE||nc<0||nc>=SIZE||(grid[nr][nc]!==''&&grid[nr][nc]!==word[i])){fits=false;break;}
        cells.push([nr,nc]);
      }
      if (fits) { cells.forEach(([nr,nc],i)=>{ grid[nr][nc]=word[i]; }); placed.push({word,cells}); ok=true; }
    }
  }
  for (let r=0;r<SIZE;r++) for(let c=0;c<SIZE;c++) if(!grid[r][c]) grid[r][c]=ALPHA[Math.floor(Math.random()*26)];
  return { grid, placed };
}

                      <div style={{fontSize:'2rem',marginBottom:8}}>{g.icon}</div>

              {active==='match'  && <MemoryMatch gState={gState} setGState={setGState}/>}

            </div>
          )}
        </div>
      </div>
    </div>,
    document.body
  );
}

// ─── GAME: Bible Trivia ────────────────────────────────────────────────────────
function BibleTrivia({ gState, setGState }) {
  const [diff,   setDiff]     = useState(null);
  const [qs,     setQs]       = useState([]);
  const [qIdx,   setQIdx]     = useState(0);
  const [score,  setScore]    = useState(0);
  const [ans,    setAns]      = useState(null);
  const [sel,    setSel]      = useState(null);
  const [done,   setDone]     = useState(false);

  const start = d => {
    setQs([...TRIVIA[d]].sort(()=>Math.random()-.5).slice(0,10));
    setDiff(d); setQIdx(0); setScore(0); setAns(null); setSel(null); setDone(false);
  };

  const pick = opt => {
    if (ans) return;
    setSel(opt);
    const ok = opt === qs[qIdx].a;
    setAns(ok?'correct':'wrong');
    const pts = diff==='easy'?10:diff==='medium'?20:30;
    const newScore = score + (ok?pts:0);
    setTimeout(()=>{
      if (qIdx+1 >= qs.length) {
        const prev = gState.trivia||{};
        if (newScore > (prev.highScore||0)) setGState({...gState,trivia:{...prev,highScore:newScore}});
        setScore(newScore); setDone(true);
      } else {
        setScore(newScore); setQIdx(i=>i+1); setAns(null); setSel(null);
      }
    }, 1100);
  };

  if (!diff) return (
    <div style={{padding:20}}>
      <div className="font-display" style={{fontSize:'1.25rem',fontWeight:600,marginBottom:6}}>Choose Difficulty</div>
      <div style={{fontSize:'0.875rem',color:'var(--ink-muted)',marginBottom:20}}>10 questions per round. Higher difficulty = more points per correct answer.</div>
      {[{k:'easy',l:'🌱 Easy',d:'Bible basics · 10 pts each',c:'#16A34A'},
        {k:'medium',l:'📖 Medium',d:'Deeper knowledge · 20 pts each',c:'#0284C7'},
        {k:'hard',l:'🔥 Hard',d:'Scholar level · 30 pts each',c:'#BE123C'}].map(x=>(
        <div key={x.k} onClick={()=>start(x.k)} style={{padding:'16px 18px',borderRadius:12,border:`1px solid ${x.c}30`,marginBottom:10,cursor:'pointer',background:x.c+'0A',transition:'background .15s'}}
          onMouseEnter={e=>e.currentTarget.style.background=x.c+'18'} onMouseLeave={e=>e.currentTarget.style.background=x.c+'0A'}>
          <div style={{fontWeight:600,color:x.c}}>{x.l}</div>
          <div style={{fontSize:'0.8125rem',color:'var(--ink-muted)',marginTop:2}}>{x.d}</div>
        </div>
      ))}
      {gState.trivia?.highScore>0 && <div style={{textAlign:'center',fontSize:'0.8125rem',color:'var(--ink-muted)',marginTop:8}}>Best score: <strong style={{color:'#0284C7'}}>{gState.trivia.highScore}</strong></div>}
    </div>
  );

  if (done) {
    const max = 10*(diff==='easy'?10:diff==='medium'?20:30);
    const pct = Math.round((score/max)*100);
    return (
      <div style={{padding:24,textAlign:'center'}}>
        <div style={{fontSize:'3rem',marginBottom:12}}>{pct>=90?'🏆':pct>=70?'🌟':pct>=50?'📖':'🙏'}</div>
        <div className="font-display" style={{fontSize:'2.25rem',fontWeight:600,marginBottom:4}}>{score} pts</div>
        <div style={{fontSize:'0.875rem',color:'var(--ink-muted)',marginBottom:8}}>{pct>=90?'Bible Scholar!':pct>=70?'Great job!':pct>=50?'Keep studying!':'Keep reading your Bible!'}</div>
        {gState.trivia?.highScore===score&&score>0&&<div style={{color:'#F59E0B',fontWeight:600,marginBottom:16}}>⭐ New high score!</div>}
        <button onClick={()=>setDiff(null)} style={{padding:'10px 24px',borderRadius:999,background:'var(--ink)',color:'white',border:'none',cursor:'pointer',fontSize:'0.875rem',fontWeight:600}}>Play again</button>
      </div>
    );
  }

  const q = qs[qIdx];
  return (
    <div style={{padding:20}}>
      <div style={{display:'flex',justifyContent:'space-between',marginBottom:10}}>
        <div style={{fontSize:'0.75rem',color:'var(--ink-muted)'}}>Q {qIdx+1}/10 · {diff}</div>
        <div style={{fontSize:'0.875rem',fontWeight:600,color:'#0284C7'}}>{score} pts</div>
      </div>
      <div style={{height:4,borderRadius:2,background:'var(--border)',marginBottom:20}}>
        <div style={{height:4,borderRadius:2,background:'#0284C7',width:`${((qIdx)/10)*100}%`,transition:'width .3s'}}/>
      </div>
      <div className="font-display" style={{fontSize:'1.125rem',fontWeight:600,lineHeight:1.5,marginBottom:24,minHeight:56}}>{q.q}</div>
      <div style={{display:'flex',flexDirection:'column',gap:10}}>
        {q.o.map(opt=>{
          let bg='#F9F9F7',border='var(--border)',color='var(--ink)';
          if(ans){
            if(opt===q.a){bg='#F0FDF4';border='#16A34A';color='#15803D';}
            else if(opt===sel&&sel!==q.a){bg='#FEF2F2';border='#DC2626';color='#DC2626';}
          }
          return (
            <button key={opt} onClick={()=>pick(opt)} disabled={!!ans}
              style={{padding:'14px 16px',borderRadius:12,border:`2px solid ${border}`,background:bg,color,textAlign:'left',cursor:ans?'default':'pointer',fontSize:'0.9375rem',fontWeight:500,transition:'all .2s',display:'flex',justifyContent:'space-between',alignItems:'center'}}>
              {opt}
              {ans&&opt===q.a&&<span>✓</span>}
              {ans&&opt===sel&&sel!==q.a&&<span>✗</span>}
            </button>
          );
        })}
      </div>
    </div>
  );
}

// ─── GAME: Bible Wordle ────────────────────────────────────────────────────────
function BibleWordle({ gState, setGState }) {
  const today = todayISO();
  const ANSWER = W_WORDS[parseInt(today.replace(/-/g,'')) % W_WORDS.length];
  const ws     = gState.wordle||{};
  const init   = ws.date===today ? (ws.guesses||[]) : [];

  const [guesses, setGuesses] = useState(init);
  const [cur,     setCur]     = useState('');
  const [shake,   setShake]   = useState(false);
  const [won,  setWon]  = useState(init.some(g=>g===ANSWER));
  const [lost, setLost] = useState(!init.some(g=>g===ANSWER) && init.length>=6);

  const KEYS = ['QWERTYUIOP','ASDFGHJKL','ZXCVBNM'];

  const letterState = useMemo(()=>{
    const s={};
    for(const g of guesses) for(let i=0;i<5;i++){
      const ch=g[i];
      if(ANSWER[i]===ch) s[ch]='correct';
      else if(ANSWER.includes(ch)&&s[ch]!=='correct') s[ch]='present';
      else if(!s[ch]) s[ch]='absent';
    }
    return s;
  },[guesses,ANSWER]);

  const cellColor=(g,col)=>{
    if(ANSWER[col]===g[col]) return '#16A34A';
    if(ANSWER.includes(g[col])) return '#D97706';
    return '#6B7280';
  };

  const submit=()=>{
    if(cur.length<5){setShake(true);setTimeout(()=>setShake(false),500);return;}
    const ng=[...guesses,cur];
    setGuesses(ng); setCur('');
    const w=cur===ANSWER, l=!w&&ng.length>=6;
    if(w)setWon(true); if(l)setLost(true);
    const prev=gState.wordle||{};
    const streak=w?((prev.date===addDays(today,-1))?(prev.streak||0)+1:1):0;
    setGState({...gState,wordle:{date:today,guesses:ng,streak:w?streak:prev.streak||0,bestStreak:Math.max(streak,prev.bestStreak||0)}});
  };

  const handleKey=k=>{
    if(won||lost)return;
    if(k==='ENTER'){submit();return;}
    if(k==='DEL'){setCur(c=>c.slice(0,-1));return;}
    if(/^[A-Z]$/.test(k)&&cur.length<5)setCur(c=>c+k);
  };

  useEffect(()=>{
    const fn=e=>{
      const k=e.key.toUpperCase();
      if(k==='ENTER'||k==='BACKSPACE'||/^[A-Z]$/.test(k)) handleKey(k==='BACKSPACE'?'DEL':k);
    };
    window.addEventListener('keydown',fn);
    return ()=>window.removeEventListener('keydown',fn);
  });

  const kbColor=k=>{
    const st=letterState[k];
    return st==='correct'?'#16A34A':st==='present'?'#D97706':st==='absent'?'#9CA3AF':'#E5E7EB';
  };
  const kbText=k=>letterState[k]?'white':'var(--ink)';

  return (
    <div style={{padding:'14px 16px'}}>
      <div style={{textAlign:'center',fontSize:'0.75rem',color:'var(--ink-muted)',marginBottom:10}}>
        📅 Daily word · {today}{ws.streak>0?` · 🔥 ${ws.streak}-day streak`:''}
      </div>

      {/* Grid */}
      <div style={{display:'flex',flexDirection:'column',alignItems:'center',gap:5,marginBottom:14}}>
        {Array.from({length:6},(_,row)=>(
          <div key={row} style={{display:'flex',gap:5}}>
            {Array.from({length:5},(_,col)=>{
              const g=guesses[row]; const revealed=!!g;
              const ch=g?g[col]:(row===guesses.length?cur[col]:'');
              let bg='transparent',border='#D1D5DB',color='var(--ink)';
              if(revealed){bg=cellColor(g,col);border=bg;color='white';}
              else if(ch)border='#6B7280';
              return (
                <div key={col} style={{width:50,height:50,display:'flex',alignItems:'center',justifyContent:'center',border:`2px solid ${border}`,borderRadius:8,fontWeight:700,fontSize:'1.375rem',background:bg,color,fontFamily:'Geist Mono,monospace',
                  animation:(!revealed&&row===guesses.length&&shake)?'snShakeX .4s ease':'none',transition:'background .3s'}}>
                  {ch||''}
                </div>
              );
            })}
          </div>
        ))}
      </div>

      {(won||lost)&&(
        <div style={{textAlign:'center',padding:'10px 14px',borderRadius:10,background:won?'#F0FDF4':'#FEF2F2',marginBottom:12}}>
          <div style={{fontWeight:700,color:won?'#16A34A':'#DC2626'}}>{won?`✓ ${ANSWER} — Well done! 🎉`:`The word was: ${ANSWER}`}</div>
          <div style={{fontSize:'0.75rem',color:'var(--ink-muted)',marginTop:3}}>Come back tomorrow for a new word!</div>
        </div>
      )}

      {/* Keyboard */}
      <div style={{display:'flex',flexDirection:'column',alignItems:'center',gap:5}}>
        {KEYS.map((row,ri)=>(
          <div key={ri} style={{display:'flex',gap:4}}>
            {ri===2&&<button onClick={()=>handleKey('ENTER')} style={{padding:'13px 6px',borderRadius:7,background:'#374151',color:'white',border:'none',fontSize:'0.625rem',fontWeight:700,cursor:'pointer',letterSpacing:'.04em'}}>ENTER</button>}
            {row.split('').map(k=>(
              <button key={k} onClick={()=>handleKey(k)} style={{width:30,height:42,borderRadius:7,background:kbColor(k),color:kbText(k),border:'none',fontSize:'0.875rem',fontWeight:700,cursor:'pointer',transition:'background .2s'}}>{k}</button>
            ))}
            {ri===2&&<button onClick={()=>handleKey('DEL')} style={{padding:'13px 6px',borderRadius:7,background:'#374151',color:'white',border:'none',fontSize:'0.625rem',fontWeight:700,cursor:'pointer'}}>DEL</button>}
          </div>
        ))}
      </div>
    </div>
  );
}

// ─── GAME: Memory Match ────────────────────────────────────────────────────────
function MemoryMatch({ gState, setGState }) {
  const [diff,   setDiff]  = useState(null);
  const [cards,  setCards] = useState([]);
  const [flip,   setFlip]  = useState([]);
  const [match,  setMatch] = useState([]);
  const [moves,  setMoves] = useState(0);
  const [t0,     setT0]    = useState(null);
  const [elapsed,setElapsed]=useState(0);
  const [done,   setDone]  = useState(false);
  const block = useRef(false);

  useEffect(()=>{
    if(t0&&!done){const iv=setInterval(()=>setElapsed(Math.floor((Date.now()-t0)/1000)),1000);return()=>clearInterval(iv);}
  },[t0,done]);

  const start=d=>{
    const n=d==='easy'?4:d==='medium'?8:12;
    const pairs=[...VERSE_PAIRS].sort(()=>Math.random()-.5).slice(0,n);
    const cs=[...pairs.map((p,i)=>({id:i*2,type:'verse',text:p.v,pid:i})),
              ...pairs.map((p,i)=>({id:i*2+1,type:'ref',text:p.r,pid:i}))].sort(()=>Math.random()-.5);
    setDiff(d);setCards(cs);setFlip([]);setMatch([]);setMoves(0);setT0(Date.now());setElapsed(0);setDone(false);
  };

  const tap=id=>{
    if(block.current||flip.includes(id)||match.includes(id))return;
    const nf=[...flip,id];
    setFlip(nf);
    if(nf.length===2){
      setMoves(m=>m+1); block.current=true;
      const [a,b]=nf.map(x=>cards.find(c=>c.id===x));
      if(a.pid===b.pid){
        const nm=[...match,...nf];
        setMatch(nm); setFlip([]); block.current=false;
        if(nm.length===cards.length){
          setDone(true);
          const el=Math.floor((Date.now()-t0)/1000);
          setElapsed(el);
          const prev=gState.match||{};
          const bt=prev.bestTime||{};
          if(!bt[diff]||el<bt[diff]) setGState({...gState,match:{...prev,bestTime:{...bt,[diff]:el}}});
        }
      } else { setTimeout(()=>{setFlip([]);block.current=false;},900); }
    }
  };

  if(!diff) return (
    <div style={{padding:20}}>
      <div className="font-display" style={{fontSize:'1.25rem',fontWeight:600,marginBottom:6}}>Memory Match</div>
      <div style={{fontSize:'0.875rem',color:'var(--ink-muted)',marginBottom:20}}>Flip cards to match Bible verses with their scripture references.</div>
      {[{k:'easy',l:'🌱 Easy — 4 pairs',c:'#16A34A'},{k:'medium',l:'📖 Medium — 8 pairs',c:'#0284C7'},{k:'hard',l:'🔥 Hard — 12 pairs',c:'#BE123C'}].map(x=>(
        <div key={x.k} onClick={()=>start(x.k)} style={{padding:'14px 18px',borderRadius:12,border:`1px solid ${x.c}30`,marginBottom:10,cursor:'pointer',background:x.c+'0A',transition:'background .15s'}}
          onMouseEnter={e=>e.currentTarget.style.background=x.c+'18'} onMouseLeave={e=>e.currentTarget.style.background=x.c+'0A'}>
          <div style={{fontWeight:600,color:x.c}}>{x.l}</div>
          {gState.match?.bestTime?.[x.k]&&<div style={{fontSize:'0.75rem',color:'var(--ink-muted)',marginTop:2}}>Best: {gState.match.bestTime[x.k]}s</div>}
        </div>
      ))}
    </div>
  );

  if(done) return (
    <div style={{padding:24,textAlign:'center'}}>
      <div style={{fontSize:'3rem',marginBottom:12}}>🎉</div>
      <div className="font-display" style={{fontSize:'1.75rem',fontWeight:600,marginBottom:4}}>Complete!</div>
      <div style={{fontSize:'0.875rem',color:'var(--ink-muted)',marginBottom:16}}>{moves} moves · {elapsed} seconds</div>
      <button onClick={()=>setDiff(null)} style={{padding:'10px 24px',borderRadius:999,background:'var(--ink)',color:'white',border:'none',cursor:'pointer',fontSize:'0.875rem',fontWeight:600}}>Play again</button>
    </div>
  );

  const cols=diff==='easy'?4:4;
  return (
    <div style={{padding:14}}>
      <div style={{display:'flex',justifyContent:'space-between',marginBottom:12,fontSize:'0.8125rem',color:'var(--ink-muted)'}}>
        <span>🃏 {match.length/2}/{cards.length/2} matched</span>
        <span>{moves} moves · {elapsed}s</span>
      </div>
      <div style={{display:'grid',gridTemplateColumns:`repeat(${cols},1fr)`,gap:8}}>
        {cards.map(card=>{
          const isFlip=flip.includes(card.id)||match.includes(card.id);
          const isMatch=match.includes(card.id);
          return (
            <div key={card.id} onClick={()=>tap(card.id)} style={{
              aspectRatio:'2/3',borderRadius:10,cursor:'pointer',padding:8,
              display:'flex',alignItems:'center',justifyContent:'center',textAlign:'center',
              background:isMatch?'#F0FDF4':isFlip?(card.type==='verse'?'#EFF6FF':G_TINT):'#1E293B',
              border:`2px solid ${isMatch?'#16A34A':isFlip?G_ACCENT:'#334155'}`,
              color:isFlip?'var(--ink)':'transparent',
              fontSize:diff==='hard'?'0.5625rem':'0.625rem',
              lineHeight:1.35,fontWeight:500,
              transition:'all .25s ease',
              boxShadow:isFlip?'0 2px 8px rgba(0,0,0,.08)':'0 2px 8px rgba(0,0,0,.2)',
            }}>
              {isFlip?card.text:'✝️'}
            </div>
          );
        })}
      </div>
    </div>
  );
}

// ─── GAME: Word Search ─────────────────────────────────────────────────────────
function WordSearch({ gState, setGState }) {
  const [themeIdx, setThemeIdx] = useState(null);
  const [gd,       setGd]       = useState(null);
  const [found,    setFound]    = useState([]); // [{word,cells}]
  const [sel,      setSel]      = useState(null); // start cell
  const [hover,    setHover]    = useState(null);
  const [wonMsg,   setWonMsg]   = useState('');

  const startTheme = idx => {
    setThemeIdx(idx);
    setGd(buildWSGrid(WS_THEMES[idx].words, 10));
    setFound([]); setSel(null); setHover(null); setWonMsg('');
  };

  const getPath=(s,e)=>{
    if(!s||!e)return[];
    const [r1,c1]=s,[r2,c2]=e;
    const dr=r2-r1,dc=c2-c1,len=Math.max(Math.abs(dr),Math.abs(dc));
    if(len===0)return[s];
    if(dr!==0&&dc!==0&&Math.abs(dr)!==Math.abs(dc))return[];
    const sr=dr===0?0:dr/Math.abs(dr),sc=dc===0?0:dc/Math.abs(dc);
    return Array.from({length:len+1},(_,i)=>[r1+sr*i,c1+sc*i]);
  };

  const tryWord=end=>{
    if(!sel)return;
    const path=getPath(sel,end);
    const w=path.map(([r,c])=>gd.grid[r][c]).join('');
    const wr=w.split('').reverse().join('');
    const target=gd.placed.find(p=>p.word===w||p.word===wr);
    if(target&&!found.some(f=>f.word===target.word)){
      const nf=[...found,target];
      setFound(nf);
      if(nf.length===gd.placed.length)setWonMsg('🎉 All words found! Well done!');
    }
    setSel(null);setHover(null);
  };

  const foundCells=useMemo(()=>{
    const s=new Set();
    found.forEach(f=>f.cells.forEach(([r,c])=>s.add(`${r},${c}`)));
    return s;
  },[found]);

  const pathCells=useMemo(()=>{
    const path=getPath(sel,hover||sel);
    return new Set(path.map(([r,c])=>`${r},${c}`));
  },[sel,hover]);

  if(themeIdx===null) return (
    <div style={{padding:20}}>
      <div className="font-display" style={{fontSize:'1.25rem',fontWeight:600,marginBottom:6}}>Word Search</div>

  return (
    <div style={{padding:'12px 14px'}}>
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:10}}>

        <div style={{fontSize:'0.8125rem',color:'var(--ink-muted)'}}>{found.length}/{gd.placed.length} found</div>
      </div>

      {wonMsg&&<div style={{textAlign:'center',padding:'8px 14px',borderRadius:8,background:'#F0FDF4',color:'#16A34A',fontWeight:700,marginBottom:10,fontSize:'0.875rem'}}>
        {wonMsg} <button onClick={()=>setThemeIdx(null)} style={{marginLeft:8,fontSize:'0.75rem',background:'none',border:'none',cursor:'pointer',textDecoration:'underline',color:'#16A34A'}}>Play another</button>
      </div>}

      <div style={{display:'flex',flexWrap:'wrap',gap:5,marginBottom:12}}>
        {gd.placed.map(p=>(
          <span key={p.word} style={{fontSize:'0.6875rem',fontWeight:600,padding:'2px 8px',borderRadius:999,
            background:found.some(f=>f.word===p.word)?'#F0FDF4':'#F4F4F0',
            color:found.some(f=>f.word===p.word)?'#16A34A':'var(--ink-muted)',
            textDecoration:found.some(f=>f.word===p.word)?'line-through':'none',letterSpacing:'.04em'}}>{p.word}</span>
        ))}
      </div>

      <div style={{display:'inline-grid',gridTemplateColumns:'repeat(10,1fr)',gap:2,touchAction:'none',userSelect:'none'}}>
        {gd.grid.map((row,r)=>row.map((ch,c)=>{
          const key=`${r},${c}`;
          const isF=foundCells.has(key),isP=pathCells.has(key),isS=sel&&sel[0]===r&&sel[1]===c;
          return (
            <div key={key}
              onPointerDown={e=>{e.currentTarget.setPointerCapture(e.pointerId);setSel([r,c]);setHover([r,c]);}}
              onPointerEnter={()=>{if(sel)setHover([r,c]);}}
              onPointerUp={()=>tryWord([r,c])}
              style={{width:28,height:28,display:'flex',alignItems:'center',justifyContent:'center',
                borderRadius:6,fontWeight:700,fontSize:'0.8125rem',fontFamily:'Geist Mono,monospace',cursor:'pointer',
                background:isF?'#F0FDF4':isS?G_ACCENT:isP?G_SOFT:'#F9F9F7',
                color:isF?'#16A34A':isS?'white':isP?G_ACCENT:'var(--ink)',
                border:`1px solid ${isF?'#BBF7D0':isP?G_ACCENT:'var(--border)'}`,
                transition:'background .08s',}}>
              {ch}
            </div>
          );
        }))}
      </div>

      <button onClick={()=>setThemeIdx(null)} style={{marginTop:14,fontSize:'0.8125rem',color:'var(--ink-muted)',background:'none',border:'none',cursor:'pointer',textDecoration:'underline',display:'block'}}>← Choose another theme</button>
    </div>
  );
}

// ─── GAME: Fill in the Blank ───────────────────────────────────────────────────
function FillBlank({ gState, setGState }) {
  const [qs]    = useState(()=>[...FITB].sort(()=>Math.random()-.5).slice(0,10));
  const [qIdx,  setQIdx]  = useState(0);
  const [score, setScore] = useState(0);
  const [ans,   setAns]   = useState(null);
  const [sel,   setSel]   = useState(null);
  const [done,  setDone]  = useState(false);

  const q=qs[qIdx];
  const pick=opt=>{
    if(ans)return;
    setSel(opt);
    const ok=opt===q.b;
    setAns(ok?'correct':'wrong');
    const ns=score+(ok?10:0);
    setTimeout(()=>{
      if(qIdx+1>=qs.length){
        const prev=gState.fitb||{};
        if(ns>(prev.highScore||0))setGState({...gState,fitb:{...prev,highScore:ns}});
        setScore(ns);setDone(true);
      } else {setScore(ns);setQIdx(i=>i+1);setAns(null);setSel(null);}
    },1100);
  };

  if(done){
    const pct=Math.round((score/100)*100);
    return (
      <div style={{padding:24,textAlign:'center'}}>
        <div style={{fontSize:'3rem',marginBottom:12}}>{pct>=80?'🏆':pct>=60?'🌟':'📖'}</div>
        <div className="font-display" style={{fontSize:'2.25rem',fontWeight:600,marginBottom:4}}>{score}/100</div>
        <div style={{fontSize:'0.875rem',color:'var(--ink-muted)',marginBottom:16}}>{pct>=80?'Scripture Scholar!':pct>=60?'Keep memorizing!':'Keep reading your Bible!'}</div>
        {gState.fitb?.highScore===score&&score>0&&<div style={{color:'#F59E0B',fontWeight:600,marginBottom:16}}>⭐ New high score!</div>}
        <button onClick={()=>{setQIdx(0);setScore(0);setAns(null);setSel(null);setDone(false);}} style={{padding:'10px 24px',borderRadius:999,background:'var(--ink)',color:'white',border:'none',cursor:'pointer',fontSize:'0.875rem',fontWeight:600}}>Play again</button>
      </div>
    );
  }

  const parts=q.t.split('___');
  return (
    <div style={{padding:20}}>
      <div style={{display:'flex',justifyContent:'space-between',marginBottom:10}}>
        <div style={{fontSize:'0.75rem',color:'var(--ink-muted)'}}>Verse {qIdx+1}/10</div>
        <div style={{fontSize:'0.875rem',fontWeight:600,color:G_ACCENT}}>{score} pts</div>
      </div>
      <div style={{height:4,borderRadius:2,background:'var(--border)',marginBottom:20}}>
        <div style={{height:4,borderRadius:2,background:G_ACCENT,width:`${(qIdx/10)*100}%`,transition:'width .3s'}}/>
      </div>

      <div style={{padding:'18px',borderRadius:14,background:G_TINT,border:`1px solid ${G_SOFT}`,marginBottom:20,lineHeight:1.8,fontSize:'1.0625rem'}}>
        <span style={{fontStyle:'italic',color:'var(--ink)'}}>
          "{parts[0]}
          <span style={{display:'inline-block',borderBottom:`2px solid ${G_ACCENT}`,minWidth:56,height:26,marginBottom:-6,background:ans?G_SOFT:'transparent',color:G_ACCENT,fontWeight:700,textAlign:'center',padding:'0 6px',transition:'background .3s'}}>
            {ans?q.b:'　'}
          </span>
          {parts[1]}"
        </span>
        <div style={{fontSize:'0.75rem',color:'var(--ink-muted)',marginTop:8,fontStyle:'normal'}}>— {q.r}</div>
      </div>

      <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:10}}>
        {q.o.map(opt=>{
          let bg='#F9F9F7',border='var(--border)',color='var(--ink)';
          if(ans){if(opt===q.b){bg='#F0FDF4';border='#16A34A';color='#15803D';}else if(opt===sel&&sel!==q.b){bg='#FEF2F2';border='#DC2626';color='#DC2626';}}
          return (
            <button key={opt} onClick={()=>pick(opt)} disabled={!!ans}
              style={{padding:'14px',borderRadius:12,border:`2px solid ${border}`,background:bg,color,fontSize:'0.9375rem',fontWeight:600,cursor:ans?'default':'pointer',transition:'all .2s'}}>
              {opt}{ans&&opt===q.b?' ✓':''}{ans&&opt===sel&&sel!==q.b?' ✗':''}
            </button>
          );
        })}
      </div>
    </div>
  );
}

const ATT_BLUE = '#0284C7';

// Find this member's records in attendance.json by name matching
function matchAttendanceRecord(me, attendanceData) {
  if (!me || !attendanceData?.sessions) return null;
  const norm = s => (s || '').trim().toLowerCase();
  const myName = norm(me.name);
  const myFull = norm((me.title ? me.title + ' ' : '') + me.name);

  // Look through all sessions to find records for this member
  const myRecords = [];
  for (const sess of attendanceData.sessions) {
    const rec = (sess.records || []).find(r =>
      norm(r.memberName) === myName ||
      norm(r.memberName) === myFull ||
      r.memberId === me.id
    );
    myRecords.push({
      date:         sess.date,
      service:      sess.service,
      serviceLabel: sess.serviceLabel || sess.service,
      status:       rec?.status || 'absent',  // not found in records = absent
    });
  }
  return myRecords.sort((a, b) => b.date.localeCompare(a.date));
}

function getMyAttendanceStats(myRecords) {
  if (!myRecords || !myRecords.length) return null;
  const fridays = myRecords.filter(r => r.service === 'Friday');
  const sundays = myRecords.filter(r => r.service === 'Sunday');

  const pct = list => list.length
    ? Math.round(list.filter(r => r.status === 'present').length / list.length * 100)
    : null;

  return {
    overall:        pct(myRecords),
    friday:         pct(fridays),
    sunday:         pct(sundays),
    totalSessions:  myRecords.length,
    fridaySessions: fridays.length,
    sundaySessions: sundays.length,
    recent10:       myRecords.slice(0, 10),
    streak: (() => {
      let streak = 0;
      for (const r of myRecords) {
        if (r.status === 'present') streak++;
        else break;
      }
      return streak;
    })(),
  };
}

function PersonalAttendanceCard({ me, attendanceData, compact }) {
  const myRecords = useMemo(() => matchAttendanceRecord(me, attendanceData), [me, attendanceData]);
  const stats     = useMemo(() => getMyAttendanceStats(myRecords), [myRecords]);

  if (!attendanceData || !myRecords || !stats) return null;
  if (!stats.totalSessions) return null;

  const pctColor = pct =>
    pct === null ? 'var(--ink-subtle)' :
    pct >= 80 ? '#16A34A' :
    pct >= 60 ? '#D97706' : '#DC2626';

  if (compact) {
    // Small badge for Home tab
    return (
      <div className="card" style={{ padding:'14px 16px', borderLeft:`3px solid ${ATT_BLUE}`, marginBottom:0 }}>
        <div style={{ fontSize:'0.6875rem', fontWeight:700, letterSpacing:'.08em', textTransform:'uppercase', color:ATT_BLUE, marginBottom:6 }}>
          📋 My Attendance
        </div>
        <div style={{ display:'flex', alignItems:'center', gap:16, flexWrap:'wrap' }}>
          <div style={{ textAlign:'center' }}>
            <div className="font-display" style={{ fontSize:'2rem', fontWeight:700, color:pctColor(stats.overall), lineHeight:1 }}>{stats.overall}%</div>
            <div style={{ fontSize:'0.6875rem', color:'var(--ink-muted)', marginTop:2 }}>Overall</div>
          </div>
          {stats.fridaySessions > 0 && (
            <div style={{ textAlign:'center' }}>
              <div className="font-display" style={{ fontSize:'1.375rem', fontWeight:700, color:pctColor(stats.friday), lineHeight:1 }}>{stats.friday}%</div>
              <div style={{ fontSize:'0.6875rem', color:'var(--ink-muted)', marginTop:2 }}>Friday</div>
            </div>
          )}
          {stats.sundaySessions > 0 && (
            <div style={{ textAlign:'center' }}>
              <div className="font-display" style={{ fontSize:'1.375rem', fontWeight:700, color:pctColor(stats.sunday), lineHeight:1 }}>{stats.sunday}%</div>
              <div style={{ fontSize:'0.6875rem', color:'var(--ink-muted)', marginTop:2 }}>Sunday</div>
            </div>
          )}
          {stats.streak > 1 && (
            <div style={{ textAlign:'center' }}>
              <div className="font-display" style={{ fontSize:'1.375rem', fontWeight:700, color:'#F59E0B', lineHeight:1 }}>🔥{stats.streak}</div>
              <div style={{ fontSize:'0.6875rem', color:'var(--ink-muted)', marginTop:2 }}>Streak</div>
            </div>
          )}
        </div>
        <div style={{ fontSize:'0.6875rem', color:'var(--ink-subtle)', marginTop:8 }}>
          Based on {stats.totalSessions} recorded session{stats.totalSessions !== 1 ? 's' : ''}
        </div>
      </div>
    );
  }

  // Full card for My Schedule tab
  return (
    <div className="card" style={{ overflow:'hidden', marginBottom:16 }}>
      {/* Header */}
      <div style={{ padding:'14px 16px', background:ATT_BLUE+'0F', borderBottom:'1px solid var(--border)' }}>
        <div style={{ fontSize:'0.6875rem', fontWeight:700, letterSpacing:'.08em', textTransform:'uppercase', color:ATT_BLUE, marginBottom:4 }}>📋 My Attendance Record</div>
        <div style={{ display:'flex', gap:20, flexWrap:'wrap', alignItems:'center' }}>
          <div>
            <div className="font-display" style={{ fontSize:'3rem', fontWeight:700, color:pctColor(stats.overall), lineHeight:1 }}>{stats.overall}%</div>
            <div style={{ fontSize:'0.75rem', color:'var(--ink-muted)' }}>Overall · {stats.totalSessions} sessions</div>
          </div>
          <div style={{ display:'flex', gap:16 }}>
            {stats.fridaySessions > 0 && (
              <div>
                <div className="font-display" style={{ fontSize:'1.75rem', fontWeight:700, color:pctColor(stats.friday) }}>{stats.friday}%</div>
                <div style={{ fontSize:'0.6875rem', color:'var(--ink-muted)' }}>Friday · {stats.fridaySessions}</div>
              </div>
            )}
            {stats.sundaySessions > 0 && (
              <div>
                <div className="font-display" style={{ fontSize:'1.75rem', fontWeight:700, color:pctColor(stats.sunday) }}>{stats.sunday}%</div>
                <div style={{ fontSize:'0.6875rem', color:'var(--ink-muted)' }}>Sunday · {stats.sundaySessions}</div>
              </div>
            )}
          </div>
        </div>
        {stats.streak >= 2 && (
          <div style={{ marginTop:8, fontSize:'0.8125rem', color:'#F59E0B', fontWeight:600 }}>
            🔥 {stats.streak} consecutive sessions — keep it up!
          </div>
        )}
      </div>

      {/* Timeline — last 10 */}
      <div style={{ padding:'12px 16px 4px' }}>
        <div style={{ fontSize:'0.6875rem', fontWeight:700, letterSpacing:'.08em', textTransform:'uppercase', color:'var(--ink-subtle)', marginBottom:10 }}>Last 10 Services</div>
        <div style={{ display:'flex', gap:6, flexWrap:'wrap' }}>
          {stats.recent10.map((r, i) => (
            <div key={i} title={`${r.serviceLabel} · ${r.date}`}
              style={{
                display:'flex', flexDirection:'column', alignItems:'center', gap:3,
                padding:'6px 4px', borderRadius:8, minWidth:36,
                background: r.status === 'present' ? '#F0FDF4' : '#FFF1F2',
                border: `1px solid ${r.status === 'present' ? '#BBF7D0' : '#FECDD3'}`,
              }}>
              <div style={{ fontSize:'0.875rem' }}>{r.status === 'present' ? '✓' : '✗'}</div>
              <div style={{ fontSize:'0.5625rem', color:'var(--ink-subtle)', fontFamily:'Geist Mono,monospace', lineHeight:1.2, textAlign:'center' }}>
                {r.date.slice(5)}
              </div>
              <div style={{ fontSize:'0.5rem', color:r.service==='Friday'?ATT_BLUE:'#7C3AED', fontWeight:600 }}>
                {r.service.slice(0,3).toUpperCase()}
              </div>
            </div>
          ))}
        </div>
      </div>

      {/* Progress bar */}
      <div style={{ padding:'12px 16px 14px' }}>
        <div style={{ height:6, borderRadius:3, background:'#E5E7EB', overflow:'hidden' }}>
          <div style={{ height:6, borderRadius:3, background:ATT_BLUE, width:`${stats.overall}%`, transition:'width .5s ease' }} />
        </div>
        <div style={{ display:'flex', justifyContent:'space-between', marginTop:4, fontSize:'0.6875rem', color:'var(--ink-subtle)' }}>
          <span>0%</span>
          <span style={{ color:pctColor(stats.overall), fontWeight:600 }}>You: {stats.overall}%</span>
          <span>100%</span>
        </div>
        <div style={{ fontSize:'0.6875rem', color:'var(--ink-subtle)', marginTop:8, textAlign:'center', fontStyle:'italic' }}>
          Your attendance is private — only visible to you on this device
        </div>
      </div>
    </div>
  );
}

function BibleTab() {
  const [translation, setTranslation] = React.useState(() => {
    try { return localStorage.getItem(BIBLE_KEY) || 'web'; } catch { return 'web'; }
  });
  const [votd, setVotd] = React.useState(null);
  const [votdLoading, setVotdLoading] = React.useState(true);
  const [votdError, setVotdError] = React.useState(null);
  const [query, setQuery] = React.useState('');
  const [result, setResult] = React.useState(null);
  const [searchLoading, setSearchLoading] = React.useState(false);
  const [searchError, setSearchError] = React.useState(null);

  const dayRef = React.useMemo(() => {
    const start = new Date(new Date().getFullYear(), 0, 0);
    const day = Math.floor((Date.now() - start) / 86400000);
    return VOTD_REFS[day % VOTD_REFS.length];
  }, []);

  const devotion = VOTD_DEVOTIONS[dayRef] || null;

  const fetchVerse = async (ref, trans) => {
    const url = `https://bible-api.com/${encodeURIComponent(ref)}?translation=${trans}`;
    const resp = await fetch(url);
    if (!resp.ok) throw new Error('Verse not found');
    return resp.json();
  };

  React.useEffect(() => {
    setVotdLoading(true); setVotdError(null);
    fetchVerse(dayRef, translation)
      .then(d => setVotd(d))
      .catch(() => setVotdError('Could not load verse. Check your connection.'))
      .finally(() => setVotdLoading(false));
  }, [dayRef, translation]);

  const changeTranslation = t => {
    setTranslation(t);
    try { localStorage.setItem(BIBLE_KEY, t); } catch {}
    setResult(null);
  };

  const handleSearch = async e => {
    e?.preventDefault();
    if (!query.trim()) return;
    setSearchLoading(true); setSearchError(null); setResult(null);
    try { setResult(await fetchVerse(query.trim(), translation)); }
    catch { setSearchError('Verse not found. Try a reference like "John 3:16", "Psalm 23", or "Romans 8:28-30".'); }
    finally { setSearchLoading(false); }
  };

  return (
    <div className="fade-in">
      <SectionHeading eyebrow="God's Word" title="Bible">
        Verse of the day and reference lookup.
      </SectionHeading>

      <div className="flex gap-2 mb-5 flex-wrap">
        {[{key:'web',label:'WEB (Modern)'},{key:'kjv',label:'KJV (Classic)'}].map(t => (
          <button key={t.key} className={`btn text-xs ${translation===t.key?'btn-primary':'btn-ghost'}`} onClick={() => changeTranslation(t.key)}>{t.label}</button>
        ))}
        <span className="text-xs ink-subtle self-center ml-2 italic">NIV requires a Scripture API key (coming soon)</span>
      </div>

      {/* Verse of the Day */}
      <div className="card p-6 mb-6" style={{background:'linear-gradient(135deg,#1E1B4B 0%,#312E81 100%)',border:'none',color:'white'}}>
        <div className="text-xs font-medium tracking-widest uppercase mb-3" style={{color:'#A5B4FC'}}>📖 Verse of the Day</div>
        {votdLoading && <div className="text-sm" style={{color:'#C7D2FE'}}>Loading…</div>}
        {votdError  && <div className="text-sm" style={{color:'#FCA5A5'}}>{votdError}</div>}
        {votd && !votdLoading && (
          <>
            <blockquote className="font-display text-lg leading-relaxed mb-4" style={{color:'#EEF2FF',fontStyle:'italic'}}>
              "{votd.text?.trim()}"
            </blockquote>
            <div className="text-sm font-semibold" style={{color:'#A5B4FC'}}>
              {votd.reference} <span className="font-normal" style={{color:'#818CF8'}}>· {translation.toUpperCase()}</span>
            </div>
          </>
        )}
      </div>

      {/* Daily Devotion */}
      {devotion && (
        <div className="card p-6 mb-6">
          <div className="text-xs font-medium tracking-widest uppercase mb-3" style={{color:'var(--accent)'}}>🕊️ Today's Devotion</div>
          <div className="text-sm ink-muted mb-2 font-medium">{dayRef}</div>
          <p className="text-sm ink leading-relaxed" style={{lineHeight:1.8}}>{devotion}</p>
        </div>
      )}

      {/* Search */}
      <div className="card p-6">
        <div className="text-xs font-medium tracking-widest uppercase ink-subtle mb-3">Look Up a Verse</div>
        <form onSubmit={handleSearch} className="flex gap-2">
          <input className="input flex-1" placeholder='e.g. John 3:16, Psalm 23, Romans 8:28-30' value={query} onChange={e => setQuery(e.target.value)} />
          <button type="submit" className="btn btn-accent" disabled={searchLoading || !query.trim()}>{searchLoading ? '…' : 'Go'}</button>
        </form>
        {searchError && <div className="text-sm mt-3" style={{color:'var(--danger)'}}>{searchError}</div>}
        {result && (
          <div className="mt-5">
            <div className="text-xs font-medium tracking-widest uppercase ink-subtle mb-3">{result.reference} · {translation.toUpperCase()}</div>
            {(result.verses||[]).length > 1 ? (
              <div className="space-y-2">
                {result.verses.map(v => (
                  <div key={v.verse} className="flex gap-2 text-sm leading-relaxed">
                    <span className="font-mono text-xs ink-subtle mt-0.5" style={{minWidth:20}}>{v.verse}</span>
                    <span className="ink">{v.text?.trim()}</span>
                  </div>
                ))}
              </div>
            ) : (
              <div className="text-sm ink leading-relaxed">{result.text?.trim()}</div>
            )}
          </div>
        )}
      </div>
    </div>
  );
}
