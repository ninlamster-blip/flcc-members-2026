const ASK_KEY        = 'flcc-claude-api-key-v1';
const ASK_PROXY_KEY  = 'flcc-ask-proxy-url-v1';
const ASK_MODEL      = 'claude-haiku-4-5-20251001';

function buildChurchContext(data, prayerData, musicData, equipData, botrData = {}) {
  const workers  = data.workers  || [];
  const schedule = data.schedule || [];
  const botr     = botrData || {};
  const pm = prayerData?.ministry || {};
  const mm = musicData?.ministry  || {};

  const wn = id => { const w = workers.find(x=>x.id===id); return w ? [w.title,w.name].filter(Boolean).join(' ') : id||'—'; };

  const workerLines = workers.map(w =>
    `  - ${[w.title,w.name].filter(Boolean).join(' ')}${w.eligibleRoles?.length ? ` (${w.eligibleRoles.join(', ')})` : ''}`
  ).join('\n');

  const byRole = role => workers
    .filter(w => w.status==='active' && w.eligibleRoles?.includes(role))
    .map(w => [w.title,w.name].filter(Boolean).join(' '))
    .join(', ');

  const scheduleLines = schedule
    .slice().sort((a,b)=>a.date.localeCompare(b.date))
    .map(s => {
      const r = s.roles||{};
      const parts = [
        r.preacher           ? `Preacher: ${wn(r.preacher)}` : null,
        r.pastoralPrayer     ? `Prayer: ${wn(r.pastoralPrayer)}` : null,
        r.presider           ? `Presider: ${wn(r.presider)}` : null,
        r.songLeader         ? `Song Leader: ${wn(r.songLeader)}` : null,
        r.communionAssistant1 ? `Communion: ${wn(r.communionAssistant1)}` : null,
        r.communionAssistant2 ? `& ${wn(r.communionAssistant2)}` : null,
        r.foodInCharge       ? `Food: ${wn(r.foodInCharge)}` : null,
      ].filter(Boolean).join(' | ');
      const flag = s.isSpecial ? ` ★ ${s.specialNote}` : '';
      return `  ${s.date} [${s.service}]${flag}: ${parts||'(not assigned)'}`;
    }).join('\n');

  const themeLines  = Object.entries(data.themes||{}).map(([m,t])=>`  ${m}: ${t||'(TBD)'}`).join('\n');
  const equipMin    = (equipData?.ministries||[]).map(em=>`  ${em.name}: ${em.headName}`).join('\n');
  const courses     = (equipData?.courses||[]).map(c=>`  - ${c.title} (${c.facilitator})`).join('\n');
  const events      = (data.events||[]).map(e=>`  - ${e.date}: ${e.title} (${e.type})`).join('\n');

  const botrSectors = (botr.sectorLeaders||[]).filter(s=>s.name).map(s=>
    `  ${s.sector}: ${s.name} | Coord: ${s.evangelismCoordinator||'—'} | Churches: ${(s.churches||[]).join(', ')}`
  ).join('\n');
  const botrChurches = (botr.satelliteChurches||[]).map(s=>`  ${s.church} (${s.sector})`).join('\n');

  return `You are "Ask FLCC" — the warm, knowledgeable AI assistant for ${data.meta?.churchName||'FLCC - Abundance Church'} (Full Life Christian Church).
You have complete knowledge of the church: members, schedules, ministries, events, BOTR network, and more.
Be warm, encouraging, and helpful. Address members by their proper titles (Bro./Sis./Ptr./Rev.).
You know the Bible deeply and can answer Christian faith questions. When quoting Scripture, give the reference.

=== FLCC BOTR CHURCH NETWORK ===
Name: ${botr.name||'FLCC - BOTR Church Network'}
Network: ${botr.network||'N.E.C.K. Kuwait'}
Lead Pastor: ${botr.leadPastor?.name||'Rev. Jopet Alim'}  Title: ${botr.leadPastor?.title||'Lead Pastor, FLCC BOTR Network'}
Evangelism Ministry Head: ${botr.evangelismMinistryHead?.name||'Sis. Lizel Ocenar'}
Mission Target: ${botr.missionTarget||'Introduce 270,000 people to Jesus Christ by 2030'}
Total Churches: ${botr.totalChurches||'12'} satellite locations + virtual platform

Sector Leaders:
${botrSectors||'  (data not yet loaded from BOTR app)'}

Satellite Churches:
${botrChurches||'  (data not yet loaded from BOTR app)'}

=== FLCC ABUNDANCE — FELLOWSHIP MINISTRY ===
Head: ${data.ministry?.headName||'N/A'} (${data.ministry?.headTitle||''}) · WhatsApp: ${data.ministry?.whatsapp||'N/A'}

=== PRAYER MINISTRY ===
Head: ${pm.headName||'N/A'} (${pm.headTitle||''}) · WhatsApp: ${pm.whatsapp||'N/A'}

=== MUSIC MINISTRY ===
Head: ${mm.headName||'N/A'} (${mm.headTitle||''}) · WhatsApp: ${mm.whatsapp||'N/A'}

=== OTHER MINISTRIES ===
${equipMin||'(none listed)'}

=== EQUIP COURSES ===
${courses||'(none listed)'}

=== MEMBERS (${workers.length} total) ===
${workerLines}

=== 2026 ACTIVE WORKERS BY ROLE ===
Preachers: ${byRole('preacher')||'(none listed)'}
Pastoral Prayer: ${byRole('pastoralPrayer')||'(none listed)'}
Presiders/EMCEEs: ${byRole('presider')||'(none listed)'}
Song Leaders: ${byRole('songLeader')||'(none listed)'}

=== 2026 MONTHLY SERMON THEMES ===
${themeLines}

=== 2026 FULL SERVICE SCHEDULE (names resolved) ===
${scheduleLines}

=== EVENTS ===
${events||'(none listed)'}`;
}

function AskTab({ data, prayerData, musicData, equipData }) {
  const [proxyUrl, setProxyUrl]   = React.useState(() => { try { return localStorage.getItem(ASK_PROXY_KEY)||''; } catch { return ''; } });
  const [apiKey, setApiKey]       = React.useState(() => { try { return localStorage.getItem(ASK_KEY)||''; } catch { return ''; } });
  const [setupInput, setSetupInput] = React.useState('');
  const [setupMode, setSetupMode]   = React.useState('proxy'); // 'proxy' | 'key'
  const [messages, setMessages] = React.useState([
    { role:'assistant', content:`Hello! I'm Ask FLCC — your church AI assistant.\n\nI know everything about ${data.meta.churchName}, the FLCC BOTR Network, all service schedules, members, and ministries. I can also answer Bible questions and give Christian guidance.\n\nWhat would you like to know?` }
  ]);
  const [input, setInput]     = React.useState('');
  const [loading, setLoading] = React.useState(false);
  const endRef   = React.useRef(null);
  const inputRef = React.useRef(null);

  const isReady   = !!(proxyUrl || apiKey);
  const systemCtx = React.useMemo(() => buildChurchContext(data, prayerData, musicData, equipData), []);
  React.useEffect(() => { endRef.current?.scrollIntoView({ behavior:'smooth' }); }, [messages]);

  const saveSetup = () => {
    const v = setupInput.trim();
    if (!v) return;
    if (setupMode === 'proxy') {
      if (!v.startsWith('http')) { alert('Proxy URL should start with https://'); return; }
      setProxyUrl(v); try { localStorage.setItem(ASK_PROXY_KEY, v); } catch {}
    } else {
      if (!v.startsWith('sk-ant-')) { alert("API key should start with sk-ant-"); return; }
      setApiKey(v); try { localStorage.setItem(ASK_KEY, v); } catch {}
    }
    setSetupInput('');
  };

  const clearSetup = () => {
    setProxyUrl(''); setApiKey('');
    try { localStorage.removeItem(ASK_PROXY_KEY); localStorage.removeItem(ASK_KEY); } catch {}
  };

  const send = async () => {
    if (!input.trim() || loading) return;
    const userMsg = { role:'user', content: input.trim() };
    const history = [...messages, userMsg];
    setMessages(history); setInput(''); setLoading(true);
    try {
      const endpoint = proxyUrl || 'https://api.anthropic.com/v1/messages';
      const headers  = { 'Content-Type': 'application/json' };
      if (!proxyUrl) {
        headers['x-api-key'] = apiKey;
        headers['anthropic-version'] = '2023-06-01';
        headers['anthropic-dangerous-direct-browser-access'] = 'true';
      }
      const resp = await fetch(endpoint, {
        method: 'POST', headers,
        body: JSON.stringify({
          model: ASK_MODEL, max_tokens: 1024,
          system: systemCtx,
          messages: history.map(m=>({ role:m.role, content:m.content })),
        }),
      });
      if (!resp.ok) { const e=await resp.json().catch(()=>{}); throw new Error(e?.error?.message||`HTTP ${resp.status}`); }
      const d = await resp.json();
      setMessages(prev => [...prev, { role:'assistant', content: d.content?.[0]?.text||'(no response)' }]);
    } catch(e) {
      setMessages(prev => [...prev, { role:'assistant', content:`⚠️ ${e.message}. Please check your setup.` }]);
    } finally { setLoading(false); inputRef.current?.focus(); }
  };

  const onKey = e => { if (e.key==='Enter' && !e.shiftKey) { e.preventDefault(); send(); } };

  if (!isReady) return (
    <div className="fade-in">
      <SectionHeading eyebrow="Ask FLCC" title="AI Church Assistant">
        Powered by Claude AI — knows your full church data, BOTR network, Bible, and Christian guidance.
      </SectionHeading>

      {/* Mode toggle */}
      <div className="flex gap-2 mb-4">
        <button className={`btn text-xs ${setupMode==='proxy'?'btn-primary':'btn-ghost'}`} onClick={()=>setSetupMode('proxy')}>
          🌐 Shared (Cloudflare Worker)
        </button>
        <button className={`btn text-xs ${setupMode==='key'?'btn-primary':'btn-ghost'}`} onClick={()=>setSetupMode('key')}>
          🔑 My Own API Key
        </button>
      </div>

      {setupMode === 'proxy' ? (
        <div className="card p-6 mb-4">
          <div className="font-display text-lg font-semibold mb-1">Shared Mode — Works for Everyone</div>
          <div className="text-sm ink-muted mb-4">
            The admin sets up a Cloudflare Worker once. All members use Ask FLCC with no individual setup required.
          </div>
          <div className="space-y-2 text-sm mb-5">
            <div className="flex gap-2"><span className="pill pill-accent">1</span><span>Go to <strong>dash.cloudflare.com</strong> → Workers &amp; Pages → Create Worker</span></div>
            <div className="flex gap-2"><span className="pill pill-accent">2</span><span>Paste the script from <code className="font-mono text-xs bg-gray-100 px-1 rounded">ask-proxy/worker.js</code> in this repo, then Deploy</span></div>
            <div className="flex gap-2"><span className="pill pill-accent">3</span><span>Worker Settings → Variables → Add Secret: <code className="font-mono text-xs bg-gray-100 px-1 rounded">ANTHROPIC_API_KEY</code></span></div>
            <div className="flex gap-2"><span className="pill pill-accent">4</span><span>Copy your Worker URL and paste it below</span></div>
          </div>
          <div className="flex gap-2">
            <input className="input flex-1" placeholder="https://flcc-ask.yourname.workers.dev" value={setupInput} onChange={e=>setSetupInput(e.target.value)} onKeyDown={e=>e.key==='Enter'&&saveSetup()} />
            <button className="btn btn-accent" onClick={saveSetup} disabled={!setupInput.trim()}>Activate</button>
          </div>
        </div>
      ) : (
        <div className="card p-6 mb-4">
          <div className="font-display text-lg font-semibold mb-1">My Own API Key</div>
          <div className="text-sm ink-muted mb-4">
            Your key stays on this device only. Each member who wants to use Ask FLCC will need to set up their own key.
          </div>
          <div className="flex gap-2 mb-3">
            <input type="password" className="input flex-1" placeholder="sk-ant-..." value={setupInput} onChange={e=>setSetupInput(e.target.value)} onKeyDown={e=>e.key==='Enter'&&saveSetup()} />
            <button className="btn btn-accent" onClick={saveSetup} disabled={!setupInput.trim()}>Activate</button>
          </div>
          <a href="https://console.anthropic.com/" target="_blank" rel="noopener" className="text-xs ink-muted hover:underline">Get a free key at console.anthropic.com →</a>
        </div>
      )}
    </div>
  );

  return (
    <div className="fade-in" style={{display:'flex',flexDirection:'column',height:'calc(100vh - 200px)',minHeight:400}}>
      <div className="flex items-center justify-between mb-3">
        <SectionHeading eyebrow="Ask FLCC" title="AI Church Assistant" />
        <button className="btn btn-ghost text-xs" onClick={clearSetup} style={{flexShrink:0}}>⚙️ Change Setup</button>
      </div>
      <div className="card flex-1 overflow-y-auto p-4" style={{marginBottom:'0.75rem',minHeight:200}}>
        <div className="space-y-4">
          {messages.map((msg,i) => (
            <div key={i} className={`flex ${msg.role==='user'?'justify-end':'justify-start'}`}>
              <div style={{
                maxWidth:'85%', padding:'10px 14px', whiteSpace:'pre-wrap', lineHeight:1.6, fontSize:'0.9rem',

  { key: 'mine',     label: 'My Schedule', requiresMe: true },

  { key: 'calendar', label: 'Calendar' },

];

const GIVING_KEY = 'flcc-giving-name-v1';
const GIVING_GOLD = '#D97706';

// ── number to words (KWD) ───────────────────────────────────────────────────
const G_ONES=['','One','Two','Three','Four','Five','Six','Seven','Eight','Nine','Ten','Eleven','Twelve','Thirteen','Fourteen','Fifteen','Sixteen','Seventeen','Eighteen','Nineteen'];
const G_TENS=['','','Twenty','Thirty','Forty','Fifty','Sixty','Seventy','Eighty','Ninety'];
function gChunk(n){ if(n<=0)return''; if(n<20)return G_ONES[n]; if(n<100)return G_TENS[Math.floor(n/10)]+(n%10?' '+G_ONES[n%10]:''); return G_ONES[Math.floor(n/100)]+' Hundred'+(n%100?' '+gChunk(n%100):'') }
function gWords(amt){ const w=Math.floor(amt),f=Math.round((amt-w)*1000); let p=[]; if(w>0){if(w>=1000)p.push(gChunk(Math.floor(w/1000))+' Thousand'); if(w%1000)p.push(gChunk(w%1000)); p.push('Dinar'+(w!==1?'s':''));} if(f>0)p.push(gChunk(f)+' Fils'); return(p.join(' ')||'Zero')+' Only'; }

  // Auto-select if name matches the logged-in member
  useEffect(() => {
    if (me && !selName) {
      const match = allNames.find(n => n.toLowerCase() === me.name.toLowerCase());

  }, [me, allNames]);

    selName ? (givingData?.members||[]).find(m=>m.name.toLowerCase()===selName.toLowerCase()) : null,

function App() {
  const [data, setData] = useState(null);
  const [prayerData, setPrayerData] = useState(null);
  const [musicData, setMusicData] = useState(null);
  const [equipData, setEquipData] = useState(null);
  const [attendanceData, setAttendanceData] = useState(null);
  const [givingData, setGivingData] = useState(null);
  const [error, setError] = useState(null);
  const [me, setMe] = useState(null);
  const [meId, setMeId] = useState(() => {
    try { return localStorage.getItem(ME_KEY); } catch { return null; }
  });
  const [showPicker, setShowPicker] = useState(false);
  const [activeTab, setActiveTab] = useState('home');
  const [currentMonth, setCurrentMonth] = useState(monthKey(todayISO()));
  const [conflictTarget, setConflictTarget] = useState(null);
  const [lastLoaded, setLastLoaded] = useState(null);
  const [refreshing, setRefreshing] = useState(false);
  const [personalEvents, setPersonalEventsState] = useState(() => loadPersonalEvents());
  const [showAddPersonal, setShowAddPersonal] = useState(false);
  const [editingPersonal, setEditingPersonal] = useState(null);
  const [sermonNotes, setSermonNotesState]     = useState(loadSermonNotes);
  const [openingNote, setOpeningNote]          = useState(null);
  const [showGames,   setShowGames]            = useState(false);   // { id, meta }
  const [botrLive, setBotrLive]               = useState(null);
  const [botrLiveStatus, setBotrLiveStatus]   = useState('idle'); // 'idle'|'loading'|'ok'|'error'
  const botrLiveFetching                      = useRef(false);
  const [notifSeen, setNotifSeenState]        = useState(() => loadNotifSeen());
  const handleMarkNotifSeen = ids => setNotifSeenState(prev => { const next = [...new Set([...prev, ...ids])]; saveNotifSeen(next); return next; });

  const setPersonalEvents = (evs) => { savePersonalEvents(evs); setPersonalEventsState(evs); };
  const handleSaveSermonNote = (id, note) => {
    const updated = { ...sermonNotes, [id]: note };
    persistSermonNotes(updated);
    setSermonNotesState(updated);
  };
  const handleDeleteSermonNote = (id) => {
    const updated = { ...sermonNotes };
    delete updated[id];
    persistSermonNotes(updated);
    setSermonNotesState(updated);
    setOpeningNote(null);
  };

  // Load data (silent variant when called from visibility change)
  const loadData = (silent = false) => {
    if (!silent) setError(null);
    setRefreshing(true);
    let pendingDone = 0;
    const checkDone = () => {
      pendingDone += 1;
      if (pendingDone >= 6) setRefreshing(false);
    };
    // Required: data.json
    fetch(`${DATA_URL}?t=${Date.now()}`)
      .then(res => {
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        return res.json();
      })
      .then(d => {
        if (!d.workers || !d.schedule) throw new Error('Data file is missing workers or schedule.');
        setData(d);
        setLastLoaded(Date.now());
      })
      .catch(err => {
        if (!silent) setError(err.message || 'Network error');
      })
      .finally(checkDone);
    // Optional: prayer.json
    fetch(`${PRAYER_DATA_URL}?t=${Date.now()}`)
      .then(res => { if (!res.ok) throw new Error(`HTTP ${res.status}`); return res.json(); })
      .then(p => {
        if (p && (p.intercessory || p.meetings)) setPrayerData(p);
        else setPrayerData(false);
      })
      .catch(() => setPrayerData(false))
      .finally(checkDone);
    // Optional: music.json
    fetch(`${MUSIC_DATA_URL}?t=${Date.now()}`)
      .then(res => { if (!res.ok) throw new Error(`HTTP ${res.status}`); return res.json(); })
      .then(m => {
        if (m && m.entries) setMusicData(m);
        else setMusicData(false);
      })
      .catch(() => setMusicData(false))
      .finally(checkDone);
    // Optional: equip.json
    fetch(`${EQUIP_DATA_URL}?t=${Date.now()}`)
      .then(res => { if (!res.ok) throw new Error(`HTTP ${res.status}`); return res.json(); })
      .then(e => {
        if (e && (Array.isArray(e.courses) || Array.isArray(e.ministries))) setEquipData(e);
        else setEquipData(false);
      })
      .catch(() => setEquipData(false))
      .finally(checkDone);
    // Optional: attendance.json
    fetch(`${ATTENDANCE_DATA_URL}?t=${Date.now()}`)
      .then(res => { if (!res.ok) throw new Error(`HTTP ${res.status}`); return res.json(); })
      .then(a => {
        if (a && Array.isArray(a.sessions)) setAttendanceData(a);
        else setAttendanceData(false);
      })
      .catch(() => setAttendanceData(false))
      .finally(checkDone);
    // Optional: finance-members.json
    fetch(`${GIVING_DATA_URL}?t=${Date.now()}`)
      .then(res => { if (!res.ok) throw new Error(`HTTP ${res.status}`); return res.json(); })
      .then(g => {
        if (g && Array.isArray(g.members)) setGivingData(g);
        else setGivingData(false);
      })
      .catch(() => setGivingData(false))
      .finally(checkDone);
  };

  useEffect(() => loadData(false), []);

  // Silent refresh when the user comes back to the app (tab regains focus or visibility)
  useEffect(() => {
    const onVisibility = () => {
      if (document.visibilityState === 'visible') {
        // Only if it's been at least 30 seconds since last load (avoid hammering)
        if (!lastLoaded || (Date.now() - lastLoaded) > 30000) {
          loadData(true);
        }
      }
    };
    document.addEventListener('visibilitychange', onVisibility);
    window.addEventListener('focus', onVisibility);
    return () => {
      document.removeEventListener('visibilitychange', onVisibility);
      window.removeEventListener('focus', onVisibility);
    };
  }, [lastLoaded]);

  // Resolve me from meId once data is loaded
  useEffect(() => {
    if (!data || !meId) return;
    const w = data.workers.find(x => x.id === meId);
    if (w) {
      setMe(w);
      setActiveTab('home');
    } else {
      // ID stale (worker deleted) — clear it
      try { localStorage.removeItem(ME_KEY); } catch {}
      setMeId(null);
    }
  }, [data, meId]);

  // First-time visitors: show picker if data loaded but no me
  useEffect(() => {
    if (data && !meId && !showPicker) {
      // Check if user has explicitly skipped before
      let skipped = false;
      try { skipped = localStorage.getItem(ME_KEY + '-skipped') === '1'; } catch {}
      if (!skipped) setShowPicker(true);
    }
  }, [data, meId, showPicker]);

  const loadBOTRStats = () => {
    if (botrLiveFetching.current) return;
    botrLiveFetching.current = true;
    setBotrLiveStatus('loading');
    const cbName = 'flccBotr_' + Date.now();
    const timer = setTimeout(() => {
      botrLiveFetching.current = false;
      setBotrLiveStatus('error');
      delete window[cbName];
    }, 12000);
    const applyData = (d) => {
      clearTimeout(timer);
      botrLiveFetching.current = false;
      if (d && (d.totalGospel != null || d.sectorAgg)) {
        setBotrLive({
          totalGospel:  Number(d.totalGospel)  || 0,
          totalDisc:    Number(d.totalDisc)     || 0,
          totalLeaders: Number(d.totalLeaders)  || 0,
          sectors: d.sectorAgg || {},
          updatedAt: Date.now(),
        });
        setBotrLiveStatus('ok');
      } else {
        setBotrLiveStatus('error');
      }
    };
    fetch(BOTR_SCRIPT_URL + '?action=getLiveData&t=' + Date.now(), {
      method: 'GET', headers: { 'Accept': 'application/json' }
    })
      .then(res => { if (!res.ok) throw new Error(); return res.json(); })
      .then(applyData)
      .catch(() => {
        window[cbName] = (d) => { delete window[cbName]; applyData(d); };
        const el = document.createElement('script');
        el.src = BOTR_SCRIPT_URL + '?action=getLiveData&callback=' + cbName + '&t=' + Date.now();
        el.onerror = () => { clearTimeout(timer); botrLiveFetching.current = false; setBotrLiveStatus('error'); delete window[cbName]; };
        document.head.appendChild(el);
      });
  };

  useEffect(() => {
    if (activeTab === 'about') loadBOTRStats();
  }, [activeTab]);

  const pickMe = (id) => {
    try { localStorage.setItem(ME_KEY, id); localStorage.removeItem(ME_KEY + '-skipped'); } catch {}
    setMeId(id);
    setShowPicker(false);
  };

  const skipPicker = () => {
    try { localStorage.setItem(ME_KEY + '-skipped', '1'); } catch {}
    setShowPicker(false);
  };

  const changeName = () => {
    try { localStorage.removeItem(ME_KEY); } catch {}
    setMe(null);
    setMeId(null);
    setShowPicker(true);
  };

  if (error) return <ErrorScreen error={error} onRetry={() => loadData(false)} />;
  if (!data) return <LoadingScreen />;
  if (showPicker) return <NamePicker workers={data.workers} onPick={pickMe} onSkip={skipPicker} churchName={data.meta.churchName} />;

  const visibleTabs = TABS.filter(t => {
    if (t.requiresMe && !me) return false;
    if (t.requiresPrayer && !prayerData) return false;
    if (t.requiresMusic && !musicData) return false;
    if (t.requiresGiving && !givingData) return false;
    return true;
  });
  const currentTab = visibleTabs.find(t => t.key === activeTab) ? activeTab : 'home';

  const formatLoadedAgo = () => {
    if (!lastLoaded) return '';
    const seconds = Math.floor((Date.now() - lastLoaded) / 1000);
    if (seconds < 60) return 'just now';
    const mins = Math.floor(seconds / 60);
    if (mins < 60) return `${mins}m ago`;
    const hours = Math.floor(mins / 60);
    if (hours < 24) return `${hours}h ago`;
    return new Date(lastLoaded).toLocaleDateString();
  };

  return (
    <div className="min-h-screen bg-app">
      <header style={{ backdropFilter: 'blur(10px)', position: 'sticky', top: 0, zIndex: 20, borderBottom: '1px solid var(--border)' }}>
        <div className="hdr-strip" />
        <div className="max-w-5xl mx-auto px-4 sm:px-6 pt-5 pb-0">
          <div className="flex items-baseline justify-between gap-4 flex-wrap">
            <div>
              <div className="text-xs font-medium tracking-widest uppercase" style={{ color: 'var(--accent)' }}>{data.meta.churchName}</div>
              <h1 className="font-display text-2xl sm:text-3xl font-semibold mt-1 greeting-h1">
                {me ? `Hello, ${me.name}` : 'Schedule'}
              </h1>
            </div>
            <div className="text-xs ink-muted text-right flex flex-col items-end gap-1">
              <div style={{ display: 'flex', alignItems: 'center', gap: 8 }}>
                <a href="ask.html" className="ask-pill">💬 Ask FLCC</a>
                {me && <NotificationBell me={me} data={data} notifSeen={notifSeen} onMarkSeen={handleMarkNotifSeen} />}
              </div>
              {data.meta.publishedAt && (
                <div>Published {new Date(data.meta.publishedAt).toLocaleDateString()}</div>
              )}
              <button className="text-xs underline ink-muted hover:ink" onClick={() => loadData(false)} disabled={refreshing}>
                {refreshing ? '↻ refreshing…' : `↻ ${formatLoadedAgo() || 'refresh'}`}
              </button>
            </div>
          </div>
          <div style={{ position: 'relative' }}>
            <nav style={{ display: 'flex', flexWrap: 'nowrap', overflowX: 'auto', overflowY: 'visible', marginTop: '1rem', paddingBottom: '3px', paddingRight: '32px', msOverflowStyle: 'none', scrollbarWidth: 'none', WebkitOverflowScrolling: 'touch' }}>
              {visibleTabs.map(t => (
                <button key={t.key} className={`tab ${currentTab === t.key ? 'tab-active' : ''}`} onClick={() => setActiveTab(t.key)}>
                  {t.label}
                </button>
              ))}
            </nav>
            {/* Right fade — indicates more tabs to scroll */}
            <div style={{ position: 'absolute', right: 0, top: 0, bottom: 0, width: 36, background: 'linear-gradient(to right, transparent, rgba(250,250,245,0.95))', pointerEvents: 'none' }} />
          </div>
        </div>
      </header>

      <main className="max-w-5xl mx-auto px-4 sm:px-6 py-8">
        <div key={currentTab} className="tab-content-area">
          {currentTab === 'home' && <HomeTab data={data} prayerData={prayerData} musicData={musicData} me={me} setActiveTab={setActiveTab} setCurrentMonth={setCurrentMonth} onConflict={setConflictTarget} personalEvents={personalEvents} onEditPersonal={setEditingPersonal} attendanceData={attendanceData} />}
          {currentTab === 'mine' && me && <MyScheduleTab data={data} prayerData={prayerData} musicData={musicData} me={me} onConflict={setConflictTarget} personalEvents={personalEvents} onEditPersonal={setEditingPersonal} sermonNotes={sermonNotes} onOpenNote={setOpeningNote} attendanceData={attendanceData} />}
          {currentTab === 'month' && <ThisMonthTab data={data} prayerData={prayerData} musicData={musicData} me={me} currentMonth={currentMonth} setCurrentMonth={setCurrentMonth} onConflict={setConflictTarget} personalEvents={personalEvents} onEditPersonal={setEditingPersonal} sermonNotes={sermonNotes} onOpenNote={setOpeningNote} />}
          {currentTab === 'prayer' && prayerData && <PrayerTab data={data} prayerData={prayerData} me={me} currentMonth={currentMonth} setCurrentMonth={setCurrentMonth} onConflict={setConflictTarget} />}
          {currentTab === 'music' && musicData && <MusicTab data={data} musicData={musicData} me={me} currentMonth={currentMonth} setCurrentMonth={setCurrentMonth} onConflict={setConflictTarget} />}
          {currentTab === 'equip'    && <EquipTab equipData={equipData} />}
          {currentTab === 'giving'   && <GivingTab givingData={givingData} me={me} />}
          {currentTab === 'calendar' && <CalendarTab data={data} prayerData={prayerData} musicData={musicData} currentMonth={currentMonth} setCurrentMonth={setCurrentMonth} me={me} personalEvents={personalEvents} onEditPersonal={setEditingPersonal} />}
          {currentTab === 'about' && <AboutTab data={data} prayerData={prayerData} musicData={musicData} equipData={equipData} me={me} onChangeName={changeName} botrLive={botrLive} botrLiveStatus={botrLiveStatus} onRefreshBotr={loadBOTRStats} />}
        </div>
      </main>

      {/* Sermon Notes Modal */}
      {openingNote && (
        <SermonNotesModal
          noteId={openingNote.id}
          meta={openingNote.meta}
          sermonNotes={sermonNotes}
          onSave={handleSaveSermonNote}
          onDelete={handleDeleteSermonNote}
          onClose={() => setOpeningNote(null)}
        />
      )}

      {conflictTarget && (
        <ConflictModal
          entry={conflictTarget.entry}
          role={conflictTarget.role}
          me={me}
          ministry={
            conflictTarget.isMusic && musicData?.ministry ? musicData.ministry :
            conflictTarget.isPrayer && prayerData?.ministry ? prayerData.ministry :
            (data.ministry || {})
          }
          isPrayer={conflictTarget.isPrayer}
          isMusic={conflictTarget.isMusic}
          onClose={() => setConflictTarget(null)}
        />
      )}

      {/* Personal event modals */}
      {(showAddPersonal || editingPersonal) && (() => {
        const myPrayerWorker = prayerData ? findPrayerMatch(me, prayerData.workers) : null;
        const myMusicWorker = musicData ? findMusicMatch(me, musicData.workers) : null;
        const conflictDates = buildMyAssignmentDates(me, data, prayerData, musicData, myPrayerWorker, myMusicWorker);
        return (
          <PersonalEventModal
            initialEvent={editingPersonal || null}
            conflictDates={conflictDates}
            onSave={(saved) => {
              setPersonalEvents(
                editingPersonal
                  ? personalEvents.map(e => e.id === saved.id ? saved : e)
                  : [...personalEvents, saved]
              );
              setShowAddPersonal(false);
              setEditingPersonal(null);
            }}
            onDelete={(id) => {
              setPersonalEvents(personalEvents.filter(e => e.id !== id));
              setEditingPersonal(null);
            }}
            onClose={() => { setShowAddPersonal(false); setEditingPersonal(null); }}
          />
        );
      })()}

      {/* Games FAB — bottom left */}
      <button
        className="fab-live"
        onClick={() => setShowGames(true)}
        style={{
          position: 'fixed', bottom: 28, left: 24,
          width: 54, height: 54, borderRadius: '50%',
          background: G_ACCENT, color: 'white',
          border: 'none', cursor: 'pointer',
          display: 'flex', alignItems: 'center', justifyContent: 'center',
          fontSize: '1.375rem', lineHeight: 1,
          boxShadow: '0 4px 20px rgba(124,58,237,0.38)',
          zIndex: 25, touchAction: 'manipulation', WebkitTapHighlightColor: 'transparent',
        }}
        title="Bible games"
        aria-label="Open Bible games"
      >🎮</button>

      {/* Personal events FAB — bottom right */}
      <button
        className="fab-live"
        onClick={() => setShowAddPersonal(true)}
        style={{
          position: 'fixed', bottom: 28, right: 24,
          width: 54, height: 54, borderRadius: '50%',
          background: 'var(--ink)', color: 'white',
          border: 'none', cursor: 'pointer',
          display: 'flex', alignItems: 'center', justifyContent: 'center',
          fontSize: '1.5rem', lineHeight: 1,
          boxShadow: '0 4px 20px rgba(0,0,0,0.22)',
          zIndex: 25, touchAction: 'manipulation', WebkitTapHighlightColor: 'transparent',
        }}
        title="Add personal event"
        aria-label="Add personal event"
      >+</button>

      {/* Game Hub */}
      {showGames && <GameHub onClose={() => setShowGames(false)} />}

      <footer className="max-w-5xl mx-auto px-4 sm:px-6 py-12 text-xs ink-subtle text-center">
        FLCC Schedule OS · Members View · Data fetched live from <code className="font-mono">data.json</code>
      </footer>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
