<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Preaching Timer — FLCC</title>
<meta name="description" content="Full-screen preaching countdown timer for FLCC service stewards" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone@7.23.9/babel.min.js"></script>
<style>
  html, body { margin: 0; background: #0a0a0a; }
  body { font-family: 'Geist', ui-sans-serif, system-ui, sans-serif; }
  .active\:scale-98:active { transform: scale(0.98); }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel" data-presets="react">
const { useState, useEffect, useRef } = React;

function PreachingTimer() {
  // Configuration
  const INITIAL_MINUTES = 30; // Set your default preaching time here
  const EXTENSION_MINUTES = 5;

  // State Management
  const [timeLeft, setTimeLeft] = useState(INITIAL_MINUTES * 60);
  const [isRunning, setIsRunning] = useState(false);
  const [currentTime, setCurrentTime] = useState(new Date());

  // Refs for tracking audio and flash intervals
  const audioCtxRef = useRef(null);
  const flashIntervalRef = useRef(null);
  const [isFlashOn, setIsFlashOn] = useState(false);

  // 1. Keep the Current Time clock updated every second
  useEffect(() => {
    const clockTimer = setInterval(() => {
      setCurrentTime(new Date());
    }, 1000);
    return () => clearInterval(clockTimer);
  }, []);

  // 2. Main Countdown Logic
  useEffect(() => {
    let countdownInterval = null;

    if (isRunning && timeLeft > 0) {
      countdownInterval = setInterval(() => {
        setTimeLeft((prev) => prev - 1);
      }, 1000);
    } else if (timeLeft === 0 && isRunning) {
      // Trigger alarm effects when time hits exact zero
      triggerAlarm();
    }

    return () => clearInterval(countdownInterval);
  }, [isRunning, timeLeft]);

  // 3. Native Web Audio API Beep (No external files needed)
  const playBeep = () => {
    try {
      if (!audioCtxRef.current) {
        audioCtxRef.current = new (window.AudioContext || window.webkitAudioContext)();
      }
      const ctx = audioCtxRef.current;
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();

      osc.type = 'sine';
      osc.frequency.setValueAtTime(880, ctx.currentTime); // A5 note
      gain.gain.setValueAtTime(0.5, ctx.currentTime);

      osc.connect(gain);
      gain.connect(ctx.destination);

      osc.start();
      // Stop the beep after 0.8 seconds
      gain.gain.exponentialRampToValueAtTime(0.00001, ctx.currentTime + 0.8);
      osc.stop(ctx.currentTime + 0.8);
    } catch (e) {
      console.error("Audio playback blocked or unsupported:", e);
    }
  };

  // 4. Handle Visual Flashing & Sound at Zero
  const triggerAlarm = () => {
    playBeep();
    if (!flashIntervalRef.current) {
      flashIntervalRef.current = setInterval(() => {
        setIsFlashOn((prev) => !prev);
      }, 500); // Flash every half second
    }
  };

  const stopAlarmEffects = () => {
    if (flashIntervalRef.current) {
      clearInterval(flashIntervalRef.current);
      flashIntervalRef.current = null;
    }
    setIsFlashOn(false);
  };

  // 5. Button Interaction Logic
  const handleMainButtonClick = () => {
    if (timeLeft === 0) {
      // If finished: Stop alarm, reset to 5 minutes, and start counting again
      stopAlarmEffects();
      setTimeLeft(EXTENSION_MINUTES * 60);
      setIsRunning(true);
    } else {
      // Toggle Start / Pause during normal operation
      setIsRunning(!isRunning);
    }
  };

  const handleReset = () => {
    stopAlarmEffects();
    setIsRunning(false);
    setTimeLeft(INITIAL_MINUTES * 60);
  };

  // Helper formatting utilities
  const formatTimer = (seconds) => {
    const mins = Math.floor(seconds / 60);
    const secs = seconds % 60;
    return `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
  };

  const formatClock = (date) => {
    return date.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: true });
  };

  // Determine styling states
  const isLast15Seconds = timeLeft <= 15 && timeLeft > 0;
  const isFinished = timeLeft === 0;

  // Background color logic based on status
  let bgColor = 'bg-neutral-950'; // Default deep dark layout
  if (isLast15Seconds) {
    bgColor = 'bg-red-950 text-red-200 animate-pulse';
  } else if (isFinished && isFlashOn) {
    bgColor = 'bg-red-600'; // High visibility terminal flash
  }

  return (
    <div className={`min-h-screen flex flex-col justify-between p-12 transition-colors duration-300 ${bgColor} text-white font-sans antialiased`}>

      {/* Top Header Section: Current Wall Clock Time */}
      <div className="flex justify-between items-center border-b border-neutral-800 pb-6">
        <div>
          <p className="text-xs uppercase tracking-widest text-neutral-400 font-medium mb-1">Current Time</p>
          <p className="text-3xl font-light tracking-tight text-neutral-200">
            {formatClock(currentTime)}
          </p>
        </div>
        <div className="text-right">
          <span className={`inline-flex items-center px-3 py-1 rounded-full text-xs font-medium tracking-wide ${isRunning ? 'bg-emerald-500/10 text-emerald-400' : 'bg-neutral-800 text-neutral-400'}`}>
            {isRunning ? '● Live' : 'Paused'}
          </span>
        </div>
      </div>

      {/* Center Main Stage: The Countdown Display */}
      <div className="flex flex-col items-center justify-center my-auto py-12">
        <h1 className={`text-[12rem] sm:text-[16rem] font-bold tracking-tighter tabular-nums leading-none transition-transform ${isFinished ? 'scale-105' : ''}`}>
          {formatTimer(timeLeft)}
        </h1>
        {isFinished && (
          <p className="text-2xl font-medium tracking-wide uppercase animate-bounce mt-4 text-red-200">
            Time Concluded
          </p>
        )}
      </div>

      {/* Bottom Controls Section */}
      <div className="flex flex-col sm:flex-row items-center justify-between gap-6 pt-6 border-t border-neutral-800">

        {/* Secondary controls */}
        <button
          onClick={handleReset}
          className="px-6 py-3 text-sm font-medium tracking-wide text-neutral-400 hover:text-white transition-colors duration-200"
        >
          Reset to {INITIAL_MINUTES}m
        </button>

        {/* Primary Action Button */}
        <button
          onClick={handleMainButtonClick}
          className={`w-full sm:w-auto px-12 py-5 rounded-xl text-lg font-semibold tracking-wide transition-all duration-200 active:scale-98 ${
            isFinished
              ? 'bg-white text-black hover:bg-neutral-200 shadow-xl'
              : isRunning
                ? 'bg-neutral-800 text-white hover:bg-neutral-700'
                : 'bg-emerald-600 text-white hover:bg-emerald-500'
          }`}
        >
          {isFinished ? '+5 Minutes Extra' : isRunning ? 'Pause Session' : 'Start Timer'}
        </button>
      </div>

    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<PreachingTimer />);
</script>
</body>
</html>
