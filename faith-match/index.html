<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#FAFAFA" />
  <meta name="description" content="Faith Match — a Scripture-inspired match-3 puzzle game." />
  <title>Faith Match</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
</head>
<body>
  <a href="../" class="fm-back-link" aria-label="Back to app">&larr;</a>

  <div id="game-root">
    <div id="game-container"></div>
    <div id="orientation-lock" class="fm-hidden">
      <div class="fm-orientation-card">
        <div class="fm-orientation-icon">&#8635;</div>
        <p>Please rotate your device to portrait mode to play Faith Match.</p>
      </div>
    </div>
  </div>

  <!--
    Temporary on-screen diagnostic overlay: surfaces uncaught JS errors
    directly on the page so this can be debugged from a phone with no
    Web Inspector access. Safe to remove once the reported freeze is
    root-caused. Kept dependency-free so it can never itself fail.
  -->
  <div id="fm-debug-log" style="position:fixed;left:4px;right:4px;bottom:4px;max-height:40vh;overflow:auto;
    background:rgba(0,0,0,0.85);color:#0f0;font:10px/1.4 monospace;padding:6px;border-radius:6px;
    z-index:99999;display:none;white-space:pre-wrap;pointer-events:none;"></div>
  <script>
    (function () {
      var box = document.getElementById('fm-debug-log');
      function log(msg) {
        box.style.display = 'block';
        box.textContent += msg + '\n';
        box.scrollTop = box.scrollHeight;
      }
      window.__fmLog = log;
      log('[boot] ' + navigator.userAgent);
      window.addEventListener('error', function (e) {
        log('[error] ' + e.message + ' @ ' + (e.filename || '?') + ':' + e.lineno);
      });
      window.addEventListener('unhandledrejection', function (e) {
        log('[promise] ' + (e.reason && e.reason.message ? e.reason.message : e.reason));
      });
      document.addEventListener('touchstart', function () { log('[touch] touchstart'); }, { passive: true });
      document.addEventListener('touchend', function () { log('[touch] touchend'); }, { passive: true });
    })();
  </script>

  <!-- Vendored locally so the game works fully offline after first load. -->
  <script src="Assets/lib/phaser.min.js"></script>

  <!-- Utils (no dependencies on scenes/objects) -->
  <script src="Utils/Constants.js"></script>
  <script src="Utils/EventBus.js"></script>
  <script src="Utils/RNG.js"></script>
  <script src="Utils/DateUtils.js"></script>
  <script src="Utils/SaveManager.js"></script>
  <script src="Utils/Achievements.js"></script>
  <script src="Utils/DailyRewards.js"></script>
  <script src="Utils/Scripture.js"></script>

  <!-- Audio (synthesized via Web Audio API, no audio files shipped) -->
  <script src="Audio/AudioManager.js"></script>

  <!-- Data models -->
  <script src="Objects/Tile.js"></script>
  <script src="Objects/Board.js"></script>
  <script src="Objects/ObjectiveTracker.js"></script>

  <!-- Levels (depends on Utils) -->
  <script src="Levels/LevelGenerator.js"></script>
  <script src="Levels/LevelManager.js"></script>

  <!-- UI components -->
  <script src="UI/Button.js"></script>
  <script src="UI/ScrollView.js"></script>
  <script src="UI/ProfileStrip.js"></script>

  <!-- Scenes -->
  <script src="Scenes/BootScene.js"></script>
  <script src="Scenes/PreloadScene.js"></script>
  <script src="Scenes/MenuScene.js"></script>
  <script src="Scenes/WorldMapScene.js"></script>
  <script src="Scenes/LevelSelectScene.js"></script>
  <script src="Scenes/ChallengesScene.js"></script>
  <script src="Scenes/AchievementsScene.js"></script>
  <script src="Scenes/SettingsScene.js"></script>
  <script src="Scenes/CreditsScene.js"></script>
  <script src="Scenes/LeaderboardScene.js"></script>
  <script src="Scenes/GameScene.js"></script>

  <script src="main.js"></script>
</body>
</html>
