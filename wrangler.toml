name = "flcc-members-2026"
main = "ask-proxy/worker.js"
compatibility_date = "2024-01-01"

[assets]
directory = "."
binding = "ASSETS"

# Optional — powers the real "members opened today" count on the Daily
# Blessing Community tab. Create a KV namespace (Workers & Pages → your
# Worker → Settings → Bindings → KV Namespace) and uncomment below with its
# id. Without this, the Community tab simply shows a local-only message.
# [[kv_namespaces]]
# binding = "DAILY_BLESSING_KV"
# id = "your-kv-namespace-id"

# Optional — powers the anonymous Kadena ng Panalangin (Prayer Chain) in the
# FLCC Kasama app. Create with `wrangler d1 create flcc-kasama` (or Workers
# dashboard → Storage & Databases → D1), paste the database_id below, and
# uncomment. The Worker creates the tables itself on first use (see
# ask-proxy/schema.sql for the canonical shape). Without this binding, the
# Kapwa tab simply shows a gentle "coming soon" note — nothing breaks.
# [[d1_databases]]
# binding = "KASAMA_DB"
# database_name = "flcc-kasama"
# database_id = "your-d1-database-id"
