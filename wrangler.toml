name = "flcc-members-2026"
main = "ask-proxy/worker.js"
compatibility_date = "2024-01-01"

[assets]
directory = "."
binding = "ASSETS"

# Optional — powers the real "members opened today" count on the Daily
# Blessing Community tab. Create a KV namespace (Workers & Pages → your
# Worker → Settings → Bindings → KV Namespace) and uncomment below with its
# id. Without this, the Community tab simply shows a local-only message.
# [[kv_namespaces]]
# binding = "DAILY_BLESSING_KV"
# id = "your-kv-namespace-id"

# Powers the anonymous Kadena ng Panalangin (Prayer Chain) in the FLCC Kasama
# app. The Worker creates the tables itself on first use (see
# ask-proxy/schema.sql for the canonical shape).
[[d1_databases]]
binding = "KASAMA_DB"
database_name = "flcc-kasama"
database_id = "69cf3b5d-f610-48d0-b5a2-3b8ec3607032"

# Powers "bagong panalangin" push notifications (opt-in, per device) for the
# Kadena ng Panalangin. This VAPID_PUBLIC_KEY is, as the name says, public —
# it's handed to any browser that asks, so it's fine to commit here. The
# matching PRIVATE key must never be committed: add it as a Worker Secret
# instead (Settings → Variables and Secrets → Add → Secret):
#   Name:  VAPID_PRIVATE_KEY_JWK
#   Value: the private key as a JSON Web Key string (see ask-proxy/webpush.js
#          header, or ask an admin/Claude session to generate a fresh pair)
# Optionally also add a Text variable VAPID_SUBJECT = "mailto:you@example.com"
# — without these two, notifications simply stay off; nothing breaks.
[vars]
VAPID_PUBLIC_KEY = "BCLTWSVRUpNgl_UB23W2QCSBRd1v5fgkE8Mm5KtrgDzCI0XM-fmDcZ8wQUnRxgx3UhSxbBWnUtzH_-unhU-cVyk"

# Fires hourly — the evening Sanctuary reminder push checks each opted-in
# device's own time zone offset (shared only if that device turned the
# reminder on) and sends only to whoever's local clock currently reads
# EVENING_LOCAL_HOUR (see ask-proxy/worker.js scheduled() /
# sendEveningSanctuaryReminder()). Devices that never supplied an offset
# fall back to the original fixed 17:00 UTC slot (20:00 Kuwait/AST time,
# matching the client's own "evening" period boundary — ofw-companion/
# js/sanctuary.js currentPeriod()) so they don't silently lose the feature.
# Opt-in per device; a no-op if VAPID isn't configured above or nobody's
# due this hour.
[triggers]
crons = ["0 * * * *"]
