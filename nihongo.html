<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nihongo — Japanese Translator · FLCC</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%23B23A2B'/%3E%3Ctext x='50' y='50' font-size='60' text-anchor='middle' dominant-baseline='central' fill='white' font-family='serif'%3E訳%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700;900&family=Shippori+Mincho:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    /* Washi paper & sumi ink — warm neutrals biased toward the indigo voice */
    --washi:      #F6F2E9;   /* warm paper ground   */
    --paper:      #FCFAF4;   /* card surface        */
    --sumi:       #1B1A16;   /* warm near-black ink */
    --ink:        #2A2820;
    --ink-muted:  #6C665A;
    --ink-faint:  #A69F8F;
    --line:       #E7E1D2;   /* warm hairline       */
    --line-2:     #DAD3C1;
    /* Ai — indigo aizome dye: the voice of Japanese */
    --ai:         #26466E;
    --ai-deep:    #1A3255;
    --ai-wash:    #EEF1F7;
    --ai-line:    #D2DAE8;
    /* Shu — vermillion hanko seal: reserved accent */
    --shu:        #B23A2B;
    --shu-deep:   #8E2B1E;
    --shu-wash:   #F7ECE7;
    --ok:         #3B7A50;
    --ok-wash:    #ECF4EE;
    --mincho: 'Shippori Mincho', 'Hiragino Mincho ProN', 'Yu Mincho', 'Songti SC', serif;
    --gothic: 'Zen Kaku Gothic New', 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', 'Yu Gothic', 'Noto Sans JP', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    --shadow-sm: 0 1px 2px rgba(27,26,22,.05);
    --shadow-md: 0 1px 3px rgba(27,26,22,.05), 0 12px 32px -18px rgba(27,26,22,.22);
    --shadow-lg: 0 24px 60px -28px rgba(26,50,85,.42);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    font-family: var(--gothic);
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
    line-height: 1.5;
    min-height: 100dvh;
    background:
      radial-gradient(120% 80% at 50% -8%, #FBF8F0 0%, rgba(251,248,240,0) 46%),
      radial-gradient(90% 60% at 100% 0%, var(--shu-wash) 0%, rgba(247,236,231,0) 40%),
      var(--washi);
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  ::selection { background: var(--ai-wash); color: var(--ai-deep); }
  :focus-visible { outline: 2px solid var(--ai); outline-offset: 2px; border-radius: 6px; }
  button { font-family: inherit; }

  .wrap { max-width: 660px; margin: 0 auto; padding: 26px 18px 72px; }

  /* ── Header ─────────────────────────────────────────────── */
  header { display: flex; align-items: center; justify-content: space-between; gap: 14px; margin-bottom: 22px; }
  .brand { display: flex; align-items: center; gap: 13px; }
  .seal {
    width: 48px; height: 48px; flex-shrink: 0; border-radius: 13px;
    background: linear-gradient(150deg, #C1462F 0%, #98291B 100%);
    display: grid; place-items: center; color: #fff;
    font-family: var(--mincho); font-weight: 700; font-size: 1.62rem; line-height: 1;
    transform: rotate(-3deg);
    box-shadow: inset 0 0 0 1.5px rgba(255,255,255,.24), inset 0 -3px 8px rgba(0,0,0,.16), 0 4px 12px -3px rgba(178,58,43,.5);
  }
  .seal span { transform: translateY(1px); }
  .brand h1 { font-size: 1.4rem; font-weight: 700; letter-spacing: -.028em; color: var(--sumi); }
  .brand .sub { font-size: .74rem; color: var(--ink-faint); font-weight: 500; letter-spacing: .06em; margin-top: 1px; }
  .icon-btn {
    border: 1px solid var(--line-2); background: var(--paper); color: var(--ink-muted);
    border-radius: 10px; padding: 8px 14px; font-size: .8rem; font-weight: 600; cursor: pointer;
    display: inline-flex; align-items: center; gap: 6px; transition: all .16s ease; box-shadow: var(--shadow-sm);
  }
  .icon-btn:hover { border-color: var(--ai); color: var(--ai); }
  .icon-btn.warn { color: #fff; background: linear-gradient(150deg, #C1462F, #98291B); border-color: transparent; box-shadow: 0 4px 12px -4px rgba(178,58,43,.5); }
  .icon-btn.warn:hover { filter: brightness(1.05); }
  .icon-btn:disabled { opacity: .6; cursor: default; }

  /* ── Direction segmented control ────────────────────────── */
  .dir-row { margin-bottom: 15px; }
  .dir-seg {
    display: flex; background: rgba(232,226,213,.6); border: 1px solid var(--line);
    border-radius: 13px; padding: 4px; gap: 3px;
  }
  .dir-seg button {
    flex: 1; border: none; background: transparent; color: var(--ink-muted); font-weight: 600;
    font-size: .82rem; padding: 9px 6px; border-radius: 9px; cursor: pointer;
    transition: color .16s ease, background .16s ease, box-shadow .16s ease;
  }
  .dir-seg button:hover:not(.active) { color: var(--ink); }
  .dir-seg button.active { background: var(--paper); color: var(--ai); box-shadow: var(--shadow-sm), 0 2px 6px -3px rgba(38,70,110,.35); }

  /* ── Cards ──────────────────────────────────────────────── */
  .card {
    background: var(--paper); border: 1px solid var(--line); border-radius: 18px;
    box-shadow: var(--shadow-md); overflow: hidden;
  }
  .input-card { margin-bottom: 15px; transition: border-color .18s ease, box-shadow .18s ease; }
  .input-card:focus-within { border-color: var(--ai-line); box-shadow: var(--shadow-md), 0 0 0 4px var(--ai-wash); }
  textarea {
    width: 100%; border: none; resize: none; padding: 18px 18px 4px; font-size: 1.1rem; line-height: 1.55;
    color: var(--ink); background: transparent; font-family: inherit; min-height: 104px; outline: none;
  }
  textarea::placeholder { color: var(--ink-faint); }
  .input-foot { display: flex; align-items: center; justify-content: space-between; padding: 10px 14px 14px; gap: 10px; }
  .input-foot .left { display: flex; align-items: center; gap: 10px; }
  .mini {
    border: 1px solid var(--line-2); background: var(--paper); color: var(--ink-muted); cursor: pointer;
    border-radius: 8px; padding: 6px 10px; font-size: .74rem; font-weight: 600;
    display: inline-flex; align-items: center; gap: 5px; transition: all .15s ease;
  }
  .mini:hover { border-color: var(--ai); color: var(--ai); }
  .count { font-size: .72rem; color: var(--ink-faint); font-variant-numeric: tabular-nums; }
  .go-btn {
    border: none; background: linear-gradient(160deg, #2C2A22, #16150F); color: #fff; border-radius: 12px;
    padding: 9px 10px 9px 9px; font-size: .9rem; font-weight: 700; cursor: pointer; transition: transform .12s ease, box-shadow .16s ease, opacity .16s ease;
    display: inline-flex; align-items: center; gap: 9px; box-shadow: 0 6px 16px -8px rgba(27,26,22,.6);
  }
  .go-btn:hover:enabled { transform: translateY(-1px); box-shadow: 0 10px 22px -10px rgba(27,26,22,.7); }
  .go-btn:active:enabled { transform: translateY(0); }
  .go-btn:disabled { background: #E9E4D6; color: var(--ink-faint); cursor: not-allowed; box-shadow: none; }
  .go-btn:disabled .go-seal { background: #D8D2C2; color: var(--paper); box-shadow: none; }
  .go-seal {
    width: 27px; height: 27px; border-radius: 8px; display: grid; place-items: center;
    background: linear-gradient(150deg, #C1462F, #98291B); color: #fff;
    font-family: var(--mincho); font-weight: 700; font-size: 1rem; line-height: 1;
    box-shadow: inset 0 0 0 1px rgba(255,255,255,.22);
  }
  .go-btn .go-label { padding-right: 6px; }
  .btn-spin { width: 15px; height: 15px; border: 2px solid rgba(255,255,255,.35); border-top-color: #fff; border-radius: 50%; margin: 6px; animation: spin .7s linear infinite; }

  /* ── Model pills ────────────────────────────────────────── */
  .opts { display: flex; align-items: center; gap: 9px; flex-wrap: wrap; margin-bottom: 18px; }
  .opts label { font-size: .68rem; color: var(--ink-faint); font-weight: 700; text-transform: uppercase; letter-spacing: .1em; }
  .pill {
    border: 1px solid var(--line-2); background: var(--paper); border-radius: 999px; padding: 6px 15px;
    font-size: .78rem; font-weight: 600; color: var(--ink-muted); cursor: pointer; transition: all .15s ease;
  }
  .pill:hover:not(.active) { border-color: var(--ai-line); color: var(--ai); }
  .pill.active { border-color: var(--ai); background: var(--ai-wash); color: var(--ai-deep); }

  /* ── Result ─────────────────────────────────────────────── */
  .result { margin-top: 4px; animation: rise .5s cubic-bezier(.2,.7,.2,1) both; }
  .res-main { position: relative; overflow: hidden; padding: 22px 20px 20px; border-bottom: 1px solid var(--line); background: linear-gradient(180deg, var(--ai-wash) 0%, rgba(238,241,247,.28) 100%); }
  .res-main::after {
    content: '和'; position: absolute; right: -6px; top: -26px; font-family: var(--mincho); font-weight: 700;
    font-size: 7.5rem; color: var(--ai); opacity: .055; pointer-events: none; user-select: none;
  }
  .res-label { font-size: .66rem; text-transform: uppercase; letter-spacing: .14em; color: var(--ai); font-weight: 700; margin-bottom: 10px; position: relative; }
  .jp-text {
    font-family: var(--gothic); font-weight: 500; font-size: 1.72rem; line-height: 1.5; color: var(--ai-deep);
    word-break: break-word; letter-spacing: .01em; position: relative;
  }
  .en-text { font-size: 1.4rem; line-height: 1.5; color: var(--sumi); font-weight: 500; word-break: break-word; position: relative; }
  .romaji { margin-top: 11px; font-size: .98rem; color: var(--ink-muted); letter-spacing: .015em; position: relative; }
  .res-actions { display: flex; gap: 8px; margin-top: 16px; flex-wrap: wrap; position: relative; }
  .res-actions button {
    border: 1px solid var(--line-2); background: rgba(252,250,244,.85); color: var(--ink-muted);
    border-radius: 10px; padding: 7px 13px; font-size: .78rem; font-weight: 600; cursor: pointer;
    display: inline-flex; align-items: center; gap: 6px; transition: all .15s ease;
  }
  .res-actions button:hover { border-color: var(--ai); color: var(--ai); background: var(--paper); }
  .res-actions button.copied { border-color: var(--ok); color: var(--ok); background: var(--ok-wash); }

  .section { padding: 16px 20px; border-bottom: 1px solid var(--line); }
  .section:last-child { border-bottom: none; }
  .section h3 { font-family: var(--mincho); font-size: .82rem; letter-spacing: .02em; color: var(--ink-muted); font-weight: 600; margin-bottom: 11px; }
  .bd-row { display: grid; grid-template-columns: minmax(0,auto) 1fr; gap: 2px 16px; align-items: baseline; padding: 7px 0; border-bottom: 1px dashed var(--line-2); }
  .bd-row:last-child { border-bottom: none; }
  .bd-jp { color: var(--ai-deep); font-weight: 600; font-size: 1.04rem; }
  .bd-rom { font-size: .76rem; color: var(--ink-faint); }
  .bd-mean { color: var(--ink); font-size: .92rem; }
  .note-txt { font-size: .94rem; color: var(--ink-muted); line-height: 1.68; }
  .alt-item { display: flex; align-items: center; gap: 11px; padding: 9px 0; border-bottom: 1px dashed var(--line-2); flex-wrap: wrap; }
  .alt-item:last-child { border-bottom: none; }
  .alt-jp { color: var(--ai-deep); font-weight: 600; font-size: 1.02rem; }
  .alt-tag {
    font-size: .64rem; letter-spacing: .06em; text-transform: uppercase; background: var(--paper);
    color: var(--ai); border: 1px solid var(--ai-line); padding: 3px 9px; border-radius: 999px; font-weight: 700;
  }
  .alt-rom { font-size: .78rem; color: var(--ink-faint); }

  /* ── States ─────────────────────────────────────────────── */
  .empty { text-align: center; padding: 46px 24px 50px; }
  .empty .big { font-family: var(--mincho); font-weight: 600; font-size: 2.7rem; color: var(--ai-deep); letter-spacing: .04em; margin-bottom: 14px; }
  .empty p { font-size: .95rem; color: var(--ink-muted); max-width: 360px; margin: 0 auto; line-height: 1.65; }
  .loading { text-align: center; padding: 46px 24px; }
  .loading .jp { font-family: var(--mincho); font-weight: 600; font-size: 1.3rem; color: var(--ai); margin-bottom: 4px; }
  .loading .en { font-size: .84rem; color: var(--ink-faint); }
  .spinner {
    width: 30px; height: 30px; border: 3px solid var(--ai-line); border-top-color: var(--ai);
    border-radius: 50%; animation: spin .8s linear infinite; margin: 0 auto 16px;
  }
  .err { text-align: center; padding: 40px 24px; color: var(--shu-deep); }
  .err .big { font-size: 1.7rem; margin-bottom: 10px; }
  .err .msg { font-size: .92rem; line-height: 1.6; max-width: 380px; margin: 0 auto; }

  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes rise { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }

  /* ── Save row ───────────────────────────────────────────── */
  .save-row { margin-top: 14px; }

  /* ── Quick phrases ──────────────────────────────────────── */
  .quick { margin-bottom: 18px; }
  .section-eyebrow { font-family: var(--mincho); font-size: .84rem; color: var(--ink-muted); font-weight: 600; margin-bottom: 10px; }
  .quick-chips { display: flex; gap: 8px; flex-wrap: wrap; }
  .chip {
    border: 1px solid var(--line-2); background: var(--paper); border-radius: 999px; padding: 7px 14px;
    font-size: .82rem; color: var(--ink-muted); cursor: pointer; transition: all .15s ease; box-shadow: var(--shadow-sm);
  }
  .chip:hover { border-color: var(--ai); color: var(--ai); background: var(--ai-wash); transform: translateY(-1px); }

  /* ── Phrasebook ─────────────────────────────────────────── */
  .pb-head { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 11px; }
  .pb-head .t { font-family: var(--mincho); font-size: .95rem; color: var(--ink); font-weight: 600; }
  .pb-head .clear { font-size: .78rem; color: var(--shu); cursor: pointer; font-weight: 600; }
  .pb-head .clear:hover { color: var(--shu-deep); text-decoration: underline; }
  .pb-list { padding: 4px 20px; }
  .pb-item { padding: 14px 0; border-bottom: 1px solid var(--line); }
  .pb-item:last-child { border-bottom: none; }
  .pb-jp { color: var(--ai-deep); font-weight: 600; font-size: 1.08rem; }
  .pb-rom { font-size: .78rem; color: var(--ink-faint); margin: 3px 0; }
  .pb-en { font-size: .9rem; color: var(--ink-muted); }
  .pb-acts { display: flex; gap: 6px; margin-top: 9px; }
  .pb-acts button { border: 1px solid var(--line-2); background: var(--paper); color: var(--ink-muted); border-radius: 8px; padding: 5px 10px; font-size: .73rem; font-weight: 600; cursor: pointer; transition: all .15s ease; }
  .pb-acts button:hover { color: var(--ai); border-color: var(--ai); }

  /* ── Modal ──────────────────────────────────────────────── */
  .overlay { position: fixed; inset: 0; background: rgba(27,26,22,.42); backdrop-filter: blur(3px); display: flex; align-items: center; justify-content: center; padding: 18px; z-index: 50; animation: rise .22s ease both; }
  .modal { background: var(--paper); border-radius: 20px; max-width: 430px; width: 100%; padding: 24px; box-shadow: var(--shadow-lg); border: 1px solid var(--line); }
  .modal h2 { font-size: 1.18rem; color: var(--sumi); margin-bottom: 4px; letter-spacing: -.01em; }
  .modal p.lead { font-size: .85rem; color: var(--ink-muted); margin-bottom: 18px; line-height: 1.55; }
  .modal .tabs { display: flex; gap: 5px; background: rgba(232,226,213,.6); padding: 4px; border-radius: 11px; margin-bottom: 16px; }
  .modal .tabs button { flex: 1; border: none; background: transparent; padding: 9px; border-radius: 8px; font-weight: 600; font-size: .83rem; color: var(--ink-muted); cursor: pointer; transition: all .15s ease; }
  .modal .tabs button.active { background: var(--paper); color: var(--ai); box-shadow: var(--shadow-sm); }
  .modal label.f { display: block; font-size: .72rem; font-weight: 700; color: var(--ink-muted); margin: 12px 0 6px; text-transform: uppercase; letter-spacing: .06em; }
  .modal input {
    width: 100%; border: 1.5px solid var(--line-2); border-radius: 10px; padding: 11px 13px;
    font-size: .9rem; font-family: inherit; outline: none; color: var(--ink); background: #fff; transition: border-color .15s ease, box-shadow .15s ease;
  }
  .modal input:focus { border-color: var(--ai); box-shadow: 0 0 0 3px var(--ai-wash); }
  .modal .save { width: 100%; margin-top: 18px; background: linear-gradient(160deg, #2C2A22, #16150F); color: #fff; border: none; border-radius: 11px; padding: 12px; font-weight: 700; font-size: .92rem; cursor: pointer; transition: transform .12s ease; }
  .modal .save:hover:enabled { transform: translateY(-1px); }
  .modal .save:disabled { background: #E9E4D6; color: var(--ink-faint); cursor: not-allowed; }
  .modal .hint { font-size: .74rem; color: var(--ink-faint); margin-top: 14px; line-height: 1.55; }
  .modal .close { background: none; border: none; font-size: 1.5rem; color: var(--ink-faint); cursor: pointer; float: right; line-height: 1; margin: -4px -4px 0 0; }
  .modal .close:hover { color: var(--ink); }

  .footlinks { text-align: center; margin-top: 34px; font-size: .8rem; color: var(--ink-faint); }
  .footlinks a { color: var(--ink-muted); text-decoration: none; font-weight: 500; }
  .footlinks a:hover { color: var(--shu); }
  .footlinks .dot { margin: 0 8px; opacity: .5; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .001ms !important; animation-iteration-count: 1 !important; transition-duration: .001ms !important; }
    .chip:hover, .go-btn:hover:enabled { transform: none; }
  }
</style>
</head>
<body>
<div id="root"></div>

<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script>
const { useState, useEffect, useRef, useCallback } = React;
const h = React.createElement;

// Reuse Ask FLCC's proxy config so members who set up Ask FLCC need nothing extra.
const PROXY_KEY    = 'flcc-ask-proxy-url-v1';
const PROXY_SECRET = 'flcc-ask-proxy-secret-v1';
const API_KEY      = 'flcc_ask_api_key';
const MODEL_KEY    = 'flcc_nihongo_model';
const PB_KEY       = 'flcc_nihongo_phrasebook';

const MODELS = [
  { id: 'claude-haiku-4-5-20251001', label: 'Fast' },
  { id: 'claude-sonnet-4-6',         label: 'Best' },
];

const DIRECTIONS = [
  { id: 'auto',   label: 'Auto' },
  { id: 'en2ja',  label: 'EN → 日本語' },
  { id: 'ja2en',  label: '日本語 → EN' },
];

const QUICK = [
  'Good morning!',
  'Thank you very much.',
  'Where is the train station?',
  'How much is this?',
  'God bless you.',
  'Nice to meet you.',
];

const SYSTEM = `You are an expert Japanese⇄English translator and language tutor.
Translate accurately and naturally, choosing register appropriate to context (default polite / です・ます form unless the source is clearly casual).
Always respond with ONLY a single valid JSON object, no markdown fences, no commentary. Schema:
{
  "detected": "english" | "japanese",
  "target": "japanese" | "english",
  "translation": "the full translation in the target language",
  "romaji": "Hepburn romanization of the Japanese side (the Japanese text — whether it is the source or the translation). Empty string if neither side is Japanese.",
  "breakdown": [ { "jp": "word/particle in Japanese", "romaji": "reading", "meaning": "short English gloss" } ],
  "notes": "1-3 concise sentences on nuance, politeness level, or usage. Empty string if nothing notable.",
  "alternatives": [ { "jp": "alternative phrasing (Japanese)", "romaji": "reading", "register": "casual|polite|formal|keigo" } ]
}
Rules:
- "breakdown" segments the JAPANESE sentence into meaningful units (words + particles), max ~12 items. Omit or use [] for very long text.
- "alternatives" gives 0-3 other natural phrasings at different politeness levels. [] if none useful.
- Keep JSON strictly valid: escape quotes, no trailing commas.`;

function getCfg() {
  return {
    proxy:  localStorage.getItem(PROXY_KEY)    || '',
    secret: localStorage.getItem(PROXY_SECRET) || '',
    apiKey: localStorage.getItem(API_KEY)      || '',
  };
}

// ─── Text-to-speech (browser native, free) ───────────────────────────────────
function speak(text, lang) {
  if (!('speechSynthesis' in window)) return;
  window.speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = lang;
  u.rate = lang.startsWith('ja') ? 0.9 : 1;
  const voices = window.speechSynthesis.getVoices();
  const v = voices.find(v => v.lang.startsWith(lang.slice(0,2)));
  if (v) u.voice = v;
  window.speechSynthesis.speak(u);
}

// ─── Setup Modal ──────────────────────────────────────────────────────────────
function SetupModal({ cfg, onSave, onClose }) {
  const hasProxy = !!cfg.proxy;
  const [tab, setTab]       = useState(hasProxy || !cfg.apiKey ? 'proxy' : 'key');
  const [proxy, setProxy]   = useState(cfg.proxy);
  const [secret, setSecret] = useState(cfg.secret);
  const [key, setKey]       = useState(cfg.apiKey);

  return h('div', { className: 'overlay', onClick: e => e.target === e.currentTarget && onClose() },
    h('div', { className: 'modal' },
      h('button', { className: 'close', onClick: onClose }, '×'),
      h('h2', null, 'Connect to AI'),
      h('p', { className: 'lead' }, 'Uses the same connection as Ask FLCC — set it up once, works everywhere.'),
      h('div', { className: 'tabs' },
        h('button', { className: tab === 'proxy' ? 'active' : '', onClick: () => setTab('proxy') }, 'Church Proxy'),
        h('button', { className: tab === 'key'   ? 'active' : '', onClick: () => setTab('key') },   'My API Key'),
      ),
      tab === 'proxy'
        ? h('div', null,
            h('label', { className: 'f' }, 'Worker URL'),
            h('input', { value: proxy, placeholder: 'https://flcc-ask.xxx.workers.dev',
              onChange: e => setProxy(e.target.value) }),
            h('label', { className: 'f' }, 'Proxy Secret (if required)'),
            h('input', { value: secret, type: 'password', placeholder: 'church password',
              onChange: e => setSecret(e.target.value) }),
            h('button', { className: 'save', disabled: !proxy.trim(),
              onClick: () => onSave({ proxy: proxy.trim(), secret: secret.trim() }) }, 'Save'),
            h('p', { className: 'hint' }, 'No personal API key needed — the church proxy holds one key for everyone. This never charges your account.'),
          )
        : h('div', null,
            h('label', { className: 'f' }, 'Anthropic API Key'),
            h('input', { value: key, type: 'password', placeholder: 'sk-ant-...',
              onChange: e => setKey(e.target.value) }),
            h('button', { className: 'save', disabled: !key.trim(),
              onClick: () => onSave({ apiKey: key.trim() }) }, 'Save'),
            h('p', { className: 'hint' }, 'Get one at console.anthropic.com. Stored only in this browser; used directly from your device.'),
          ),
    ),
  );
}

// ─── Result view ────────────────────────────────────────────────────────────
function Result({ data }) {
  const [copied, setCopied] = useState('');
  const jpIsTarget = data.target === 'japanese';
  const targetText = data.translation;
  const romaji = data.romaji || '';

  const copy = (text, tag) => {
    navigator.clipboard?.writeText(text);
    setCopied(tag); setTimeout(() => setCopied(''), 1400);
  };

  return h('div', { className: 'card result' },
    // Main translation
    h('div', { className: 'res-main' },
      h('div', { className: 'res-label' }, jpIsTarget ? '日本語 · Japanese' : 'English'),
      h('div', { className: jpIsTarget ? 'jp-text' : 'en-text' }, targetText),
      romaji && jpIsTarget ? h('div', { className: 'romaji' }, romaji) : null,
      h('div', { className: 'res-actions' },
        h('button', { className: copied === 'main' ? 'copied' : '', onClick: () => copy(targetText, 'main') },
          copied === 'main' ? '✓ Copied' : '⧉ Copy'),
        jpIsTarget ? h('button', { onClick: () => speak(targetText, 'ja-JP') }, '🔊 Listen')
                   : h('button', { onClick: () => speak(targetText, 'en-US') }, '🔊 Listen'),
        romaji ? h('button', { className: copied === 'rom' ? 'copied' : '', onClick: () => copy(romaji, 'rom') },
          copied === 'rom' ? '✓' : '⧉ Rōmaji') : null,
      ),
    ),
    // Breakdown
    data.breakdown && data.breakdown.length
      ? h('div', { className: 'section' },
          h('h3', null, 'Word breakdown'),
          data.breakdown.map((b, i) => h('div', { className: 'bd-row', key: i },
            h('span', { className: 'bd-jp' }, b.jp,
              b.romaji ? h('span', { className: 'bd-rom' }, '  ' + b.romaji) : null),
            h('span', { className: 'bd-mean' }, b.meaning),
          )),
        )
      : null,
    // Notes
    data.notes
      ? h('div', { className: 'section' },
          h('h3', null, 'Nuance & register'),
          h('div', { className: 'note-txt' }, data.notes),
        )
      : null,
    // Alternatives
    data.alternatives && data.alternatives.length
      ? h('div', { className: 'section' },
          h('h3', null, 'Other phrasings'),
          data.alternatives.map((a, i) => h('div', { className: 'alt-item', key: i },
            h('span', { className: 'alt-tag' }, a.register || 'alt'),
            h('span', { className: 'alt-jp' }, a.jp),
            a.romaji ? h('span', { className: 'alt-rom' }, a.romaji) : null,
            h('button', { className: 'mini', style: { marginLeft: 'auto' }, onClick: () => speak(a.jp, 'ja-JP') }, '🔊'),
          )),
        )
      : null,
  );
}

// ─── App ──────────────────────────────────────────────────────────────────────
function App() {
  const [cfg, setCfg]       = useState(getCfg);
  const [text, setText]     = useState('');
  const [dir, setDir]       = useState('auto');
  const [model, setModel]   = useState(() => localStorage.getItem(MODEL_KEY) || MODELS[0].id);
  const [result, setResult] = useState(null);
  const [loading, setLoading] = useState(false);
  const [error, setError]   = useState('');
  const [showSetup, setShowSetup] = useState(false);
  const [pb, setPb]         = useState(() => { try { return JSON.parse(localStorage.getItem(PB_KEY)) || []; } catch { return []; } });
  const [saved, setSaved]   = useState(false);
  const taRef = useRef(null);

  const connected = !!cfg.proxy || !!cfg.apiKey;

  useEffect(() => { localStorage.setItem(MODEL_KEY, model); }, [model]);
  useEffect(() => { localStorage.setItem(PB_KEY, JSON.stringify(pb)); }, [pb]);
  // Prime speech voices
  useEffect(() => { if ('speechSynthesis' in window) window.speechSynthesis.getVoices(); }, []);

  const saveCfg = (patch) => {
    if (patch.proxy !== undefined) {
      localStorage.setItem(PROXY_KEY, patch.proxy);
      patch.secret ? localStorage.setItem(PROXY_SECRET, patch.secret) : localStorage.removeItem(PROXY_SECRET);
      localStorage.removeItem(API_KEY);
    }
    if (patch.apiKey !== undefined) {
      localStorage.setItem(API_KEY, patch.apiKey);
      localStorage.removeItem(PROXY_KEY); localStorage.removeItem(PROXY_SECRET);
    }
    setCfg(getCfg());
    setShowSetup(false);
  };

  const translate = useCallback(async (override) => {
    const source = (override ?? text).trim();
    if (!source) return;
    if (override != null) setText(override);
    if (!connected) { setShowSetup(true); return; }

    setLoading(true); setError(''); setResult(null); setSaved(false);

    const dirHint = dir === 'en2ja'
      ? 'The source is English; translate INTO Japanese.'
      : dir === 'ja2en'
      ? 'The source is Japanese; translate INTO English.'
      : 'Auto-detect the source language and translate into the other of {English, Japanese}.';

    const endpoint = cfg.proxy
      ? cfg.proxy.replace(/\/+$/, '') + '/proxy'
      : 'https://api.anthropic.com/v1/messages';
    const headers = { 'Content-Type': 'application/json' };
    if (cfg.proxy) { if (cfg.secret) headers['x-proxy-secret'] = cfg.secret; }
    else {
      headers['x-api-key'] = cfg.apiKey;
      headers['anthropic-version'] = '2023-06-01';
      headers['anthropic-dangerous-direct-browser-access'] = 'true';
    }

    try {
      const res = await fetch(endpoint, {
        method: 'POST', headers,
        body: JSON.stringify({
          model, max_tokens: 1500, system: SYSTEM,
          messages: [{ role: 'user', content: `${dirHint}\n\nText to translate:\n${source}` }],
        }),
      });
      if (!res.ok) {
        let msg = `API error ${res.status}`;
        try { const d = await res.json(); msg = d.error?.message || msg; } catch {}
        if (res.status === 401) msg = 'Invalid key or proxy secret — check Setup.';
        if (res.status === 429) msg = 'Rate limit reached. Wait a moment and retry.';
        throw new Error(msg);
      }
      const d = await res.json();
      let raw = (d.content?.[0]?.text || '').trim();
      // Strip accidental code fences
      raw = raw.replace(/^```(?:json)?\s*/i, '').replace(/\s*```$/,'').trim();
      // Grab the outermost JSON object
      const s = raw.indexOf('{'), e = raw.lastIndexOf('}');
      if (s === -1 || e === -1) throw new Error('Unexpected response format.');
      const parsed = JSON.parse(raw.slice(s, e + 1));
      // Track the Japanese source text when translating JA→EN so we can voice it
      if (parsed.detected === 'japanese') parsed.sourceJp = source;
      setResult(parsed);
    } catch (err) {
      setError(err.message || 'Something went wrong.');
    } finally {
      setLoading(false);
    }
  }, [text, dir, model, cfg, connected]);

  const savePhrase = () => {
    if (!result) return;
    const jp = result.target === 'japanese' ? result.translation : (result.sourceJp || '');
    const en = result.target === 'english' ? result.translation : text.trim();
    setPb(prev => [{ id: Date.now(), jp, romaji: result.romaji || '', en }, ...prev].slice(0, 100));
    setSaved(true);
  };

  return h('div', { className: 'wrap' },
    // Header
    h('header', null,
      h('div', { className: 'brand' },
        h('div', { className: 'seal' }, h('span', null, '訳')),
        h('div', null,
          h('h1', null, 'Nihongo'),
          h('div', { className: 'sub' }, '日本語  ⇄  English'),
        ),
      ),
      h('button', { className: 'icon-btn' + (connected ? '' : ' warn'), onClick: () => setShowSetup(true) },
        connected ? '⚙ Setup' : '⚡ Connect'),
    ),

    // Direction
    h('div', { className: 'dir-row' },
      h('div', { className: 'dir-seg' },
        DIRECTIONS.map(d => h('button', {
          key: d.id, className: dir === d.id ? 'active' : '', onClick: () => setDir(d.id),
        }, d.label)),
      ),
    ),

    // Input
    h('div', { className: 'card input-card' },
      h('textarea', {
        ref: taRef, value: text, placeholder: 'Type English or 日本語 to translate…',
        onChange: e => setText(e.target.value),
        onKeyDown: e => { if ((e.metaKey || e.ctrlKey) && e.key === 'Enter') translate(); },
      }),
      h('div', { className: 'input-foot' },
        h('div', { className: 'left' },
          text ? h('button', { className: 'mini', onClick: () => { setText(''); setResult(null); setError(''); taRef.current?.focus(); } }, '✕ Clear') : null,
          h('span', { className: 'count' }, `${text.length}`),
        ),
        h('button', { className: 'go-btn', disabled: !text.trim() || loading, onClick: () => translate() },
          loading ? h('span', { className: 'btn-spin' }) : h('span', { className: 'go-seal' }, '訳'),
          h('span', { className: 'go-label' }, loading ? 'Translating…' : 'Translate')),
      ),
    ),

    // Model
    h('div', { className: 'opts' },
      h('label', null, 'Model'),
      MODELS.map(m => h('button', {
        key: m.id, className: 'pill' + (model === m.id ? ' active' : ''), onClick: () => setModel(m.id),
      }, m.label)),
    ),

    // Quick phrases (only before first result)
    !result && !loading ? h('div', { className: 'quick' },
      h('div', { className: 'section-eyebrow' }, 'Try a phrase'),
      h('div', { className: 'quick-chips' },
        QUICK.map(q => h('button', { key: q, className: 'chip', onClick: () => translate(q) }, q)),
      ),
    ) : null,

    // Result / states
    loading ? h('div', { className: 'card' }, h('div', { className: 'loading' },
        h('div', { className: 'spinner' }),
        h('div', { className: 'jp' }, '翻訳中'),
        h('div', { className: 'en' }, 'Translating…')))
    : error ? h('div', { className: 'card' }, h('div', { className: 'err' },
        h('div', { className: 'big' }, '⚠'), h('div', { className: 'msg' }, error)))
    : result ? h('div', null,
        h(Result, { data: result }),
        h('div', { className: 'save-row' },
          h('button', { className: 'icon-btn', onClick: savePhrase, disabled: saved },
            saved ? '✓ Saved to phrasebook' : '☆ Save to phrasebook'),
        ),
      )
    : !text ? h('div', { className: 'card' }, h('div', { className: 'empty' },
        h('div', { className: 'big' }, 'こんにちは'),
        h('p', null, 'Translate between English and Japanese — with romaji, a word-by-word breakdown, politeness notes, and native audio.')))
    : null,

    // Phrasebook
    pb.length ? h('div', { style: { marginTop: '30px' } },
      h('div', { className: 'pb-head' },
        h('span', { className: 't' }, `Phrasebook · ${pb.length}`),
        h('span', { className: 'clear', onClick: () => { if (confirm('Clear all saved phrases?')) setPb([]); } }, 'Clear all'),
      ),
      h('div', { className: 'card' }, h('div', { className: 'pb-list' },
        pb.map(p => h('div', { className: 'pb-item', key: p.id },
          h('div', { className: 'pb-jp' }, p.jp),
          p.romaji ? h('div', { className: 'pb-rom' }, p.romaji) : null,
          h('div', { className: 'pb-en' }, p.en),
          h('div', { className: 'pb-acts' },
            h('button', { onClick: () => speak(p.jp, 'ja-JP') }, '🔊 Listen'),
            h('button', { onClick: () => { navigator.clipboard?.writeText(p.jp); } }, '⧉ Copy'),
            h('button', { onClick: () => setPb(prev => prev.filter(x => x.id !== p.id)) }, '✕ Remove'),
          ),
        )),
      )),
    ) : null,

    h('div', { className: 'footlinks' },
      h('a', { href: './index.html' }, '← Back to FLCC'),
      h('span', { className: 'dot' }, '·'),
      h('a', { href: './ask.html' }, 'Ask FLCC'),
    ),

    showSetup ? h(SetupModal, { cfg, onSave: saveCfg, onClose: () => setShowSetup(false) }) : null,
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(h(App));
</script>
</body>
</html>
