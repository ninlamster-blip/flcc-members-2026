<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nihongo — Japanese Translator · FLCC</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🇯🇵%3C/text%3E%3C/svg%3E">
<style>
  :root {
    --bg: #FAFAF5;
    --card: #FFFFFF;
    --ink: #18181B;
    --ink-muted: #52525B;
    --ink-subtle: #A1A1AA;
    --border: #E7E5DE;
    --border-strong: #D4D4D0;
    --accent: #A33B2A;
    --accent-hover: #8B2E20;
    --accent-soft: #FBEBE7;
    --jp: #1E3A8A;
    --jp-soft: #EEF2FF;
    --ok: #15803D;
    --ok-soft: #ECFDF3;
    --shadow: 0 1px 2px rgba(0,0,0,.04), 0 8px 24px -12px rgba(0,0,0,.12);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: var(--bg); color: var(--ink); }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    line-height: 1.5;
    min-height: 100dvh;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  .wrap { max-width: 780px; margin: 0 auto; padding: 20px 18px 64px; }

  /* Header */
  header { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 18px; }
  .brand { display: flex; align-items: center; gap: 11px; }
  .brand .flag { font-size: 1.9rem; line-height: 1; }
  .brand h1 { font-size: 1.28rem; font-weight: 700; letter-spacing: -.02em; }
  .brand .sub { font-size: .74rem; color: var(--ink-subtle); font-weight: 500; letter-spacing: .02em; }
  .icon-btn {
    border: 1px solid var(--border-strong); background: var(--card); color: var(--ink-muted);
    border-radius: 9px; padding: 7px 12px; font-size: .8rem; font-weight: 600; cursor: pointer;
    display: inline-flex; align-items: center; gap: 6px; transition: .15s;
  }
  .icon-btn:hover { border-color: var(--ink); color: var(--ink); }
  .icon-btn.warn { color: var(--accent); border-color: var(--accent); }

  /* Direction selector */
  .dir-row { display: flex; align-items: stretch; gap: 8px; margin-bottom: 14px; }
  .dir-seg { flex: 1; display: flex; background: #F1F0EA; border-radius: 11px; padding: 4px; gap: 4px; }
  .dir-seg button {
    flex: 1; border: none; background: transparent; color: var(--ink-muted); font-weight: 600;
    font-size: .82rem; padding: 8px 6px; border-radius: 8px; cursor: pointer; transition: .15s;
  }
  .dir-seg button.active { background: var(--card); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.06); }
  .swap-btn {
    border: 1px solid var(--border-strong); background: var(--card); border-radius: 11px; width: 46px;
    font-size: 1.05rem; cursor: pointer; color: var(--ink-muted); transition: .15s;
  }
  .swap-btn:hover { border-color: var(--ink); color: var(--ink); transform: rotate(180deg); }

  /* Input card */
  .card {
    background: var(--card); border: 1px solid var(--border); border-radius: 16px;
    box-shadow: var(--shadow); overflow: hidden;
  }
  .input-card { margin-bottom: 14px; }
  textarea {
    width: 100%; border: none; resize: none; padding: 16px 16px 6px; font-size: 1.06rem; line-height: 1.55;
    color: var(--ink); background: transparent; font-family: inherit; min-height: 96px; outline: none;
  }
  textarea::placeholder { color: var(--ink-subtle); }
  .input-foot { display: flex; align-items: center; justify-content: space-between; padding: 8px 12px 12px; gap: 10px; }
  .input-foot .left { display: flex; align-items: center; gap: 8px; }
  .mini {
    border: 1px solid var(--border); background: var(--card); color: var(--ink-muted); cursor: pointer;
    border-radius: 8px; padding: 6px 9px; font-size: .74rem; font-weight: 600; display: inline-flex; align-items: center; gap: 5px;
  }
  .mini:hover { border-color: var(--ink); color: var(--ink); }
  .count { font-size: .7rem; color: var(--ink-subtle); }
  .go-btn {
    border: none; background: var(--ink); color: #fff; border-radius: 10px; padding: 9px 20px;
    font-size: .88rem; font-weight: 700; cursor: pointer; transition: .15s; display: inline-flex; align-items: center; gap: 7px;
  }
  .go-btn:hover:enabled { background: #000; }
  .go-btn:disabled { background: #EDEDE7; color: var(--ink-subtle); cursor: not-allowed; }

  /* Model pill row */
  .opts { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; }
  .opts label { font-size: .74rem; color: var(--ink-subtle); font-weight: 600; }
  .pill {
    border: 1px solid var(--border); background: var(--card); border-radius: 999px; padding: 5px 12px;
    font-size: .74rem; font-weight: 600; color: var(--ink-muted); cursor: pointer; transition: .15s;
  }
  .pill.active { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); }

  /* Result */
  .result { margin-top: 16px; }
  .res-main { padding: 20px 18px; border-bottom: 1px solid var(--border); }
  .res-label { font-size: .68rem; text-transform: uppercase; letter-spacing: .08em; color: var(--ink-subtle); font-weight: 700; margin-bottom: 8px; }
  .jp-text {
    font-size: 1.6rem; line-height: 1.55; color: var(--jp); font-weight: 500;
    word-break: break-word; letter-spacing: .01em;
  }
  .en-text { font-size: 1.32rem; line-height: 1.5; color: var(--ink); font-weight: 500; word-break: break-word; }
  .romaji { margin-top: 10px; font-size: .98rem; color: var(--ink-muted); font-style: italic; }
  .res-actions { display: flex; gap: 8px; margin-top: 14px; flex-wrap: wrap; }
  .res-actions button {
    border: 1px solid var(--border-strong); background: var(--card); color: var(--ink-muted);
    border-radius: 9px; padding: 7px 13px; font-size: .78rem; font-weight: 600; cursor: pointer;
    display: inline-flex; align-items: center; gap: 6px; transition: .15s;
  }
  .res-actions button:hover { border-color: var(--jp); color: var(--jp); }
  .res-actions button.copied { border-color: var(--ok); color: var(--ok); background: var(--ok-soft); }

  .section { padding: 15px 18px; border-bottom: 1px solid var(--border); }
  .section:last-child { border-bottom: none; }
  .section h3 { font-size: .68rem; text-transform: uppercase; letter-spacing: .08em; color: var(--ink-subtle); font-weight: 700; margin-bottom: 9px; }
  .bd-row { display: grid; grid-template-columns: auto 1fr; gap: 4px 14px; align-items: baseline; padding: 5px 0; border-bottom: 1px dashed var(--border); }
  .bd-row:last-child { border-bottom: none; }
  .bd-jp { color: var(--jp); font-weight: 600; font-size: 1.02rem; }
  .bd-rom { font-size: .78rem; color: var(--ink-subtle); font-style: italic; }
  .bd-mean { color: var(--ink); font-size: .92rem; }
  .note-txt { font-size: .9rem; color: var(--ink-muted); line-height: 1.6; }
  .alt-item { display: flex; align-items: baseline; gap: 10px; padding: 6px 0; border-bottom: 1px dashed var(--border); flex-wrap: wrap; }
  .alt-item:last-child { border-bottom: none; }
  .alt-jp { color: var(--jp); font-weight: 600; }
  .alt-tag { font-size: .68rem; background: var(--jp-soft); color: var(--jp); padding: 2px 8px; border-radius: 999px; font-weight: 700; }
  .alt-rom { font-size: .78rem; color: var(--ink-subtle); font-style: italic; }

  /* States */
  .empty, .loading, .err { text-align: center; padding: 40px 20px; color: var(--ink-subtle); }
  .empty .big { font-size: 2.4rem; margin-bottom: 10px; }
  .empty p { font-size: .9rem; max-width: 340px; margin: 0 auto; }
  .spinner {
    width: 26px; height: 26px; border: 3px solid var(--border-strong); border-top-color: var(--accent);
    border-radius: 50%; animation: spin .8s linear infinite; margin: 0 auto 12px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .err { color: var(--accent); }
  .err .big { font-size: 1.6rem; margin-bottom: 8px; }

  /* Quick phrases */
  .quick { margin-bottom: 16px; }
  .quick-title { font-size: .72rem; color: var(--ink-subtle); font-weight: 700; text-transform: uppercase; letter-spacing: .06em; margin-bottom: 8px; }
  .quick-chips { display: flex; gap: 7px; flex-wrap: wrap; }
  .chip {
    border: 1px solid var(--border); background: var(--card); border-radius: 999px; padding: 6px 13px;
    font-size: .8rem; color: var(--ink-muted); cursor: pointer; transition: .15s;
  }
  .chip:hover { border-color: var(--jp); color: var(--jp); background: var(--jp-soft); }

  /* Phrasebook */
  .pb-item { padding: 12px 0; border-bottom: 1px solid var(--border); }
  .pb-item:last-child { border-bottom: none; }
  .pb-jp { color: var(--jp); font-weight: 600; font-size: 1.06rem; }
  .pb-rom { font-size: .78rem; color: var(--ink-subtle); font-style: italic; margin: 2px 0; }
  .pb-en { font-size: .88rem; color: var(--ink-muted); }
  .pb-acts { display: flex; gap: 6px; margin-top: 7px; }
  .pb-acts button { border: 1px solid var(--border); background: var(--card); color: var(--ink-subtle); border-radius: 7px; padding: 4px 9px; font-size: .72rem; cursor: pointer; }
  .pb-acts button:hover { color: var(--jp); border-color: var(--jp); }

  /* Modal */
  .overlay { position: fixed; inset: 0; background: rgba(24,24,27,.4); display: flex; align-items: center; justify-content: center; padding: 18px; z-index: 50; }
  .modal { background: var(--card); border-radius: 18px; max-width: 420px; width: 100%; padding: 22px; box-shadow: 0 20px 60px -20px rgba(0,0,0,.4); }
  .modal h2 { font-size: 1.1rem; margin-bottom: 4px; }
  .modal p.lead { font-size: .84rem; color: var(--ink-muted); margin-bottom: 16px; }
  .modal .tabs { display: flex; gap: 6px; background: #F1F0EA; padding: 4px; border-radius: 10px; margin-bottom: 16px; }
  .modal .tabs button { flex: 1; border: none; background: transparent; padding: 8px; border-radius: 7px; font-weight: 600; font-size: .82rem; color: var(--ink-muted); cursor: pointer; }
  .modal .tabs button.active { background: var(--card); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.06); }
  .modal label.f { display: block; font-size: .74rem; font-weight: 600; color: var(--ink-muted); margin: 10px 0 5px; }
  .modal input {
    width: 100%; border: 1.5px solid var(--border-strong); border-radius: 9px; padding: 10px 12px;
    font-size: .9rem; font-family: inherit; outline: none;
  }
  .modal input:focus { border-color: var(--ink); }
  .modal .save { width: 100%; margin-top: 16px; background: var(--ink); color: #fff; border: none; border-radius: 10px; padding: 11px; font-weight: 700; font-size: .9rem; cursor: pointer; }
  .modal .save:disabled { background: #EDEDE7; color: var(--ink-subtle); cursor: not-allowed; }
  .modal .hint { font-size: .72rem; color: var(--ink-subtle); margin-top: 12px; line-height: 1.5; }
  .modal .close { background: none; border: none; font-size: 1.3rem; color: var(--ink-subtle); cursor: pointer; float: right; line-height: 1; }
  .footlinks { text-align: center; margin-top: 28px; font-size: .76rem; color: var(--ink-subtle); }
  .footlinks a { color: var(--ink-muted); text-decoration: none; }
  .footlinks a:hover { color: var(--accent); text-decoration: underline; }
</style>
</head>
<body>
<div id="root"></div>

<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script>
const { useState, useEffect, useRef, useCallback } = React;
const h = React.createElement;

// Reuse Ask FLCC's proxy config so members who set up Ask FLCC need nothing extra.
const PROXY_KEY    = 'flcc-ask-proxy-url-v1';
const PROXY_SECRET = 'flcc-ask-proxy-secret-v1';
const API_KEY      = 'flcc_ask_api_key';
const MODEL_KEY    = 'flcc_nihongo_model';
const PB_KEY       = 'flcc_nihongo_phrasebook';

const MODELS = [
  { id: 'claude-haiku-4-5-20251001', label: 'Fast' },
  { id: 'claude-sonnet-4-6',         label: 'Best' },
];

const DIRECTIONS = [
  { id: 'auto',   label: 'Auto' },
  { id: 'en2ja',  label: 'EN → 日本語' },
  { id: 'ja2en',  label: '日本語 → EN' },
];

const QUICK = [
  'Good morning!',
  'Thank you very much.',
  'Where is the train station?',
  'How much is this?',
  'God bless you.',
  'Nice to meet you.',
];

const SYSTEM = `You are an expert Japanese⇄English translator and language tutor.
Translate accurately and naturally, choosing register appropriate to context (default polite / です・ます form unless the source is clearly casual).
Always respond with ONLY a single valid JSON object, no markdown fences, no commentary. Schema:
{
  "detected": "english" | "japanese",
  "target": "japanese" | "english",
  "translation": "the full translation in the target language",
  "romaji": "Hepburn romanization of the Japanese side (the Japanese text — whether it is the source or the translation). Empty string if neither side is Japanese.",
  "breakdown": [ { "jp": "word/particle in Japanese", "romaji": "reading", "meaning": "short English gloss" } ],
  "notes": "1-3 concise sentences on nuance, politeness level, or usage. Empty string if nothing notable.",
  "alternatives": [ { "jp": "alternative phrasing (Japanese)", "romaji": "reading", "register": "casual|polite|formal|keigo" } ]
}
Rules:
- "breakdown" segments the JAPANESE sentence into meaningful units (words + particles), max ~12 items. Omit or use [] for very long text.
- "alternatives" gives 0-3 other natural phrasings at different politeness levels. [] if none useful.
- Keep JSON strictly valid: escape quotes, no trailing commas.`;

function getCfg() {
  return {
    proxy:  localStorage.getItem(PROXY_KEY)    || '',
    secret: localStorage.getItem(PROXY_SECRET) || '',
    apiKey: localStorage.getItem(API_KEY)      || '',
  };
}

// ─── Text-to-speech (browser native, free) ───────────────────────────────────
function speak(text, lang) {
  if (!('speechSynthesis' in window)) return;
  window.speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = lang;
  u.rate = lang.startsWith('ja') ? 0.9 : 1;
  const voices = window.speechSynthesis.getVoices();
  const v = voices.find(v => v.lang.startsWith(lang.slice(0,2)));
  if (v) u.voice = v;
  window.speechSynthesis.speak(u);
}

// ─── Setup Modal ──────────────────────────────────────────────────────────────
function SetupModal({ cfg, onSave, onClose }) {
  const hasProxy = !!cfg.proxy;
  const [tab, setTab]       = useState(hasProxy || !cfg.apiKey ? 'proxy' : 'key');
  const [proxy, setProxy]   = useState(cfg.proxy);
  const [secret, setSecret] = useState(cfg.secret);
  const [key, setKey]       = useState(cfg.apiKey);

  return h('div', { className: 'overlay', onClick: e => e.target === e.currentTarget && onClose() },
    h('div', { className: 'modal' },
      h('button', { className: 'close', onClick: onClose }, '×'),
      h('h2', null, 'Connect to AI'),
      h('p', { className: 'lead' }, 'Uses the same connection as Ask FLCC — set it up once, works everywhere.'),
      h('div', { className: 'tabs' },
        h('button', { className: tab === 'proxy' ? 'active' : '', onClick: () => setTab('proxy') }, 'Church Proxy'),
        h('button', { className: tab === 'key'   ? 'active' : '', onClick: () => setTab('key') },   'My API Key'),
      ),
      tab === 'proxy'
        ? h('div', null,
            h('label', { className: 'f' }, 'Worker URL'),
            h('input', { value: proxy, placeholder: 'https://flcc-ask.xxx.workers.dev',
              onChange: e => setProxy(e.target.value) }),
            h('label', { className: 'f' }, 'Proxy Secret (if required)'),
            h('input', { value: secret, type: 'password', placeholder: 'church password',
              onChange: e => setSecret(e.target.value) }),
            h('button', { className: 'save', disabled: !proxy.trim(),
              onClick: () => onSave({ proxy: proxy.trim(), secret: secret.trim() }) }, 'Save'),
            h('p', { className: 'hint' }, 'No personal API key needed — the church proxy holds one key for everyone. This never charges your account.'),
          )
        : h('div', null,
            h('label', { className: 'f' }, 'Anthropic API Key'),
            h('input', { value: key, type: 'password', placeholder: 'sk-ant-...',
              onChange: e => setKey(e.target.value) }),
            h('button', { className: 'save', disabled: !key.trim(),
              onClick: () => onSave({ apiKey: key.trim() }) }, 'Save'),
            h('p', { className: 'hint' }, 'Get one at console.anthropic.com. Stored only in this browser; used directly from your device.'),
          ),
    ),
  );
}

// ─── Result view ────────────────────────────────────────────────────────────
function Result({ data }) {
  const [copied, setCopied] = useState('');
  const jpIsTarget = data.target === 'japanese';
  const targetText = data.translation;
  const romaji = data.romaji || '';
  const jpText = jpIsTarget ? targetText : (data.sourceJp || '');

  const copy = (text, tag) => {
    navigator.clipboard?.writeText(text);
    setCopied(tag); setTimeout(() => setCopied(''), 1400);
  };

  return h('div', { className: 'card result' },
    // Main translation
    h('div', { className: 'res-main' },
      h('div', { className: 'res-label' }, jpIsTarget ? '日本語' : 'English'),
      h('div', { className: jpIsTarget ? 'jp-text' : 'en-text' }, targetText),
      romaji && jpIsTarget ? h('div', { className: 'romaji' }, romaji) : null,
      h('div', { className: 'res-actions' },
        h('button', { className: copied === 'main' ? 'copied' : '', onClick: () => copy(targetText, 'main') },
          copied === 'main' ? '✓ Copied' : '⧉ Copy'),
        jpIsTarget ? h('button', { onClick: () => speak(targetText, 'ja-JP') }, '🔊 Listen')
                   : h('button', { onClick: () => speak(targetText, 'en-US') }, '🔊 Listen'),
        romaji ? h('button', { className: copied === 'rom' ? 'copied' : '', onClick: () => copy(romaji, 'rom') },
          copied === 'rom' ? '✓' : '⧉ Rōmaji') : null,
      ),
    ),
    // Breakdown
    data.breakdown && data.breakdown.length
      ? h('div', { className: 'section' },
          h('h3', null, 'Word breakdown'),
          data.breakdown.map((b, i) => h('div', { className: 'bd-row', key: i },
            h('span', { className: 'bd-jp' }, b.jp,
              b.romaji ? h('span', { className: 'bd-rom' }, '  ' + b.romaji) : null),
            h('span', { className: 'bd-mean' }, b.meaning),
          )),
        )
      : null,
    // Notes
    data.notes
      ? h('div', { className: 'section' },
          h('h3', null, 'Nuance & register'),
          h('div', { className: 'note-txt' }, data.notes),
        )
      : null,
    // Alternatives
    data.alternatives && data.alternatives.length
      ? h('div', { className: 'section' },
          h('h3', null, 'Other phrasings'),
          data.alternatives.map((a, i) => h('div', { className: 'alt-item', key: i },
            h('span', { className: 'alt-tag' }, a.register || 'alt'),
            h('span', { className: 'alt-jp' }, a.jp),
            a.romaji ? h('span', { className: 'alt-rom' }, a.romaji) : null,
            h('button', { className: 'mini', style: { marginLeft: 'auto' }, onClick: () => speak(a.jp, 'ja-JP') }, '🔊'),
          )),
        )
      : null,
  );
}

// ─── App ──────────────────────────────────────────────────────────────────────
function App() {
  const [cfg, setCfg]       = useState(getCfg);
  const [text, setText]     = useState('');
  const [dir, setDir]       = useState('auto');
  const [model, setModel]   = useState(() => localStorage.getItem(MODEL_KEY) || MODELS[0].id);
  const [result, setResult] = useState(null);
  const [loading, setLoading] = useState(false);
  const [error, setError]   = useState('');
  const [showSetup, setShowSetup] = useState(false);
  const [pb, setPb]         = useState(() => { try { return JSON.parse(localStorage.getItem(PB_KEY)) || []; } catch { return []; } });
  const [saved, setSaved]   = useState(false);
  const taRef = useRef(null);

  const connected = !!cfg.proxy || !!cfg.apiKey;

  useEffect(() => { localStorage.setItem(MODEL_KEY, model); }, [model]);
  useEffect(() => { localStorage.setItem(PB_KEY, JSON.stringify(pb)); }, [pb]);
  // Prime speech voices
  useEffect(() => { if ('speechSynthesis' in window) window.speechSynthesis.getVoices(); }, []);

  const saveCfg = (patch) => {
    if (patch.proxy !== undefined) {
      localStorage.setItem(PROXY_KEY, patch.proxy);
      patch.secret ? localStorage.setItem(PROXY_SECRET, patch.secret) : localStorage.removeItem(PROXY_SECRET);
      localStorage.removeItem(API_KEY);
    }
    if (patch.apiKey !== undefined) {
      localStorage.setItem(API_KEY, patch.apiKey);
      localStorage.removeItem(PROXY_KEY); localStorage.removeItem(PROXY_SECRET);
    }
    setCfg(getCfg());
    setShowSetup(false);
  };

  const translate = useCallback(async (override) => {
    const source = (override ?? text).trim();
    if (!source) return;
    if (override != null) setText(override);
    if (!connected) { setShowSetup(true); return; }

    setLoading(true); setError(''); setResult(null); setSaved(false);

    const dirHint = dir === 'en2ja'
      ? 'The source is English; translate INTO Japanese.'
      : dir === 'ja2en'
      ? 'The source is Japanese; translate INTO English.'
      : 'Auto-detect the source language and translate into the other of {English, Japanese}.';

    const endpoint = cfg.proxy
      ? cfg.proxy.replace(/\/+$/, '') + '/proxy'
      : 'https://api.anthropic.com/v1/messages';
    const headers = { 'Content-Type': 'application/json' };
    if (cfg.proxy) { if (cfg.secret) headers['x-proxy-secret'] = cfg.secret; }
    else {
      headers['x-api-key'] = cfg.apiKey;
      headers['anthropic-version'] = '2023-06-01';
      headers['anthropic-dangerous-direct-browser-access'] = 'true';
    }

    try {
      const res = await fetch(endpoint, {
        method: 'POST', headers,
        body: JSON.stringify({
          model, max_tokens: 1500, system: SYSTEM,
          messages: [{ role: 'user', content: `${dirHint}\n\nText to translate:\n${source}` }],
        }),
      });
      if (!res.ok) {
        let msg = `API error ${res.status}`;
        try { const d = await res.json(); msg = d.error?.message || msg; } catch {}
        if (res.status === 401) msg = 'Invalid key or proxy secret — check Setup.';
        if (res.status === 429) msg = 'Rate limit reached. Wait a moment and retry.';
        throw new Error(msg);
      }
      const d = await res.json();
      let raw = (d.content?.[0]?.text || '').trim();
      // Strip accidental code fences
      raw = raw.replace(/^```(?:json)?\s*/i, '').replace(/\s*```$/,'').trim();
      // Grab the outermost JSON object
      const s = raw.indexOf('{'), e = raw.lastIndexOf('}');
      if (s === -1 || e === -1) throw new Error('Unexpected response format.');
      const parsed = JSON.parse(raw.slice(s, e + 1));
      // Track the Japanese source text when translating JA→EN so we can voice it
      if (parsed.detected === 'japanese') parsed.sourceJp = source;
      setResult(parsed);
    } catch (err) {
      setError(err.message || 'Something went wrong.');
    } finally {
      setLoading(false);
    }
  }, [text, dir, model, cfg, connected]);

  const savePhrase = () => {
    if (!result) return;
    const jp = result.target === 'japanese' ? result.translation : (result.sourceJp || '');
    const en = result.target === 'english' ? result.translation : text.trim();
    setPb(prev => [{ id: Date.now(), jp, romaji: result.romaji || '', en }, ...prev].slice(0, 100));
    setSaved(true);
  };

  return h('div', { className: 'wrap' },
    // Header
    h('header', null,
      h('div', { className: 'brand' },
        h('span', { className: 'flag' }, '🇯🇵'),
        h('div', null,
          h('h1', null, 'Nihongo'),
          h('div', { className: 'sub' }, 'Japanese ⇄ English Translator'),
        ),
      ),
      h('button', { className: 'icon-btn' + (connected ? '' : ' warn'), onClick: () => setShowSetup(true) },
        connected ? '⚙ Setup' : '⚡ Connect'),
    ),

    // Direction
    h('div', { className: 'dir-row' },
      h('div', { className: 'dir-seg' },
        DIRECTIONS.map(d => h('button', {
          key: d.id, className: dir === d.id ? 'active' : '', onClick: () => setDir(d.id),
        }, d.label)),
      ),
    ),

    // Input
    h('div', { className: 'card input-card' },
      h('textarea', {
        ref: taRef, value: text, placeholder: 'Type English or 日本語 to translate…',
        onChange: e => setText(e.target.value),
        onKeyDown: e => { if ((e.metaKey || e.ctrlKey) && e.key === 'Enter') translate(); },
      }),
      h('div', { className: 'input-foot' },
        h('div', { className: 'left' },
          text ? h('button', { className: 'mini', onClick: () => { setText(''); setResult(null); setError(''); taRef.current?.focus(); } }, '✕ Clear') : null,
          h('span', { className: 'count' }, `${text.length}`),
        ),
        h('button', { className: 'go-btn', disabled: !text.trim() || loading, onClick: () => translate() },
          loading ? '…' : '訳 Translate'),
      ),
    ),

    // Model
    h('div', { className: 'opts' },
      h('label', null, 'Model:'),
      MODELS.map(m => h('button', {
        key: m.id, className: 'pill' + (model === m.id ? ' active' : ''), onClick: () => setModel(m.id),
      }, m.label)),
    ),

    // Quick phrases (only before first result)
    !result && !loading ? h('div', { className: 'quick' },
      h('div', { className: 'quick-title' }, 'Try a phrase'),
      h('div', { className: 'quick-chips' },
        QUICK.map(q => h('button', { key: q, className: 'chip', onClick: () => translate(q) }, q)),
      ),
    ) : null,

    // Result / states
    loading ? h('div', { className: 'card' }, h('div', { className: 'loading' },
        h('div', { className: 'spinner' }), h('div', null, 'Translating…')))
    : error ? h('div', { className: 'card' }, h('div', { className: 'err' },
        h('div', { className: 'big' }, '⚠'), h('div', null, error)))
    : result ? h('div', null,
        h(Result, { data: result }),
        h('div', { style: { marginTop: '12px', display: 'flex', gap: '8px' } },
          h('button', { className: 'icon-btn', onClick: savePhrase, disabled: saved },
            saved ? '✓ Saved to phrasebook' : '☆ Save to phrasebook'),
        ),
      )
    : !text ? h('div', { className: 'card' }, h('div', { className: 'empty' },
        h('div', { className: 'big' }, 'こんにちは'),
        h('p', null, 'Translate between English and Japanese with romaji, a word-by-word breakdown, politeness notes, and audio.')))
    : null,

    // Phrasebook
    pb.length ? h('div', { style: { marginTop: '28px' } },
      h('div', { className: 'quick-title', style: { display: 'flex', justifyContent: 'space-between' } },
        h('span', null, `Phrasebook · ${pb.length}`),
        h('span', { style: { cursor: 'pointer', color: 'var(--accent)' }, onClick: () => { if (confirm('Clear all saved phrases?')) setPb([]); } }, 'Clear'),
      ),
      h('div', { className: 'card', style: { padding: '4px 18px' } },
        pb.map(p => h('div', { className: 'pb-item', key: p.id },
          h('div', { className: 'pb-jp' }, p.jp),
          p.romaji ? h('div', { className: 'pb-rom' }, p.romaji) : null,
          h('div', { className: 'pb-en' }, p.en),
          h('div', { className: 'pb-acts' },
            h('button', { onClick: () => speak(p.jp, 'ja-JP') }, '🔊 Listen'),
            h('button', { onClick: () => { navigator.clipboard?.writeText(p.jp); } }, '⧉ Copy'),
            h('button', { onClick: () => setPb(prev => prev.filter(x => x.id !== p.id)) }, '✕ Remove'),
          ),
        )),
      ),
    ) : null,

    h('div', { className: 'footlinks' },
      h('a', { href: './index.html' }, '← Back to FLCC'),
      ' · ', h('a', { href: './ask.html' }, 'Ask FLCC'),
    ),

    showSetup ? h(SetupModal, { cfg, onSave: saveCfg, onClose: () => setShowSetup(false) }) : null,
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(h(App));
</script>
</body>
</html>
