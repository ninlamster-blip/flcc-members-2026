<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bible Timeline & Paul's Journeys | FLCC</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
:root {
  --bg: #0a0e1a;
  --bg2: #111827;
  --bg3: #1f2937;
  --glass: rgba(255,255,255,0.05);
  --glass-border: rgba(255,255,255,0.1);
  --text: #f1f5f9;
  --text2: #94a3b8;
  --accent: #6366f1;
  --accent2: #8b5cf6;
  --gold: #f59e0b;
  --radius: 12px;
  --shadow: 0 8px 32px rgba(0,0,0,0.4);
}
[data-theme="light"] {
  --bg: #f8fafc;
  --bg2: #ffffff;
  --bg3: #f1f5f9;
  --glass: rgba(0,0,0,0.03);
  --glass-border: rgba(0,0,0,0.1);
  --text: #0f172a;
  --text2: #475569;
  --shadow: 0 8px 32px rgba(0,0,0,0.1);
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;font-family:'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--text);overflow:hidden}
/* NAV */
#app{display:flex;flex-direction:column;height:100vh}
#topbar{display:flex;align-items:center;justify-content:space-between;padding:12px 24px;background:var(--bg2);border-bottom:1px solid var(--glass-border);flex-shrink:0;z-index:100}
.logo{display:flex;align-items:center;gap:10px;font-weight:700;font-size:1.1rem}
.logo-icon{width:36px;height:36px;background:linear-gradient(135deg,var(--accent),var(--gold));border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:18px}
#tabs{display:flex;gap:4px;background:var(--bg3);padding:4px;border-radius:10px}
.tab-btn{padding:8px 20px;border:none;background:transparent;color:var(--text2);border-radius:7px;cursor:pointer;font-size:.9rem;font-weight:500;transition:all .2s}
.tab-btn.active{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;box-shadow:0 2px 12px rgba(99,102,241,.4)}
#topbar-right{display:flex;gap:10px;align-items:center}
.icon-btn{width:36px;height:36px;border:1px solid var(--glass-border);background:var(--glass);border-radius:8px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:16px;color:var(--text);transition:all .2s}
.icon-btn:hover{background:var(--accent);border-color:var(--accent);color:#fff}
/* MODULES */
.module{display:none;flex:1;overflow:hidden;flex-direction:column}
.module.active{display:flex}

/* ===== TIMELINE MODULE ===== */
#timeline-controls{display:flex;gap:10px;padding:12px 20px;background:var(--bg2);border-bottom:1px solid var(--glass-border);align-items:center;flex-wrap:wrap;flex-shrink:0}
#search-box{flex:1;min-width:160px;max-width:280px;padding:8px 14px;background:var(--bg3);border:1px solid var(--glass-border);border-radius:8px;color:var(--text);font-size:.9rem;outline:none}
#search-box:focus{border-color:var(--accent)}
.filter-group{display:flex;gap:4px;flex-wrap:wrap}
.filter-btn{padding:5px 12px;font-size:.8rem;border:1px solid var(--glass-border);background:var(--glass);color:var(--text2);border-radius:20px;cursor:pointer;transition:all .2s;white-space:nowrap}
.filter-btn.active{background:var(--accent);border-color:var(--accent);color:#fff}
.zoom-btns{display:flex;gap:4px;margin-left:auto}
.zoom-btn{padding:6px 12px;border:1px solid var(--glass-border);background:var(--glass);color:var(--text);border-radius:6px;cursor:pointer;font-size:1rem;transition:all .2s}
.zoom-btn:hover{background:var(--accent);color:#fff}
#timeline-wrap{flex:1;overflow:hidden;position:relative}
#timeline-scroll{width:100%;height:100%;overflow-x:auto;overflow-y:hidden;cursor:grab;user-select:none}
#timeline-scroll:active{cursor:grabbing}
#timeline-inner{display:flex;align-items:stretch;min-height:100%;padding:30px 40px;gap:0;position:relative;transition:transform .1s}
/* Era lane */
.era{flex-shrink:0;display:flex;flex-direction:column;border-right:2px solid var(--glass-border);padding:0 16px 0 0;margin-right:16px;min-width:160px}
.era-header{writing-mode:horizontal-tb;font-size:.75rem;font-weight:700;text-transform:uppercase;letter-spacing:.1em;padding:8px 14px;border-radius:8px;margin-bottom:12px;text-align:center}
.era-year{font-size:.7rem;color:var(--text2);text-align:center;margin-bottom:10px}
.era-events{display:flex;flex-direction:column;gap:8px;flex:1}
/* Event card */
.event-card{background:var(--glass);border:1px solid var(--glass-border);border-radius:10px;padding:10px 12px;cursor:pointer;transition:all .25s;min-width:140px;position:relative;backdrop-filter:blur(10px)}
.event-card:hover{transform:translateY(-2px);box-shadow:var(--shadow);border-color:var(--accent)}
.event-card.highlighted{border-color:var(--gold);box-shadow:0 0 16px rgba(245,158,11,.3)}
.event-card.hidden{display:none}
.event-icon{font-size:1.4rem;margin-bottom:6px}
.event-name{font-size:.85rem;font-weight:600;line-height:1.3;margin-bottom:3px}
.event-date{font-size:.72rem;color:var(--text2)}
.event-tag{display:inline-block;font-size:.65rem;padding:2px 7px;border-radius:20px;margin-top:5px;font-weight:600;text-transform:uppercase}
/* Timeline ruler at bottom */
#tl-ruler{height:32px;flex-shrink:0;background:var(--bg2);border-top:1px solid var(--glass-border);position:relative;display:flex;align-items:center;padding:0 40px;overflow:hidden}
/* Detail panel */
#detail-panel{position:fixed;right:0;top:60px;bottom:0;width:360px;background:var(--bg2);border-left:1px solid var(--glass-border);transform:translateX(100%);transition:transform .35s cubic-bezier(.4,0,.2,1);z-index:200;overflow-y:auto;display:flex;flex-direction:column}
#detail-panel.open{transform:translateX(0)}
.dp-header{padding:20px;background:linear-gradient(135deg,var(--accent),var(--accent2));position:relative;flex-shrink:0}
.dp-icon{font-size:2.5rem;margin-bottom:8px}
.dp-title{font-size:1.2rem;font-weight:700}
.dp-date{font-size:.85rem;opacity:.85;margin-top:2px}
.dp-close{position:absolute;top:16px;right:16px;width:28px;height:28px;background:rgba(255,255,255,.2);border:none;border-radius:50%;cursor:pointer;color:#fff;font-size:16px;display:flex;align-items:center;justify-content:center}
.dp-body{padding:20px;display:flex;flex-direction:column;gap:16px}
.dp-section{background:var(--bg3);border-radius:10px;padding:14px}
.dp-section-title{font-size:.75rem;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--text2);margin-bottom:8px}
.dp-section p{font-size:.9rem;line-height:1.6;color:var(--text)}
.dp-scripture{font-family:Georgia,serif;font-style:italic;font-size:.9rem;color:var(--accent);border-left:3px solid var(--accent);padding-left:10px;line-height:1.6}
.dp-people{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.dp-tag{padding:4px 10px;background:var(--glass);border:1px solid var(--glass-border);border-radius:20px;font-size:.75rem}

/* ===== PAUL'S JOURNEYS MODULE ===== */
#journey-sidebar{width:320px;flex-shrink:0;background:var(--bg2);border-right:1px solid var(--glass-border);display:flex;flex-direction:column;overflow:hidden}
@media(max-width:768px){#journey-sidebar{width:100%;max-height:240px;border-right:none;border-bottom:1px solid var(--glass-border)}}
#journey-map-area{flex:1;position:relative;display:flex;flex-direction:column}
#map{flex:1}
.journey-selector{padding:16px;flex-shrink:0}
.journey-selector h3{font-size:.8rem;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--text2);margin-bottom:10px}
.journey-btns{display:flex;flex-direction:column;gap:6px}
.journey-btn{padding:10px 14px;border:1px solid var(--glass-border);background:var(--glass);color:var(--text);border-radius:8px;cursor:pointer;text-align:left;transition:all .2s;font-size:.85rem;display:flex;align-items:center;gap:10px}
.journey-btn .j-dot{width:12px;height:12px;border-radius:50%;flex-shrink:0}
.journey-btn.active,.journey-btn:hover{color:#fff}
.journey-btn.active{box-shadow:0 2px 12px rgba(0,0,0,.3)}
.journey-info{padding:16px;border-top:1px solid var(--glass-border);flex:1;overflow-y:auto}
.journey-info h3{font-size:1rem;font-weight:700;margin-bottom:4px}
.journey-info .ji-meta{font-size:.8rem;color:var(--text2);margin-bottom:12px}
.waypoint-list{display:flex;flex-direction:column;gap:4px}
.wp-item{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:7px;cursor:pointer;transition:all .2s;font-size:.85rem;border:1px solid transparent}
.wp-item:hover{background:var(--bg3);border-color:var(--glass-border)}
.wp-item.active-wp{background:var(--bg3);border-color:var(--accent)}
.wp-num{width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:.7rem;font-weight:700;color:#fff;flex-shrink:0}
.playbar{padding:12px 16px;border-top:1px solid var(--glass-border);background:var(--bg2);flex-shrink:0}
.playbar-btns{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.play-btn{flex:1;padding:9px;background:linear-gradient(135deg,var(--accent),var(--accent2));border:none;border-radius:8px;color:#fff;cursor:pointer;font-size:.9rem;font-weight:600;transition:all .2s}
.play-btn:hover{opacity:.9}
.ctrl-btn{padding:8px 12px;border:1px solid var(--glass-border);background:var(--glass);color:var(--text);border-radius:6px;cursor:pointer;font-size:.85rem;transition:all .2s}
.ctrl-btn:hover{background:var(--bg3)}
.progress-bar{height:4px;background:var(--bg3);border-radius:4px;cursor:pointer;position:relative;overflow:hidden}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--gold));border-radius:4px;transition:width .5s}
.journey-module-inner{display:flex;flex:1;overflow:hidden}
@media(max-width:768px){.journey-module-inner{flex-direction:column}}
/* MAP POPUP CUSTOM */
.leaflet-popup-content-wrapper{background:var(--bg2)!important;color:var(--text)!important;border:1px solid var(--glass-border)!important;border-radius:12px!important;box-shadow:var(--shadow)!important;padding:0!important}
.leaflet-popup-content{margin:0!important;min-width:240px}
.leaflet-popup-tip-container{display:none}
.popup-inner{padding:16px}
.popup-inner h4{font-size:1rem;font-weight:700;margin-bottom:2px}
.popup-inner .p-ref{font-size:.75rem;color:var(--accent);margin-bottom:10px}
.popup-inner .p-event{font-size:.82rem;line-height:1.5;color:var(--text);margin-bottom:8px}
.popup-inner .p-modern{font-size:.75rem;color:var(--text2);font-style:italic}
/* Overlay for guided tour */
#tour-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:500;align-items:center;justify-content:center}
#tour-overlay.show{display:flex}
.tour-card{background:var(--bg2);border-radius:16px;padding:30px;max-width:480px;width:90%;border:1px solid var(--glass-border);box-shadow:var(--shadow)}
.tour-card h2{font-size:1.4rem;font-weight:700;margin-bottom:10px}
.tour-card p{color:var(--text2);line-height:1.6;margin-bottom:20px;font-size:.95rem}
.tour-actions{display:flex;gap:10px;justify-content:flex-end}
.btn-primary{padding:10px 22px;background:linear-gradient(135deg,var(--accent),var(--accent2));border:none;border-radius:8px;color:#fff;cursor:pointer;font-size:.9rem;font-weight:600}
.btn-secondary{padding:10px 22px;background:var(--bg3);border:1px solid var(--glass-border);border-radius:8px;color:var(--text);cursor:pointer;font-size:.9rem}
/* Scrollbar */
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--glass-border);border-radius:3px}
/* Animations */
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.era{animation:fadeIn .4s ease both}
.event-card{animation:fadeIn .3s ease both}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}
.animating .wp-item.active-wp .wp-num{animation:pulse 1s infinite}
/* Map dark theme */
.leaflet-tile{filter:brightness(.8) saturate(.7)}
[data-theme="light"] .leaflet-tile{filter:none}
</style>
</head>
<body>
<div id="app">
  <!-- TOP BAR -->
  <div id="topbar">
    <div class="logo">
      <div class="logo-icon">✝</div>
      <span>Bible Explorer</span>
    </div>
    <div id="tabs">
      <button class="tab-btn active" onclick="switchTab('timeline')">📜 Timeline</button>
      <button class="tab-btn" onclick="switchTab('journeys')">🗺 Paul's Journeys</button>
    </div>
    <div id="topbar-right">
      <button class="icon-btn" onclick="toggleTheme()" title="Toggle theme">☀</button>
      <button class="icon-btn" onclick="showTour()" title="Guided tour">?</button>
    </div>
  </div>

  <!-- MODULE 1: TIMELINE -->
  <div id="mod-timeline" class="module active">
    <div id="timeline-controls">
      <input type="text" id="search-box" placeholder="🔍 Search events, people, places..." oninput="searchTimeline(this.value)">
      <div class="filter-group">
        <button class="filter-btn active" data-filter="all" onclick="setFilter(this,'all')">All</button>
        <button class="filter-btn" data-filter="ot" onclick="setFilter(this,'ot')">Old Testament</button>
        <button class="filter-btn" data-filter="nt" onclick="setFilter(this,'nt')">New Testament</button>
        <button class="filter-btn" data-filter="prophet" onclick="setFilter(this,'prophet')">Prophets</button>
        <button class="filter-btn" data-filter="king" onclick="setFilter(this,'king')">Kings</button>
        <button class="filter-btn" data-filter="apostle" onclick="setFilter(this,'apostle')">Apostles</button>
        <button class="filter-btn" data-filter="major" onclick="setFilter(this,'major')">Major Events</button>
      </div>
      <div class="zoom-btns">
        <button class="zoom-btn" onclick="zoomTL(-1)">−</button>
        <button class="zoom-btn" onclick="zoomTL(1)">+</button>
        <button class="zoom-btn" style="font-size:.75rem;padding:6px 10px" onclick="zoomTL(0)">Reset</button>
      </div>
    </div>
    <div id="timeline-wrap">
      <div id="timeline-scroll">
        <div id="timeline-inner" id="timeline-inner"></div>
      </div>
    </div>
  </div>

  <!-- MODULE 2: PAUL'S JOURNEYS -->
  <div id="mod-journeys" class="module">
    <div class="journey-module-inner">
      <div id="journey-sidebar">
        <div class="journey-selector">
          <h3>Select Journey</h3>
          <div class="journey-btns" id="journey-btns"></div>
        </div>
        <div class="journey-info" id="journey-info"></div>
        <div class="playbar">
          <div class="playbar-btns">
            <button class="ctrl-btn" onclick="rewindJourney()" title="Rewind">⏮</button>
            <button class="play-btn" id="play-btn" onclick="togglePlay()">▶ Animate Route</button>
            <button class="ctrl-btn" onclick="changeSpeed()" title="Speed" id="speed-btn">1×</button>
          </div>
          <div class="progress-bar" onclick="seekProgress(event)">
            <div class="progress-fill" id="progress-fill" style="width:0%"></div>
          </div>
        </div>
      </div>
      <div id="journey-map-area">
        <div id="map"></div>
      </div>
    </div>
  </div>
</div>

<!-- DETAIL PANEL (Timeline) -->
<div id="detail-panel">
  <div class="dp-header" id="dp-header">
    <button class="dp-close" onclick="closeDetail()">✕</button>
    <div class="dp-icon" id="dp-icon"></div>
    <div class="dp-title" id="dp-title"></div>
    <div class="dp-date" id="dp-date"></div>
  </div>
  <div class="dp-body" id="dp-body"></div>
</div>

<!-- TOUR OVERLAY -->
<div id="tour-overlay">
  <div class="tour-card">
    <h2 id="tour-title"></h2>
    <p id="tour-desc"></p>
    <div class="tour-actions">
      <button class="btn-secondary" onclick="hideTour()">Skip Tour</button>
      <button class="btn-primary" id="tour-next-btn" onclick="tourNext()">Next →</button>
    </div>
  </div>
</div>

<script>
// ===================== TIMELINE DATA =====================
const ERAS = [
  {
    id:'creation',name:'Creation Era',color:'#10b981',gradient:'#059669',period:'~4000–2000 BC',testament:'ot',
    events:[
      {id:'creation',name:'Creation',icon:'🌍',date:'~4000 BC',tags:['ot','major'],scripture:'Genesis 1:1',
       desc:'God created the heavens and the earth in six days, bringing order from void. Light, sky, land, seas, plants, animals, and humankind were formed by divine command.',
       people:['God','Adam','Eve'],significance:'The foundation of all existence; establishes God as sovereign Creator.'},
      {id:'adam-eve',name:'Adam & Eve',icon:'🌿',date:'~4000 BC',tags:['ot'],scripture:'Genesis 2:7–25',
       desc:'God formed Adam from dust and breathed life into him. Eve was created from Adam\'s rib to be his companion in the Garden of Eden.',
       people:['Adam','Eve'],significance:'The first humans, created in God\'s image.'},
      {id:'fall',name:'The Fall',icon:'🍎',date:'~4000 BC',tags:['ot','major'],scripture:'Genesis 3',
       desc:'Satan, disguised as a serpent, deceived Eve into eating the forbidden fruit. Adam followed. Sin entered the world, bringing death, suffering, and separation from God.',
       people:['Adam','Eve','Satan'],significance:'The origin of human sin; necessitates the plan of redemption.'},
      {id:'cain-abel',name:'Cain & Abel',icon:'⚔️',date:'~3900 BC',tags:['ot'],scripture:'Genesis 4',
       desc:'Cain, jealous that God accepted Abel\'s sacrifice but not his own, murdered his brother—the first recorded homicide in Scripture.',
       people:['Cain','Abel'],significance:'Illustrates the devastating consequences of unchecked sin.'},
      {id:'flood',name:'Noah\'s Flood',icon:'🌊',date:'~2350 BC',tags:['ot','major'],scripture:'Genesis 6–9',
       desc:'God, grieved by human wickedness, sent a global flood. Noah, found righteous, built an ark for his family and pairs of every animal. The rainbow became God\'s covenant of promise.',
       people:['Noah','Shem','Ham','Japheth'],significance:'God\'s judgment and grace; foreshadows baptism and salvation.'},
      {id:'babel',name:'Tower of Babel',icon:'🗼',date:'~2200 BC',tags:['ot','major'],scripture:'Genesis 11:1–9',
       desc:'Humanity united to build a tower reaching heaven, driven by pride. God confused their language and scattered them across the earth, giving rise to the nations.',
       people:['Nimrod'],significance:'Origin of nations and languages; counterpart to Pentecost.'}
    ]
  },
  {
    id:'patriarchs',name:'Patriarch Era',color:'#f59e0b',gradient:'#d97706',period:'~2000–1700 BC',testament:'ot',
    events:[
      {id:'abraham',name:'Abraham',icon:'⭐',date:'~2000 BC',tags:['ot','major'],scripture:'Genesis 12–25',
       desc:'God called Abram from Ur to Canaan, promising to make him a great nation through whom all peoples would be blessed. His faith was counted as righteousness.',
       people:['Abraham','Sarah','Lot'],significance:'Father of faith; the Abrahamic covenant is foundational to salvation history.'},
      {id:'isaac',name:'Isaac',icon:'🐑',date:'~1900 BC',tags:['ot'],scripture:'Genesis 21–35',
       desc:'The miracle son of Abraham and Sarah, born when they were very old. Abraham\'s willingness to sacrifice Isaac foreshadowed the sacrifice of God\'s own Son.',
       people:['Isaac','Rebekah','Abraham'],significance:'Child of promise; typology of Christ as the sacrificial lamb.'},
      {id:'jacob',name:'Jacob',icon:'🌙',date:'~1850 BC',tags:['ot'],scripture:'Genesis 25–50',
       desc:'Jacob wrestled with God and received the name Israel. His twelve sons became the twelve tribes of Israel, the foundation of the Hebrew nation.',
       people:['Jacob','Rachel','Leah'],significance:'His twelve sons become the nation of Israel.'},
      {id:'joseph',name:'Joseph',icon:'🎨',date:'~1750 BC',tags:['ot','major'],scripture:'Genesis 37–50',
       desc:'Joseph, sold into slavery by his jealous brothers, rose to become second-in-command of Egypt. He saved Egypt and his family from famine, reconciling with his brothers in grace.',

    ]
  },
  {
    id:'exodus',name:'Exodus Era',color:'#ef4444',gradient:'#dc2626',period:'~1500–1400 BC',testament:'ot',
    events:[
      {id:'moses',name:'Moses',icon:'📜',date:'~1526 BC',tags:['ot','major','prophet'],scripture:'Exodus 2',
       desc:'Born during Pharaoh\'s edict to kill Hebrew boys, Moses was placed in a basket on the Nile, found by Pharaoh\'s daughter, and raised in the palace.',
       people:['Moses','Miriam','Jochebed'],significance:'The greatest prophet of the OT; mediator of the Mosaic covenant.'},
      {id:'burning-bush',name:'Burning Bush',icon:'🔥',date:'~1446 BC',tags:['ot','major'],scripture:'Exodus 3–4',
       desc:'God appeared to Moses in a bush that burned but was not consumed, revealing His name as "I AM WHO I AM" and commissioning Moses to deliver Israel from Egypt.',
       people:['Moses','God'],significance:'God\'s self-revelation as the eternal, ever-present deliverer.'},
      {id:'plagues',name:'Ten Plagues',icon:'🐸',date:'~1446 BC',tags:['ot','major'],scripture:'Exodus 7–12',
       desc:'God sent ten devastating plagues upon Egypt—water to blood, frogs, lice, flies, livestock disease, boils, hail, locusts, darkness, and the death of firstborns—to compel Pharaoh to release Israel.',

      {id:'exodus-event',name:'The Exodus',icon:'🏜️',date:'~1446 BC',tags:['ot','major'],scripture:'Exodus 12–14',

      {id:'red-sea',name:'Red Sea Crossing',icon:'🌊',date:'~1446 BC',tags:['ot','major'],scripture:'Exodus 14',
       desc:'Trapped between Pharaoh\'s army and the sea, God parted the waters for Israel to cross on dry ground. When Egypt pursued, the waters returned, destroying Pharaoh\'s army.',
       people:['Moses','Miriam'],significance:'God\'s power to save and judge; Paul connects it to baptism (1 Cor 10).'},
      {id:'ten-commandments',name:'Ten Commandments',icon:'📋',date:'~1446 BC',tags:['ot','major'],scripture:'Exodus 20',
       desc:'God inscribed the Ten Commandments on stone tablets at Mount Sinai, establishing the moral foundation of the Mosaic covenant. These laws governed Israel\'s relationship with God and neighbor.',
       people:['Moses','God'],significance:'The moral law; reveals God\'s holy character and human need for a Savior.'}
    ]

       modern:'Rome, Italy'}
    ]
  }
};

// ===================== TIMELINE RENDERING =====================
let tlScale = 1;
let activeFilter = 'all';
let detailOpen = false;
let isDragging = false, dragStartX = 0, scrollStartX = 0;

function buildTimeline() {
  const inner = document.getElementById('timeline-inner');
  inner.innerHTML = '';
  ERAS.forEach((era, ei) => {
    const eraEl = document.createElement('div');
    eraEl.className = 'era';
    eraEl.style.animationDelay = `${ei * 0.05}s`;
    const hdr = document.createElement('div');
    hdr.className = 'era-header';
    hdr.style.cssText = `background:${era.color}22;color:${era.color};border:1px solid ${era.color}44`;
    hdr.textContent = era.name;
    const yr = document.createElement('div');
    yr.className = 'era-year';
    yr.textContent = era.period;
    const eventsWrap = document.createElement('div');
    eventsWrap.className = 'era-events';
    era.events.forEach((ev, evi) => {
      const card = document.createElement('div');
      card.className = 'event-card';
      card.dataset.tags = ev.tags.join(',');
      card.dataset.search = (ev.name + ' ' + ev.people?.join(' ') + ' ' + ev.desc).toLowerCase();
      card.style.animationDelay = `${(ei * 0.05) + (evi * 0.03)}s`;
      card.style.borderLeftColor = era.color;
      card.style.borderLeftWidth = '3px';
      card.innerHTML = `
        <div class="event-icon">${ev.icon}</div>
        <div class="event-name">${ev.name}</div>
        <div class="event-date">${ev.date}</div>
        <span class="event-tag" style="background:${era.color}22;color:${era.color}">${ev.tags.includes('major') ? '★ Major' : ev.tags.includes('prophet') ? 'Prophet' : ev.tags.includes('king') ? 'King' : ev.tags.includes('apostle') ? 'Apostle' : era.testament.toUpperCase()}</span>
      `;
      card.onclick = () => openDetail(ev, era);
      eventsWrap.appendChild(card);
    });
    eraEl.appendChild(hdr);
    eraEl.appendChild(yr);
    eraEl.appendChild(eventsWrap);
    inner.appendChild(eraEl);
  });
  setupDrag();
}

function setupDrag() {
  const scroll = document.getElementById('timeline-scroll');
  scroll.addEventListener('mousedown', e => { isDragging = true; dragStartX = e.clientX; scrollStartX = scroll.scrollLeft; scroll.style.cursor = 'grabbing'; });
  scroll.addEventListener('mousemove', e => { if (!isDragging) return; scroll.scrollLeft = scrollStartX - (e.clientX - dragStartX); });
  scroll.addEventListener('mouseup', () => { isDragging = false; scroll.style.cursor = 'grab'; });
  scroll.addEventListener('mouseleave', () => { isDragging = false; scroll.style.cursor = 'grab'; });
  scroll.addEventListener('wheel', e => { e.preventDefault(); scroll.scrollLeft += e.deltaY * 2; }, { passive: false });
}

function zoomTL(dir) {
  const inner = document.getElementById('timeline-inner');
  if (dir === 0) { tlScale = 1; }
  else { tlScale = Math.min(2.5, Math.max(0.5, tlScale + dir * 0.2)); }
  inner.style.transform = `scaleX(${tlScale})`;
  inner.style.transformOrigin = 'left center';
}

function setFilter(btn, filter) {
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  activeFilter = filter;
  applyFilter();
}

function applyFilter() {
  document.querySelectorAll('.event-card').forEach(card => {
    const tags = card.dataset.tags;
    card.classList.remove('hidden');
    if (activeFilter === 'all') return;
    if (!tags.includes(activeFilter)) card.classList.add('hidden');
  });
}

function searchTimeline(q) {
  q = q.toLowerCase();
  document.querySelectorAll('.event-card').forEach(card => {
    card.classList.remove('highlighted');
    if (!q) { card.classList.remove('hidden'); return; }
    if (card.dataset.search.includes(q)) {
      card.classList.remove('hidden');
      card.classList.add('highlighted');
    } else {
      card.classList.add('hidden');
    }
  });
}

function openDetail(ev, era) {
  document.getElementById('dp-icon').textContent = ev.icon;
  document.getElementById('dp-title').textContent = ev.name;
  document.getElementById('dp-date').textContent = ev.date;
  document.getElementById('dp-header').style.background = `linear-gradient(135deg, ${era.color}, ${era.gradient})`;
  const body = document.getElementById('dp-body');
  body.innerHTML = `
    <div class="dp-section">
      <div class="dp-section-title">Scripture Reference</div>
      <div class="dp-scripture">${ev.scripture}</div>
    </div>
    <div class="dp-section">
      <div class="dp-section-title">Overview</div>
      <p>${ev.desc}</p>
    </div>
    ${ev.significance ? `<div class="dp-section"><div class="dp-section-title">Significance</div><p>${ev.significance}</p></div>` : ''}
    ${ev.people?.length ? `<div class="dp-section"><div class="dp-section-title">Key People</div><div class="dp-people">${ev.people.map(p=>`<span class="dp-tag">${p}</span>`).join('')}</div></div>` : ''}
    <div class="dp-section" style="background:${era.color}11;border:1px solid ${era.color}33">
      <div class="dp-section-title" style="color:${era.color}">${era.name}</div>
      <p style="font-size:.8rem;color:var(--text2)">${era.period}</p>
    </div>
  `;
  document.getElementById('detail-panel').classList.add('open');
  detailOpen = true;
}

function closeDetail() {
  document.getElementById('detail-panel').classList.remove('open');
  detailOpen = false;
}

// ===================== MAP / PAUL'S JOURNEYS =====================
let map, currentJourney = 'first', layers = {}, markers = {}, routeLines = {};
let animating = false, animStep = 0, animTimer = null, animSpeed = 1;
const speeds = [0.5, 1, 2, 4];
let speedIdx = 1;

function initMap() {
  map = L.map('map', { zoomControl: true, center: [38, 27], zoom: 5 });
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '© OpenStreetMap',
    maxZoom: 18
  }).addTo(map);

  Object.keys(JOURNEYS).forEach(jk => {
    const j = JOURNEYS[jk];
    layers[jk] = L.layerGroup();
    markers[jk] = [];
    j.waypoints.forEach((wp, i) => {
      const color = j.color;
      const icon = L.divIcon({
        className: '',
        html: `<div style="width:28px;height:28px;background:${color};border:3px solid white;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:white;box-shadow:0 2px 8px rgba(0,0,0,.4)">${i+1}</div>`,
        iconSize: [28, 28], iconAnchor: [14, 14]
      });
      const m = L.marker([wp.coords[1], wp.coords[0]], { icon }).bindPopup(`
        <div class="popup-inner">
          <h4>${wp.name}</h4>
          <div class="p-ref">${wp.ref} · ${j.year}</div>
          <div class="p-event">${wp.events}</div>
          <div class="p-modern">📍 ${wp.modern}</div>
        </div>
      `, { maxWidth: 280 });
      markers[jk].push(m);
      layers[jk].addLayer(m);
    });
  });

  selectJourney('first');
}

function selectJourney(jk) {
  stopAnimation();
  Object.values(layers).forEach(l => map.removeLayer(l));
  Object.values(routeLines).forEach(l => { try { map.removeLayer(l); } catch(e){} });
  currentJourney = jk;
  const j = JOURNEYS[jk];
  layers[jk].addTo(map);
  document.querySelectorAll('.journey-btn').forEach(b => {
    b.classList.remove('active');
    b.style.background = '';
    b.style.borderColor = '';
  });
  const activeBtn = document.querySelector(`.journey-btn[data-key="${jk}"]`);
  if (activeBtn) {
    activeBtn.classList.add('active');
    activeBtn.style.background = j.color;
    activeBtn.style.borderColor = j.color;
  }
  updateJourneyInfo();
  document.getElementById('progress-fill').style.width = '0%';
  animStep = 0;
  const bounds = L.latLngBounds(j.waypoints.map(wp => [wp.coords[1], wp.coords[0]]));
  map.fitBounds(bounds, { padding: [40, 40] });
}

function updateJourneyInfo() {
  const j = JOURNEYS[currentJourney];
  const info = document.getElementById('journey-info');
  info.innerHTML = `
    <h3 style="color:${j.color}">${j.name}</h3>
    <div class="ji-meta">${j.year} · ${j.scripture}</div>
    <p style="font-size:.82rem;color:var(--text2);margin-bottom:12px;line-height:1.5">${j.desc}</p>
    <div class="waypoint-list" id="wp-list">
      ${j.waypoints.map((wp,i)=>`
        <div class="wp-item" data-idx="${i}" onclick="flyToWaypoint(${i})">
          <div class="wp-num" style="background:${j.color}">${i+1}</div>
          <span>${wp.name}</span>
        </div>
      `).join('')}
    </div>
  `;
}

function flyToWaypoint(idx) {
  const j = JOURNEYS[currentJourney];
  const wp = j.waypoints[idx];
  map.flyTo([wp.coords[1], wp.coords[0]], 8, { duration: 1.2 });
  setTimeout(() => markers[currentJourney][idx].openPopup(), 1300);
  document.querySelectorAll('.wp-item').forEach((el, i) => {
    el.classList.toggle('active-wp', i === idx);
  });
}

function togglePlay() {
  if (animating) { stopAnimation(); } else { startAnimation(); }
}

function startAnimation() {
  animating = true;
  document.getElementById('play-btn').textContent = '⏸ Pause';
  document.querySelector('.journey-module-inner').classList.add('animating');
  if (animStep === 0) clearRoutes();
  animateStep();
}

function clearRoutes() {
  if (routeLines[currentJourney]) {
    try { map.removeLayer(routeLines[currentJourney]); } catch(e){}
  }
}

function animateStep() {
  if (!animating) return;
  const j = JOURNEYS[currentJourney];
  const total = j.waypoints.length;
  if (animStep >= total - 1) {
    stopAnimation();
    document.getElementById('progress-fill').style.width = '100%';
    return;
  }
  flyToWaypoint(animStep);
  const pct = (animStep / (total - 1)) * 100;
  document.getElementById('progress-fill').style.width = pct + '%';
  if (animStep > 0) {
    const pts = j.waypoints.slice(0, animStep + 1).map(wp => [wp.coords[1], wp.coords[0]]);
    clearRoutes();
    routeLines[currentJourney] = L.polyline(pts, {
      color: j.color, weight: 3, opacity: 0.8,
      dashArray: '8, 6'
    }).addTo(map);
  }
  animStep++;
  const delay = 2500 / animSpeed;
  animTimer = setTimeout(animateStep, delay);
}

function stopAnimation() {
  animating = false;
  if (animTimer) clearTimeout(animTimer);
  document.getElementById('play-btn').textContent = '▶ Animate Route';
  document.querySelector('.journey-module-inner')?.classList.remove('animating');
}

function rewindJourney() {
  stopAnimation();
  animStep = 0;
  clearRoutes();
  document.getElementById('progress-fill').style.width = '0%';
  const j = JOURNEYS[currentJourney];
  const bounds = L.latLngBounds(j.waypoints.map(wp => [wp.coords[1], wp.coords[0]]));
  map.fitBounds(bounds, { padding: [40, 40] });
  document.querySelectorAll('.wp-item').forEach(el => el.classList.remove('active-wp'));
}

function changeSpeed() {
  speedIdx = (speedIdx + 1) % speeds.length;
  animSpeed = speeds[speedIdx];
  document.getElementById('speed-btn').textContent = animSpeed + '×';
}

function seekProgress(e) {
  const bar = e.currentTarget;
  const pct = e.offsetX / bar.offsetWidth;
  const j = JOURNEYS[currentJourney];
  animStep = Math.floor(pct * (j.waypoints.length - 1));
  document.getElementById('progress-fill').style.width = (pct * 100) + '%';
  flyToWaypoint(animStep);
  stopAnimation();
}

function buildJourneyBtns() {
  const container = document.getElementById('journey-btns');
  Object.keys(JOURNEYS).forEach(jk => {
    const j = JOURNEYS[jk];
    const btn = document.createElement('button');
    btn.className = 'journey-btn';
    btn.dataset.key = jk;
    btn.innerHTML = `<span class="j-dot" style="background:${j.color}"></span>${j.name}<small style="margin-left:auto;opacity:.7;font-size:.72rem">${j.year}</small>`;
    btn.onclick = () => selectJourney(jk);
    container.appendChild(btn);
  });
}

// ===================== TABS =====================
function switchTab(tab) {
  document.querySelectorAll('.module').forEach(m => m.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.getElementById(`mod-${tab}`).classList.add('active');
  document.querySelectorAll('.tab-btn').forEach(b => { if (b.textContent.toLowerCase().includes(tab === 'timeline' ? 'timeline' : 'paul')) b.classList.add('active'); });
  if (tab === 'journeys' && !map) { setTimeout(initMap, 100); }
  if (tab === 'timeline') closeDetail();
}

// ===================== THEME =====================
function toggleTheme() {
  const html = document.documentElement;
  const isDark = html.getAttribute('data-theme') === 'dark';
  html.setAttribute('data-theme', isDark ? 'light' : 'dark');
  document.querySelector('.icon-btn').textContent = isDark ? '🌙' : '☀';
}

// ===================== TOUR =====================
const TOUR_STEPS = [
  { title:'Welcome to Bible Explorer', desc:'This interactive experience covers the entire Biblical narrative—from Creation to Revelation—and traces Paul\'s missionary journeys across the ancient Mediterranean world.' },
  { title:'Bible Timeline', desc:'Scroll horizontally through 4,000 years of Biblical history. Click any event card to open a detailed study panel with scripture references, key people, and historical significance.' },
  { title:'Search & Filter', desc:'Use the search bar to find specific events, people, or places. Filter by Old Testament, New Testament, Prophets, Kings, Apostles, or Major Events.' },
  { title:'Paul\'s Journeys', desc:'Switch to the Paul\'s Journeys tab to explore his four missionary expeditions on an interactive map. Click cities for Biblical context, or use the Animate Route button to watch the journey unfold step by step.' },
];
let tourStep = 0;
function showTour() { tourStep = 0; renderTour(); document.getElementById('tour-overlay').classList.add('show'); }
function hideTour() { document.getElementById('tour-overlay').classList.remove('show'); }
function tourNext() {
  tourStep++;
  if (tourStep >= TOUR_STEPS.length) { hideTour(); return; }
  renderTour();
}
function renderTour() {
  const s = TOUR_STEPS[tourStep];
  document.getElementById('tour-title').textContent = s.title;
  document.getElementById('tour-desc').textContent = s.desc;
  document.getElementById('tour-next-btn').textContent = tourStep === TOUR_STEPS.length - 1 ? 'Start Exploring →' : 'Next →';
}

// ===================== INIT =====================
buildTimeline();
buildJourneyBtns();
</script>
