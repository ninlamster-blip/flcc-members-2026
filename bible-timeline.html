<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bible Explorer · FLCC</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
:root{
  --bg:#0a0e1a;--bg2:#111827;--bg3:#1f2937;
  --glass:rgba(255,255,255,.05);--gb:rgba(255,255,255,.1);
  --text:#f1f5f9;--text2:#94a3b8;
  --accent:#6366f1;--accent2:#8b5cf6;--gold:#f59e0b;
  --shadow:0 8px 32px rgba(0,0,0,.45);
}
[data-theme="light"]{
  --bg:#f1f5f9;--bg2:#fff;--bg3:#e2e8f0;
  --glass:rgba(0,0,0,.03);--gb:rgba(0,0,0,.1);
  --text:#0f172a;--text2:#475569;
  --shadow:0 8px 32px rgba(0,0,0,.12);
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;font-family:system-ui,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);overflow:hidden}

/* ── APP SHELL ── */
#app{display:flex;flex-direction:column;height:100vh}
#topbar{display:flex;align-items:center;justify-content:space-between;padding:10px 22px;
  background:var(--bg2);border-bottom:1px solid var(--gb);flex-shrink:0;z-index:100}
.logo{display:flex;align-items:center;gap:10px;font-weight:700;font-size:1.05rem;letter-spacing:-.01em}
.logo-mark{width:32px;height:32px;border-radius:7px;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(135deg,var(--accent),var(--gold));flex-shrink:0}
.logo-mark svg{width:18px;height:18px;fill:#fff}
#tabs{display:flex;gap:3px;background:var(--bg3);padding:3px;border-radius:9px}
.tab-btn{padding:7px 18px;border:none;background:transparent;color:var(--text2);border-radius:6px;
  cursor:pointer;font-size:.85rem;font-weight:500;transition:all .2s;letter-spacing:.01em}
.tab-btn.active{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;
  box-shadow:0 2px 10px rgba(99,102,241,.4)}
.topbar-actions{display:flex;gap:8px}
.icon-btn{width:34px;height:34px;border:1px solid var(--gb);background:var(--glass);
  border-radius:7px;cursor:pointer;display:flex;align-items:center;justify-content:center;
  color:var(--text2);font-size:.75rem;font-weight:600;letter-spacing:.02em;transition:all .2s}
.icon-btn:hover{background:var(--bg3);color:var(--text);border-color:var(--accent)}
.module{display:none;flex:1;overflow:hidden;flex-direction:column;min-height:0}
.module.active{display:flex}

/* ── TIMELINE CONTROLS ── */
#tl-controls{display:flex;align-items:center;gap:10px;padding:10px 20px;
  background:var(--bg2);border-bottom:1px solid var(--gb);flex-shrink:0;flex-wrap:wrap}
#tl-search{flex:1;min-width:150px;max-width:260px;padding:7px 13px;
  background:var(--bg3);border:1px solid var(--gb);border-radius:7px;
  color:var(--text);font-size:.85rem;outline:none;font-family:inherit}
#tl-search::placeholder{color:var(--text2)}
#tl-search:focus{border-color:var(--accent)}
.filter-row{display:flex;gap:4px;flex-wrap:wrap}
.f-btn{padding:4px 11px;font-size:.77rem;border:1px solid var(--gb);background:var(--glass);
  color:var(--text2);border-radius:20px;cursor:pointer;transition:all .2s;white-space:nowrap;font-family:inherit}
.f-btn.on{background:var(--accent);border-color:var(--accent);color:#fff}
.zoom-row{display:flex;gap:3px;margin-left:auto}
.z-btn{padding:5px 11px;border:1px solid var(--gb);background:var(--glass);
  color:var(--text);border-radius:6px;cursor:pointer;font-size:.85rem;transition:all .2s;font-family:inherit}
.z-btn:hover{background:var(--accent);color:#fff;border-color:var(--accent)}

/* ── TIMELINE VIEWPORT ── */
#tl-viewport{flex:1;overflow:hidden;position:relative;min-height:0}
#tl-scroll{width:100%;height:100%;overflow-x:auto;overflow-y:auto;cursor:grab;user-select:none;-webkit-overflow-scrolling:touch}
#tl-scroll:active{cursor:grabbing}
#tl-svg{display:block}

/* ── TIMELINE INFOBAR ── */
#tl-infobar{flex-shrink:0;height:30px;display:flex;align-items:center;padding:0 20px;
  background:var(--bg2);border-top:1px solid var(--gb);font-size:.78rem;color:var(--text2);
  letter-spacing:.02em}

/* ── SVG NODE STYLES ── */
.ev-node{transition:filter .15s}
.ev-node:hover,.ev-node.selected{filter:brightness(1.4) drop-shadow(0 0 6px currentColor)}
.era-anchor{pointer-events:none}

/* ── DETAIL PANEL ── */
#dp{position:fixed;right:0;top:52px;bottom:0;width:340px;
  background:var(--bg2);border-left:1px solid var(--gb);
  transform:translateX(100%);transition:transform .3s cubic-bezier(.4,0,.2,1);
  z-index:200;overflow-y:auto;display:flex;flex-direction:column}
#dp.open{transform:translateX(0)}
#dp-header{padding:20px;position:relative;flex-shrink:0}
.dp-era-bar{height:3px;border-radius:3px;margin-bottom:16px}
.dp-meta{font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.1em;margin-bottom:5px;opacity:.7}
.dp-title{font-size:1.25rem;font-weight:700;line-height:1.3;margin-bottom:3px}
.dp-date{font-size:.82rem;color:var(--text2)}
.dp-close{position:absolute;top:16px;right:16px;width:28px;height:28px;
  background:var(--bg3);border:none;border-radius:50%;cursor:pointer;
  color:var(--text2);font-size:14px;display:flex;align-items:center;justify-content:center;transition:all .2s}
.dp-close:hover{background:var(--accent);color:#fff}
#dp-body{padding:0 20px 20px;display:flex;flex-direction:column;gap:14px}
.dp-block{background:var(--bg3);border-radius:9px;padding:13px}
.dp-block-title{font-size:.7rem;font-weight:700;text-transform:uppercase;letter-spacing:.1em;
  color:var(--text2);margin-bottom:8px}
.dp-text{font-size:.88rem;line-height:1.65;color:var(--text)}
.dp-quote{font-family:Georgia,serif;font-style:italic;font-size:.88rem;line-height:1.6;
  border-left:3px solid var(--accent);padding-left:11px;color:var(--accent)}
.dp-chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:4px}
.dp-chip{padding:3px 9px;background:var(--glass);border:1px solid var(--gb);
  border-radius:20px;font-size:.73rem;color:var(--text2)}

/* ── PAUL'S JOURNEYS ── */
#mod-journeys{flex-direction:row}
@media(max-width:700px){#mod-journeys{flex-direction:column}}
#j-sidebar{width:300px;flex-shrink:0;display:flex;flex-direction:column;
  background:var(--bg2);border-right:1px solid var(--gb);overflow:hidden}
@media(max-width:700px){#j-sidebar{width:100%;max-height:230px;border-right:none;border-bottom:1px solid var(--gb)}}
#j-map{flex:1;min-height:300px}
.j-section{padding:14px;border-bottom:1px solid var(--gb);flex-shrink:0}
.j-section-title{font-size:.7rem;font-weight:700;text-transform:uppercase;
  letter-spacing:.1em;color:var(--text2);margin-bottom:9px}
.j-btn{display:flex;align-items:center;gap:9px;width:100%;padding:9px 12px;
  border:1px solid var(--gb);background:var(--glass);color:var(--text);
  border-radius:7px;cursor:pointer;text-align:left;transition:all .2s;
  font-size:.83rem;margin-bottom:5px;font-family:inherit}
.j-btn:last-child{margin-bottom:0}
.j-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.j-btn.on,.j-btn:hover{color:#fff;box-shadow:0 2px 8px rgba(0,0,0,.3)}
.j-btn small{margin-left:auto;opacity:.65;font-size:.72rem}
.j-info{flex:1;overflow-y:auto;padding:14px}
.j-info h3{font-size:.95rem;font-weight:700;margin-bottom:3px}
.j-info p{font-size:.8rem;line-height:1.5;color:var(--text2);margin-bottom:11px}
.wp-list{display:flex;flex-direction:column;gap:3px}
.wp{display:flex;align-items:center;gap:8px;padding:7px 9px;border-radius:6px;
  cursor:pointer;transition:all .2s;font-size:.82rem;border:1px solid transparent}
.wp:hover{background:var(--bg3);border-color:var(--gb)}
.wp.cur{background:var(--bg3);border-color:var(--accent)}
.wp-num{width:20px;height:20px;border-radius:50%;display:flex;align-items:center;
  justify-content:center;font-size:.68rem;font-weight:700;color:#fff;flex-shrink:0}
.j-playbar{padding:12px 14px;border-top:1px solid var(--gb);flex-shrink:0}
.playbar-row{display:flex;gap:6px;margin-bottom:8px}
.play-btn{flex:1;padding:8px;border:none;background:linear-gradient(135deg,var(--accent),var(--accent2));
  border-radius:7px;color:#fff;cursor:pointer;font-size:.83rem;font-weight:600;
  transition:opacity .2s;font-family:inherit}
.play-btn:hover{opacity:.88}
.ctrl-btn{padding:7px 10px;border:1px solid var(--gb);background:var(--glass);
  color:var(--text);border-radius:6px;cursor:pointer;font-size:.78rem;transition:all .2s;font-family:inherit}
.ctrl-btn:hover{background:var(--bg3)}
.prog-track{height:4px;background:var(--bg3);border-radius:4px;cursor:pointer;overflow:hidden}
.prog-fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--gold));border-radius:4px;transition:width .4s}

/* ── MAP POPUP ── */
.leaflet-popup-content-wrapper{background:var(--bg2)!important;color:var(--text)!important;
  border:1px solid var(--gb)!important;border-radius:10px!important;padding:0!important;box-shadow:var(--shadow)!important}
.leaflet-popup-content{margin:0!important}
.leaflet-popup-tip-container{display:none}
.lp{padding:14px;min-width:220px}
.lp h4{font-size:.9rem;font-weight:700;margin-bottom:2px}
.lp .lp-ref{font-size:.72rem;color:var(--accent);margin-bottom:8px}
.lp .lp-ev{font-size:.8rem;line-height:1.5;margin-bottom:7px}
.lp .lp-loc{font-size:.72rem;color:var(--text2);font-style:italic}
.leaflet-tile{filter:brightness(.75) saturate(.6)}
[data-theme="light"] .leaflet-tile{filter:none}

/* ── SCROLLBAR ── */
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--gb);border-radius:3px}

@keyframes fadeUp{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
@keyframes jesusPulse{0%,100%{opacity:1}50%{opacity:.82}}
.jesus-hub{animation:jesusPulse 3s ease-in-out infinite}
.jesus-arc{pointer-events:none}
.christ-node{filter:drop-shadow(0 0 4px rgba(251,191,36,.6))}
</style>
</head>
<body>
<div id="app">

  <!-- TOP BAR -->
  <header id="topbar">
    <div class="logo">
      <div class="logo-mark">
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <rect x="10.5" y="2" width="3" height="20" rx="1.5"/>
          <rect x="4" y="8.5" width="16" height="3" rx="1.5"/>
        </svg>
      </div>
      <span>Bible Explorer</span>
    </div>
    <div id="tabs">
      <button class="tab-btn active" data-tab="timeline" onclick="switchTab('timeline')">Timeline</button>
      <button class="tab-btn" data-tab="journeys" onclick="switchTab('journeys')">Paul's Journeys</button>
    </div>
    <div class="topbar-actions">
      <button class="icon-btn" id="theme-btn" onclick="toggleTheme()" title="Toggle theme">AA</button>
    </div>
  </header>

  <!-- TIMELINE MODULE -->
  <div id="mod-timeline" class="module active">
    <div id="tl-controls">
      <input type="text" id="tl-search" placeholder="Search events, people, places" oninput="tlSearch(this.value)">
      <div class="filter-row">
        <button class="f-btn on"  data-f="all"     onclick="tlFilter(this,'all')">All</button>
        <button class="f-btn"     data-f="ot"      onclick="tlFilter(this,'ot')">Old Testament</button>
        <button class="f-btn"     data-f="nt"      onclick="tlFilter(this,'nt')">New Testament</button>
        <button class="f-btn"     data-f="prophet" onclick="tlFilter(this,'prophet')">Prophets</button>
        <button class="f-btn"     data-f="king"    onclick="tlFilter(this,'king')">Kings</button>
        <button class="f-btn"     data-f="apostle" onclick="tlFilter(this,'apostle')">Apostles</button>
        <button class="f-btn"     data-f="major"   onclick="tlFilter(this,'major')">Major Events</button>
      </div>
      <div class="zoom-row">
        <button class="z-btn" onclick="tlZoom(-1)">−</button>
        <button class="z-btn" onclick="tlZoom(1)">+</button>
        <button class="z-btn" style="font-size:.72rem;padding:5px 9px" onclick="tlZoom(0)">Reset</button>
      </div>
    </div>
    <div id="tl-viewport">
      <div id="tl-scroll">
        <svg id="tl-svg"></svg>
      </div>
    </div>
    <div id="tl-infobar">Hover or click any node to explore</div>
  </div>

  <!-- PAUL'S JOURNEYS MODULE -->
  <div id="mod-journeys" class="module">
    <div id="j-sidebar">
      <div class="j-section">
        <div class="j-section-title">Select Journey</div>
        <div id="j-btns"></div>
      </div>
      <div class="j-info" id="j-info"></div>
      <div class="j-playbar">
        <div class="playbar-row">
          <button class="ctrl-btn" onclick="jRewind()" title="Restart">&#9198;</button>
          <button class="play-btn" id="j-play-btn" onclick="jTogglePlay()">&#9654; Animate Route</button>
          <button class="ctrl-btn" id="j-speed-btn" onclick="jCycleSpeed()">1&#215;</button>
        </div>
        <div class="prog-track" onclick="jSeek(event)">
          <div class="prog-fill" id="j-prog" style="width:0%"></div>
        </div>
      </div>
    </div>
    <div id="j-map"></div>
  </div>
</div>

<!-- DETAIL PANEL -->
<aside id="dp">
  <div id="dp-header">
    <button class="dp-close" onclick="dpClose()">&#10005;</button>
    <div class="dp-era-bar" id="dp-era-bar"></div>
    <div class="dp-meta" id="dp-meta"></div>
    <div class="dp-title" id="dp-title"></div>
    <div class="dp-date" id="dp-date"></div>
  </div>
  <div id="dp-body"></div>
</aside>

<script>

   DATA

/* =========================================================
   TIMELINE — SVG MIND MAP
   ========================================================= */
const SP = 88;   // horizontal spacing between event nodes
const EG = 58;   // gap between eras
const AY = 242;  // axis Y
const ABY = 108; // above-axis Y
const BLY = 376; // below-axis Y
const NR = 8;    // event node radius
const ER = 13;   // era anchor radius
const SVG_H = 490;

let svgScale = 1;
let tlDrag = false, tlDragX = 0, tlScrollX = 0;
let activeFilter = 'all';
let selectedEvId = null;

function buildSVG() {
  // Calculate positions
  const eraAnchors = []; // {era, x}
  const evNodes = [];    // {ev, era, x, y, isAbove}
  let cx = 72;

  ERAS.forEach((era, ei) => {
    eraAnchors.push({ era, x: cx });
    era.events.forEach((ev, j) => {
      const isAbove = (j + ei) % 2 === 0;
      evNodes.push({ ev, era, x: cx + (j + 1) * SP, y: isAbove ? ABY : BLY, isAbove });
    });
    cx += (era.events.length + 1) * SP + EG;
  });

  const W = cx + 72;
  const svg = document.getElementById('tl-svg');
  svg.setAttribute('width', W);
  svg.setAttribute('height', SVG_H);
  svg.setAttribute('viewBox', `0 0 ${W} ${SVG_H}`);

  // Jesus supernode — center of all Scripture
  const lcEvs = evNodes.filter(n => n.era.id === 'life-christ');
  const jx = lcEvs.length ? Math.round((lcEvs[0].x + lcEvs[lcEvs.length-1].x) / 2) : Math.round(W / 2);
  const jy = 50;

  let h = `<defs>`;
  ERAS.forEach(e => {
    h += `<filter id="gf-${e.id}" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>`;
  });
  h += `
    <radialGradient id="jg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fffde7"/>
      <stop offset="40%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#92400e"/>
    </radialGradient>
    <filter id="jglow" x="-120%" y="-120%" width="340%" height="340%">
      <feGaussianBlur stdDeviation="9" result="b1"/>
      <feGaussianBlur stdDeviation="4" result="b2"/>
      <feMerge><feMergeNode in="b1"/><feMergeNode in="b1"/><feMergeNode in="b2"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>`;

  // Axis background
  h += `<line x1="40" y1="${AY}" x2="${W-40}" y2="${AY}" stroke="rgba(255,255,255,.06)" stroke-width="2"/>`;

  // Era axis segments
  eraAnchors.forEach((ep, i) => {
    const nxt = eraAnchors[i + 1];
    const ex = nxt ? nxt.x : W - 40;
    h += `<line x1="${ep.x}" y1="${AY}" x2="${ex}" y2="${AY}" stroke="${ep.era.color}" stroke-width="3" opacity=".55"/>`;
  });

  // Connectors (draw before nodes so nodes appear on top)
  evNodes.forEach(np => {
    const { x, y, isAbove, era } = np;
    const cp = isAbove ? AY - 55 : AY + 55;
    h += `<path d="M ${x} ${y} C ${x} ${cp} ${x} ${cp} ${x} ${AY}"
      stroke="${era.color}" stroke-width="1.5" fill="none" opacity=".3"
      class="ev-conn" data-id="${np.ev.id}"/>`;
    h += `<circle cx="${x}" cy="${AY}" r="3" fill="${era.color}" opacity=".55"/>`;
  });

  // OT → Jesus arcs (prophecy & typology pointing to Christ)
  ['creation','fall','abraham','moses','david','temple','isaiah','jeremiah','daniel'].forEach(id => {
    const np = evNodes.find(n => n.ev.id === id);
    if (!np) return;
    const cp1y = np.y > AY ? np.y - 150 : np.y - 55;
    const cp2y = jy + (np.y > AY ? 140 : 60);
    h += `<path d="M ${np.x} ${np.y} C ${np.x} ${cp1y} ${jx} ${cp2y} ${jx} ${jy}"
      stroke="rgba(251,191,36,.32)" stroke-width="1.3" fill="none" stroke-dasharray="5,4" class="jesus-arc"/>`;
  });
  // Jesus → NT arcs (fulfillment radiating outward)
  ['pentecost','paul-conversion','missionary','seven-churches','new-creation'].forEach(id => {
    const np = evNodes.find(n => n.ev.id === id);
    if (!np) return;
    const cp1y = jy + (np.y > AY ? 140 : 60);
    const cp2y = np.y > AY ? np.y - 150 : np.y - 55;
    h += `<path d="M ${jx} ${jy} C ${jx} ${cp1y} ${np.x} ${cp2y} ${np.x} ${np.y}"
      stroke="rgba(251,191,36,.32)" stroke-width="1.3" fill="none" stroke-dasharray="5,4" class="jesus-arc"/>`;
  });

  // Era anchors + labels
  eraAnchors.forEach(ep => {
    const { era, x } = ep;
    h += `<circle cx="${x}" cy="${AY}" r="${ER}" fill="${era.color}" stroke="var(--bg2)" stroke-width="2" class="era-anchor"/>`;
    // Era name
    h += `<text x="${x + ER + 5}" y="${AY + ER + 14}"
      font-size="10.5" font-weight="700" fill="${era.color}"
      font-family="system-ui,sans-serif">${era.name}</text>`;
    // Period
    h += `<text x="${x + ER + 5}" y="${AY + ER + 27}"
      font-size="9" fill="rgba(148,163,184,.75)"
      font-family="system-ui,sans-serif">${era.period}</text>`;
  });

  // Event nodes + labels for major events
  evNodes.forEach(np => {
    const { ev, era, x, y, isAbove } = np;
    const tags = (ev.tags || []).join(',');
    const isMajor = ev.tags?.includes('major');
    const isChrist = era.id === 'life-christ';
    const nodeR = isChrist ? NR + 4 : NR;
    const strokeW = isChrist ? 3 : 2.5;
    h += `<circle cx="${x}" cy="${y}" r="${nodeR}" fill="${era.color}"
      stroke="${isChrist ? '#fff9c4' : 'var(--bg2)'}" stroke-width="${strokeW}"
      class="ev-node${isChrist ? ' christ-node' : ''}" data-id="${ev.id}" data-era="${era.id}" data-tags="${tags}"
      style="cursor:pointer">
      <title>${ev.name} · ${ev.date}</title>
    </circle>`;
    if (isMajor) {
      const lbl = ev.name.length > 14 ? ev.name.slice(0,13) + '…' : ev.name;
      const ly = isAbove ? y - NR - 7 : y + NR + 15;
      h += `<text x="${x}" y="${ly}" text-anchor="middle"
        font-size="9.5" fill="${era.color}" font-weight="600"
        font-family="system-ui,sans-serif" class="ev-lbl" data-id="${ev.id}"
        style="pointer-events:none">${lbl}</text>`;
    }
  });

  // Jesus Christ supernode — drawn last so it sits above everything
  h += `
    <circle cx="${jx}" cy="${jy}" r="28" fill="url(#jg)" filter="url(#jglow)"
      class="jesus-hub" style="cursor:pointer">
      <title>Jesus Christ — The Center of Scripture</title>
    </circle>
    <path d="M ${jx} ${jy-16} L ${jx} ${jy+16} M ${jx-12} ${jy} L ${jx+12} ${jy}"
      stroke="rgba(255,255,255,.94)" stroke-width="4" stroke-linecap="round"
      style="pointer-events:none"/>
    <text x="${jx}" y="${jy+47}" text-anchor="middle" font-size="12" font-weight="700"
      fill="#fbbf24" font-family="system-ui,sans-serif" letter-spacing=".04em"
      style="pointer-events:none">Jesus Christ</text>
    <text x="${jx}" y="${jy+60}" text-anchor="middle" font-size="8.5"
      fill="rgba(251,191,36,.65)" font-family="system-ui,sans-serif" font-style="italic"
      style="pointer-events:none">The Word Made Flesh</text>
  `;

  svg.innerHTML = h;

  // Attach events after DOM update
  svg.querySelectorAll('.ev-node').forEach(node => {
    node.addEventListener('click', () => {
      const eraObj = ERAS.find(e => e.id === node.dataset.era);
      const evObj = eraObj?.events.find(e => e.id === node.dataset.id);
      if (!evObj) return;
      svg.querySelectorAll('.ev-node').forEach(n => {
        n.removeAttribute('filter'); n.classList.remove('selected');
      });
      node.setAttribute('filter', `url(#gf-${eraObj.id})`);
      node.classList.add('selected');
      selectedEvId = evObj.id;
      dpOpen(evObj, eraObj);
    });
    node.addEventListener('mouseenter', () => {
      if (!node.classList.contains('selected'))
        node.setAttribute('filter', `url(#gf-${node.dataset.era})`);
      const eraObj = ERAS.find(e => e.id === node.dataset.era);
      const evObj = eraObj?.events.find(e => e.id === node.dataset.id);
      if (evObj && eraObj)
        document.getElementById('tl-infobar').textContent =
          `${eraObj.name}  ›  ${evObj.name}  ·  ${evObj.date}`;
    });
    node.addEventListener('mouseleave', () => {
      if (!node.classList.contains('selected')) node.removeAttribute('filter');
      document.getElementById('tl-infobar').textContent = 'Hover or click any node to explore';
    });
  });

  // Jesus hub interaction
  const hubEl = svg.querySelector('.jesus-hub');
  if (hubEl) {
    hubEl.addEventListener('click', () => {
      svg.querySelectorAll('.ev-node').forEach(n => { n.removeAttribute('filter'); n.classList.remove('selected'); });
      dpOpenJesus();
    });
    hubEl.addEventListener('mouseenter', () => {
      document.getElementById('tl-infobar').textContent =
        'Jesus Christ  ·  The Alpha and Omega  ·  All Scripture points to and flows from Him';
    });
    hubEl.addEventListener('mouseleave', () => {
      document.getElementById('tl-infobar').textContent = 'Hover or click any node to explore';
    });
  }

  setupTLDrag();
  window._tlW = W;
}

function dpOpenJesus() {

  document.getElementById('dp-meta').textContent = 'The Center of All Scripture';
  document.getElementById('dp-meta').style.color = '#fbbf24';
  document.getElementById('dp-title').textContent = 'Jesus Christ';
  document.getElementById('dp-date').textContent = 'Eternal — born ~4 BC, crucified ~AD 33, risen and reigning';
  document.getElementById('dp-body').innerHTML = `
    <div class="dp-block">
      <div class="dp-block-title">The Word Incarnate</div>
      <div class="dp-quote">In the beginning was the Word, and the Word was with God, and the Word was God... And the Word became flesh and dwelt among us. — John 1:1, 14</div>
    </div>
    <div class="dp-block">
      <div class="dp-block-title">The Scarlet Thread</div>
      <div class="dp-text">Every era on this timeline — from Creation to New Creation — finds its meaning in Jesus Christ. The Old Testament anticipates Him through promise, prophecy, and type. The Gospels reveal Him. The Epistles explain Him. Revelation glorifies Him as King of Kings. He is the Second Adam, the true Passover Lamb, the Son of David, the Suffering Servant, the Son of Man, and the eternal High Priest.</div>
    </div>
    <div class="dp-block">
      <div class="dp-block-title">He fulfills every thread</div>
      <div class="dp-chips">
        <span class="dp-chip">Second Adam</span>
        <span class="dp-chip">Seed of Abraham</span>
        <span class="dp-chip">Greater Moses</span>
        <span class="dp-chip">True Passover</span>
        <span class="dp-chip">Son of David</span>
        <span class="dp-chip">True Temple</span>
        <span class="dp-chip">Isaiah's Servant</span>
        <span class="dp-chip">New Covenant</span>
        <span class="dp-chip">Son of Man</span>
        <span class="dp-chip">Eternal Priest</span>
        <span class="dp-chip">Lamb of God</span>
        <span class="dp-chip">King of Kings</span>
      </div>
    </div>
    <div class="dp-block">
      <div class="dp-block-title">All promises find their Yes in Him</div>
      <div class="dp-quote">For no matter how many promises God has made, they are "Yes" in Christ. — 2 Corinthians 1:20</div>
    </div>
  `;
  document.getElementById('dp').classList.add('open');
}

function setupTLDrag() {
  const scr = document.getElementById('tl-scroll');
  scr.onmousedown = e => { tlDrag = true; tlDragX = e.clientX; tlScrollX = scr.scrollLeft; };
  scr.onmousemove = e => { if (tlDrag) scr.scrollLeft = tlScrollX - (e.clientX - tlDragX); };
  scr.onmouseup = scr.onmouseleave = () => tlDrag = false;
  scr.onwheel = e => { e.preventDefault(); scr.scrollLeft += e.deltaY * 2.5; };
}

function tlZoom(dir) {
  if (dir === 0) svgScale = 1;
  else svgScale = Math.min(2.5, Math.max(0.5, svgScale + dir * 0.2));
  const svg = document.getElementById('tl-svg');
  svg.style.transform = `scaleX(${svgScale})`;
  svg.style.transformOrigin = 'left center';
}

function tlSearch(q) {
  q = q.toLowerCase();
  const svg = document.getElementById('tl-svg');
  svg.querySelectorAll('.ev-node').forEach(node => {
    const era = ERAS.find(e => e.id === node.dataset.era);
    const ev = era?.events.find(e => e.id === node.dataset.id);
    if (!ev) return;
    const hay = (ev.name + ' ' + (ev.people || []).join(' ') + ' ' + (ev.desc || '')).toLowerCase();
    const ok = !q || hay.includes(q);
    node.style.opacity = ok ? '1' : '0.12';
    const conn = svg.querySelector(`.ev-conn[data-id="${ev.id}"]`);
    const lbl = svg.querySelector(`.ev-lbl[data-id="${ev.id}"]`);
    if (conn) conn.style.opacity = ok ? '.3' : '.04';
    if (lbl) lbl.style.opacity = ok ? '1' : '.12';
  });
}

function tlFilter(btn, f) {
  document.querySelectorAll('.f-btn').forEach(b => b.classList.remove('on'));
  btn.classList.add('on');
  activeFilter = f;
  const svg = document.getElementById('tl-svg');
  svg.querySelectorAll('.ev-node').forEach(node => {
    const tags = (node.dataset.tags || '').split(',');
    const ok = f === 'all' || tags.includes(f);
    node.style.opacity = ok ? '1' : '0.1';
    const conn = svg.querySelector(`.ev-conn[data-id="${node.dataset.id}"]`);
    const lbl = svg.querySelector(`.ev-lbl[data-id="${node.dataset.id}"]`);
    if (conn) conn.style.opacity = ok ? '.3' : '.03';
    if (lbl) lbl.style.opacity = ok ? '1' : '.1';
  });
}

/* =========================================================
   DETAIL PANEL
   ========================================================= */
function dpOpen(ev, era) {
  document.getElementById('dp-era-bar').style.background = era.color;
  document.getElementById('dp-meta').textContent = era.name + ' · ' + era.period;
  document.getElementById('dp-meta').style.color = era.color;
  document.getElementById('dp-title').textContent = ev.name;
  document.getElementById('dp-date').textContent = ev.date;
  const body = document.getElementById('dp-body');
  body.innerHTML = `
    <div class="dp-block">
      <div class="dp-block-title">Scripture</div>
      <div class="dp-quote">${ev.scripture}</div>
    </div>
    <div class="dp-block">
      <div class="dp-block-title">Overview</div>
      <div class="dp-text">${ev.desc}</div>
    </div>
    ${ev.significance ? `<div class="dp-block">
      <div class="dp-block-title">Significance</div>
      <div class="dp-text">${ev.significance}</div>
    </div>` : ''}
    ${ev.people?.length ? `<div class="dp-block">
      <div class="dp-block-title">Key People</div>
      <div class="dp-chips">${ev.people.map(p => `<span class="dp-chip">${p}</span>`).join('')}</div>
    </div>` : ''}
  `;
  document.getElementById('dp').classList.add('open');
}
function dpClose() {
  document.getElementById('dp').classList.remove('open');
  document.getElementById('tl-svg').querySelectorAll('.ev-node').forEach(n => {
    n.removeAttribute('filter'); n.classList.remove('selected');
  });
  selectedEvId = null;
}

/* =========================================================
   PAUL'S JOURNEYS MAP
   ========================================================= */
let map = null, jKey = 'first', jLayers = {}, jMarkers = {}, jRoutes = {};
let jPlaying = false, jStep = 0, jTimer = null;
const jSpeeds = [0.5, 1, 2, 4]; let jSpeedIdx = 1;

function initMap() {
  if (map) { setTimeout(() => map.invalidateSize(), 60); return; }
  map = L.map('j-map', { center: [35, 26], zoom: 5 });
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '&copy; OpenStreetMap', maxZoom: 18
  }).addTo(map);

  Object.keys(JOURNEYS).forEach(jk => {
    const j = JOURNEYS[jk];
    jLayers[jk] = L.layerGroup();
    jMarkers[jk] = j.waypoints.map((wp, i) => {
      const icon = L.divIcon({
        className: '',
        html: `<div style="width:26px;height:26px;background:${j.color};border:2.5px solid #fff;border-radius:50%;
                            display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;
                            color:#fff;box-shadow:0 2px 8px rgba(0,0,0,.4)">${i + 1}</div>`,
        iconSize: [26, 26], iconAnchor: [13, 13]
      });
      const m = L.marker([wp.coords[1], wp.coords[0]], { icon }).bindPopup(`
        <div class="lp">
          <h4>${wp.name}</h4>
          <div class="lp-ref">${wp.ref} &middot; ${j.year}</div>
          <div class="lp-ev">${wp.events}</div>
          <div class="lp-loc">${wp.modern}</div>
        </div>`, { maxWidth: 270 });
      jLayers[jk].addLayer(m);
      return m;
    });
  });
  jSelect('first');
}

function jSelect(jk) {
  jStop();
  Object.values(jLayers).forEach(l => { try { map.removeLayer(l); } catch(e){} });
  Object.values(jRoutes).forEach(l => { try { map.removeLayer(l); } catch(e){} });
  jKey = jk; jStep = 0;
  document.getElementById('j-prog').style.width = '0%';
  jLayers[jk].addTo(map);
  document.querySelectorAll('.j-btn').forEach(b => {
    const active = b.dataset.jk === jk;
    b.classList.toggle('on', active);
    b.style.background = active ? JOURNEYS[jk].color : '';
    b.style.borderColor = active ? JOURNEYS[jk].color : '';
  });
  renderJInfo();
  const j = JOURNEYS[jk];
  map.fitBounds(L.latLngBounds(j.waypoints.map(wp => [wp.coords[1], wp.coords[0]])), { padding: [40, 40] });
}

function renderJInfo() {
  const j = JOURNEYS[jKey];
  document.getElementById('j-info').innerHTML = `
    <h3 style="color:${j.color};margin-bottom:3px">${j.name}</h3>
    <p style="font-size:.75rem;color:var(--text2);margin-bottom:4px">${j.year} &middot; ${j.scripture}</p>
    <p>${j.desc}</p>
    <div class="wp-list">${j.waypoints.map((wp, i) => `
      <div class="wp" data-i="${i}" onclick="jFlyTo(${i})">
        <div class="wp-num" style="background:${j.color}">${i + 1}</div>
        <span>${wp.name}</span>
      </div>`).join('')}
    </div>`;
}

function jFlyTo(i) {
  const j = JOURNEYS[jKey];
  const wp = j.waypoints[i];
  map.flyTo([wp.coords[1], wp.coords[0]], 7, { duration: 1.1 });
  setTimeout(() => jMarkers[jKey][i].openPopup(), 1200);
  document.querySelectorAll('.wp').forEach((el, idx) => el.classList.toggle('cur', idx === i));
}

function jTogglePlay() {
  jPlaying ? jStop() : jStart();
}
function jStart() {
  jPlaying = true;
  document.getElementById('j-play-btn').innerHTML = '&#9646;&#9646; Pause';
  if (jStep === 0) jClearRoute();
  jAnimate();
}
function jStop() {
  jPlaying = false;
  if (jTimer) clearTimeout(jTimer);
  document.getElementById('j-play-btn').innerHTML = '&#9654; Animate Route';
}
function jClearRoute() {
  if (jRoutes[jKey]) { try { map.removeLayer(jRoutes[jKey]); } catch(e){} }
}
function jAnimate() {
  if (!jPlaying) return;
  const j = JOURNEYS[jKey];
  const total = j.waypoints.length;
  if (jStep >= total - 1) { jStop(); document.getElementById('j-prog').style.width = '100%'; return; }
  jFlyTo(jStep);
  document.getElementById('j-prog').style.width = ((jStep / (total - 1)) * 100) + '%';
  if (jStep > 0) {
    jClearRoute();
    const pts = j.waypoints.slice(0, jStep + 1).map(wp => [wp.coords[1], wp.coords[0]]);
    jRoutes[jKey] = L.polyline(pts, { color: j.color, weight: 3, opacity: .8, dashArray: '8,5' }).addTo(map);
  }
  jStep++;
  jTimer = setTimeout(jAnimate, 2600 / jSpeeds[jSpeedIdx]);
}
function jRewind() {
  jStop(); jStep = 0; jClearRoute();
  document.getElementById('j-prog').style.width = '0%';
  document.querySelectorAll('.wp').forEach(el => el.classList.remove('cur'));
  const j = JOURNEYS[jKey];
  map.fitBounds(L.latLngBounds(j.waypoints.map(wp => [wp.coords[1], wp.coords[0]])), { padding: [40, 40] });
}
function jCycleSpeed() {
  jSpeedIdx = (jSpeedIdx + 1) % jSpeeds.length;
  document.getElementById('j-speed-btn').textContent = jSpeeds[jSpeedIdx] + '×';
}
function jSeek(e) {
  const pct = e.offsetX / e.currentTarget.offsetWidth;
  const j = JOURNEYS[jKey];
  jStep = Math.floor(pct * (j.waypoints.length - 1));
  document.getElementById('j-prog').style.width = (pct * 100) + '%';
  jFlyTo(jStep); jStop();
}

function buildJBtns() {
  const c = document.getElementById('j-btns');
  Object.keys(JOURNEYS).forEach(jk => {
    const j = JOURNEYS[jk];
    const btn = document.createElement('button');
    btn.className = 'j-btn'; btn.dataset.jk = jk;
    btn.innerHTML = `<span class="j-dot" style="background:${j.color}"></span>
      ${j.name}<small>${j.year}</small>`;
    btn.onclick = () => jSelect(jk);
    c.appendChild(btn);
  });
}

/* =========================================================
   TABS + THEME
   ========================================================= */
function switchTab(tab) {
  document.querySelectorAll('.module').forEach(m => m.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b.dataset.tab === tab));
  document.getElementById('mod-' + tab).classList.add('active');
  if (tab === 'journeys') { setTimeout(initMap, 80); }
  if (tab === 'timeline') dpClose();
}

function toggleTheme() {
  const html = document.documentElement;
  const light = html.getAttribute('data-theme') === 'light';
  html.setAttribute('data-theme', light ? 'dark' : 'light');
  document.getElementById('theme-btn').textContent = light ? 'AA' : 'AA';
}

/* =========================================================
   INIT
   ========================================================= */
buildSVG();
buildJBtns();
</script>
