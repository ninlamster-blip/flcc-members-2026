<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Member List — FLCC</title>
<meta name="description" content="Send your church's member list to the FLCC admin." />

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Geist:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone@7.23.9/babel.min.js"></script>

<!-- Which church this list belongs to. -->
<script src="./church.js"></script>
<script>document.title = window.FLCC.short + ' — Member List';</script>

<style>
  :root {
    --bg:#F8F7F2; --surface:#FFFFFF; --ink:#1A1A1E; --ink-2:#3D3D44; --ink-3:#6E6E78; --ink-4:#A8A8B3;
    --border:#E8E6DF; --border-2:#D5D2C8;
    --accent:#A33B2A; --accent-hover:#7E2D1F;
    --success:#16A34A; --success-soft:#DCFCE7;
    --warning:#D97706; --warning-soft:#FEF3C7;
    --danger:#DC2626;
  }
  *{box-sizing:border-box;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;}
  html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'Geist',ui-sans-serif,system-ui,sans-serif;}
  .font-display{font-family:'Fraunces',Georgia,serif;letter-spacing:-.01em;}

  .wrap{max-width:640px;margin:0 auto;padding:1.75rem 1.125rem 5rem;}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:1.125rem;margin-bottom:1rem;}
  .eyebrow{font-size:.6875rem;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-4);}

  .field-label{font-size:.6rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-4);margin-bottom:4px;}
  .field-input{width:100%;background:var(--bg);border:1.5px solid var(--border);border-radius:10px;padding:.5rem .7rem;font-size:.9375rem;color:var(--ink);font-family:'Geist',sans-serif;transition:border-color .15s,box-shadow .15s,background .15s;outline:none;}
  .field-input:focus{border-color:var(--accent);background:var(--surface);box-shadow:0 0 0 3px rgba(163,59,42,.12);}
  textarea.field-input{min-height:120px;resize:vertical;line-height:1.6;}

  .btn{display:inline-flex;align-items:center;justify-content:center;gap:.45rem;padding:.55rem 1rem;border-radius:10px;font-size:.875rem;font-weight:600;border:1.5px solid transparent;cursor:pointer;transition:all .18s;white-space:nowrap;font-family:'Geist',sans-serif;}
  .btn:active{transform:scale(.97);}
  .btn:disabled{opacity:.45;cursor:not-allowed;}
  .btn-accent{background:var(--accent);color:#fff;}
  .btn-accent:hover:not(:disabled){background:var(--accent-hover);}
  .btn-ghost{background:transparent;color:var(--ink-2);border-color:var(--border-2);}
  .btn-ghost:hover:not(:disabled){background:var(--bg);}
  .btn-ok{background:var(--success);color:#fff;}

  .row{display:flex;align-items:center;gap:.4rem;padding:.5rem 0;border-bottom:1px solid var(--border);}
  .row:last-child{border-bottom:none;}
  .pill{display:inline-flex;align-items:center;padding:.15rem .5rem;border-radius:999px;font-size:.6875rem;font-weight:600;background:var(--bg);color:var(--ink-3);border:1px solid var(--border);}
  .link-btn{background:none;border:none;padding:0;cursor:pointer;font:inherit;color:var(--accent);text-decoration:underline;}
  .muted{color:var(--ink-3);font-size:.8125rem;line-height:1.6;}
  .subtle{color:var(--ink-4);font-size:.75rem;line-height:1.55;}
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel" data-presets="react">
const { useState, useEffect, useMemo, useRef } = React;

const CHURCH    = window.FLCC;
const DRAFT_KEY = CHURCH.key('flcc-roster-draft-v1');

// The titles used across the existing rosters. "Fam." marks a couple or family
// counted as one unit, which data.json already models as type: 'family'.
const TITLES = ['Bro.', 'Sis.', 'Ptr.', 'Ptra.', 'Rev.', 'Fam.', ''];

// data.json ids are readable and grouped by title — sis-01, bro-04, ptr-01.
// ptr-01 and ptr-02 are meaningful to the app: it shows those two as the
// church's pastors, so listing pastors first in that order is worth doing.
const ID_PREFIX = { 'Bro.': 'bro', 'Sis.': 'sis', 'Ptr.': 'ptr', 'Ptra.': 'ptra', 'Rev.': 'rev', 'Fam.': 'fam', '': 'mem' };

const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];

// Birthdays are stored the way data.json stores them: "MM-DD", no year.
const bMonth = v => (v || '').split('-')[0] || '';
const bDay   = v => (v || '').split('-')[1] || '';
const setMonth = (v, m) => m ? `${m}-${bDay(v) || '01'}` : '';
const setDay   = (v, d) => bMonth(v) ? `${bMonth(v)}-${d || '01'}` : '';

function parseLine(line) {
  const text = line.trim().replace(/^[-•*\d.)\s]+/, '').trim();
  if (!text) return null;
  for (const t of TITLES) {
    if (t && text.toLowerCase().startsWith(t.toLowerCase())) {
      return { title: t, name: text.slice(t.length).trim(), birthday: '' };
    }
  }
  // "Pastor Juan" / "Sister Maria" — spelled out rather than abbreviated.
  const spelled = [['pastora ','Ptra.'],['pastor ','Ptr.'],['reverend ','Rev.'],['brother ','Bro.'],['sister ','Sis.'],['family ','Fam.']];
  for (const [word, title] of spelled) {
    if (text.toLowerCase().startsWith(word)) return { title, name: text.slice(word.length).trim(), birthday: '' };
  }
  return { title: '', name: text, birthday: '' };
}

function loadDraft() {
  try { const d = JSON.parse(localStorage.getItem(DRAFT_KEY) || 'null'); return Array.isArray(d?.people) ? d : null; } catch (e) { return null; }
}
function saveDraft(people, contact) {
  try { localStorage.setItem(DRAFT_KEY, JSON.stringify({ people, contact, savedAt: new Date().toISOString() })); } catch (e) {}
}

/** The workers[] array as data.json wants it. Roles are left empty on purpose —
 *  the admin assigns who can take which service role in the schedule editor. */
function buildWorkers(people) {
  const counters = {};
  return people.filter(p => p.name.trim()).map(p => {
    const prefix = ID_PREFIX[p.title] || 'mem';
    counters[prefix] = (counters[prefix] || 0) + 1;
    return {
      id: `${prefix}-${String(counters[prefix]).padStart(2, '0')}`,
      name: p.name.trim(),
      title: p.title,
      type: p.title === 'Fam.' ? 'family' : 'individual',
      eligibleRoles: [],
      status: 'active',
      birthday: p.birthday || '',
    };
  });
}

function App() {
  const draft = useRef(loadDraft()).current;
  const [people, setPeople]   = useState(() => draft?.people || []);
  const [contact, setContact] = useState(() => draft?.contact || { name: '', phone: '' });
  const [bulk, setBulk]       = useState('');
  const [title, setTitle]     = useState('');
  const [name, setName]       = useState('');
  const [copied, setCopied]   = useState('');

  useEffect(() => { saveDraft(people, contact); }, [people, contact]);

  const workers = useMemo(() => buildWorkers(people), [people]);

  const addOne = () => {
    if (!name.trim()) return;
    setPeople(p => [...p, { title, name: name.trim(), birthday: '' }]);
    setName('');
  };

  const addBulk = () => {
    const parsed = bulk.split('\n').map(parseLine).filter(Boolean);
    if (!parsed.length) return;
    setPeople(p => [...p, ...parsed]);
    setBulk('');
  };

  const update = (i, patch) => setPeople(p => p.map((x, j) => j === i ? { ...x, ...patch } : x));
  const remove = (i) => setPeople(p => p.filter((_, j) => j !== i));

  const asText = () => {
    const lines = [
      `${CHURCH.name} — Member List`,
      `${people.length} member${people.length === 1 ? '' : 's'}`,
      contact.name ? `Submitted by: ${contact.name}${contact.phone ? ' · ' + contact.phone : ''}` : '',
      '',
      ...people.filter(p => p.name.trim()).map((p, i) =>
        `${i + 1}. ${[p.title, p.name].filter(Boolean).join(' ')}${p.birthday ? ` (birthday ${p.birthday})` : ''}`),
    ].filter(l => l !== null);
    return lines.join('\n');
  };

  const asJSON = () => JSON.stringify({
    church: CHURCH.slug,
    churchName: CHURCH.name,
    submittedBy: contact,
    submittedAt: new Date().toISOString(),
    workers,
  }, null, 2);

  const copy = (what, text) => {
    navigator.clipboard.writeText(text)
      .then(() => { setCopied(what); setTimeout(() => setCopied(''), 2200); })
      .catch(() => alert('Copy failed — select the text and copy it manually.'));
  };

  const download = () => {
    const blob = new Blob([asJSON()], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = `${CHURCH.slug}-members.json`; a.click();
    URL.revokeObjectURL(url);
  };

  const ready = people.some(p => p.name.trim());

  return (
    <div className="wrap">
      <header style={{ marginBottom: '1.25rem' }}>
        <div style={{ display: 'flex', alignItems: 'center', gap: 8, marginBottom: 4 }}>
          <span style={{ flex: 'none', width: 11, height: 11, borderRadius: '50%', background: CHURCH.accent }} />
          <span className="eyebrow">{CHURCH.name}</span>
        </div>
        <h1 className="font-display" style={{ margin: '0 0 .375rem', fontSize: '1.75rem', fontWeight: 600 }}>Member List</h1>
        <p className="muted" style={{ margin: 0 }}>
          List everyone who serves or attends regularly. Send it back to your FLCC admin and they'll load it into
          the app — after that your church's schedule and attendance work like everyone else's.
        </p>
      </header>

      {/* Add one at a time */}
      <div className="card">
        <div className="eyebrow" style={{ marginBottom: '.625rem' }}>Add a member</div>
        <div style={{ display: 'flex', gap: '.5rem', marginBottom: '.5rem' }}>
          <select className="field-input" style={{ width: 92, flex: 'none' }} value={title} onChange={e => setTitle(e.target.value)}>
            {TITLES.map(t => <option key={t || 'none'} value={t}>{t || '—'}</option>)}
          </select>
          <input
            className="field-input" placeholder="Full name" value={name}
            onChange={e => setName(e.target.value)}
            onKeyDown={e => e.key === 'Enter' && addOne()}
          />
          <button className="btn btn-accent" style={{ flex: 'none' }} onClick={addOne} disabled={!name.trim()}>Add</button>
        </div>
        <div className="subtle">Use <strong>Fam.</strong> for a couple or family counted as one.</div>
      </div>

      {/* Or paste the whole list */}
      <div className="card">
        <div className="eyebrow" style={{ marginBottom: '.625rem' }}>Or paste your whole list</div>
        <textarea
          className="field-input"
          placeholder={'One name per line, for example:\n\nPtr. Juan Dela Cruz\nSis. Maria Santos\nBro. Allen Reyes\nFam. Gomez'}
          value={bulk} onChange={e => setBulk(e.target.value)}
        />
        <div style={{ display: 'flex', alignItems: 'center', gap: '.625rem', marginTop: '.625rem' }}>
          <button className="btn btn-accent" onClick={addBulk} disabled={!bulk.trim()}>Add these names</button>
          <span className="subtle">Bro./Sis./Ptr. at the start of a line is picked up automatically.</span>
        </div>
      </div>

      {/* The list so far */}
      <div className="card">
        <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', marginBottom: '.625rem' }}>
          <div className="eyebrow">Your list</div>
          <span className="pill">{people.length} {people.length === 1 ? 'member' : 'members'}</span>
        </div>

        {people.length === 0 ? (
          <div className="muted" style={{ padding: '1rem 0', textAlign: 'center' }}>
            No one added yet. Start above — your list is saved on this device as you go.
          </div>
        ) : people.map((p, i) => (
          <div className="row" key={i}>
            <select className="field-input" style={{ width: 70, flex: 'none', padding: '.3rem .3rem', fontSize: '.8125rem' }}
              value={p.title} onChange={e => update(i, { title: e.target.value })} title="Title">
              {TITLES.map(t => <option key={t || 'none'} value={t}>{t || '—'}</option>)}
            </select>
            <input className="field-input" style={{ flex: 1, minWidth: 0, padding: '.3rem .5rem', fontSize: '.875rem' }}
              value={p.name} onChange={e => update(i, { name: e.target.value })} />
            {/* Birthday is optional and split in two — one 372-option list per
                row adds up fast on a long roster and a cheap phone. */}
            <select className="field-input" style={{ width: 54, flex: 'none', padding: '.3rem .15rem', fontSize: '.75rem' }}
              value={bMonth(p.birthday)} onChange={e => update(i, { birthday: setMonth(p.birthday, e.target.value) })} title="Birth month">
              <option value="">🎂</option>
              {MONTHS.map((m, mi) => <option key={m} value={String(mi + 1).padStart(2, '0')}>{m.slice(0, 3)}</option>)}
            </select>
            <select className="field-input" style={{ width: 46, flex: 'none', padding: '.3rem .15rem', fontSize: '.75rem' }}
              value={bDay(p.birthday)} onChange={e => update(i, { birthday: setDay(p.birthday, e.target.value) })}
              title="Birth day" disabled={!bMonth(p.birthday)}>
              <option value="">–</option>
              {Array.from({ length: 31 }, (_, di) => <option key={di} value={String(di + 1).padStart(2, '0')}>{di + 1}</option>)}
            </select>
            <button className="link-btn" style={{ color: 'var(--ink-4)', textDecoration: 'none', fontSize: '1.125rem' }}
              onClick={() => remove(i)} title="Remove">×</button>
          </div>
        ))}
      </div>

      {/* Who's sending it */}
      <div className="card">
        <div className="eyebrow" style={{ marginBottom: '.625rem' }}>Who is sending this</div>
        <div style={{ display: 'flex', gap: '.5rem' }}>
          <input className="field-input" placeholder="Your name" value={contact.name}
            onChange={e => setContact(c => ({ ...c, name: e.target.value }))} />
          <input className="field-input" placeholder="Phone / WhatsApp" value={contact.phone}
            onChange={e => setContact(c => ({ ...c, phone: e.target.value }))} />
        </div>
        <div className="subtle" style={{ marginTop: '.5rem' }}>
          So the admin knows who to ask if something needs checking.
        </div>
      </div>

      {/* Send it */}
      <div className="card" style={{ borderColor: 'var(--accent)' }}>
        <div className="eyebrow" style={{ color: 'var(--accent)', marginBottom: '.375rem' }}>Send to your admin</div>
        <p className="muted" style={{ marginTop: 0 }}>
          Either one works — pick whichever is easier for you.
        </p>
        <div style={{ display: 'grid', gap: '.5rem' }}>
          <button className={`btn ${copied === 'text' ? 'btn-ok' : 'btn-accent'}`} disabled={!ready}
            onClick={() => copy('text', asText())}>
            {copied === 'text' ? '✓ Copied — now paste it in your message' : '📋 Copy the list (paste into WhatsApp)'}
          </button>
          <button className="btn btn-ghost" disabled={!ready} onClick={download}>
            ↓ Download the file and send it
          </button>
        </div>
        {!ready && <div className="subtle" style={{ marginTop: '.5rem' }}>Add at least one name first.</div>}
      </div>

      <p className="subtle" style={{ textAlign: 'center' }}>
        Nothing is sent anywhere on its own — your list stays on this device until you send it.
        Service roles are assigned by the admin afterwards.
      </p>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
