<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>FLCC Attendance — Steward Dashboard</title>
<meta name="description" content="Private attendance steward app for FLCC - Farwaniya 1" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Geist:wght@300;400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">

<script src="https://cdn.tailwindcss.com"></script>
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

<style>
  :root {
    --bg: #FAFAF5; --surface: #FFFFFF;
    --ink: #18181B; --ink-muted: #52525B; --ink-subtle: #A1A1AA;
    --border: #E7E5DE; --border-strong: #D4D4D0;
    --accent: #0284C7; --accent-hover: #0369A1;
    --accent-soft: #E0F2FE; --accent-tint: #F0F9FF;
    --present: #16A34A; --present-soft: #F0FDF4; --present-ring: #BBF7D0;
    --late: #D97706; --late-soft: #FFFBEB; --late-ring: #FDE68A;
    --absent: #DC2626; --absent-soft: #FFF1F2; --absent-ring: #FECDD3;
    --danger: #B91C1C; --danger-soft: #FEE2E2;
    --safe-bottom: env(safe-area-inset-bottom, 0px);
  }
  * { -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; box-sizing: border-box; }
  html, body { background: var(--bg); color: var(--ink); margin: 0; overscroll-behavior: none; }
  body { font-family: 'Geist', ui-sans-serif, system-ui, sans-serif; }
  .font-display { font-family: 'Fraunces', Georgia, serif; letter-spacing: -0.01em; }
  .font-mono { font-family: 'Geist Mono', ui-monospace, monospace; }
  .ink-muted { color: var(--ink-muted); } .ink-subtle { color: var(--ink-subtle); }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; }

  .btn { display: inline-flex; align-items: center; gap: 0.5rem; padding: 0.5rem 0.875rem; border-radius: 8px; font-size: 0.875rem; font-weight: 500; transition: all 0.15s; border: 1px solid transparent; cursor: pointer; white-space: nowrap; }
  .btn-primary { background: var(--ink); color: white; } .btn-primary:hover { background: #27272A; }
  .btn-accent  { background: var(--accent); color: white; } .btn-accent:hover { background: var(--accent-hover); }
  .btn-ghost   { background: transparent; color: var(--ink); border-color: var(--border); } .btn-ghost:hover { background: var(--bg); }
  .btn-soft    { background: #F4F4F0; color: var(--ink); } .btn-soft:hover { background: #EDEDE7; }
  .btn-danger  { background: var(--danger-soft); color: var(--danger); border: none; }

  .input, .select, .textarea {
    width: 100%; padding: 0.5rem 0.75rem; background: var(--surface);
    border: 1px solid var(--border); border-radius: 8px; font-size: 0.875rem;
    color: var(--ink); font-family: 'Geist', sans-serif;
    transition: border-color 0.15s, box-shadow 0.15s;
  }
  .input:focus, .select:focus, .textarea:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px rgba(2,132,199,0.1); }
  .textarea { resize: vertical; }

  .tab { padding: 0.625rem 0; font-size: 0.8125rem; font-weight: 500; color: var(--ink-muted); border-bottom: 2px solid transparent; cursor: pointer; margin-right: 1.25rem; white-space: nowrap; background: none; border-top: none; border-left: none; border-right: none; flex-shrink: 0; transition: color .15s; }
  .tab:hover { color: var(--ink); }
  .tab-active { color: var(--ink); border-bottom-color: var(--accent); }

  .pill { display: inline-flex; align-items: center; padding: 0.125rem 0.625rem; border-radius: 999px; font-size: 0.75rem; font-weight: 500; }

  .modal-backdrop { position: fixed; inset: 0; background: rgba(24,24,27,0.45); backdrop-filter: blur(6px); display: flex; align-items: flex-end; justify-content: center; z-index: 50; }
  @media (min-width: 600px) { .modal-backdrop { align-items: center; } }
  .modal { background: var(--surface); border-radius: 20px 20px 0 0; max-width: 560px; width: 100%; max-height: 88vh; overflow-y: auto; box-shadow: 0 -8px 40px rgba(0,0,0,.14); animation: slideUp .32s cubic-bezier(.32,.72,0,1) both; }
  @media (min-width: 600px) { .modal { border-radius: 16px; animation: fadeScale .24s cubic-bezier(.34,1.56,.64,1) both; } }
  @keyframes slideUp   { from{transform:translateY(100%)} to{transform:translateY(0)} }
  @keyframes fadeScale { from{opacity:0;transform:scale(.96) translateY(8px)} to{opacity:1;transform:scale(1) translateY(0)} }
  @keyframes fadeIn    { from{opacity:0;transform:translateY(4px)} to{opacity:1;transform:translateY(0)} }
  @keyframes slideDown { from{opacity:0;transform:translateY(-8px)} to{opacity:1;transform:translateY(0)} }
  .fade-in { animation: fadeIn .2s ease-out both; }

  /* Member card */
  .member-row { display: flex; align-items: center; gap: 12px; padding: 13px 16px; border-bottom: 1px solid var(--border); transition: background .18s ease; }
  .member-row:last-child { border-bottom: none; }
  .status-btn { width: 40px; height: 40px; border-radius: 10px; border: 2px solid transparent; cursor: pointer; font-size: 1rem; font-weight: 700; transition: all .18s cubic-bezier(.34,1.56,.64,1); display: flex; align-items: center; justify-content: center; flex-shrink: 0; -webkit-tap-highlight-color: transparent; }

  /* Bar chart */
  .bar-wrap { display: flex; align-items: flex-end; gap: 5px; height: 64px; }
  .bar-col { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px; }
  .bar { width: 100%; border-radius: 4px 4px 0 0; transition: height .4s ease; min-height: 2px; }
  .bar-label { font-size: 0.5625rem; color: var(--ink-subtle); text-align: center; font-family: 'Geist Mono', monospace; }

  /* Undo toast */
  .undo-toast { position: fixed; bottom: calc(90px + var(--safe-bottom)); left: 50%; transform: translateX(-50%); background: #1E293B; color: white; padding: 12px 18px; border-radius: 12px; display: flex; align-items: center; gap: 12px; box-shadow: 0 8px 32px rgba(0,0,0,.22); z-index: 60; white-space: nowrap; animation: fadeIn .22s cubic-bezier(.34,1.56,.64,1) both; }

  /* Sync status dot */
  .sync-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
  .sync-dot-ok   { background: #16A34A; }
  .sync-dot-pend { background: #F59E0B; }
  .sync-dot-err  { background: #DC2626; }

  /* Care flag */
  .care-card { padding: 12px 14px; border-radius: 12px; border-left: 3px solid #F59E0B; background: #FFFBEB; margin-bottom: 10px; animation: fadeIn .2s ease-out; }

  nav::-webkit-scrollbar { display: none; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel" data-presets="react">
const { useState, useEffect, useMemo, useReducer, useRef, useCallback } = React;

// ─── Constants ────────────────────────────────────────────────────────────────
const STORE_KEY   = 'flcc-attendance-v1';
const GH_TOKEN_KEY = 'flcc-gh-token-v1';
const GH_REPO     = 'ninlamster-blip/flcc-members-2026';
const GH_FILE     = 'attendance.json';
const DATA_URL    = './data.json';
const VERSION     = '1.0';
const ATT_ACCENT  = '#0284C7';

const STATUS_CFG = {
  present: { label: 'Present', emoji: '✓', color: '#16A34A', soft: '#F0FDF4', ring: '#BBF7D0' },
  absent:  { label: 'Absent',  emoji: '✗', color: '#DC2626', soft: '#FFF1F2', ring: '#FECDD3' },
};

const ROLE_MINISTRY = {
  preacher: 'Preaching', pastoralPrayer: 'Preaching',
  songLeader: 'Music / Worship', presider: 'Service',
  communionAssistant1: 'Communion', communionAssistant2: 'Communion',
  foodInCharge: 'Kitchen Ministry',
};

const SERVICE_TYPES = [
  { key: 'Friday',        label: 'Friday Service',   pastoralCare: true  },
  { key: 'Sunday',        label: 'Sunday Service',   pastoralCare: true  },
  { key: 'Thanksgiving',  label: 'Thanksgiving',     pastoralCare: false },
  { key: 'PrayerMeeting', label: 'Prayer Meeting',   pastoralCare: false },
  { key: 'Training',      label: 'Training',         pastoralCare: false },
  { key: 'Fellowship',    label: 'Fellowship',       pastoralCare: false },
  { key: 'MensService',   label: "Men's Service",    pastoralCare: false },
  { key: 'Special',       label: 'Special Service',  pastoralCare: false },
];

// Services that count for Pastoral Care flags — Friday and Sunday only
const PASTORAL_CARE_SERVICES = new Set(['Friday','Sunday']);

const GAS_TEMPLATE = `// ─── Paste this in Google Apps Script ───────────────────
// 1. Open script.google.com → New project
// 2. Paste this code
// 3. Replace SHEET_ID with your Google Sheet ID
// 4. Deploy → New deployment → Web app
//    Execute as: Me | Who has access: Anyone
// 5. Copy the deployment URL → paste in Settings

const SHEET_ID = 'YOUR_GOOGLE_SHEET_ID_HERE';

function doPost(e) {
  try {
    const data = JSON.parse(e.postData.contents);
    const ss = SpreadsheetApp.openById(SHEET_ID);
    if (data.action === 'logAttendance') {
      let sheet = ss.getSheetByName('Attendance_Log');
      if (!sheet) {
        sheet = ss.insertSheet('Attendance_Log');
        sheet.appendRow([
          'log_id','session_id','service_date','service_type',
          'member_id','member_name','ministry','attendance_status',
          'timestamp','recorded_by'
        ]);
      }
      const session = data.session;
      for (const r of (session.records || [])) {
        sheet.appendRow([
          Utilities.getUuid(), session.id,
          session.date, session.service,
          r.memberId, r.memberName || '',
          r.ministry || '', r.status,
          r.timestamp || '', session.recordedBy || ''
        ]);
      }
      return ContentService
        .createTextOutput(JSON.stringify({ success: true, synced: session.records.length }))
        .setMimeType(ContentService.MimeType.JSON);
    }
    return ContentService.createTextOutput(JSON.stringify({ error: 'Unknown action' })).setMimeType(ContentService.MimeType.JSON);
  } catch (err) {
    return ContentService.createTextOutput(JSON.stringify({ error: err.message })).setMimeType(ContentService.MimeType.JSON);
  }
}

function doGet(e) {
  return ContentService.createTextOutput('FLCC Attendance API is running.').setMimeType(ContentService.MimeType.TEXT);
}`;

// ─── Storage ──────────────────────────────────────────────────────────────────
function loadState() {
  try { return JSON.parse(localStorage.getItem(STORE_KEY) || 'null'); } catch { return null; }
}
function persistState(s) {
  try { localStorage.setItem(STORE_KEY, JSON.stringify(s)); } catch {}
}
function defaultState() {
  return {
    meta: { churchName: 'FLCC - Farwaniya 1', stewardName: '', gasUrl: '', lastSync: null },
    sessions: [],
    customMembers: [],
  };
}
function migrate(s) {
  if (!s) return null;
  if (!s.meta) s.meta = defaultState().meta;
  if (!s.sessions) s.sessions = [];
  if (!s.customMembers) s.customMembers = [];
  return s;
}

// ─── Helpers ──────────────────────────────────────────────────────────────────
function todayISO() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
function formatDateFull(s) {
  const [y,m,d] = s.split('-').map(Number);
  return new Date(y,m-1,d).toLocaleDateString('en-US', { weekday:'long', month:'long', day:'numeric', year:'numeric' });
}
function formatDateShort(s) {
  const [y,m,d] = s.split('-').map(Number);
  return new Date(y,m-1,d).toLocaleDateString('en-US', { month:'short', day:'numeric' });
}
function dayOfWeekStr(s) {
  const [y,m,d] = s.split('-').map(Number);
  return ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'][new Date(y,m-1,d).getDay()];
}
function uid() { return `a-${Date.now()}-${Math.random().toString(36).slice(2,6)}`; }

function deriveMinistry(worker) {
  for (const r of (worker.eligibleRoles || [])) if (ROLE_MINISTRY[r]) return ROLE_MINISTRY[r];
  return worker.type === 'family' ? 'Family' : 'Ministry';
}
function workerDisplay(w) { return w ? (w.title ? `${w.title} ${w.name}` : w.name) : ''; }

const AV_COLORS = ['#0284C7','#7C3AED','#BE123C','#0F766E','#B45309','#16A34A','#0369A1','#6D28D9'];
function avatarBg(name) { return AV_COLORS[(name||'?').charCodeAt(0) % AV_COLORS.length]; }
function getInitials(name) {
  const clean = (name||'').replace(/^(Bro\.|Sis\.|Ptr\.)\s*/i,'');
  const parts = clean.split(' ').filter(Boolean);
  return parts.length >= 2 ? (parts[0][0]+parts[parts.length-1][0]).toUpperCase() : (parts[0]||'?')[0].toUpperCase();
}

function getSessionSummary(session, totalMembers) {
  const recs    = session?.records || [];
  const present = recs.filter(r => r.status === 'present').length;
  const total   = totalMembers || session?.totalMembers || 0;
  const absent  = Math.max(0, total - present);
  return { present, absent, total };
}

function computeCareFlags(sessions, members) {
  // Pastoral care only applies to Friday and Sunday worship services
  const worshipSessions = [...sessions]
    .filter(s => PASTORAL_CARE_SERVICES.has(s.service))
    .sort((a,b) => b.date.localeCompare(a.date));
  const recent = worshipSessions.slice(0, 8);
  if (recent.length < 3) return [];
  return members.filter(w=>w.status==='active').reduce((flags,m)=>{
    const statuses = recent.map(s=>(s.records||[]).find(r=>r.memberId===m.id)?.status||null);
    let streak=0, maxStreak=0;
    for (const st of statuses) {
      if (st !== 'present') { streak++; maxStreak=Math.max(maxStreak,streak); }
      else streak=0;
    }
    if (maxStreak >= 3) {
      const lastPresent = recent.find(s=>(s.records||[]).find(r=>r.memberId===m.id)?.status==='present');
      const allWorshipSessions = worshipSessions.filter(s=>(s.records||[]).find(r=>r.memberId===m.id));
      const pct = allWorshipSessions.length
        ? Math.round(allWorshipSessions.filter(s=>(s.records||[]).find(r=>r.memberId===m.id)?.status==='present').length / allWorshipSessions.length * 100)
        : 0;
      const level = maxStreak >= 5 ? 'priority' : 'gentle';
      flags.push({
        member:        m,
        streak:        maxStreak,
        level,
        lastPresent:   lastPresent?.date || null,
        lastService:   lastPresent?.service || null,
        overallPct:    pct,
        totalSessions: allWorshipSessions.length,
      });
    }
    return flags;
  }, []).sort((a,b) => b.streak - a.streak);
}

function getMemberAttendancePct(memberId, sessions) {
  const relevant = sessions.filter(s=>(s.records||[]).find(r=>r.memberId===memberId));
  if (!relevant.length) return null;
  const present = relevant.filter(s=>{const r=(s.records||[]).find(x=>x.memberId===memberId);return r&&r.status!=='absent';}).length;
  return Math.round((present/relevant.length)*100);
}

function detectTodayService(schedule) {
  const today = todayISO();
  const dow   = dayOfWeekStr(today);
  const exact = (schedule||[]).find(s=>s.date===today);
  if (exact) return exact.service;
  if (dow === 'Friday')   return 'Friday';
  if (dow === 'Sunday')   return 'Sunday';
  // Auto-detect Thanksgiving — last Thursday of the month
  if (dow === 'Thursday') {
    const [y,m,d] = today.split('-').map(Number);
    // Check if next Thursday falls in a different month
    const nextThursday = new Date(y, m-1, d+7);
    if (nextThursday.getMonth() !== m-1) return 'Thanksgiving';
  }
  return null;
}

// ─── Reducer ──────────────────────────────────────────────────────────────────
function reducer(state, action) {
  let next;
  switch (action.type) {
    case 'UPSERT_SESSION': {
      const i = state.sessions.findIndex(s=>s.id===action.session.id);
      const sessions = i>=0
        ? state.sessions.map(s=>s.id===action.session.id?action.session:s)
        : [...state.sessions, action.session];
      next = { ...state, sessions };
      break;
    }
    case 'DELETE_SESSION':
      next = { ...state, sessions: state.sessions.filter(s=>s.id!==action.id) };
      break;
    case 'ADD_CUSTOM_MEMBER':
      next = { ...state, customMembers: [...state.customMembers, action.member] };
      break;
    case 'REMOVE_CUSTOM_MEMBER':
      next = { ...state, customMembers: state.customMembers.filter(m=>m.id!==action.id) };
      break;
    case 'UPDATE_META':
      next = { ...state, meta: { ...state.meta, ...action.payload } };
      break;
    case 'RESET':
      next = defaultState();
      break;
    default: return state;
  }
  persistState(next);
  return next;
}

// ─── UI Primitives ────────────────────────────────────────────────────────────
function Avatar({ name, size=40 }) {
  return (
    <div style={{ width:size, height:size, borderRadius:size/2, background:avatarBg(name), display:'flex', alignItems:'center', justifyContent:'center', color:'white', fontWeight:700, fontSize:size*0.34, flexShrink:0, letterSpacing:'.02em', userSelect:'none' }}>
      {getInitials(name)}
    </div>
  );
}

function SummaryBar({ summary }) {
  const { present, absent, total } = summary;
  const unrecorded = Math.max(0, total - present);
  return (
    <div style={{ display:'flex', gap:12, flexWrap:'wrap', fontSize:'0.8125rem', alignItems:'center' }}>
      <div style={{ display:'flex', alignItems:'center', gap:5 }}>
        <div style={{ width:8, height:8, borderRadius:2, background:'#16A34A', flexShrink:0 }}/>
        <span style={{ fontWeight:700, color:'#16A34A', fontSize:'1rem' }}>{present}</span>
        <span style={{ color:'var(--ink-muted)' }}>Present</span>
      </div>
      <div style={{ display:'flex', alignItems:'center', gap:5 }}>
        <div style={{ width:8, height:8, borderRadius:2, background:'#DC2626', flexShrink:0 }}/>
        <span style={{ fontWeight:700, color:'#DC2626', fontSize:'1rem' }}>{absent}</span>
        <span style={{ color:'var(--ink-muted)' }}>Absent</span>
      </div>
      {unrecorded > 0 && (
        <div style={{ display:'flex', alignItems:'center', gap:5 }}>
          <div style={{ width:8, height:8, borderRadius:2, background:'var(--ink-subtle)', flexShrink:0 }}/>
          <span style={{ fontWeight:600, color:'var(--ink-subtle)' }}>{unrecorded}</span>
          <span style={{ color:'var(--ink-subtle)' }}>not yet tapped</span>
        </div>
      )}
      {total > 0 && <div style={{ marginLeft:'auto', color:'var(--ink-subtle)', fontSize:'0.75rem' }}>{total} total</div>}
    </div>
  );
}

function BarChart({ bars, color='#0284C7' }) {
  const maxVal = Math.max(...bars.map(b=>b.value), 1);
  return (
    <div className="bar-wrap">
      {bars.map((b,i)=>(
        <div key={i} className="bar-col">
          <div className="bar" style={{ height:`${Math.max(2,(b.value/maxVal)*56)}px`, background: b.value===0?'var(--border)':color, opacity:b.value===0?.4:1 }}/>
          <div className="bar-label">{b.label}</div>
        </div>
      ))}
    </div>
  );
}

// ─── Member Card ──────────────────────────────────────────────────────────────
function MemberCard({ member, record, onStatus, isLastAction, onUndo }) {
  const isPresent = record?.status === 'present';

  const tap = () => {
    if (navigator.vibrate) navigator.vibrate(10);
    onStatus(member.id, isPresent ? null : 'present');
  };

  return (
    <div className="member-row" style={{ background: isPresent ? '#F0FDF4' : 'white' }}>
      <Avatar name={member.name} />
      <div style={{ flex:1, minWidth:0 }}>
        <div style={{ fontWeight:600, fontSize:'0.9375rem', overflow:'hidden', textOverflow:'ellipsis', whiteSpace:'nowrap' }}>{member.fullName || member.name}</div>
        <div style={{ fontSize:'0.75rem', color: isPresent ? '#15803D' : 'var(--ink-subtle)', marginTop:1 }}>
          {isPresent ? '✓ Present' : 'Not yet recorded'}
        </div>
      </div>
      {isLastAction && (
        <button onClick={onUndo} style={{ fontSize:'0.6875rem', color:ATT_ACCENT, background:'none', border:'none', cursor:'pointer', fontWeight:600, textDecoration:'underline', flexShrink:0, paddingRight:8 }}>Undo</button>
      )}
      <button
        onClick={tap}
        style={{
          width: 54, height: 54, borderRadius: 14,
          border: `2px solid ${isPresent ? '#16A34A' : '#D1D5DB'}`,
          background: isPresent ? '#16A34A' : '#F9FAFB',
          color: isPresent ? 'white' : '#9CA3AF',
          cursor: 'pointer',
          fontSize: isPresent ? '1.5rem' : '1.25rem',
          fontWeight: 700,
          transition: 'all .2s cubic-bezier(.34,1.56,.64,1)',
          transform: isPresent ? 'scale(1.08)' : 'scale(1)',
          flexShrink: 0,
          display: 'flex', alignItems: 'center', justifyContent: 'center',
          WebkitTapHighlightColor: 'transparent',
          boxShadow: isPresent ? '0 4px 14px rgba(22,163,74,0.35)' : 'none',
        }}
        aria-label={isPresent ? 'Mark absent' : 'Mark present'}
      >
        {isPresent ? '✓' : ''}
      </button>
    </div>
  );
}

// ─── TODAY TAB ────────────────────────────────────────────────────────────────
function TodayTab({ members, state, dispatch, schedule }) {
  const today = todayISO();
  const existing = state.sessions.find(s=>s.date===today);

  const [session,    setSession]    = useState(existing || null);
  const [search,     setSearch]     = useState('');
  const [filter,     setFilter]     = useState('all');
  const [lastAction, setLastAction] = useState(null);
  const [showPicker, setShowPicker] = useState(!existing);
  const [showAddVis, setShowAddVis] = useState(false);
  const undoTimer = useRef(null);

  const todayVisitors = state.customMembers.filter(m=>m.sessionDate===today||m.permanent);
  const allMembers = useMemo(()=>[...members,...todayVisitors],[members,todayVisitors]);

  // Auto-detect service
  const detectedService = useMemo(()=>detectTodayService(schedule),[schedule]);

  const startSession = serviceKey => {
    const svcLabel = SERVICE_TYPES.find(s=>s.key===serviceKey)?.label || serviceKey;
    const sess = {
      id: uid(), date: today, service: serviceKey, serviceLabel: svcLabel,
      recordedBy: state.meta.stewardName || 'Attendance Steward',
      createdAt: new Date().toISOString(),
      totalMembers: allMembers.length,
      records: [], synced: false,
    };
    setSession(sess);
    setShowPicker(false);
    dispatch({ type:'UPSERT_SESSION', session: sess });
  };

  const updateStatus = (memberId, newStatus) => {
    if (!session) return;
    const member  = allMembers.find(m => m.id === memberId);
    const prevRec = (session.records||[]).find(r => r.memberId === memberId);
    const prevSt  = prevRec?.status || null;

    const updatedRecs = newStatus === null
      ? session.records.filter(r => r.memberId !== memberId)
      : prevRec
        ? session.records.map(r => r.memberId === memberId ? { ...r, status: newStatus, timestamp: new Date().toISOString() } : r)
        : [...session.records, { memberId, memberName: member?.fullName || member?.name || '', ministry: member?.ministry || '', status: newStatus, timestamp: new Date().toISOString() }];

    const updated = { ...session, records: updatedRecs };
    setSession(updated);
    dispatch({ type:'UPSERT_SESSION', session: updated });

    if (undoTimer.current) clearTimeout(undoTimer.current);
    setLastAction({ memberId, memberName: member?.fullName || member?.name || '', prevStatus: prevSt, newStatus });
    undoTimer.current = setTimeout(() => setLastAction(null), 5000);
  };

  const handleUndo = () => {
    if (!lastAction) return;
    if (undoTimer.current) clearTimeout(undoTimer.current);
    const { memberId, prevStatus } = lastAction;
    const prevRec = (session.records||[]).find(r=>r.memberId===memberId);
    const updatedRecs = prevStatus===null
      ? session.records.filter(r=>r.memberId!==memberId)
      : prevRec
        ? session.records.map(r=>r.memberId===memberId?{...r,status:prevStatus}:r)
        : [...session.records,{memberId,memberName:lastAction.memberName,ministry:'',status:prevStatus,timestamp:new Date().toISOString()}];
    const updated = { ...session, records:updatedRecs };
    setSession(updated);
    dispatch({ type:'UPSERT_SESSION', session:updated });
    setLastAction(null);
  };

  const summary = useMemo(()=>getSessionSummary(session, allMembers.length),[session,allMembers]);

  const visibleMembers = useMemo(()=>{
    let list = allMembers;
    if (search.trim()) {
      const q = search.toLowerCase();
      list = list.filter(m=>(m.name||'').toLowerCase().includes(q)||(m.ministry||'').toLowerCase().includes(q));
    }
    if (filter !== 'all') {
      if (filter === 'present')    list = list.filter(m => (session?.records||[]).find(r => r.memberId === m.id)?.status === 'present');
      if (filter === 'unrecorded') list = list.filter(m => !(session?.records||[]).find(r => r.memberId === m.id && r.status === 'present'));
    }
    // Sort: unrecorded first, then by name
    return list.slice().sort((a,b)=>{
      const ar = (session?.records||[]).find(r=>r.memberId===a.id);
      const br = (session?.records||[]).find(r=>r.memberId===b.id);
      if (!ar && br) return -1; if (ar && !br) return 1;
      return a.name.localeCompare(b.name);
    });
  },[allMembers, search, filter, session]);

  if (showPicker) return (
    <div className="fade-in" style={{ padding:20 }}>
      <div className="font-display" style={{ fontSize:'1.75rem', fontWeight:600, marginBottom:6 }}>
        {formatDateFull(today)}
      </div>
      <p style={{ fontSize:'0.875rem', color:'var(--ink-muted)', marginBottom:20 }}>
        {detectedService ? `Auto-detected: ${SERVICE_TYPES.find(s=>s.key===detectedService)?.label}. Start this session or choose another.` : 'Choose the session type to begin recording attendance.'}
      </p>

      {/* Auto-detected */}
      {detectedService && (
        <button className="btn btn-accent" style={{ width:'100%', justifyContent:'center', padding:'14px', borderRadius:12, fontSize:'1rem', marginBottom:16 }} onClick={()=>startSession(detectedService)}>
          ▶ Start {SERVICE_TYPES.find(s=>s.key===detectedService)?.label}
        </button>
      )}

      {/* Worship services — Pastoral Care applies */}
      <div style={{ fontSize:'0.6rem', fontWeight:700, letterSpacing:'.1em', textTransform:'uppercase', color:'var(--ink-subtle)', marginBottom:8 }}>
        ✝️ Worship Services <span style={{ fontWeight:400, textTransform:'none', letterSpacing:'normal', fontSize:'0.6rem', color:ATT_ACCENT }}>— Pastoral Care applies</span>
      </div>
      <div style={{ display:'grid', gap:8, marginBottom:16 }}>
        {SERVICE_TYPES.filter(s=>s.pastoralCare && s.key!==detectedService).map(svc=>(
          <button key={svc.key} onClick={()=>startSession(svc.key)}
            style={{ padding:'12px 16px', borderRadius:12, border:`1.5px solid ${ATT_ACCENT}30`, background:ATT_ACCENT+'08', textAlign:'left', cursor:'pointer', fontSize:'0.9375rem', fontWeight:600, color:ATT_ACCENT, transition:'background .15s' }}
            onMouseEnter={e=>e.currentTarget.style.background=ATT_ACCENT+'18'}
            onMouseLeave={e=>e.currentTarget.style.background=ATT_ACCENT+'08'}>
            {svc.label}
          </button>
        ))}
      </div>

      {/* Other gatherings — no Pastoral Care */}
      <div style={{ fontSize:'0.6rem', fontWeight:700, letterSpacing:'.1em', textTransform:'uppercase', color:'var(--ink-subtle)', marginBottom:8 }}>
        🗓 Other Gatherings <span style={{ fontWeight:400, textTransform:'none', letterSpacing:'normal', fontSize:'0.6rem', color:'var(--ink-subtle)' }}>— no Pastoral Care flag</span>
      </div>
      <div style={{ display:'grid', gap:8 }}>
        {SERVICE_TYPES.filter(s=>!s.pastoralCare && s.key!==detectedService).map(svc=>(
          <button key={svc.key} onClick={()=>startSession(svc.key)}
            style={{ padding:'12px 16px', borderRadius:12, border:'1px solid var(--border)', background:'var(--surface)', textAlign:'left', cursor:'pointer', fontSize:'0.9375rem', fontWeight:500, transition:'background .15s' }}
            onMouseEnter={e=>e.currentTarget.style.background='#F4F4F0'}
            onMouseLeave={e=>e.currentTarget.style.background=''}>
            {svc.label}
          </button>
        ))}
      </div>

      {!state.meta.stewardName && (
        <div style={{ marginTop:20, padding:'12px 14px', borderRadius:10, background:'#FEF3C7', fontSize:'0.8125rem', color:'#92400E' }}>
          ⚠ Set your name in Settings so it's recorded with attendance.
        </div>
      )}
    </div>
  );

  return (
    <div style={{ display:'flex', flexDirection:'column', height:'calc(100vh - 120px)' }}>
      {/* Service header */}
      <div style={{ padding:'12px 16px', background:ATT_ACCENT+'10', borderBottom:'1px solid var(--border)', flexShrink:0 }}>
        <div style={{ display:'flex', alignItems:'flex-start', justifyContent:'space-between', gap:8, marginBottom:10 }}>
          <div>
            <div className="font-display" style={{ fontSize:'1.125rem', fontWeight:600 }}>{session?.serviceLabel}</div>
            <div style={{ fontSize:'0.8125rem', color:'var(--ink-muted)' }}>{formatDateFull(today)}</div>
            {/* Show whether this session counts for Pastoral Care */}
            {session && (
              PASTORAL_CARE_SERVICES.has(session.service)
                ? <div style={{ fontSize:'0.6875rem', color:ATT_ACCENT, fontWeight:500, marginTop:3 }}>✝️ Worship service · Pastoral Care applies</div>
                : <div style={{ fontSize:'0.6875rem', color:'var(--ink-subtle)', marginTop:3 }}>🗓 Other gathering · Pastoral Care not applicable</div>
            )}
          </div>
          <div style={{ display:'flex', gap:6 }}>
            <button className="btn btn-soft text-xs" onClick={()=>setShowAddVis(true)} style={{ padding:'5px 10px', fontSize:'0.75rem' }}>+ Visitor</button>
            <button className="btn btn-soft text-xs" onClick={()=>setShowPicker(true)} style={{ padding:'5px 10px', fontSize:'0.75rem' }}>Change</button>
          </div>
        </div>
        <SummaryBar summary={summary} />
      </div>

      {/* Search + filter */}
      <div style={{ padding:'10px 14px', borderBottom:'1px solid var(--border)', flexShrink:0 }}>
        <input className="input" value={search} onChange={e=>setSearch(e.target.value)} placeholder="Search members…" style={{ marginBottom:8 }} />
        <div style={{ display:'flex', gap:6, overflowX:'auto', scrollbarWidth:'none' }}>
          {[
            { k:'all',       l:'All' },
            { k:'present',   l:'✓ Present' },
            { k:'unrecorded',l:'Not yet tapped' },
          ].map(f=>(
            <button key={f.k} onClick={()=>setFilter(f.k)} style={{ padding:'4px 12px', borderRadius:999, border:'none', cursor:'pointer', fontSize:'0.75rem', fontWeight:filter===f.k?600:400, whiteSpace:'nowrap', background:filter===f.k?ATT_ACCENT:'#F4F4F0', color:filter===f.k?'white':'var(--ink-muted)', transition:'all .15s', flexShrink:0 }}>{f.l}</button>
          ))}
        </div>
      </div>

      {/* Member list */}
      <div style={{ overflowY:'auto', flex:1, WebkitOverflowScrolling:'touch' }}>
        {visibleMembers.length===0
          ? <div style={{ textAlign:'center', padding:40, color:'var(--ink-subtle)', fontStyle:'italic', fontSize:'0.875rem' }}>{search?'No members match.':'No members found.'}</div>
          : visibleMembers.map(m=>(
            <MemberCard
              key={m.id}
              member={m}
              record={(session?.records||[]).find(r=>r.memberId===m.id)}
              onStatus={updateStatus}
              isLastAction={lastAction?.memberId===m.id}
              onUndo={handleUndo}
            />
          ))
        }

        {/* Big Sync button — always visible at bottom */}
        {session && state.meta.gasUrl && (
          <SyncButton session={session} state={state} dispatch={dispatch} />
        )}
        {session && !state.meta.gasUrl && (
          <div style={{ margin:'20px 16px', padding:'14px 16px', borderRadius:12, background:'#F0F9FF', border:'1px solid #BAE6FD', textAlign:'center' }}>
            <div style={{ fontSize:'0.8125rem', color:'#0369A1', marginBottom:8 }}>Set up Google Sheets sync in Settings to save attendance to the cloud.</div>
            <div style={{ fontSize:'0.75rem', color:ATT_ACCENT }}>All data is already saved on this device. ✓</div>
          </div>
        )}
        <div style={{ height:100 }} />
      </div>

      {lastAction && (
        <div className="undo-toast">
          <div style={{ fontSize:'0.8125rem' }}>
            <strong>{lastAction.memberName}</strong>
            {lastAction.newStatus === 'present' ? ' marked Present ✓' : ' removed'}
          </div>
          <button onClick={handleUndo} style={{ background:'rgba(255,255,255,.18)', border:'none', borderRadius:6, padding:'4px 10px', color:'white', cursor:'pointer', fontSize:'0.8125rem', fontWeight:600 }}>Undo</button>
        </div>
      )}

      {/* Add visitor modal */}
      {showAddVis && (
        <VisitorModal state={state} dispatch={dispatch} today={today} onClose={()=>{setShowAddVis(false);}} />
      )}
    </div>
  );
}

// ─── Visitor Modal ────────────────────────────────────────────────────────────
function VisitorModal({ state, dispatch, today, onClose }) {
  const [name,       setName]      = useState('');
  const [ministry,   setMinistry]  = useState('Visitor');
  const [permanent,  setPermanent] = useState(false);

  const submit = () => {
    if (!name.trim()) { alert('Name is required.'); return; }
    dispatch({
      type: 'ADD_CUSTOM_MEMBER',
      member: { id:`vis-${Date.now()}`, name:name.trim(), ministry:ministry||'Visitor', type:'individual', status:'active', sessionDate:today, permanent },
    });
    onClose();
  };

  return (
    <div className="modal-backdrop" onClick={onClose}>
      <div className="modal" style={{ padding:24 }} onClick={e=>e.stopPropagation()}>
        <div style={{ width:42, height:4, borderRadius:2, background:'var(--border-strong)', margin:'0 auto 20px', opacity:.6 }}/>
        <div className="font-display" style={{ fontSize:'1.5rem', fontWeight:600, marginBottom:16 }}>Add Visitor / New Member</div>
        <div style={{ display:'flex', flexDirection:'column', gap:10 }}>
          <div>
            <label style={{ fontSize:'0.75rem', color:'var(--ink-muted)' }}>Full name *</label>
            <input className="input" style={{ marginTop:4 }} value={name} onChange={e=>setName(e.target.value)} placeholder="e.g. Bro. Juan dela Cruz" autoFocus />
          </div>
          <div>
            <label style={{ fontSize:'0.75rem', color:'var(--ink-muted)' }}>Ministry / label</label>
            <input className="input" style={{ marginTop:4 }} value={ministry} onChange={e=>setMinistry(e.target.value)} placeholder="Visitor, Praise Team…" />
          </div>
          <label style={{ display:'flex', alignItems:'center', gap:8, cursor:'pointer', fontSize:'0.875rem' }}>
            <input type="checkbox" checked={permanent} onChange={e=>setPermanent(e.target.checked)} />
            Save permanently (appears in all future sessions)
          </label>
        </div>
        <div style={{ display:'flex', gap:8, justifyContent:'flex-end', marginTop:20 }}>
          <button className="btn btn-ghost" onClick={onClose}>Cancel</button>
          <button className="btn btn-accent" onClick={submit}>Add</button>
        </div>
      </div>
    </div>
  );
}

// ─── HISTORY TAB ──────────────────────────────────────────────────────────────
function HistoryTab({ state, dispatch, members }) {
  const [expanded, setExpanded] = useState(null);
  const sorted = useMemo(()=>[...state.sessions].sort((a,b)=>b.date.localeCompare(a.date)),[state.sessions]);

  if (!sorted.length) return (
    <div style={{ textAlign:'center', padding:'60px 20px', color:'var(--ink-subtle)' }}>
      <div style={{ fontSize:'2.5rem', marginBottom:12 }}>📋</div>
      <div className="font-display" style={{ fontSize:'1.25rem' }}>No sessions yet</div>
      <p style={{ fontSize:'0.875rem', marginTop:8 }}>Record your first session in the Today tab.</p>
    </div>
  );

  return (
    <div style={{ padding:16 }} className="fade-in">
      <div style={{ display:'flex', alignItems:'baseline', justifyContent:'space-between', marginBottom:16 }}>
        <div className="font-display" style={{ fontSize:'1.5rem', fontWeight:600 }}>Session History</div>
        <div style={{ fontSize:'0.75rem', color:'var(--ink-muted)' }}>{sorted.length} sessions</div>
      </div>
      <div style={{ display:'flex', flexDirection:'column', gap:10 }}>
        {sorted.map(sess=>{
          const sum = getSessionSummary(sess, members.length);
          const isOpen = expanded===sess.id;
          const attendedPct = sum.total>0 ? Math.round((sum.present/sum.total)*100) : 0;
          return (
            <div key={sess.id} className="card overflow-hidden">
              <div onClick={()=>setExpanded(isOpen?null:sess.id)} style={{ padding:'14px 16px', cursor:'pointer', userSelect:'none' }}>
                <div style={{ display:'flex', alignItems:'center', justifyContent:'space-between', gap:8 }}>
                  <div>
                    <div style={{ fontWeight:600, fontSize:'0.9375rem' }}>{sess.serviceLabel||sess.service}</div>
                    <div style={{ fontSize:'0.8125rem', color:'var(--ink-muted)', marginTop:2 }}>{formatDateFull(sess.date)}</div>
                  </div>
                  <div style={{ display:'flex', alignItems:'center', gap:10, flexShrink:0 }}>
                    <div style={{ textAlign:'right' }}>
                      <div style={{ fontSize:'1.375rem', fontWeight:700, color:attendedPct>=80?'#16A34A':attendedPct>=60?'#D97706':'#DC2626', fontFamily:'Fraunces,Georgia,serif' }}>{attendedPct}%</div>
                      <div style={{ fontSize:'0.6875rem', color:'var(--ink-muted)' }}>attendance</div>
                    </div>
                    <div style={{ fontSize:'0.75rem', transform:isOpen?'rotate(90deg)':'rotate(0)', transition:'transform .2s', color:'var(--ink-subtle)' }}>▶</div>
                  </div>
                </div>
                <div style={{ display:'flex', gap:14, marginTop:10, fontSize:'0.8125rem' }}>
                  <span style={{ color:'#16A34A', fontWeight:600 }}>✓ {sum.present} Present</span>
                  <span style={{ color:'#DC2626', fontWeight:600 }}>✗ {sum.absent} Absent</span>
                  {sess.synced && <span style={{ marginLeft:'auto', color:'#16A34A', fontSize:'0.6875rem' }}>✓ synced</span>}
                </div>
              </div>
              {isOpen && (
                <div style={{ borderTop:'1px solid var(--border)', background:'#FAFAFA' }}>
                  <div style={{ maxHeight:280, overflowY:'auto' }}>
                    {[...members,...(state.customMembers||[]).filter(m=>m.sessionDate===sess.date||m.permanent)]
                      .filter(m=>m.status==='active')
                      .map(m=>{
                        const rec = (sess.records||[]).find(r=>r.memberId===m.id);
                        const st  = rec?.status;
                        const cfg = st ? STATUS_CFG[st] : null;
                        return (
                          <div key={m.id} style={{ display:'flex', alignItems:'center', gap:10, padding:'9px 16px', borderBottom:'1px solid var(--border)', background:cfg?cfg.soft+'88':'transparent' }}>
                            <Avatar name={m.name} size={32} />
                            <div style={{ flex:1, minWidth:0 }}>
                              <div style={{ fontSize:'0.875rem', fontWeight:500, overflow:'hidden', textOverflow:'ellipsis', whiteSpace:'nowrap' }}>{m.fullName||m.name}</div>
                            </div>
                            <div style={{ flexShrink:0 }}>
                              {cfg ? (
                                <span className="pill" style={{ background:cfg.color+'20', color:cfg.color, fontSize:'0.75rem' }}>{cfg.emoji} {cfg.label}</span>
                              ) : (
                                <span style={{ fontSize:'0.75rem', color:'var(--ink-subtle)', fontStyle:'italic' }}>not recorded</span>
                              )}
                            </div>
                          </div>
                        );
                      })}
                  </div>
                  <div style={{ display:'flex', justifyContent:'flex-end', padding:'10px 14px', borderTop:'1px solid var(--border)' }}>
                    <button className="btn btn-ghost" style={{ fontSize:'0.75rem', color:'var(--absent)', borderColor:'var(--absent)' }}
                      onClick={()=>{ if(confirm('Delete this session?')) { dispatch({type:'DELETE_SESSION',id:sess.id}); setExpanded(null); } }}>
                      Delete session
                    </button>
                  </div>
                </div>
              )}
            </div>
          );
        })}
      </div>
    </div>
  );
}

// ─── ANALYTICS TAB ───────────────────────────────────────────────────────────
function AnalyticsTab({ state, members }) {
  const allSessions = useMemo(()=>[...state.sessions].sort((a,b)=>a.date.localeCompare(b.date)),[state.sessions]);

  // Build list of months that have sessions
  const availableMonths = useMemo(()=>{
    const seen = new Set();
    for (const s of allSessions) seen.add(s.date.slice(0,7));
    return ['all', ...Array.from(seen).sort().reverse()];
  },[allSessions]);

  const [selectedMonth, setSelectedMonth] = useState('all');
  const [serviceView,   setServiceView]   = useState('all'); // 'all' | 'Friday' | 'Sunday'

  // Sessions filtered by selected month + service view
  const sessions = useMemo(()=>{
    let list = allSessions;
    if (selectedMonth !== 'all') list = list.filter(s=>s.date.slice(0,7)===selectedMonth);
    if (serviceView  !== 'all') list = list.filter(s=>s.service===serviceView);
    return list;
  },[allSessions, selectedMonth, serviceView]);

  const fridaySessions  = useMemo(()=>allSessions.filter(s=>s.service==='Friday'),[allSessions]);
  const sundaySessions  = useMemo(()=>allSessions.filter(s=>s.service==='Sunday'),[allSessions]);

  // Helper: top N members by attendance for a given session list
  function topByService(sessionList, n=5) {
    return members.map(m=>{
      const relevant = sessionList.filter(s=>(s.records||[]).find(r=>r.memberId===m.id));
      if (!relevant.length) return null;
      const present  = relevant.filter(s=>{const r=(s.records||[]).find(x=>x.memberId===m.id);return r&&r.status!=='absent';}).length;
      const pct      = Math.round((present/relevant.length)*100);
      return { member:m, pct, attended:present, total:relevant.length };
    })
    .filter(Boolean)
    .filter(x=>x.total>0)
    .sort((a,b)=>b.pct-a.pct||b.attended-a.attended)
    .slice(0,n);
  }

  const topFriday  = useMemo(()=>topByService(fridaySessions),[fridaySessions, members]);
  const topSunday  = useMemo(()=>topByService(sundaySessions),[sundaySessions, members]);
  const topFiltered = useMemo(()=>topByService(sessions),[sessions, members]);

  // Bar charts
  const sessionBars = useMemo(()=>
    sessions.slice(-8).map(s=>{
      const sum = getSessionSummary(s, members.length);
      return { label:formatDateShort(s.date), value:sum.total>0?Math.round((sum.present/sum.total)*100):0 };
    }),[sessions, members]);

  // Monthly breakdown (all months, all service types, for the bar chart)
  const monthlyBars = useMemo(()=>{
    const map = new Map();
    for (const s of allSessions) {
      const mk = s.date.slice(0,7);
      if (!map.has(mk)) map.set(mk,[]);
      map.get(mk).push(s);
    }
    return Array.from(map.entries()).sort().slice(-6).map(([mk,ss])=>{
      const avg = ss.length ? Math.round(ss.reduce((acc,s)=>{
        const sum=getSessionSummary(s,members.length);
        return acc+(sum.total?(sum.present/sum.total)*100:0);
      },0)/ss.length) : 0;
      const [y,m] = mk.split('-');
      return { label:new Date(+y,+m-1,1).toLocaleDateString('en-US',{month:'short'}), value:avg, mk };
    });
  },[allSessions,members]);

  // Monthly report — per-session breakdown for selected month
  const monthReport = useMemo(()=>{
    if (selectedMonth==='all') return null;
    const mSessions = allSessions.filter(s=>s.date.slice(0,7)===selectedMonth);
    if (!mSessions.length) return null;
    const fridays = mSessions.filter(s=>s.service==='Friday');
    const sundays = mSessions.filter(s=>s.service==='Sunday');
    const others  = mSessions.filter(s=>s.service!=='Friday'&&s.service!=='Sunday');
    const total   = mSessions.length;
    const avgPct  = total ? Math.round(mSessions.reduce((acc,s)=>{
      const sum=getSessionSummary(s,members.length);
      return acc+(sum.total?(sum.present/sum.total)*100:0);
    },0)/total) : 0;
    return { mSessions, fridays, sundays, others, total, avgPct };
  },[selectedMonth, allSessions, members]);

  // Care flags (always from all sessions)
  const careFlags = useMemo(()=>computeCareFlags(allSessions, members),[allSessions,members]);

  const MEDAL = ['🥇','🥈','🥉'];

  function LeaderList({ list, color, emptyMsg }) {
    if (!list.length) return <div style={{padding:'16px',textAlign:'center',color:'var(--ink-subtle)',fontStyle:'italic',fontSize:'0.8125rem'}}>{emptyMsg}</div>;
    return list.map((x,i)=>(
      <div key={x.member.id} style={{display:'flex',alignItems:'center',gap:12,padding:'12px 16px',borderBottom:'1px solid var(--border)'}}>
        <div style={{width:26,textAlign:'center',fontSize:'1rem',flexShrink:0}}>{i<3?MEDAL[i]:<span style={{fontSize:'0.875rem',color:'var(--ink-subtle)',fontWeight:700}}>{i+1}</span>}</div>
        <Avatar name={x.member.name} size={36} />
        <div style={{flex:1,minWidth:0}}>
          <div style={{fontSize:'0.875rem',fontWeight:600,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{x.member.fullName||x.member.name}</div>
          <div style={{fontSize:'0.6875rem',color:'var(--ink-muted)',marginTop:2}}>{x.attended} of {x.total} session{x.total!==1?'s':''}</div>
          <div style={{width:`${x.pct}%`,height:3,borderRadius:2,background:color,marginTop:4,maxWidth:100}}/>
        </div>
        <div style={{fontWeight:700,color,flexShrink:0,fontFamily:'Fraunces,Georgia,serif',fontSize:'1.125rem'}}>{x.pct}%</div>
      </div>
    ));
  }

  if (!allSessions.length) return (
    <div style={{textAlign:'center',padding:'60px 20px',color:'var(--ink-subtle)'}}>
      <div style={{fontSize:'2.5rem',marginBottom:12}}>📊</div>
      <div className="font-display" style={{fontSize:'1.25rem'}}>No data yet</div>
      <p style={{fontSize:'0.875rem',marginTop:8}}>Record at least one session to see analytics.</p>
    </div>
  );

  return (
    <div style={{padding:16}} className="fade-in">

// ─── MEMBERS TAB ──────────────────────────────────────────────────────────────
function MembersTab({ members, state, dispatch }) {
  const [search, setSearch] = useState('');
  const [showAdd, setShowAdd] = useState(false);

  const permanentVisitors = state.customMembers.filter(m=>m.permanent);
  const allDisplay = [...members, ...permanentVisitors];

  const filtered = useMemo(()=>{
    const q = search.toLowerCase();
    return allDisplay.filter(m=>m.status==='active'&&(!q||(m.name||'').toLowerCase().includes(q)||(m.ministry||'').toLowerCase().includes(q)));
  },[allDisplay, search]);

  return (
    <div className="fade-in">
      <div style={{ padding:'14px 16px', borderBottom:'1px solid var(--border)' }}>
        <div style={{ display:'flex', gap:8, marginBottom:10 }}>
          <input className="input" value={search} onChange={e=>setSearch(e.target.value)} placeholder="Search members…" style={{ flex:1 }} />
          <button className="btn btn-accent" onClick={()=>setShowAdd(true)}>+ Add</button>
        </div>
        <div style={{ fontSize:'0.8125rem', color:'var(--ink-muted)' }}>{filtered.length} active members · {members.length} from data.json + {permanentVisitors.length} custom</div>
      </div>

      <div style={{ overflowY:'auto' }}>
        {filtered.map(m=>{
          const pct = getMemberAttendancePct(m.id, state.sessions);
          const isCustom = !!state.customMembers.find(x=>x.id===m.id);
          return (
            <div key={m.id} style={{ display:'flex', alignItems:'center', gap:12, padding:'13px 16px', borderBottom:'1px solid var(--border)' }}>
              <Avatar name={m.name} />
              <div style={{ flex:1, minWidth:0 }}>
                <div style={{ display:'flex', alignItems:'center', gap:6 }}>
                  <div style={{ fontWeight:600, fontSize:'0.9375rem', overflow:'hidden', textOverflow:'ellipsis', whiteSpace:'nowrap' }}>{m.fullName||m.name}</div>
                  {isCustom && <span className="pill" style={{ background:ATT_ACCENT+'20', color:ATT_ACCENT, fontSize:'0.6rem', padding:'1px 5px' }}>custom</span>}
                </div>
                <div style={{ fontSize:'0.75rem', color:'var(--ink-muted)', marginTop:1 }}>{m.ministry||'Ministry'}</div>
              </div>
              <div style={{ textAlign:'right', flexShrink:0 }}>
                {pct!==null ? (
                  <>
                    <div style={{ fontWeight:700, color:pct>=80?'#16A34A':pct>=60?'#D97706':'#DC2626', fontFamily:'Fraunces,Georgia,serif', fontSize:'1.125rem' }}>{pct}%</div>
                    <div style={{ fontSize:'0.6rem', color:'var(--ink-subtle)' }}>attendance</div>
                  </>
                ) : <span style={{ fontSize:'0.75rem', color:'var(--ink-subtle)', fontStyle:'italic' }}>no data</span>}
              </div>
              {isCustom && (
                <button onClick={()=>{ if(confirm('Remove this custom member?')) dispatch({type:'REMOVE_CUSTOM_MEMBER',id:m.id}); }}
                  style={{ background:'none', border:'none', color:'var(--absent)', cursor:'pointer', fontSize:'1rem', padding:'4px', flexShrink:0 }}>✕</button>
              )}
            </div>
          );
        })}
        <div style={{ height:40 }}/>
      </div>

      {showAdd && <VisitorModal state={state} dispatch={dispatch} today={todayISO()} onClose={()=>setShowAdd(false)} />}
    </div>
  );
}

// ─── SETTINGS TAB ─────────────────────────────────────────────────────────────
function SettingsTab({ state, dispatch }) {
  const m = state.meta;
  const set = payload => dispatch({ type:'UPDATE_META', payload });
  const [gasGuide, setGasGuide] = useState(false);
  const [testStatus, setTestStatus] = useState('');
  const [syncing, setSyncing] = useState(false);
  const fileRef = useRef(null);

  const testGas = async () => {
    if (!m.gasUrl) { alert('Paste your GAS URL first.'); return; }
    setTestStatus('testing');
    try {
      await fetch(m.gasUrl, { method:'POST', mode:'no-cors', body:JSON.stringify({ action:'test' }) });
      setTestStatus('ok');
      setTimeout(()=>setTestStatus(''),3000);
    } catch { setTestStatus('err'); setTimeout(()=>setTestStatus(''),4000); }
  };

  const exportBackup = () => {
    const blob = new Blob([JSON.stringify(state, null, 2)], { type:'application/json' });
    const url  = URL.createObjectURL(blob);
    const a    = document.createElement('a'); a.href=url; a.download=`flcc-attendance-${todayISO()}.json`; a.click(); URL.revokeObjectURL(url);
  };

  const importBackup = f => {
    const r = new FileReader();
    r.onload = ev => {
      try {
        const d = JSON.parse(ev.target.result);
        if (!Array.isArray(d.sessions)) throw new Error('Invalid format');
        if (confirm('Replace all attendance data with this backup?')) dispatch({ type:'RESET' });
        // Re-import sessions
        for (const s of d.sessions) dispatch({ type:'UPSERT_SESSION', session:s });
        alert('Imported!');
      } catch { alert('Import failed.'); }
    };
    r.readAsText(f);
  };

  const buildAttendanceJSON = () => {
    const sorted = [...state.sessions].sort((a,b) => b.date.localeCompare(a.date));
    return {
      meta: {
        churchName: m.churchName || 'FLCC - Farwaniya 1',
        publishedAt: new Date().toISOString(),
        totalSessions: sorted.length,
      },
      sessions: sorted.map(s => ({
        id:           s.id,
        date:         s.date,
        service:      s.service,
        serviceLabel: s.serviceLabel || s.service,
        summary:      getSessionSummary(s),
        records:      (s.records || []).map(r => ({
          memberId:   r.memberId,
          memberName: r.memberName,
          status:     r.status,
        })),
      })),
    };
  };

  const publishAttendanceJSON = () => {
    const out  = buildAttendanceJSON();
    const blob = new Blob([JSON.stringify(out, null, 2)], { type:'application/json' });
    const url  = URL.createObjectURL(blob);
    const a    = document.createElement('a');
    a.href = url; a.download = 'attendance.json'; a.click();
    URL.revokeObjectURL(url);
  };

  const [ghToken, setGhToken]     = useState(() => { try { return localStorage.getItem(GH_TOKEN_KEY)||''; } catch { return ''; } });
  const [ghTokenInput, setGhTokenInput] = useState('');
  const [ghPublishing, setGhPublishing] = useState(false);
  const [ghStatus, setGhStatus]   = useState(''); // 'ok' | 'err' | ''

  const saveGhToken = () => {
    const v = ghTokenInput.trim();
    if (!v.startsWith('ghp_') && !v.startsWith('github_pat_')) { alert('Token should start with ghp_ or github_pat_'); return; }
    setGhToken(v); try { localStorage.setItem(GH_TOKEN_KEY, v); } catch {}
    setGhTokenInput('');
  };

  const clearGhToken = () => {
    setGhToken(''); try { localStorage.removeItem(GH_TOKEN_KEY); } catch {}
  };

  const publishToGitHub = async () => {
    if (!ghToken) { alert('Enter your GitHub token first.'); return; }
    if (!state.sessions.length) { alert('No sessions to publish yet.'); return; }
    setGhPublishing(true); setGhStatus('');
    try {
      const content = JSON.stringify(buildAttendanceJSON(), null, 2);
      const encoded = btoa(unescape(encodeURIComponent(content)));
      // Get current file SHA (needed for updates)
      const getResp = await fetch(`https://api.github.com/repos/${GH_REPO}/contents/${GH_FILE}`, {
        headers: { Authorization: `Bearer ${ghToken}`, Accept: 'application/vnd.github+json' },
      });
      const existing = getResp.ok ? await getResp.json() : null;
      const sha = existing?.sha;
      // Commit the new file
      const putResp = await fetch(`https://api.github.com/repos/${GH_REPO}/contents/${GH_FILE}`, {
        method: 'PUT',
        headers: { Authorization: `Bearer ${ghToken}`, Accept: 'application/vnd.github+json', 'Content-Type': 'application/json' },
        body: JSON.stringify({
          message: `Update attendance.json — ${new Date().toLocaleDateString('en-US', { month:'short', day:'numeric', year:'numeric' })}`,
          content: encoded,
          ...(sha ? { sha } : {}),
        }),
      });
      if (!putResp.ok) {
        const err = await putResp.json().catch(() => ({}));
        throw new Error(err.message || `HTTP ${putResp.status}`);
      }
      setGhStatus('ok'); setTimeout(() => setGhStatus(''), 4000);
    } catch (e) {
      alert(`Publish failed: ${e.message}`);
      setGhStatus('err'); setTimeout(() => setGhStatus(''), 4000);
    } finally { setGhPublishing(false); }
  };

  // Weekly summary for Ptr. Justin — formatted for Messenger
  const generateWeeklySummary = () => {
    const today = todayISO();
    const weekAgo = (() => {
      const d = new Date(); d.setDate(d.getDate() - 7);
      return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
    })();
    const monthKey = today.slice(0, 7);
    const thisWeek = state.sessions
      .filter(s => s.date >= weekAgo && s.date <= today)
      .sort((a,b) => a.date.localeCompare(b.date));
    const thisMonth = state.sessions.filter(s => s.date.slice(0,7) === monthKey);

    if (!thisWeek.length && !thisMonth.length) {
      alert('No sessions found for this week or month yet.');
      return;
    }

    const allMembers = state.customMembers || [];
    const lines = [];
    lines.push(`📋 FLCC - FARWANIYA 1`);
    lines.push(`Attendance Summary`);
    lines.push(`Week of ${weekAgo} – ${today}`);
    lines.push(`Generated: ${new Date().toLocaleString()}`);
    lines.push(``);

    if (thisWeek.length) {
      lines.push(`📅 THIS WEEK'S SESSIONS (${thisWeek.length}):`);
      for (const s of thisWeek) {
        const sum = getSessionSummary(s);
        const pct = sum.total > 0 ? Math.round((sum.present / sum.total) * 100) : 0;
        lines.push(`  ${s.serviceLabel || s.service} · ${s.date}`);
        lines.push(`  ✓ Present: ${sum.present}  ✗ Absent: ${sum.absent}  (${pct}%)`);
      }
      lines.push(``);
    }

    if (thisMonth.length) {
      const monthAvg = Math.round(thisMonth.reduce((acc, s) => {
        const sum = getSessionSummary(s);
        return acc + (sum.total ? (sum.present / sum.total) * 100 : 0);
      }, 0) / thisMonth.length);
      const [y, mo] = monthKey.split('-');
      const monthLabel = new Date(+y, +mo-1, 1).toLocaleDateString('en-US', { month:'long', year:'numeric' });
      lines.push(`📊 ${monthLabel.toUpperCase()} SUMMARY:`);
      lines.push(`  Total sessions: ${thisMonth.length}`);
      lines.push(`  Monthly average: ${monthAvg}%`);
      lines.push(``);
    }

    // Top 5 most present this month
    const monthSessions = thisMonth.length ? thisMonth : thisWeek;
    const memberCounts = {};
    for (const s of monthSessions) {
      for (const r of (s.records || [])) {
        if (r.status === 'present') {
          const key = r.memberId;
          memberCounts[key] = memberCounts[key] || { name: r.memberName, count: 0, total: 0 };
          memberCounts[key].count++;
        }
        const key2 = r.memberId;
        memberCounts[key2] = memberCounts[key2] || { name: r.memberName, count: 0, total: 0 };
        memberCounts[key2].total = (memberCounts[key2].total || 0) + 1;
      }
    }
    const top5 = Object.values(memberCounts)
      .map(x => ({ ...x, pct: x.total ? Math.round((x.count / monthSessions.length) * 100) : 0 }))
      .sort((a,b) => b.count - a.count || b.pct - a.pct)
      .slice(0, 5);

    if (top5.length) {
      lines.push(`🏆 MOST FAITHFUL ATTENDEES:`);
      top5.forEach((x, i) => {
        const medals = ['🥇','🥈','🥉','4.','5.'];
        lines.push(`  ${medals[i]} ${x.name} — ${x.count} sessions`);
      });
      lines.push(``);
    }

    // Care flags — Friday and Sunday worship services only
    const careMembers = [];
    const recent6 = [...state.sessions]
      .filter(s => PASTORAL_CARE_SERVICES.has(s.service))
      .sort((a,b)=>b.date.localeCompare(a.date)).slice(0, 6);
    const memberIds = new Set();
    for (const s of recent6) for (const r of (s.records||[])) memberIds.add(r.memberId);

// ─── SYNC BUTTON — big, simple, used inside TodayTab ─────────────────────────
function SyncButton({ session, state, dispatch }) {
  const [syncing,  setSyncing]  = useState(false);
  const [done,     setDone]     = useState(false);
  const [err,      setErr]      = useState(false);

  const alreadySynced = session?.synced;
  const summary = getSessionSummary(session, null);

  const syncNow = async () => {
    if (!state.meta.gasUrl) return;
    setSyncing(true); setDone(false); setErr(false);
    try {
      await fetch(state.meta.gasUrl, {
        method: 'POST', mode: 'no-cors',
        body: JSON.stringify({ action: 'logAttendance', session }),
      });
      dispatch({ type:'UPSERT_SESSION', session:{ ...session, synced:true, syncedAt:new Date().toISOString() } });
      dispatch({ type:'UPDATE_META', payload:{ lastSync: new Date().toISOString() } });
      setDone(true);
    } catch {
      setErr(true);
    }
    setSyncing(false);
    setTimeout(() => { setDone(false); setErr(false); }, 4000);
  };

  return (
    <div style={{ margin:'20px 16px' }}>
      <button
        onClick={syncNow}
        disabled={syncing}
        style={{
          width: '100%', padding: '18px', borderRadius: 16,
          background: done ? '#16A34A' : err ? '#DC2626' : alreadySynced ? '#F0FDF4' : ATT_ACCENT,
          color: alreadySynced && !done && !err ? ATT_ACCENT : 'white',
          border: `2px solid ${alreadySynced && !done && !err ? '#BAE6FD' : 'transparent'}`,
          cursor: syncing ? 'wait' : 'pointer',
          fontSize: '1.0625rem', fontWeight: 700,
          display: 'flex', alignItems: 'center', justifyContent: 'center', gap: 10,
          transition: 'all .25s cubic-bezier(.34,1.56,.64,1)',
          boxShadow: done || alreadySynced ? 'none' : `0 6px 24px rgba(2,132,199,0.35)`,
        }}
      >
        <span style={{ fontSize: '1.25rem' }}>
          {syncing ? '↻' : done ? '✓' : err ? '⚠' : '☁'}
        </span>
        <span>
          {syncing ? 'Syncing to Google Sheets…'
            : done  ? 'Synced successfully!'
            : err   ? 'Sync failed — tap to retry'
            : alreadySynced ? `Already synced · ${summary.present} present, ${summary.absent} absent`
            : `Sync to Google Sheets · ${summary.present} present, ${summary.absent} absent`}
        </span>
      </button>
      {state.meta.lastSync && !done && (
        <div style={{ textAlign:'center', fontSize:'0.6875rem', color:'var(--ink-subtle)', marginTop:8 }}>
          Last synced: {new Date(state.meta.lastSync).toLocaleString()}
        </div>
      )}
    </div>
  );
}

function buildFollowUpMessage(flag, stewardName, churchName) {

  const title = (flag.member.fullName || flag.member.name).match(/^(Bro\.|Sis\.|Ptr\.)/i)?.[0] || '';
  const displayName = title ? `${title} ${name}` : name;
  const plural = flag.streak > 1 ? 'few services' : 'service';

  if (flag.level === 'priority') {
    return `Hi ${displayName}! 😊

This is ${stewardName || 'your church family'} from ${churchName || 'FLCC - Farwaniya 1'}.

We've noticed we haven't seen you for a while now and we genuinely miss you. You are an important part of our congregation and your presence means a lot to all of us. 🙏

We're reaching out not to pressure you, but simply to let you know we care about you — your faith, your family, and your wellbeing.

If there's anything going on or any way we can support you, please don't hesitate to reach out. Our doors and hearts are always open.

We're praying for you. God bless! ✝️

— ${stewardName || 'FLCC Pastoral Team'}
${churchName || 'FLCC - Farwaniya 1'}`;
  }

  return `Hi ${displayName}! 😊

This is ${stewardName || 'your church family'} from ${churchName || 'FLCC - Farwaniya 1'}. We missed you the past ${plural} and just wanted to check in on you.

Hope you and your family are doing well. We're praying for you and look forward to seeing you again soon! 🙏

God bless,
${stewardName || 'FLCC - Farwaniya 1'}`;
}

    computeCareFlags(allSessions, members),

          {/* Copy full report */}
          <button onClick={copyFullReport} style={{
            width:'100%',padding:'13px',marginBottom:20,borderRadius:12,
            background:'#7C3AED',color:'white',border:'none',cursor:'pointer',
            fontSize:'0.9375rem',fontWeight:700,display:'flex',alignItems:'center',justifyContent:'center',gap:8,
          }}>
            📋 Copy full report for Ptr. Justin
          </button>

          {/* Priority flags */}
          {priority.length > 0 && (
            <div style={{marginBottom:24}}>
              <div style={{
                display:'flex',alignItems:'center',gap:10,
                padding:'10px 14px',borderRadius:'12px 12px 0 0',
                background:'#DC2626',color:'white',
                fontSize:'0.8125rem',fontWeight:700,letterSpacing:'.04em',
              }}>
                🔴 PASTORAL PRIORITY — 5+ Consecutive Absences
                <span style={{marginLeft:'auto',fontSize:'0.75rem',fontWeight:400,opacity:.85}}>Pastor should reach out personally</span>
              </div>
              <div style={{borderRadius:'0 0 12px 12px',border:'2px solid #FECACA',borderTop:'none',overflow:'hidden'}}>
                {priority.map((flag,i) => (
                  <CareMemberCard key={flag.member.id} flag={flag} stewardName={stewardName} churchName={churchName} isLast={i===priority.length-1} />
                ))}
              </div>
            </div>
          )}

          {/* Gentle flags */}
          {gentle.length > 0 && (
            <div style={{marginBottom:24}}>
              <div style={{
                display:'flex',alignItems:'center',gap:10,
                padding:'10px 14px',borderRadius:'12px 12px 0 0',
                background:'#D97706',color:'white',
                fontSize:'0.8125rem',fontWeight:700,letterSpacing:'.04em',
              }}>
                🟡 GENTLE FOLLOW-UP — 3–4 Consecutive Absences
                <span style={{marginLeft:'auto',fontSize:'0.75rem',fontWeight:400,opacity:.85}}>Steward or CSL can reach out</span>
              </div>
              <div style={{borderRadius:'0 0 12px 12px',border:'2px solid #FDE68A',borderTop:'none',overflow:'hidden'}}>
                {gentle.map((flag,i) => (
                  <CareMemberCard key={flag.member.id} flag={flag} stewardName={stewardName} churchName={churchName} isLast={i===gentle.length-1} />
                ))}
              </div>
            </div>
          )}

          {/* Scripture footer */}
          <div style={{padding:'16px 18px',borderRadius:12,background:'#F5F3FF',border:'1px solid #DDD6FE',textAlign:'center'}}>
            <div style={{fontSize:'0.8125rem',color:'#6D28D9',fontStyle:'italic',lineHeight:1.7}}>
              "Suppose one of you has a hundred sheep and loses one of them. Does he not leave the ninety-nine… and go after the lost sheep until he finds it?"
            </div>
            <div style={{fontSize:'0.6875rem',color:'#7C3AED',marginTop:6,fontWeight:600}}>— Luke 15:4</div>
          </div>
        </>
      )}
    </div>
  );
}

function CareMemberCard({ flag, stewardName, churchName, isLast }) {
  const [expanded, setExpanded] = useState(false);
  const [copied,   setCopied]   = useState(false);
  const m = flag.member;
  const isP = flag.level === 'priority';
  const accentColor  = isP ? '#DC2626' : '#D97706';
  const accentSoft   = isP ? '#FEF2F2' : '#FFFBEB';

  const message = buildFollowUpMessage(flag, stewardName, churchName);

  const copyMsg = () => {
    navigator.clipboard.writeText(message)
      .then(() => { setCopied(true); setTimeout(() => setCopied(false), 3000); })
      .catch(() => alert('Copy failed.'));
  };

  const openMessenger = () => {
    // Copy message first, then open Messenger search
    navigator.clipboard.writeText(message).catch(()=>{});
    window.open('https://www.messenger.com', '_blank');
  };

  return (
    <div style={{
      borderBottom: isLast ? 'none' : '1px solid #F3F4F6',
      background: expanded ? accentSoft : 'white',
      transition: 'background .2s',
    }}>
      {/* Member row */}
      <div style={{display:'flex',alignItems:'center',gap:12,padding:'14px 16px',cursor:'pointer'}}
        onClick={() => setExpanded(e => !e)}>
        {/* Avatar */}
        <div style={{
          width:48,height:48,borderRadius:14,flexShrink:0,
          background:avatarBg(m.name),
          display:'flex',alignItems:'center',justifyContent:'center',
          color:'white',fontWeight:700,fontSize:'1.0625rem',letterSpacing:'.02em',
          boxShadow:`0 0 0 3px ${accentColor}30`,
        }}>
          {getInitials(m.name)}
        </div>

        {/* Info */}
        <div style={{flex:1,minWidth:0}}>
          <div style={{display:'flex',alignItems:'center',gap:8,flexWrap:'wrap'}}>
            <div style={{fontWeight:700,fontSize:'0.9375rem'}}>{m.fullName||m.name}</div>
            <span style={{
              padding:'2px 8px',borderRadius:999,fontSize:'0.625rem',fontWeight:700,
              background:accentColor+'18',color:accentColor,letterSpacing:'.06em',textTransform:'uppercase',
            }}>{isP ? '🔴 Priority' : '🟡 Follow-up'}</span>
          </div>
          <div style={{fontSize:'0.75rem',color:'var(--ink-muted)',marginTop:2}}>{m.ministry||'Ministry'}</div>
          <div style={{fontSize:'0.75rem',color:accentColor,fontWeight:600,marginTop:2}}>
            Absent {flag.streak} consecutive session{flag.streak!==1?'s':''}
            {flag.lastPresent
              ? <span style={{fontWeight:400,color:'var(--ink-muted)'}}> · last seen {formatDateShort(flag.lastPresent)}</span>
              : <span style={{fontWeight:400,color:'var(--ink-muted)'}}> · no attendance on record</span>}
          </div>
        </div>

        {/* Stats + chevron */}
        <div style={{textAlign:'right',flexShrink:0}}>
          <div className="font-display" style={{fontSize:'1.25rem',fontWeight:700,color:flag.overallPct>=60?'#D97706':'#DC2626'}}>{flag.overallPct}%</div>
          <div style={{fontSize:'0.6rem',color:'var(--ink-subtle)'}}>overall</div>
          <div style={{fontSize:'0.6875rem',color:'var(--ink-subtle)',marginTop:4,transition:'transform .2s',transform:expanded?'rotate(180deg)':'rotate(0)'}}>▼</div>
        </div>
      </div>

      {/* Expanded detail */}
      {expanded && (
        <div style={{padding:'0 16px 16px',animation:'fadeIn .2s ease-out'}}>
          {/* Stats row */}
          <div style={{display:'grid',gridTemplateColumns:'repeat(3,1fr)',gap:8,marginBottom:14}}>
            {[
              {label:'Consecutive',value:`${flag.streak} absent`,color:accentColor},
              {label:'Overall %', value:`${flag.overallPct}%`,   color:flag.overallPct>=60?'#D97706':'#DC2626'},
              {label:'Total sessions',value:flag.totalSessions,  color:'var(--ink-muted)'},
            ].map(s=>(
              <div key={s.label} style={{textAlign:'center',padding:'10px 8px',borderRadius:10,background:'white',border:'1px solid var(--border)'}}>
                <div className="font-display" style={{fontSize:'1.125rem',fontWeight:700,color:s.color}}>{s.value}</div>
                <div style={{fontSize:'0.625rem',color:'var(--ink-subtle)',marginTop:2}}>{s.label}</div>
              </div>
            ))}
          </div>

          {/* Suggested message preview */}
          <div style={{marginBottom:12}}>
            <div style={{fontSize:'0.6875rem',fontWeight:700,letterSpacing:'.08em',textTransform:'uppercase',color:'var(--ink-subtle)',marginBottom:8}}>
              Suggested follow-up message
            </div>
            <div style={{
              padding:'12px 14px',borderRadius:10,
              background:isP?'#FEF2F2':'#FFFBEB',
              border:`1px solid ${accentColor}30`,
              fontSize:'0.8125rem',color:'var(--ink)',lineHeight:1.7,
              whiteSpace:'pre-wrap',fontFamily:'Geist,sans-serif',
              maxHeight:160,overflowY:'auto',
            }}>{message}</div>
          </div>

          {/* Action buttons */}
          <div style={{display:'flex',gap:8,flexWrap:'wrap'}}>
            <button onClick={copyMsg} style={{
              flex:1,padding:'11px',borderRadius:10,border:'none',cursor:'pointer',
              background:copied?'#16A34A':accentColor,color:'white',
              fontSize:'0.875rem',fontWeight:700,transition:'background .2s',
              display:'flex',alignItems:'center',justifyContent:'center',gap:6,
            }}>
              {copied ? '✓ Copied!' : '📋 Copy message'}
            </button>
            <button onClick={openMessenger} style={{
              flex:1,padding:'11px',borderRadius:10,border:'none',cursor:'pointer',
              background:'#0084FF',color:'white',
              fontSize:'0.875rem',fontWeight:700,
              display:'flex',alignItems:'center',justifyContent:'center',gap:6,
            }}>
              💬 Open Messenger
            </button>
          </div>
          <div style={{fontSize:'0.6875rem',color:'var(--ink-subtle)',marginTop:8,textAlign:'center'}}>
            Message is auto-copied when you tap Open Messenger — just find their name and paste
          </div>
        </div>
      )}
    </div>
  );
}

// ─── APP ──────────────────────────────────────────────────────────────────────
const TABS = [
  { key:'today',     label:'Today'     },
  { key:'history',   label:'History'   },
  { key:'analytics', label:'Analytics' },
  { key:'care',      label:'🙏 Care'   },
  { key:'members',   label:'Members'   },
  { key:'settings',  label:'Settings'  },
];

function App() {
  const [state, dispatch] = useReducer(reducer, null, ()=>migrate(loadState())||defaultState());
  const [tab,       setTab]     = useState('today');
  const [mainData,  setMainData] = useState(null);
  const [dataLoaded, setDataLoaded] = useState(false);

  // Fetch data.json for workers + schedule
  useEffect(()=>{
    fetch(`${DATA_URL}?t=${Date.now()}`)
      .then(r=>r.ok?r.json():null)
      .then(d=>{ if(d) setMainData(d); setDataLoaded(true); })
      .catch(()=>setDataLoaded(true));
  },[]);

  // Members list = data.json workers + custom permanent members
  const members = useMemo(()=>{
    const base = (mainData?.workers||[])
      // Only individual members — exclude families, pairs, food-rotation combos
      .filter(w => w.status === 'active' && w.type === 'individual')
      .map(w => ({
        id:       w.id,
        // Store plain name (no title) for display; title kept separately
        name:     w.name,
        title:    w.title || '',
        fullName: w.title ? `${w.title} ${w.name}` : w.name,
        type:     'individual',
        status:   'active',
        ministry: deriveMinistry(w),
      }));
    return base;
  },[mainData]);

  const schedule = mainData?.schedule || [];
  const todayStr = todayISO();
  const unsynced = state.sessions.filter(s=>!s.synced).length;

  return (
    <div style={{ minHeight:'100vh', background:'var(--bg)' }}>
      {/* Header */}
      <header style={{ background:'rgba(250,250,245,.92)', backdropFilter:'blur(10px)', borderBottom:'1px solid var(--border)', position:'sticky', top:0, zIndex:20 }}>
        <div style={{ maxWidth:700, margin:'0 auto', padding:'16px 18px 0' }}>
          <div style={{ display:'flex', alignItems:'flex-start', justifyContent:'space-between', gap:8, marginBottom:10 }}>
            <div>
              <div style={{ fontSize:'0.6875rem', fontWeight:700, letterSpacing:'.1em', textTransform:'uppercase', color:ATT_ACCENT }}>
                {state.meta.churchName||'FLCC - Farwaniya 1'} · Attendance OS
              </div>
              <div className="font-display" style={{ fontSize:'1.625rem', fontWeight:600, lineHeight:1.2 }}>
                📋 Attendance
              </div>
            </div>
            <div style={{ textAlign:'right', fontSize:'0.75rem', color:'var(--ink-subtle)' }}>
              {state.meta.stewardName && <div style={{ fontWeight:500, color:'var(--ink-muted)' }}>{state.meta.stewardName}</div>}
              <div>{todayStr}</div>
              {unsynced>0 && <div style={{ display:'flex', alignItems:'center', gap:4, justifyContent:'flex-end', marginTop:2 }}><div className="sync-dot sync-dot-pend"/><span style={{ color:'#D97706', fontWeight:500 }}>{unsynced} unsynced</span></div>}
            </div>
          </div>
          <nav style={{ display:'flex', overflowX:'auto', scrollbarWidth:'none' }}>
            {TABS.map(t=>(
              <button key={t.key} className={`tab ${tab===t.key?'tab-active':''}`} onClick={()=>setTab(t.key)}>{t.label}</button>
            ))}
          </nav>
        </div>
      </header>

      {/* Data loading state */}
      {!dataLoaded && (
        <div style={{ textAlign:'center', padding:40, color:'var(--ink-subtle)', fontSize:'0.875rem' }}>
          Loading member data from data.json…
        </div>
      )}

      {/* Loading error — no data.json */}
      {dataLoaded && !mainData && (
        <div style={{ margin:'16px', padding:'12px 16px', borderRadius:10, background:'#FEF3C7', border:'1px solid #FDE68A', fontSize:'0.8125rem', color:'#92400E' }}>
          ⚠ Could not load data.json. Place attendance.html alongside data.json in your repo, or add members manually in the Members tab.
        </div>
      )}

      {/* Tab content */}
      <main style={{ maxWidth:700, margin:'0 auto' }}>
        {tab==='today'     && <TodayTab     members={members} state={state} dispatch={dispatch} schedule={schedule} />}
        {tab==='history'   && <HistoryTab   state={state} dispatch={dispatch} members={members} />}
        {tab==='analytics' && <AnalyticsTab state={state} members={members} />}
        {tab==='care'      && <CareTab      state={state} members={members} />}
        {tab==='members'   && <MembersTab   members={members} state={state} dispatch={dispatch} />}
        {tab==='settings'  && <SettingsTab  state={state} dispatch={dispatch} />}
      </main>

      <footer style={{ maxWidth:700, margin:'0 auto', padding:'3rem 1.5rem 6rem', fontSize:'0.75rem', color:'var(--ink-subtle)', textAlign:'center' }}>
        FLCC Attendance OS · Steward: {state.meta.stewardName||'(set name in Settings)'} · Data stored locally
      </footer>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
