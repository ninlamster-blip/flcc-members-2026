<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Daily Reflection · FLCC</title>
<meta name="description" content="A private daily emotion and mood journal to help you become more aware of your emotional and spiritual well-being." />

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
  :root {
    --scale: 1;
    --bg: #FBF9F4;
    --surface: #FFFFFF;
    --ink: #18181B;
    --ink-muted: #52525B;
    --ink-subtle: #8B8B85;
    --border: #E9E6DD;
    --border-strong: #D8D4C8;
    --accent: #A33B2A;
    --accent-hover: #8B2E20;
    --accent-soft: #FBEBE7;
    --calm: #3B6E64;
    --calm-soft: #E6F0ED;
    --success: #15803D;
    --danger: #B91C1C;
    --danger-soft: #FEE2E2;
    --radius-lg: 20px;
    --radius-md: 14px;
  }

  *, *::before, *::after { box-sizing: border-box; -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }
  html { font-size: calc(16px * var(--scale)); scroll-behavior: smooth; }
  html, body { background: var(--bg); color: var(--ink); margin: 0; min-height: 100%; }
  body {
    font-family: 'Geist', ui-sans-serif, system-ui, sans-serif;
    line-height: 1.6;
    padding-bottom: env(safe-area-inset-bottom);
  }
  .font-display { font-family: 'Fraunces', Georgia, serif; }

  #root { max-width: 620px; margin: 0 auto; min-height: 100vh; display: flex; flex-direction: column; }

  /* ── Header ── */
  .app-header {
    position: sticky; top: 0; z-index: 30;
    background: rgba(251,249,244,0.94);
    backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--border);
    padding: 0.9rem 1.1rem 0.75rem;
  }
  .header-row { display: flex; align-items: flex-start; justify-content: space-between; gap: 0.75rem; }
  .greeting { font-family: 'Fraunces', Georgia, serif; font-weight: 600; font-size: 1.5rem; letter-spacing: -0.01em; line-height: 1.25; }
  .greeting-sub { font-size: 0.95rem; color: var(--ink-muted); margin-top: 0.35rem; line-height: 1.5; }

  .icon-btn {
    width: 42px; height: 42px; min-width: 42px;
    border-radius: 12px;
    border: 1px solid var(--border);
    background: var(--surface);
    display: flex; align-items: center; justify-content: center;
    font-size: 1.1rem;
    cursor: pointer;
  }
  .icon-btn:active { transform: scale(0.94); }

  .segmented {
    display: flex; gap: 0.25rem; margin-top: 0.9rem;
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 14px; padding: 0.25rem;
  }
  .segmented button {
    flex: 1; border: none; background: transparent; cursor: pointer;
    font-family: inherit; font-size: 0.9rem; font-weight: 500;
    padding: 0.6rem 0.5rem; border-radius: 10px; color: var(--ink-muted);
    min-height: 44px;
  }
  .segmented button.active { background: var(--ink); color: #fff; }

  /* ── Content ── */
  .content { flex: 1; padding: 1rem 1.1rem 2.5rem; }
  .fade-in { animation: fadeIn 0.25s ease both; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }
  @media (prefers-reduced-motion: reduce) { .fade-in { animation: none; } }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    padding: 1.25rem;
    margin-bottom: 1rem;
  }
  .eyebrow {
    font-size: 0.75rem; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase;
    color: var(--accent); margin-bottom: 0.5rem;
  }

  .btn-big {
    width: 100%; min-height: 56px;
    border-radius: 16px; border: none; cursor: pointer;
    font-family: inherit; font-size: 1.05rem; font-weight: 600;
    display: flex; align-items: center; justify-content: center; gap: 0.5rem;
    background: var(--ink); color: #fff;
    padding: 0.9rem 1.25rem;
    transition: transform 0.12s ease, background 0.15s ease;
  }
  .btn-big:active { transform: scale(0.98); }
  .btn-big:disabled { background: #D8D4C8; color: #8B8B85; cursor: not-allowed; }
  .btn-big.accent { background: var(--accent); }
  .btn-big.accent:hover { background: var(--accent-hover); }
  .btn-big.ghost { background: var(--surface); color: var(--ink); border: 1.5px solid var(--border-strong); }
  .btn-secondary {
    min-height: 48px; border-radius: 14px; border: 1.5px solid var(--border-strong);
    background: var(--surface); color: var(--ink); font-family: inherit; font-weight: 500;
    font-size: 0.95rem; padding: 0.7rem 1.1rem; cursor: pointer;
  }
  .btn-secondary:active { transform: scale(0.98); }
  .btn-secondary.done { background: var(--calm-soft); border-color: var(--calm); color: var(--calm); }

  /* ── Mood grid ── */
  .mood-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 0.7rem; }
  @media (min-width: 420px) { .mood-grid { grid-template-columns: repeat(3, 1fr); } }
  .mood-tile {
    border: 2px solid transparent;
    border-radius: 16px;
    padding: 0.9rem 0.6rem;
    min-height: 84px;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 0.35rem;
    cursor: pointer;
    font-family: inherit;
    text-align: center;
  }
  .mood-tile .emoji { font-size: 1.7rem; line-height: 1; }
  .mood-tile .label { font-size: 0.85rem; font-weight: 600; }
  .mood-tile.selected { border-color: currentColor; box-shadow: 0 0 0 3px rgba(0,0,0,0.05); }
  .mood-tile:active { transform: scale(0.97); }

  /* ── Intensity slider ── */
  .intensity-track { position: relative; padding: 1.5rem 0.25rem 0.5rem; }
  input[type="range"].intensity {
    width: 100%; -webkit-appearance: none; appearance: none;
    height: 10px; border-radius: 6px; outline: none;
    background: linear-gradient(90deg, #DBEAFE, #A33B2A);
  }
  input[type="range"].intensity::-webkit-slider-thumb {
    -webkit-appearance: none; width: 32px; height: 32px; border-radius: 50%;
    background: #fff; border: 3px solid var(--accent); cursor: pointer;
    box-shadow: 0 2px 8px rgba(0,0,0,0.2);
  }
  input[type="range"].intensity::-moz-range-thumb {
    width: 32px; height: 32px; border-radius: 50%;
    background: #fff; border: 3px solid var(--accent); cursor: pointer;
  }
  .intensity-labels { display: flex; justify-content: space-between; margin-top: 0.75rem; font-size: 0.7rem; color: var(--ink-subtle); }
  .intensity-current { text-align: center; font-size: 1.15rem; font-weight: 600; margin-bottom: 0.25rem; }

  /* ── Cause chips ── */
  .chip-wrap { display: flex; flex-wrap: wrap; gap: 0.55rem; }
  .chip {
    border: 1.5px solid var(--border-strong);
    background: var(--surface);
    border-radius: 999px;
    padding: 0.65rem 1.05rem;
    font-size: 0.9rem; font-weight: 500;
    cursor: pointer; font-family: inherit;
    min-height: 44px;
    display: inline-flex; align-items: center;
  }
  .chip.selected { background: var(--ink); border-color: var(--ink); color: #fff; }

  textarea.journal-input {
    width: 100%; min-height: 160px; border-radius: 14px;
    border: 1.5px solid var(--border-strong); padding: 0.9rem 1rem;
    font-family: inherit; font-size: 1rem; line-height: 1.6; color: var(--ink);
    resize: vertical; outline: none; background: var(--surface);
  }
  textarea.journal-input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(163,59,42,0.1); }
  .word-count { font-size: 0.75rem; color: var(--ink-subtle); text-align: right; margin-top: 0.4rem; }
  .word-count.over { color: var(--danger); font-weight: 600; }

  .progress-dots { display: flex; gap: 0.4rem; justify-content: center; margin: 0.5rem 0 1.2rem; }
  .progress-dots span { width: 8px; height: 8px; border-radius: 50%; background: var(--border-strong); }
  .progress-dots span.active { background: var(--accent); width: 22px; border-radius: 5px; }

  .step-title { font-family: 'Fraunces', Georgia, serif; font-weight: 600; font-size: 1.35rem; margin-bottom: 0.4rem; letter-spacing: -0.01em; }
  .step-sub { color: var(--ink-muted); font-size: 0.95rem; margin-bottom: 1.25rem; line-height: 1.5; }

  .reflection-block + .reflection-block { margin-top: 1rem; }
  .reflection-label { font-size: 0.7rem; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-subtle); margin-bottom: 0.5rem; display: flex; align-items: center; gap: 0.4rem; }
  .reflection-text { font-size: 1rem; line-height: 1.75; color: var(--ink); }
  .prayer-text { font-size: 1rem; line-height: 1.85; color: var(--ink); font-style: italic; }
  blockquote.verse {
    border-left: 3px solid var(--accent); margin: 0; padding: 0.2rem 0 0.2rem 1rem;
    font-style: italic; color: var(--ink-muted); font-size: 0.95rem; line-height: 1.6;
  }

  .care-banner {
    border-radius: var(--radius-lg); padding: 1.25rem;
    background: var(--calm-soft); border: 1.5px solid var(--calm);
    margin-bottom: 1rem;
  }
  .care-banner.urgent { background: var(--danger-soft); border-color: var(--danger); }

  .streak-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 0.7rem; }
  .streak-tile { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 0.9rem; text-align: center; }
  .streak-num { font-family: 'Fraunces', Georgia, serif; font-size: 1.6rem; font-weight: 600; }
  .streak-label { font-size: 0.75rem; color: var(--ink-muted); margin-top: 0.15rem; }

  .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 0.3rem; }
  .cal-cell { aspect-ratio: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; border-radius: 10px; font-size: 0.7rem; color: var(--ink-subtle); gap: 0.15rem; }
  .cal-cell.today { border: 1.5px solid var(--ink); }
  .cal-dot { width: 9px; height: 9px; border-radius: 50%; }

  .disclaimer {
    font-size: 0.7rem; color: var(--ink-subtle); text-align: center; line-height: 1.6;
    padding: 1rem 1.5rem 1.5rem; max-width: 520px; margin: 0 auto;
  }

  .link-btn { background: none; border: none; color: var(--accent); font-family: inherit; font-size: inherit; font-weight: 600; cursor: pointer; padding: 0; text-decoration: underline; }

  .modal-backdrop {
    position: fixed; inset: 0; background: rgba(24,24,27,0.5); backdrop-filter: blur(4px);
    display: flex; align-items: flex-end; justify-content: center; z-index: 50; padding: 0;
  }
  @media (min-width: 640px) { .modal-backdrop { align-items: center; padding: 1.5rem; } }
  .modal-sheet {
    background: var(--surface); width: 100%; max-width: 480px;
    border-radius: 22px 22px 0 0; padding: 1.5rem 1.25rem calc(1.5rem + env(safe-area-inset-bottom));
    max-height: 85vh; overflow-y: auto;
  }
  @media (min-width: 640px) { .modal-sheet { border-radius: 20px; } }

  ::-webkit-scrollbar { width: 5px; }
  ::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 3px; }
</style>
</head>

<body>
<div id="root"></div>

// =============================================================================
// UTILITIES
// =============================================================================

function pad2(n) { return String(n).padStart(2, '0'); }
function dateISO(d) { return `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`; }
function todayISO() { return dateISO(new Date()); }
function addDays(iso, n) {
  const [y, m, d] = iso.split('-').map(Number);
  const dt = new Date(y, m - 1, d + n);
  return dateISO(dt);
}
function parseISO(iso) {
  const [y, m, d] = iso.split('-').map(Number);
  return new Date(y, m - 1, d);
}
function formatDateLong(iso) {
  return parseISO(iso).toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric' });
}
function monthKey(iso) { return iso.slice(0, 7); }
function wordCount(text) { return (text || '').trim().split(/\s+/).filter(Boolean).length; }

function seededRandom(seedStr) {
  let h = 0;
  for (let i = 0; i < seedStr.length; i++) { h = (h << 5) - h + seedStr.charCodeAt(i); h |= 0; }
  const x = Math.sin(h) * 10000;
  return x - Math.floor(x);
}
function pick(arr, seed) {
  if (!arr || !arr.length) return '';
  return arr[Math.floor(seededRandom(seed) * arr.length) % arr.length];
}
function pickN(arr, n, seed) {
  if (arr.length <= n) return arr;
  const indices = [];
  let tries = 0;
  while (indices.length < n && tries < 20) {
    const idx = Math.floor(seededRandom(seed + tries) * arr.length);
    if (!indices.includes(idx)) indices.push(idx);
    tries++;
  }
  return indices.map(i => arr[i]);
}

function computeStreak(dateList) {
  const dates = [...new Set(dateList)].sort();
  if (!dates.length) return { current: 0, longest: 0 };
  let longest = 1, run = 1;
  for (let i = 1; i < dates.length; i++) {
    const gap = (parseISO(dates[i]) - parseISO(dates[i - 1])) / 86400000;
    run = gap === 1 ? run + 1 : 1;
    longest = Math.max(longest, run);
  }
  const today = todayISO();
  const yesterday = addDays(today, -1);
  const last = dates[dates.length - 1];
  let current = 0;
  if (last === today || last === yesterday) {
    current = 1;
    for (let i = dates.length - 1; i > 0; i--) {
      const gap = (parseISO(dates[i]) - parseISO(dates[i - 1])) / 86400000;
      if (gap === 1) current++; else break;
    }
  }
  return { current, longest };
}

function avg(arr) { return arr.length ? arr.reduce((a, b) => a + b, 0) / arr.length : null; }

function timeOfDay() {
  const h = new Date().getHours();
  if (h < 5) return 'lateNight';
  if (h < 12) return 'morning';
  if (h < 17) return 'afternoon';
  if (h < 22) return 'evening';
  return 'lateNight';
}
function greetingWord() {
  const t = timeOfDay();
  if (t === 'morning') return 'Good morning';
  if (t === 'afternoon') return 'Good afternoon';
  if (t === 'evening') return 'Good evening';
  return 'Good evening';
}

function useWeather() {
  const [weather, setWeather] = useState(null);
  const [status, setStatus] = useState('loading');

  useEffect(() => {
    const load = async (lat, lon, city) => {
      try {
        const res = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,relative_humidity_2m,weather_code,is_day,wind_speed_10m&daily=sunrise,sunset&timezone=auto`);
        const d = await res.json();
        setWeather({
          temp: d.current.temperature_2m,
          humidity: d.current.relative_humidity_2m,
          wind: d.current.wind_speed_10m,
          code: d.current.weather_code,
          isDay: d.current.is_day === 1,
          sunrise: d.daily?.sunrise?.[0],
          sunset: d.daily?.sunset?.[0],
          city,
        });
        setStatus('ok');
      } catch { setStatus('error'); }
    };
    const ipFallback = async () => {
      try {
        const r = await fetch('https://ipwho.is/');
        const d = await r.json();
        if (d.success && d.latitude) load(d.latitude, d.longitude, d.city || '');
        else setStatus('error');
      } catch { setStatus('error'); }
    };
    if (navigator.geolocation) {
      navigator.geolocation.getCurrentPosition(
        async pos => {
          const { latitude: lat, longitude: lon } = pos.coords;
          let city = '';
          try {
            const g = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lon}&zoom=10`);
            const gd = await g.json();
            city = gd.address?.city || gd.address?.town || gd.address?.village || gd.address?.suburb || '';
          } catch {}
          load(lat, lon, city);
        },
        ipFallback,
        { timeout: 8000 }
      );
    } else {
      ipFallback();
    }
  }, []);

  return { weather, status };
}

function weatherEmoji(c, isDay) {
  if (c === 0) return isDay ? '☀️' : '🌙';
  if (c <= 2) return isDay ? '🌤️' : '🌛';
  if (c === 3) return '☁️';
  if (c <= 48) return '🌫️';
  if (c <= 55) return isDay ? '🌦️' : '🌧️';
  if (c <= 67) return '🌧️';
  if (c <= 77) return '❄️';
  if (c <= 82) return '🌧️';
  return '⛈️';
}
function weatherLabel(c, isDay) {
  if (c === 0) return isDay ? 'Clear Sky' : 'Clear Night';
  if (c <= 2) return 'Partly Cloudy';
  if (c === 3) return 'Overcast';
  if (c <= 48) return 'Foggy';
  if (c <= 55) return 'Drizzle';
  if (c <= 67) return 'Rainy';
  if (c <= 77) return 'Snowy';
  if (c <= 82) return 'Showers';
  return 'Thunderstorm';
}
function formatTime(iso) {
  if (!iso) return '—';
  const d = new Date(iso);
  return d.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' });
}

function pickReading(mood, causes) {
  if (causes && (causes.includes('Future') || causes.includes('Waiting on God'))) return WISDOM_OVERRIDE;
  return MOOD_READING[mood.key] || MOOD_READING.neutral;
}

function patternClause(history, tier) {
  const recent = history.slice(-3);
  if (recent.length < 3) return '';
  const allHard = recent.every(e => e.tier <= -2);
  const allBright = recent.every(e => e.tier >= 2);
  if (tier <= -1 && allHard) {
    return " I've noticed the last few days have been heavy for you — today isn't a coincidence, and God sees the whole week, not just this moment.";
  }
  if (tier >= 1 && allBright) {
    return " You've had a beautiful run of days like this — what a gift to notice God's steady goodness building over time.";
  }
  return '';
}

function buildTemplateReflection({ mood, intensity, causes, journal, name, history }) {
  const tier = mood.tier;
  const lib = TIER_LIBRARY[String(tier)] || TIER_LIBRARY[0];
  const seed = todayISO() + mood.key + intensity;
  const firstName = (name || 'friend').split(' ')[0];
  const intensityWord = INTENSITY_LABELS[intensity - 1].toLowerCase();

  const causeNotes = (causes || []).filter(c => c !== 'Other').slice(0, 2).map(c => CAUSE_NOTES[c]).filter(Boolean);
  let causeSentence = '';
  if (causeNotes.length === 1) causeSentence = ` It sounds like this is connected to ${causeNotes[0]}.`;
  else if (causeNotes.length === 2) causeSentence = ` It sounds like this is connected to ${causeNotes[0]} and ${causeNotes[1]}.`;

  const opens = {
    3: [`${greetingWord()}, ${firstName}. What a gift to sit with you in this ${intensityWord} feeling of ${mood.label.toLowerCase()} today.`,
        `${firstName}, thank you for pausing to notice this ${intensityWord} sense of ${mood.label.toLowerCase()} in your heart today.`],
    0: [`${greetingWord()}, ${firstName}. Thank you for checking in and naming how you feel today.`,
        `${firstName}, I'm glad you paused today, even if today feels fairly ordinary.`],
    '-2': [`${greetingWord()}, ${firstName}. Thank you for being honest that today feels ${intensityWord} ${mood.label.toLowerCase()}.`,
           `${firstName}, I hear you — this ${intensityWord} weight of ${mood.label.toLowerCase()} is real, and you were brave to name it.`],
  };
  const openBucket = tier >= 2 ? 3 : (tier <= -2 ? '-2' : 0);

  const closes = {
    3: [`Carry this joy forward as worship — let it be one more reason to trust Him tomorrow, whatever it holds.`,
        `Let this be a marker of God's goodness that you can look back on in harder seasons.`],
    0: [`Whatever today holds, you are held by a God who never changes, even when your feelings do.`,
        `Take this quiet moment with Him — He is present in the ordinary just as much as in the extraordinary.`],
    '-2': [`You are not walking through this alone. Christ is near, and so is your church family — please don't carry this in silence.`,
           `This feeling is not the final word over your day. God's mercies are new this morning, and He is not finished with you.`],
  };
  const closeBucket = tier >= 2 ? 3 : (tier <= -2 ? '-2' : 0);

  const devotional = [
    pick(opens[openBucket], seed + 'o') + causeSentence,
    patternClause(history || [], tier),
    pick(closes[closeBucket], seed + 'c'),
  ].filter(Boolean).join(' ');

  const reading = pickReading(mood, causes);

  const prayer = buildTemplatePrayer({ mood, tier, causeNotes, reading, seed });
  const encouragement = pick(lib.encouragement, seed + 'e');
  const questions = pickN(lib.questions, 3, seed + 'q');
  let action = pick(lib.actions, seed + 'a');
  if ((causes || []).includes('Loneliness') || (causes || []).includes('Homesickness')) action = 'Call your family — even a short message can lighten a homesick heart.';
  else if ((causes || []).includes('Church') || (causes || []).includes('Ministry')) action = tier >= 1 ? 'Encourage another believer today, especially someone serving alongside you.' : 'Reach out to your Life Group leader or ministry head this week.';

  return { devotional, prayer, encouragement, reading, questions, action, source: 'template' };
}

function buildTemplatePrayer({ mood, tier, causeNotes, reading, seed }) {
  const acknowledge = tier >= 2
    ? `Lord, thank You for this moment of ${mood.label.toLowerCase()} You've given today.`
    : tier <= -1
      ? `Lord, You see me right now, feeling ${mood.label.toLowerCase()}${causeNotes.length ? ', weighed down by ' + causeNotes[0] : ''}.`
      : `Lord, I come to You in this ordinary moment, just as I am today.`;
  const thanksgiving = `Thank You that You are near, that Your mercies are new every morning, and that nothing about today has surprised You.`;
  const surrender = tier <= -1
    ? `I surrender this feeling to You — I don't have to carry it alone or pretend it isn't there. Take what is heavy and carry it with me.`
    : `I surrender this day to You, asking that whatever comes next would be for Your glory and my good.`;
  const hope = `I hold on to hope, not because of how I feel, but because of who You are and what You have already done through Christ.`;
  const scripture = `Your Word says, ${reading.note}`;
  const trust = `I choose to trust You today, one step at a time, even where I don't fully understand.`;
  const closing = pick([
    'In Jesus\' name, amen.',
    'I pray this trusting in Your love, in Jesus\' name, amen.',
  ], seed + 'p');
  return [acknowledge, thanksgiving, surrender, hope, scripture, trust, closing].join(' ');
}

// =============================================================================
// PASTORAL CARE DETECTION (heuristic, descriptive — never diagnostic)
// =============================================================================

function detectCrisisLanguage(text) {
  if (!text) return false;
  const lower = text.toLowerCase();
  return CRISIS_KEYWORDS.some(k => lower.includes(k));
}

function computeCareSignal(entries) {
  const cutoff = addDays(todayISO(), -14);
  const recent = entries.filter(e => e.date >= cutoff);
  const hardCount = recent.filter(e => e.tier <= -2).length;
  const crisisCount = recent.filter(e => e.tier === CRISIS_TIER).length;

  const sorted = [...entries].sort((a, b) => a.date.localeCompare(b.date));
  let run = 0, longestRun = 0;
  for (const e of sorted) {
    if (e.tier <= -1) { run++; longestRun = Math.max(longestRun, run); } else { run = 0; }
  }
  const lastFive = sorted.slice(-5);
  const keywordHit = lastFive.some(e => detectCrisisLanguage(e.journal));

  const trigger = crisisCount >= 3 || hardCount >= 6 || longestRun >= 5 || keywordHit;
  return { trigger, severity: keywordHit ? 'urgent' : 'gentle', hardCount, crisisCount, longestRun, keywordHit };
}

function buildAiSystemPrompt() {
  return `You are a warm, mature Christian mentor writing a private daily devotional reflection for a member of a Filipino church community (Free Life Christian Church), many of whom are Overseas Filipino Workers (OFWs) far from home. You respond with biblical wisdom, emotional honesty, and pastoral warmth — never generic, never robotic, never repeated word-for-word between days.

Ground rules:
- This is NOT therapy, diagnosis, or a replacement for prayer, Scripture, pastoral care, or professional help.
- Never use clinical or diagnostic language.
- Acknowledge pain honestly. Never offer toxic positivity or dismiss hard feelings.
- Always point toward Christ, Scripture, prayer, and the local church community.
- Suggested Bible reading must be a REAL, specific reference (book, chapter, verses) appropriate to the mood: a Psalm for anxiety/sorrow, a Gospel passage for discouragement/weariness, an Epistle for encouragement/relational issues, Wisdom literature (Proverbs/Ecclesiastes) for decisions or an uncertain future.
- If recent entries or the journal text show signs of persistent hopelessness, isolation, or language suggesting crisis, set "careFlag": true so the app can gently invite the member to reach out to a Life Group leader, ministry leader, or pastor. Never shame them. Never diagnose.
- Keep it personal: reference their specific mood, intensity, causes, and journal entry (if given) rather than writing generically.

Respond with STRICT JSON only, no markdown fences, matching exactly this shape:
{"devotional": "120-180 word devotional reflection, second person, warm and specific",
 "prayer": "80-140 word first-person prayer prayed with/for the member: acknowledging emotions, thanksgiving, surrender, hope, a scripture truth woven in, trust, and a closing",
 "encouragement": "40-80 words of scripture-rooted encouragement, honest about pain, pointing to hope in Christ",
 "reading": {"reference": "specific book/chapter/verses", "note": "one sentence on why this passage fits today"},
 "questions": ["2 to 4 short, thoughtful reflection questions"],
 "action": "one simple, concrete spiritual action for today",
 "careFlag": true or false}`;
}

async function callAiReflection(payload) {
  const { apiKey, proxyUrl, proxySecret, model } = getAiConfig();
  if (!apiKey && !proxyUrl) return null;

  const endpoint = proxyUrl ? proxyUrl.replace(/\/+$/, '') + '/proxy' : 'https://api.anthropic.com/v1/messages';
  const headers = { 'Content-Type': 'application/json' };
  if (!proxyUrl) {
    headers['x-api-key'] = apiKey;
    headers['anthropic-version'] = '2023-06-01';
    headers['anthropic-dangerous-direct-browser-access'] = 'true';
  } else if (proxySecret) {
    headers['x-proxy-secret'] = proxySecret;
  }

  const historyLines = (payload.history || []).slice(-7)
    .map(e => `${e.date}: ${e.mood} (intensity ${e.intensity}/5)${e.journal ? ' — journaled' : ''}`).join('\n') || 'No prior entries yet.';

  const userMsg = `Member: ${payload.name || 'a church member'}
Time of day: ${payload.timeOfDay}
Weather: ${payload.weatherDesc || 'unknown'}
Today's mood: ${payload.mood} (intensity ${payload.intensity}/5 — ${INTENSITY_LABELS[payload.intensity - 1]})
Causes selected: ${(payload.causes || []).join(', ') || 'none given'}
Journal entry: ${payload.journal ? '"' + payload.journal + '"' : '(no journal entry written today)'}
Check-in streak: ${payload.checkinStreak} day(s)
Recent mood history (most recent last):
${historyLines}

Write today's personalized devotional reflection now, following the JSON schema exactly.`;

  try {
    const res = await fetch(endpoint, {
      method: 'POST',
      headers,
      body: JSON.stringify({
        model,
        max_tokens: 1400,
        system: buildAiSystemPrompt(),
        messages: [{ role: 'user', content: userMsg }],
      }),
    });
    if (!res.ok) return null;
    const data = await res.json();
    const text = data?.content?.[0]?.text || '';
    const cleaned = text.replace(/^```json\s*/i, '').replace(/^```\s*/i, '').replace(/```\s*$/, '').trim();
    const parsed = JSON.parse(cleaned);
    if (!parsed.devotional || !parsed.prayer) return null;
    return {
      devotional: parsed.devotional,
      prayer: parsed.prayer,
      encouragement: parsed.encouragement || '',
      reading: parsed.reading || null,
      questions: Array.isArray(parsed.questions) ? parsed.questions.slice(0, 4) : [],
      action: parsed.action || '',
      careFlag: !!parsed.careFlag,
      source: 'ai',
    };
  } catch { return null; }
}

function TrendChart({ points }) {
  const w = 560, h = 160, pad = 24;
  if (points.length < 2) {
    return <div style={{ fontSize: '0.85rem', color: 'var(--ink-subtle)', textAlign: 'center', padding: '2rem 0' }}>Check in a few more days to see your trend here.</div>;
  }
  const xs = points.map((_, i) => pad + (i * (w - pad * 2)) / (points.length - 1));
  const ys = points.map(p => h / 2 - (p.value / 3.2) * (h / 2 - pad));
  const path = xs.map((x, i) => `${i === 0 ? 'M' : 'L'} ${x.toFixed(1)} ${ys[i].toFixed(1)}`).join(' ');
  const areaPath = `${path} L ${xs[xs.length - 1].toFixed(1)} ${h - pad} L ${xs[0].toFixed(1)} ${h - pad} Z`;
  return (
    <svg viewBox={`0 0 ${w} ${h}`} style={{ width: '100%', height: 'auto', display: 'block' }} preserveAspectRatio="xMidYMid meet">
      <line x1={pad} y1={h / 2} x2={w - pad} y2={h / 2} stroke="var(--border)" strokeWidth="1" strokeDasharray="4 4" />
      <path d={areaPath} fill="url(#moodGrad)" opacity="0.5" />
      <path d={path} fill="none" stroke="var(--accent)" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" />
      {xs.map((x, i) => {
        const c = tierColor(Math.round(points[i].value));
        return <circle key={i} cx={x} cy={ys[i]} r="4" fill={c.fg} stroke="#fff" strokeWidth="1.5" />;
      })}
      <defs>
        <linearGradient id="moodGrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stopColor="var(--accent)" stopOpacity="0.35" />
          <stop offset="100%" stopColor="var(--accent)" stopOpacity="0" />
        </linearGradient>
      </defs>
    </svg>
  );
}

function EmotionalCalendar({ entries, monthKeyVal, onNavigate }) {
  const byDate = useMemo(() => Object.fromEntries(entries.map(e => [e.date, e])), [entries]);
  const [y, m] = monthKeyVal.split('-').map(Number);
  const first = new Date(y, m - 1, 1);
  const startDow = first.getDay();
  const daysInMonth = new Date(y, m, 0).getDate();
  const cells = [];
  for (let i = 0; i < startDow; i++) cells.push(null);
  for (let d = 1; d <= daysInMonth; d++) cells.push(d);
  const today = todayISO();

  return (
    <div>
      <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', marginBottom: '0.75rem' }}>
        <button className="icon-btn" onClick={() => onNavigate(-1)} aria-label="Previous month">‹</button>
        <div style={{ fontWeight: 600 }}>{first.toLocaleDateString('en-US', { month: 'long', year: 'numeric' })}</div>
        <button className="icon-btn" onClick={() => onNavigate(1)} aria-label="Next month">›</button>
      </div>
      <div className="cal-grid">
        {['S', 'M', 'T', 'W', 'T', 'F', 'S'].map((d, i) => (
          <div key={i} style={{ textAlign: 'center', fontSize: '0.7rem', color: 'var(--ink-subtle)', fontWeight: 600 }}>{d}</div>
        ))}
        {cells.map((day, i) => {
          if (!day) return <div key={i} />;
          const iso = `${y}-${pad2(m)}-${pad2(day)}`;
          const entry = byDate[iso];
          const c = entry ? tierColor(entry.tier) : null;
          return (
            <div key={i} className={`cal-cell${iso === today ? ' today' : ''}`}>
              <span>{day}</span>
              {c && <span className="cal-dot" style={{ background: c.fg }} />}
            </div>
          );
        })}
      </div>
    </div>
  );
}

function computeInsights(entries) {
  if (entries.length < 5) return [];
  const insights = [];
  const overall = avg(entries.map(e => e.tier));

  const byDow = {};
  entries.forEach(e => {
    const dow = parseISO(e.date).toLocaleDateString('en-US', { weekday: 'long' });
    (byDow[dow] = byDow[dow] || []).push(e.tier);
  });
  let bestDow = null, bestDiff = 0.75, worstDow = null, worstDiff = 0.75;
  Object.entries(byDow).forEach(([dow, tiers]) => {
    if (tiers.length < 2) return;
    const diff = avg(tiers) - overall;
    if (diff > bestDiff) { bestDiff = diff; bestDow = dow; }
    if (-diff > worstDiff) { worstDiff = -diff; worstDow = dow; }
  });
  if (bestDow) insights.push(`You tend to feel more at peace on ${bestDow}s.`);
  if (worstDow) insights.push(`${worstDow}s tend to be harder for you — consider extra rest or prayer that day.`);

  const journaled = entries.filter(e => e.journal && e.journal.trim());
  const notJournaled = entries.filter(e => !e.journal || !e.journal.trim());
  if (journaled.length >= 3 && notJournaled.length >= 3) {
    const diff = avg(journaled.map(e => e.tier)) - avg(notJournaled.map(e => e.tier));
    if (diff > 0.5) insights.push('When you spend time journaling, your entries tend to be more hopeful.');
  }

  const hardEntries = entries.filter(e => e.tier <= -2);
  if (hardEntries.length >= 3) {
    const tally = {};
    hardEntries.forEach(e => (e.causes || []).forEach(c => (tally[c] = (tally[c] || 0) + 1)));
    const [topCause, count] = Object.entries(tally).sort((a, b) => b[1] - a[1])[0] || [];
    if (topCause && count / hardEntries.length >= 0.4) insights.push(`${topCause} appears often on your harder days.`);
  }

  const brightEntries = entries.filter(e => e.tier >= 2);
  const gratitudeCauses = ['Answered prayer', 'Blessings', 'Thankfulness'];
  const gratitudeCount = brightEntries.filter(e => (e.causes || []).some(c => gratitudeCauses.includes(c))).length;
  if (brightEntries.length >= 3 && gratitudeCount / brightEntries.length >= 0.4) {
    insights.push('Gratitude and thankfulness show up often on your brighter days.');
  }

  if (entries.length >= 14) {
    const sorted = [...entries].sort((a, b) => a.date.localeCompare(b.date));
    const lastWeek = sorted.slice(-7);
    const priorWeek = sorted.slice(-14, -7);
    const diff = avg(lastWeek.map(e => e.tier)) - avg(priorWeek.map(e => e.tier));
    if (diff > 0.6) insights.push('Your overall mood this week has felt gentler than last week.');
    else if (diff < -0.6) insights.push('This week has felt a bit heavier than last week — be gentle with yourself.');
  }

  return insights.slice(0, 5);
}

function TrendsTab({ entries }) {
  const [range, setRange] = useState('week');
  const [calMonth, setCalMonth] = useState(monthKey(todayISO()));

  const sorted = useMemo(() => [...entries].sort((a, b) => a.date.localeCompare(b.date)), [entries]);

  const points = useMemo(() => {
    if (range === 'week') {
      const days = Array.from({ length: 7 }).map((_, i) => addDays(todayISO(), i - 6));
      return days.map(d => ({ date: d, value: sorted.find(e => e.date === d)?.tier ?? null })).filter(p => p.value !== null || true).map(p => ({ ...p, value: p.value ?? 0 }));
    }
    if (range === 'month') {
      const days = Array.from({ length: 30 }).map((_, i) => addDays(todayISO(), i - 29));
      return days.filter(d => sorted.some(e => e.date === d)).map(d => ({ date: d, value: sorted.find(e => e.date === d).tier }));
    }
    // year — monthly averages
    const months = Array.from({ length: 12 }).map((_, i) => {
      const dt = new Date(); dt.setMonth(dt.getMonth() - (11 - i));
      return monthKey(dateISO(dt));
    });
    return months.map(mk => {
      const vals = sorted.filter(e => monthKey(e.date) === mk).map(e => e.tier);
      return vals.length ? { date: mk, value: avg(vals) } : null;
    }).filter(Boolean);
  }, [range, sorted]);

  const streakDates = entries.map(e => e.date);
  const journalDates = entries.filter(e => e.journal && e.journal.trim()).map(e => e.date);
  const prayerDates = entries.filter(e => e.prayerDone).map(e => e.date);
  const actionDates = entries.filter(e => e.actionDone).map(e => e.date);

  const checkinStreak = computeStreak(streakDates);
  const journalStreak = computeStreak(journalDates);
  const prayerStreak = computeStreak(prayerDates);
  const actionStreak = computeStreak(actionDates);

  const moodCounts = useMemo(() => {
    const tally = {};
    entries.forEach(e => (tally[e.mood] = (tally[e.mood] || 0) + 1));
    return Object.entries(tally).sort((a, b) => b[1] - a[1]).slice(0, 5);
  }, [entries]);

  const overallAvg = entries.length ? avg(entries.map(e => e.tier)) : null;
  const insights = useMemo(() => computeInsights(entries), [entries]);

  if (!entries.length) {
    return (
      <div className="card fade-in" style={{ textAlign: 'center', padding: '2.5rem 1.5rem' }}>
        <div style={{ fontSize: '2rem', marginBottom: '0.75rem' }}>🌱</div>
        <div style={{ fontWeight: 600, marginBottom: '0.4rem' }}>Your trends will appear here</div>
        <div style={{ fontSize: '0.9rem', color: 'var(--ink-muted)' }}>Check in daily and your mood trends, streaks, and insights will grow over time.</div>
      </div>
    );
  }

  return (
    <div className="fade-in">
      <div className="card">
        <div className="eyebrow">Mood Trend</div>
        <div style={{ display: 'flex', gap: '0.5rem', marginBottom: '0.75rem' }}>
          {[['week', 'Week'], ['month', 'Month'], ['year', 'Year']].map(([v, l]) => (
            <button key={v} className="chip" style={range === v ? { background: 'var(--ink)', borderColor: 'var(--ink)', color: '#fff' } : {}} onClick={() => setRange(v)}>{l}</button>
          ))}
        </div>
        <TrendChart points={points} />
        {overallAvg !== null && (
          <div style={{ textAlign: 'center', marginTop: '0.5rem', fontSize: '0.85rem', color: 'var(--ink-muted)' }}>
            Average mood: <strong style={{ color: 'var(--ink)' }}>{overallAvg > 0.5 ? 'Generally Positive' : overallAvg < -0.5 ? 'Generally Difficult' : 'Fairly Steady'}</strong>
          </div>
        )}
      </div>

      <div className="card">
        <div className="eyebrow">Streaks</div>
        <div className="streak-grid">
          <div className="streak-tile"><div className="streak-num">🔥 {checkinStreak.current}</div><div className="streak-label">Check-in Streak</div></div>
          <div className="streak-tile"><div className="streak-num">📔 {journalStreak.current}</div><div className="streak-label">Journal Streak</div></div>
          <div className="streak-tile"><div className="streak-num">🙏 {prayerStreak.current}</div><div className="streak-label">Prayer Streak</div></div>
          <div className="streak-tile"><div className="streak-num">🕊️ {actionStreak.current}</div><div className="streak-label">Devotion Streak</div></div>
        </div>
      </div>

      <div className="card">
        <div className="eyebrow">Most Common Emotions</div>
        <div style={{ display: 'flex', flexDirection: 'column', gap: '0.6rem' }}>
          {moodCounts.map(([key, count]) => {
            const m = MOOD_BY_KEY[key];
            const c = tierColor(m.tier);
            const pct = Math.round((count / entries.length) * 100);
            return (
              <div key={key} style={{ display: 'flex', alignItems: 'center', gap: '0.6rem' }}>
                <span style={{ fontSize: '1.2rem' }}>{m.emoji}</span>
                <span style={{ fontSize: '0.9rem', width: 92 }}>{m.label}</span>
                <div style={{ flex: 1, background: 'var(--bg)', borderRadius: 999, height: 8, overflow: 'hidden' }}>
                  <div style={{ width: `${pct}%`, background: c.fg, height: '100%' }} />
                </div>
                <span style={{ fontSize: '0.75rem', color: 'var(--ink-subtle)', width: 28, textAlign: 'right' }}>{count}</span>
              </div>
            );
          })}
        </div>
      </div>

      <div className="card">
        <div className="eyebrow">Emotional Calendar</div>
        <EmotionalCalendar entries={entries} monthKeyVal={calMonth} onNavigate={n => {
          const [y, m] = calMonth.split('-').map(Number);
          const dt = new Date(y, m - 1 + n, 1);
          setCalMonth(monthKey(dateISO(dt)));
        }} />
      </div>

      <div className="card">
        <div className="eyebrow">✨ AI Insights</div>
        {insights.length ? (
          <div style={{ display: 'flex', flexDirection: 'column', gap: '0.6rem' }}>
            {insights.map((ins, i) => <div key={i} style={{ fontSize: '0.9rem', lineHeight: 1.6 }}>· {ins}</div>)}
          </div>
        ) : (
          <div style={{ fontSize: '0.85rem', color: 'var(--ink-subtle)' }}>Keep checking in daily — patterns and insights will appear here once there's enough history.</div>
        )}
        <div style={{ fontSize: '0.7rem', color: 'var(--ink-subtle)', marginTop: '0.75rem', fontStyle: 'italic' }}>These are gentle, descriptive observations — not medical or psychological conclusions.</div>
      </div>
    </div>
  );
}

function CheckinWizard({ onComplete, onCancel }) {
  const [step, setStep] = useState(0);
  const [mood, setMood] = useState(null);
  const [intensity, setIntensity] = useState(3);
  const [causes, setCauses] = useState([]);
  const [journal, setJournal] = useState('');
  const totalSteps = 4;

  const toggleCause = (c) => setCauses(prev => prev.includes(c) ? prev.filter(x => x !== c) : [...prev, c]);
  const words = wordCount(journal);
  const over = words > 1000;

  const next = () => setStep(s => Math.min(totalSteps - 1, s + 1));
  const back = () => step === 0 ? onCancel() : setStep(s => s - 1);

  return (
    <div className="fade-in">
      <ProgressDots step={step} total={totalSteps} />
      {step === 0 && (
        <div className="card">
          <div className="step-title">How are you really feeling?</div>

          <IntensitySlider value={intensity} onChange={setIntensity} />
          <button className="btn-big accent" style={{ marginTop: '1rem' }} onClick={next}>Continue</button>
        </div>
      )}
      {step === 2 && (
        <div className="card">
          <div className="step-title">What's contributing to this?</div>
          <div className="step-sub">Choose as many as apply — or none, if you're not sure.</div>
          <CausesGrid value={causes} onToggle={toggleCause} />
          <button className="btn-big accent" style={{ marginTop: '1.5rem' }} onClick={next}>Continue</button>
        </div>
      )}
      {step === 3 && (
        <div className="card">
          <div className="step-title">Would you like to write more?</div>
          <div className="step-sub">What happened today? What's on your heart? Would you like to tell God something? This stays completely private.</div>
          <textarea className="journal-input" placeholder="Write as much or as little as you like…" value={journal} onChange={e => setJournal(e.target.value)} />
          <div className={`word-count${over ? ' over' : ''}`}>{words} / 1000 words</div>
          <button className="btn-big accent" style={{ marginTop: '1rem' }} disabled={over}
            onClick={() => onComplete({ mood, intensity, causes, journal: journal.trim() })}>
            Complete Check-in
          </button>
        </div>
      )}
      {step > 0 && (
        <button className="link-btn" style={{ display: 'block', margin: '0.75rem auto 0' }} onClick={back}>← Back</button>
      )}
    </div>
  );
}

// =============================================================================
// MAIN APP
// =============================================================================

function App() {
  const { me, meId } = useLocalMember();
  const { weather } = useWeather();
  const [entries, setEntries] = useState([]);
  const [tab, setTab] = useState('today');
  const [checkingIn, setCheckingIn] = useState(false);
  const [generating, setGenerating] = useState(false);
  const [scale, setScale] = useState(() => {
    try { return parseFloat(localStorage.getItem(FONT_SCALE_KEY)) || 1; } catch { return 1; }
  });
  const [shareEntry, setShareEntry] = useState(null);
  const [showPrivacy, setShowPrivacy] = useState(false);
  const [careDismissed, setCareDismissed] = useState(false);
  const [ministry, setMinistry] = useState(null);

  useEffect(() => { document.documentElement.style.setProperty('--scale', scale); try { localStorage.setItem(FONT_SCALE_KEY, String(scale)); } catch {} }, [scale]);

  useEffect(() => {
    if (meId === null && meId !== undefined) { /* still resolving */ }
    setEntries(loadEntries(meId));
  }, [meId]);

  useEffect(() => {
    fetch(`${DATA_URL}?t=${Date.now()}`).then(r => r.json()).then(d => setMinistry(d.ministry || null)).catch(() => {});
  }, []);

  useEffect(() => {
    try {
      const dismissedDate = localStorage.getItem(CARE_DISMISS_PREFIX + (meId || 'guest'));
      setCareDismissed(dismissedDate === todayISO());
    } catch {}
  }, [meId]);

  const today = todayISO();
  const todayEntry = entries.find(e => e.date === today);
  const careSignal = useMemo(() => computeCareSignal(entries), [entries]);

  const persist = (next) => { setEntries(next); saveEntries(meId, next); };

  const handleComplete = async ({ mood, intensity, causes, journal }) => {
    setGenerating(true);
    const moodMeta = MOOD_BY_KEY[mood];
    const history = entries.map(e => ({ date: e.date, mood: e.mood, tier: e.tier, intensity: e.intensity, journal: e.journal }));
    const checkinStreak = computeStreak(entries.map(e => e.date)).current;

    let reflection = null;
    try {
      reflection = await callAiReflection({
        name: me?.name, timeOfDay: timeOfDay(),
        weatherDesc: weather ? `${Math.round(weather.temp)}°C, ${weatherLabel(weather.code, weather.isDay)}` : null,
        mood: moodMeta.label, intensity, causes, journal, checkinStreak, history,
      });
    } catch {}
    if (!reflection) {
      reflection = buildTemplateReflection({ mood: moodMeta, intensity, causes, journal, name: me?.name, history });
    }
    if (!reflection.reading) reflection.reading = pickReading(moodMeta, causes);

    const entry = {
      date: today, mood, tier: moodMeta.tier, intensity, causes, journal,
      weather: weather ? { temp: weather.temp, code: weather.code, city: weather.city } : null,
      reflection, prayerDone: false, actionDone: false, createdAt: new Date().toISOString(),
    };
    persist([...entries.filter(e => e.date !== today), entry]);
    setGenerating(false);
    setCheckingIn(false);
  };

  const markPrayed = () => persist(entries.map(e => e.date === today ? { ...e, prayerDone: !e.prayerDone } : e));
  const markAction = () => persist(entries.map(e => e.date === today ? { ...e, actionDone: !e.actionDone } : e));

  const dismissCare = () => {
    try { localStorage.setItem(CARE_DISMISS_PREFIX + (meId || 'guest'), todayISO()); } catch {}
    setCareDismissed(true);
  };

  const firstName = (me?.name || '').split(' ')[0];
  const greetingName = firstName ? `, ${firstName}` : '';

  return (
    <React.Fragment>
      <div className="app-header">
        <div className="header-row">
          <div>
            <div className="greeting">{greetingWord()}{greetingName}.</div>
            {!todayEntry && <div className="greeting-sub">Before today's devotion, how are you really feeling?</div>}
            {todayEntry && <div className="greeting-sub">You've already checked in today — come back tomorrow for your next reflection.</div>}
          </div>
          <div style={{ display: 'flex', gap: '0.4rem', flexShrink: 0 }}>
            <FontScaleControl scale={scale} onChange={setScale} />
            <button className="icon-btn" onClick={() => setShowPrivacy(true)} aria-label="Privacy info">🔒</button>
          </div>
        </div>
        <div className="segmented">
          <button className={tab === 'today' ? 'active' : ''} onClick={() => setTab('today')}>Today</button>
          <button className={tab === 'trends' ? 'active' : ''} onClick={() => setTab('trends')}>Trends</button>
        </div>
      </div>

      <div className="content">
        {tab === 'today' && (
          <React.Fragment>
            {careSignal.trigger && !careDismissed && (
              <CareBanner signal={careSignal} ministry={ministry} memberFirstName={firstName} onDismiss={dismissCare} />
            )}

            {!checkingIn && !todayEntry && <WeatherCard weather={weather} />}

            {checkingIn ? (
              generating ? (
                <div className="card fade-in" style={{ textAlign: 'center', padding: '3rem 1.5rem' }}>
                  <div style={{ fontSize: '2rem', marginBottom: '1rem' }}>🕊️</div>
                  <div style={{ fontWeight: 600 }}>Preparing your reflection…</div>
                  <div style={{ fontSize: '0.85rem', color: 'var(--ink-muted)', marginTop: '0.4rem' }}>Just a moment while we bring this before God with you.</div>
                </div>
              ) : (
                <CheckinWizard onComplete={handleComplete} onCancel={() => setCheckingIn(false)} />
              )
            ) : todayEntry ? (
              <ReflectionView entry={todayEntry} onMarkPrayed={markPrayed} onMarkAction={markAction} onShare={() => setShareEntry(todayEntry)} />
            ) : (
              <button className="btn-big accent" onClick={() => setCheckingIn(true)}>Begin Today's Check-in</button>
            )}
          </React.Fragment>
        )}

        {tab === 'trends' && <TrendsTab entries={entries} />}
      </div>

      <div className="disclaimer">
        This devotional journal is designed to encourage your walk with Christ. It is not a replacement for the Bible, prayer, Christian fellowship, pastoral guidance, professional counseling, or your personal relationship with God. If you are experiencing prolonged emotional distress or thoughts of harming yourself, please seek immediate help from trusted family members, church leaders, local emergency services, or qualified mental health professionals.
      </div>

      {shareEntry && <ShareModal entry={shareEntry} ministry={ministry} memberFirstName={firstName} onClose={() => setShareEntry(null)} />}
      {showPrivacy && <PrivacyModal onClose={() => setShowPrivacy(false)} />}
    </React.Fragment>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
