<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Schedule Editor — FLCC</title>
<script>window.addEventListener('DOMContentLoaded',function(){document.title='Schedule Editor — '+window.FLCC.short;});</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,ital,wght@9..144,0,400;9..144,0,600;9..144,0,700;9..144,1,400&family=Geist:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone@7.23.9/babel.min.js"></script>

<!-- Which church's schedule is being edited. Decides both the roster loaded
     and the file Publish writes to. -->
<script src="./church.js"></script>
<style>
  :root {
    --bg:#F8F7F2; --surface:#FFFFFF; --ink:#1A1A1E; --ink-2:#3D3D44; --ink-3:#6E6E78; --ink-4:#A8A8B3;
    --border:#E8E6DF; --border-2:#D5D2C8;
    --friday:#0EA5E9; --friday-soft:#E0F2FE; --friday-mid:#BAE6FD;
    --sunday:#8B5CF6; --sunday-soft:#EDE9FE; --sunday-mid:#DDD6FE;
    --accent:#A33B2A; --accent-hover:#7E2D1F;
    --success:#16A34A; --success-soft:#DCFCE7;
    --warning:#D97706; --warning-soft:#FEF3C7;
    --danger:#DC2626;
  }
  *{box-sizing:border-box;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;}
  html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'Geist',ui-sans-serif,system-ui,sans-serif;}
  .font-display{font-family:'Fraunces',Georgia,serif;}

  @keyframes fadeUp   {from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}
  @keyframes fadeIn   {from{opacity:0}to{opacity:1}}
  @keyframes scaleIn  {from{opacity:0;transform:scale(.92)}to{opacity:1;transform:scale(1)}}
  @keyframes spin     {to{transform:rotate(360deg)}}
  @keyframes pulse    {0%,100%{opacity:1}50%{opacity:.45}}
  @keyframes bounce   {0%,100%{transform:scale(1)}35%{transform:scale(1.18)}65%{transform:scale(.92)}}
  @keyframes shimmer  {0%{background-position:-400px 0}100%{background-position:400px 0}}
  @keyframes notif    {0%{transform:translateY(20px);opacity:0}12%{transform:translateY(0);opacity:1}80%{transform:translateY(0);opacity:1}100%{transform:translateY(20px);opacity:0}}

  .fade-up {animation:fadeUp .45s cubic-bezier(.22,1,.36,1) both;}
  .fade-in {animation:fadeIn .3s ease both;}
  .scale-in{animation:scaleIn .35s cubic-bezier(.34,1.56,.64,1) both;}
  .spin    {animation:spin 1s linear infinite;}

  .service-card{background:var(--surface);border:1px solid var(--border);border-radius:16px;overflow:hidden;transition:box-shadow .25s ease,transform .25s ease,border-color .25s ease;transform:translateY(0);}
  .service-card:hover{box-shadow:0 8px 32px rgba(0,0,0,.08);transform:translateY(-2px);border-color:var(--border-2);}
  .service-card.expanded{box-shadow:0 12px 48px rgba(0,0,0,.11);transform:translateY(-2px);}

  .card-body{max-height:0;overflow:hidden;transition:max-height .4s cubic-bezier(.4,0,.2,1),opacity .3s ease;opacity:0;}
  .card-body.open{max-height:1000px;opacity:1;}

  .field-input{width:100%;background:var(--bg);border:1.5px solid var(--border);border-radius:10px;padding:.45rem .7rem;font-size:.875rem;color:var(--ink);font-family:'Geist',sans-serif;transition:border-color .15s,box-shadow .15s,background .15s;outline:none;}
  .field-input:focus{border-color:var(--accent);background:var(--surface);box-shadow:0 0 0 3px rgba(163,59,42,.12);}
  select.field-input{font-family:'Geist',sans-serif;}

  .btn{display:inline-flex;align-items:center;gap:.45rem;padding:.5rem 1rem;border-radius:10px;font-size:.875rem;font-weight:600;border:1.5px solid transparent;cursor:pointer;transition:all .18s;white-space:nowrap;-webkit-tap-highlight-color:transparent;font-family:'Geist',sans-serif;}
  .btn:active{transform:scale(.96);}
  .btn-ghost{background:transparent;color:var(--ink-2);border-color:var(--border-2);}
  .btn-ghost:hover{background:var(--bg);}

  .publish-btn{position:relative;overflow:hidden;display:inline-flex;align-items:center;justify-content:center;gap:.5rem;padding:.75rem 1.75rem;border-radius:12px;font-size:.9375rem;font-weight:700;border:none;cursor:pointer;background:var(--accent);color:#fff;box-shadow:0 4px 18px rgba(163,59,42,.35);transition:background .2s,box-shadow .2s,transform .15s;-webkit-tap-highlight-color:transparent;font-family:'Geist',sans-serif;}
  .publish-btn::before{content:'';position:absolute;inset:0;background:linear-gradient(90deg,transparent 0%,rgba(255,255,255,.18) 50%,transparent 100%);background-size:400px 100%;opacity:0;transition:opacity .3s;}
  .publish-btn.loading::before{opacity:1;animation:shimmer 1.2s linear infinite;}
  .publish-btn:hover:not(:disabled){background:var(--accent-hover);box-shadow:0 6px 24px rgba(163,59,42,.42);transform:translateY(-1px);}
  .publish-btn:active:not(:disabled){transform:translateY(0) scale(.97);}
  .publish-btn:disabled{opacity:.7;cursor:wait;}
  .publish-btn.ok {background:var(--success);box-shadow:0 4px 18px rgba(22,163,74,.3);animation:bounce .5s ease;}
  .publish-btn.err{background:var(--danger); box-shadow:0 4px 18px rgba(220,38,38,.3);}

  .nav-tab{display:flex;align-items:center;gap:9px;width:100%;padding:.5rem .75rem;border-radius:10px;font-size:.875rem;font-weight:500;cursor:pointer;transition:all .18s;color:var(--ink-3);border:none;background:transparent;text-align:left;margin-bottom:2px;font-family:'Geist',sans-serif;}
  .nav-tab:hover {background:rgba(163,59,42,.06);color:var(--ink);}
  .nav-tab.active{background:rgba(163,59,42,.1);color:var(--accent);font-weight:700;}

  .month-item{display:flex;align-items:center;justify-content:space-between;padding:.5rem .75rem;border-radius:10px;font-size:.875rem;font-weight:500;cursor:pointer;transition:all .18s;color:var(--ink-3);border:none;background:transparent;width:100%;text-align:left;font-family:'Geist',sans-serif;}
  .month-item:hover {background:rgba(163,59,42,.07);color:var(--ink);}
  .month-item.active{background:rgba(163,59,42,.1);color:var(--accent);font-weight:700;}

  .m-tab{padding:.375rem .875rem;border-radius:999px;font-size:.8125rem;font-weight:500;cursor:pointer;border:none;white-space:nowrap;flex-shrink:0;transition:all .2s;font-family:'Geist',sans-serif;}
  .m-tab.active{background:var(--accent);color:#fff;box-shadow:0 3px 10px rgba(163,59,42,.3);}
  .m-tab.idle  {background:#F0EFE9;color:var(--ink-3);}
  .m-tab.idle:hover{background:#E5E3DB;color:var(--ink);}

  .svc-badge{display:inline-flex;align-items:center;gap:.35rem;padding:.2rem .65rem;border-radius:999px;font-size:.6875rem;font-weight:700;letter-spacing:.04em;text-transform:uppercase;}
  .field-label{font-size:.6rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-4);margin-bottom:4px;}
  .chevron{transition:transform .3s cubic-bezier(.34,1.56,.64,1);display:inline-block;}
  .chevron.up{transform:rotate(180deg);}

  .role-pill{padding:3px 9px;border-radius:999px;border:1.5px solid;font-size:.75rem;font-weight:600;cursor:pointer;transition:all .15s;font-family:'Geist',sans-serif;}

  input[type=checkbox].toggle{appearance:none;-webkit-appearance:none;width:36px;height:20px;border-radius:10px;background:var(--border-2);cursor:pointer;position:relative;transition:background .2s;flex-shrink:0;}
  input[type=checkbox].toggle:checked{background:var(--success);}
  input[type=checkbox].toggle::after{content:'';position:absolute;width:14px;height:14px;border-radius:50%;background:#fff;top:3px;left:3px;transition:transform .2s;box-shadow:0 1px 3px rgba(0,0,0,.2);}
  input[type=checkbox].toggle:checked::after{transform:translateX(16px);}

  .toast{position:fixed;bottom:28px;left:50%;transform:translateX(-50%);background:#1A1A1E;color:#fff;padding:12px 20px;border-radius:12px;font-size:.875rem;font-weight:500;display:flex;align-items:center;gap:10px;box-shadow:0 8px 32px rgba(0,0,0,.22);z-index:100;white-space:nowrap;animation:notif 3.5s ease forwards;}

  .progress-line{height:3px;border-radius:99px;background:var(--border);overflow:hidden;}
  .progress-fill{height:100%;border-radius:99px;transition:width .6s cubic-bezier(.22,1,.36,1);}

  .app-shell{display:grid;grid-template-columns:220px 1fr;grid-template-rows:auto 1fr;min-height:100vh;}
  .sidebar{grid-row:1/3;padding:28px 14px;border-right:1px solid var(--border);position:sticky;top:0;height:100vh;overflow-y:auto;display:flex;flex-direction:column;}
  .main-header{padding:22px 28px 16px;border-bottom:1px solid var(--border);}
  .main-content{padding:24px 28px 80px;overflow-y:auto;}

  @media(max-width:700px){
    .app-shell{grid-template-columns:1fr;grid-template-rows:auto auto 1fr;}
    .sidebar{display:none;}
    .main-header{padding:16px;}
    .main-content{padding:16px 16px 80px;}
  }
  ::-webkit-scrollbar{width:0;height:0;}

  /* ── DYNAMIC UI LAYER ──────────────────────────────────────────────── */
  :root { --spring: cubic-bezier(0.34, 1.56, 0.64, 1); }
  @keyframes gradientPulse { 0%,100%{background-position:0% 50%} 50%{background-position:100% 50%} }
  @keyframes fadeSlideUp { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:translateY(0)} }
  @keyframes tabPop { from{transform:scaleX(0);opacity:0} to{transform:scaleX(1);opacity:1} }

  .main-header {
    background: linear-gradient(180deg,rgba(237,233,254,0.4) 0%,rgba(250,250,245,0.95) 55%) !important;
    position: relative;
    overflow: hidden;
  }
  .main-header::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 3px;
    background: linear-gradient(90deg,#7C3AED,#6D28D9,#4F46E5,#7C3AED);
    background-size: 250% 100%;
    animation: gradientPulse 5s ease-in-out infinite;
  }
  .btn { transition:transform 0.18s var(--spring),box-shadow 0.18s ease,background 0.15s ease !important; }
  .btn:hover { transform:translateY(-2px); box-shadow:0 4px 14px rgba(0,0,0,0.12); }
  .btn:active { transform:translateY(0) scale(0.95) !important; }
  .card { transition:box-shadow 0.18s ease,border-color 0.15s ease !important; }
  .card:hover { box-shadow:0 6px 18px rgba(0,0,0,0.07); }
  input:focus, select:focus, textarea:focus { outline:none; border-color:#7C3AED !important; box-shadow:0 0 0 3px rgba(124,58,237,0.1) !important; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel" data-presets="react">
const { useState, useEffect, useMemo, useCallback } = React;

const CHURCH       = window.FLCC;
const DATA_URL     = CHURCH.data('data.json');
const GH_TOKEN_KEY = CHURCH.key('flcc-sched-editor-token-v1');
const GH_REPO      = 'ninlamster-blip/flcc-members-2026';
// Scoped to the active church — this editor can only overwrite its own
// church's schedule file.
const GH_FILE      = CHURCH.publishPath('data.json');

const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];

const ROLE_DEFS = [
  { key:'preacher',            label:'Preacher' },
  { key:'pastoralPrayer',      label:'Pastoral Prayer' },
  { key:'presider',            label:'Presider' },
  { key:'songLeader',          label:'Song Leader' },
  { key:'communionAssistant1', label:'Communion Asst. 1' },
  { key:'communionAssistant2', label:'Communion Asst. 2' },
  { key:'foodInCharge',        label:'Food In Charge' },
];

const ROLE_LABELS = Object.fromEntries(ROLE_DEFS.map(r=>[r.key,r.label]));

const TABS = [
  { id:'schedule', icon:'📅', label:'Schedule' },
  { id:'workers',  icon:'👥', label:'Workers'  },
  { id:'themes',   icon:'📖', label:'Themes'   },
  { id:'events',   icon:'🗓', label:'Events'   },
];

const EVT_COLORS = {
  birthday:    { bg:'#FEF3C7', color:'#92400E', border:'#FDE68A' },
  anniversary: { bg:'#EDE9FE', color:'#6D28D9', border:'#DDD6FE' },
  holiday:     { bg:'#F0FDF4', color:'#15803D', border:'#BBF7D0' },
  general:     { bg:'#F0F9FF', color:'#0369A1', border:'#BAE6FD' },
};

function fmt(iso) {
  if (!iso) return '—';
  const [y,m,d] = iso.split('-').map(Number);
  return new Date(y,m-1,d).toLocaleDateString('en-US',{weekday:'short',month:'long',day:'numeric'});
}
function uid()     { return `s${Date.now()}${Math.random().toString(36).slice(2,5)}`; }
function monthOf(iso){ return iso ? parseInt(iso.split('-')[1],10)-1 : -1; }
function initials(name){ return (name||'').split(' ').map(n=>n[0]).join('').slice(0,2).toUpperCase(); }
function workerName(id,workers){
  if(!id) return '';
  const w=workers.find(w=>w.id===id);
  return w ? (w.title?`${w.title} ${w.name}`:w.name) : id;
}

// ─── SvcBadge ─────────────────────────────────────────────────────────────────
function SvcBadge({service}){
  const cfg = service==='Friday'
    ? {bg:'var(--friday-soft)',color:'var(--friday)',dot:'#0EA5E9',label:'Friday'}
    : service==='Sunday'
    ? {bg:'var(--sunday-soft)',color:'var(--sunday)',dot:'#8B5CF6',label:'Sunday'}
    : {bg:'#F0EFE9',color:'var(--ink-3)',dot:'var(--ink-4)',label:service||'Other'};
  return (
    <span className="svc-badge" style={{background:cfg.bg,color:cfg.color}}>
      <span style={{width:6,height:6,borderRadius:'50%',background:cfg.dot,display:'inline-block'}}/>
      {cfg.label}
    </span>
  );
}

// ─── ServiceCard ──────────────────────────────────────────────────────────────
function ServiceCard({entry,isOpen,onToggle,onChange,onDelete,index,workers}){
  const roles = entry.roles||{};
  const setRole  = (k,v)=>onChange({...entry,roles:{...roles,[k]:v}});
  const setField = (k,v)=>onChange({...entry,[k]:v});

  const accentLine = entry.service==='Friday'?'var(--friday)':entry.service==='Sunday'?'var(--sunday)':'var(--border-2)';
  const svcColor   = entry.service==='Friday'?'var(--friday)':entry.service==='Sunday'?'var(--sunday)':'var(--ink-4)';

  const filledCount = ROLE_DEFS.filter(r=>roles[r.key]).length;
  const pct = Math.round((filledCount/ROLE_DEFS.length)*100);

  return (
    <div className={`service-card fade-up ${isOpen?'expanded':''}`}
      style={{marginBottom:12,animationDelay:`${index*55}ms`,borderLeft:`3px solid ${accentLine}`}}>

      {/* Header */}
      <div onClick={onToggle} style={{padding:'14px 16px',cursor:'pointer',display:'flex',alignItems:'flex-start',gap:10,userSelect:'none'}}>
        <div style={{flex:1,minWidth:0}}>
          <div style={{display:'flex',alignItems:'center',gap:8,flexWrap:'wrap',marginBottom:6}}>
            <SvcBadge service={entry.service}/>
            {entry.isSpecial && (
              <span style={{fontSize:'.6875rem',padding:'2px 8px',borderRadius:999,background:'#FEF3C7',color:'#92400E',fontWeight:600,border:'1px solid #FDE68A'}}>
                ✦ {entry.specialNote||'Special'}
              </span>
            )}
          </div>
          <div className="font-display" style={{fontSize:'1.0625rem',fontWeight:600,color:'var(--ink)',marginBottom:4}}>
            {fmt(entry.date)}
          </div>
          {!isOpen && (roles.preacher||roles.pastoralPrayer) && (
            <div style={{fontSize:'.8125rem',color:'var(--ink-3)',display:'flex',gap:12,flexWrap:'wrap'}}>
              {roles.preacher      && <span><span style={{color:'var(--ink-4)'}}>Preacher · </span>{workerName(roles.preacher,workers)}</span>}
              {roles.pastoralPrayer&& <span><span style={{color:'var(--ink-4)'}}>Prayer · </span>{workerName(roles.pastoralPrayer,workers)}</span>}
            </div>
          )}
          {!isOpen && pct>0 && (
            <div style={{marginTop:8}}>
              <div className="progress-line" style={{width:120}}>
                <div className="progress-fill" style={{width:`${pct}%`,background:pct===100?'var(--success)':svcColor}}/>
              </div>
            </div>
          )}
        </div>
        <div style={{display:'flex',alignItems:'center',gap:6,flexShrink:0,marginTop:2}}>
          {pct===100&&!isOpen&&<span title="All roles assigned">✅</span>}
          <span className={`chevron ${isOpen?'up':''}`} style={{color:'var(--ink-4)',fontSize:'.875rem'}}>▾</span>
        </div>
      </div>

      {/* Body */}
      <div className={`card-body ${isOpen?'open':''}`}>
        <div style={{padding:'0 16px 16px',borderTop:'1px solid var(--border)',paddingTop:14}}>
          <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:'8px 12px',marginBottom:12}}>
            <div>
              <div className="field-label">Date</div>
              <input type="date" className="field-input" value={entry.date||''} onChange={e=>setField('date',e.target.value)}/>
            </div>
            <div>
              <div className="field-label">Service Type</div>
              <select className="field-input" value={entry.service||''} onChange={e=>setField('service',e.target.value)}>
                <option value="Friday">Friday Service</option>
                <option value="Sunday">Sunday Service</option>
                <option value="">Other</option>
              </select>
            </div>
          </div>

          {/* Role dropdowns */}
          <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:'8px 12px',marginBottom:10}}>
            {ROLE_DEFS.map(({key,label})=>{
              const eligible = workers.filter(w=>w.status==='active'&&w.eligibleRoles.includes(key));
              return (
                <div key={key}>
                  <div className="field-label">{label}</div>
                  <select className="field-input" value={roles[key]||''} onChange={e=>setRole(key,e.target.value)}>
                    <option value="">— Select —</option>
                    {eligible.map(w=><option key={w.id} value={w.id}>{w.title} {w.name}</option>)}
                  </select>
                </div>
              );
            })}
          </div>

          {/* Special */}
          <div style={{marginBottom:10}}>
            <label style={{display:'flex',alignItems:'center',gap:8,cursor:'pointer',fontSize:'.8125rem',color:'var(--ink-3)',fontWeight:500,marginBottom:6}}>
              <input type="checkbox" className="toggle" checked={!!entry.isSpecial} onChange={e=>setField('isSpecial',e.target.checked)}/>
              Special service
            </label>
            {entry.isSpecial&&(
              <div>
                <div className="field-label">Note</div>
                <input className="field-input" value={entry.specialNote||''} onChange={e=>setField('specialNote',e.target.value)} placeholder="e.g. Lord's Supper, Anniversary Sunday"/>
              </div>
            )}
          </div>

          <div style={{display:'flex',justifyContent:'flex-end'}}>
            <button onClick={()=>{if(confirm(`Delete ${fmt(entry.date)}?`))onDelete(entry.id);}}
              style={{background:'none',border:'none',cursor:'pointer',fontSize:'.8125rem',color:'var(--danger)',padding:'4px 8px',borderRadius:6,fontWeight:500}}>
              🗑 Delete
            </button>
          </div>
        </div>
      </div>
    </div>
  );
}

// ─── Workers Tab ──────────────────────────────────────────────────────────────
function WorkersTab({workers,onChange,onDirty}){
  const [search,setSearch]=useState('');
  const [expId,setExpId]=useState(null);

  const update = w=>{onChange(workers.map(x=>x.id===w.id?w:x));onDirty();};
  const add    = ()=>{
    const id=`w${Date.now()}`;
    const w={id,name:'New Member',title:'',type:'individual',eligibleRoles:[],status:'active',birthday:''};
    onChange([...workers,w]);setExpId(id);onDirty();
  };
  const del = id=>{if(confirm('Remove this worker?')){onChange(workers.filter(w=>w.id!==id));onDirty();}};

  const filtered = workers.filter(w=>!search||(w.name+' '+w.title).toLowerCase().includes(search.toLowerCase()));

  return (
    <div>
      <div style={{display:'flex',gap:10,marginBottom:20,flexWrap:'wrap'}}>
        <input className="field-input" style={{maxWidth:280,flex:1}} placeholder="🔍 Search workers…" value={search} onChange={e=>setSearch(e.target.value)}/>
        <button onClick={add} style={{padding:'.5rem 1rem',borderRadius:10,background:'var(--accent)',color:'#fff',border:'none',fontWeight:700,fontSize:'.875rem',cursor:'pointer',whiteSpace:'nowrap',fontFamily:'Geist,sans-serif'}}>
          + Add Worker
        </button>
      </div>

      <div className="fade-in" style={{display:'flex',gap:8,marginBottom:18,flexWrap:'wrap'}}>
        {[
          {label:`${workers.filter(w=>w.status==='active').length} Active`,bg:'var(--success-soft)',color:'var(--success)'},
          {label:`${workers.filter(w=>w.type==='individual').length} Individual`,bg:'var(--friday-soft)',color:'var(--friday)'},
          {label:`${workers.filter(w=>w.type==='pair'||w.type==='family').length} Group`,bg:'var(--sunday-soft)',color:'var(--sunday)'},
        ].map(s=>(
          <div key={s.label} style={{padding:'5px 12px',borderRadius:999,background:s.bg,color:s.color,fontSize:'.8125rem',fontWeight:600}}>{s.label}</div>
        ))}
      </div>

      <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fill,minmax(280px,1fr))',gap:12}}>
        {filtered.map((w,i)=>{
          const isOpen=expId===w.id;
          const avatarCfg=w.type==='individual'
            ?{bg:'var(--friday-soft)',color:'var(--friday)'}
            :{bg:'var(--sunday-soft)',color:'var(--sunday)'};
          return (
            <div key={w.id} className={`service-card fade-up ${isOpen?'expanded':''}`} style={{animationDelay:`${i*25}ms`}}>
              <div onClick={()=>setExpId(isOpen?null:w.id)} style={{padding:'14px 16px',cursor:'pointer',display:'flex',alignItems:'center',gap:12}}>
                <div style={{width:40,height:40,borderRadius:'50%',background:avatarCfg.bg,color:avatarCfg.color,display:'flex',alignItems:'center',justifyContent:'center',fontWeight:700,fontSize:'.875rem',flexShrink:0}}>
                  {initials(w.name)}
                </div>

// ─── Events Tab ───────────────────────────────────────────────────────────────
function EventsTab({events,onChange,onDirty}){
  const [expId,setExpId]=useState(null);

  const update = ev=>{onChange(events.map(e=>e.id===ev.id?ev:e));onDirty();};
  const add    = ()=>{
    const id=`evt-${Date.now()}`;
    const ev={id,title:'',type:'general',date:'',startTime:'',endTime:'',location:'',notes:'',recurrence:'none',showOnDashboard:true};
    onChange([...events,ev]);setExpId(id);onDirty();
  };
  const del = id=>{if(confirm('Delete this event?')){onChange(events.filter(e=>e.id!==id));onDirty();}};

  const sorted=[...events].sort((a,b)=>(a.date||'').localeCompare(b.date||''));

  return (
    <div style={{maxWidth:680}}>
      <div style={{display:'flex',justifyContent:'flex-end',marginBottom:20}}>
        <button onClick={add} style={{padding:'.5rem 1rem',borderRadius:10,background:'var(--accent)',color:'#fff',border:'none',fontWeight:700,fontSize:'.875rem',cursor:'pointer',fontFamily:'Geist,sans-serif'}}>
          + Add Event
        </button>
      </div>

      {sorted.length===0?(
        <div style={{textAlign:'center',padding:'48px 20px',color:'var(--ink-4)'}}>
          <div style={{fontSize:'2.5rem',marginBottom:12}}>🗓</div>
          <div style={{fontWeight:600,fontSize:'1rem',color:'var(--ink-3)'}}>No events yet</div>
          <p style={{fontSize:'.875rem',marginTop:4}}>Add birthdays, anniversaries, and special occasions.</p>
        </div>
      ):sorted.map((ev,i)=>{
        const isOpen=expId===ev.id;
        const tc=EVT_COLORS[ev.type]||EVT_COLORS.general;
        return (
          <div key={ev.id} className={`service-card fade-up ${isOpen?'expanded':''}`} style={{marginBottom:10,animationDelay:`${i*35}ms`}}>
            <div onClick={()=>setExpId(isOpen?null:ev.id)} style={{padding:'14px 16px',cursor:'pointer',display:'flex',alignItems:'center',gap:12}}>
              <div style={{flex:1,minWidth:0}}>
                <div style={{display:'flex',alignItems:'center',gap:8,marginBottom:4,flexWrap:'wrap'}}>
                  <span style={{fontSize:'.6875rem',padding:'2px 8px',borderRadius:999,background:tc.bg,color:tc.color,border:`1px solid ${tc.border}`,fontWeight:700,textTransform:'uppercase',letterSpacing:'.04em'}}>{ev.type}</span>
                  {ev.showOnDashboard&&<span style={{fontSize:'.6875rem',color:'var(--success)',fontWeight:600}}>● Dashboard</span>}
                  {ev.recurrence!=='none'&&<span style={{fontSize:'.6875rem',color:'var(--ink-4)',fontWeight:500}}>🔁 {ev.recurrence}</span>}
                </div>
                <div style={{fontWeight:600,fontSize:'.9375rem',color:'var(--ink)'}}>{ev.title||'— Untitled event —'}</div>
                <div style={{fontSize:'.8125rem',color:'var(--ink-3)',marginTop:2}}>{ev.date?fmt(ev.date):'No date set'}</div>
              </div>
              <span className={`chevron ${isOpen?'up':''}`} style={{color:'var(--ink-4)',fontSize:'.875rem'}}>▾</span>
            </div>

            <div className={`card-body ${isOpen?'open':''}`}>
              <div style={{padding:'0 16px 16px',borderTop:'1px solid var(--border)',paddingTop:14}}>
                <div style={{display:'grid',gridTemplateColumns:'2fr 1fr',gap:'8px 12px',marginBottom:8}}>
                  <div style={{gridColumn:'1/-1'}}>
                    <div className="field-label">Title</div>
                    <input className="field-input" value={ev.title} onChange={e=>update({...ev,title:e.target.value})}/>
                  </div>
                  <div>
                    <div className="field-label">Date</div>
                    <input type="date" className="field-input" value={ev.date} onChange={e=>update({...ev,date:e.target.value})}/>
                  </div>
                  <div>
                    <div className="field-label">Type</div>
                    <select className="field-input" value={ev.type} onChange={e=>update({...ev,type:e.target.value})}>
                      {Object.keys(EVT_COLORS).map(t=><option key={t} value={t}>{t.charAt(0).toUpperCase()+t.slice(1)}</option>)}
                    </select>
                  </div>
                  <div>
                    <div className="field-label">Recurrence</div>
                    <select className="field-input" value={ev.recurrence||'none'} onChange={e=>update({...ev,recurrence:e.target.value})}>
                      <option value="none">Once</option>
                      <option value="yearly">Every Year</option>
                      <option value="monthly">Every Month</option>
                    </select>
                  </div>
                  <div>
                    <div className="field-label">Location</div>
                    <input className="field-input" value={ev.location||''} onChange={e=>update({...ev,location:e.target.value})} placeholder="Optional"/>
                  </div>
                  <div style={{gridColumn:'1/-1'}}>
                    <div className="field-label">Notes</div>
                    <input className="field-input" value={ev.notes||''} onChange={e=>update({...ev,notes:e.target.value})} placeholder="Optional"/>
                  </div>
                </div>
                <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginTop:8}}>
                  <label style={{display:'flex',alignItems:'center',gap:8,cursor:'pointer',fontSize:'.8125rem',color:'var(--ink-3)',fontWeight:500}}>
                    <input type="checkbox" className="toggle" checked={!!ev.showOnDashboard} onChange={e=>update({...ev,showOnDashboard:e.target.checked})}/>
                    Show on members dashboard
                  </label>
                  <button onClick={()=>del(ev.id)} style={{background:'none',border:'none',cursor:'pointer',fontSize:'.8125rem',color:'var(--danger)',padding:'4px 8px',borderRadius:6,fontWeight:500,fontFamily:'Geist,sans-serif'}}>
                    🗑 Delete
                  </button>
                </div>
              </div>
            </div>
          </div>
        );
      })}
    </div>
  );
}

// ─── Token Modal ──────────────────────────────────────────────────────────────
function TokenModal({onSave,onClose}){
  const [val,setVal]=useState('');
  const save=()=>{
    const v=val.trim();
    if(!v.startsWith('ghp_')&&!v.startsWith('github_pat_')){alert('Token should start with ghp_ or github_pat_');return;}
    onSave(v);
  };
  return (
    <div style={{position:'fixed',inset:0,background:'rgba(26,26,30,.5)',backdropFilter:'blur(8px)',display:'flex',alignItems:'center',justifyContent:'center',zIndex:200,padding:16}}
      onClick={onClose}>
      <div className="scale-in" style={{background:'var(--surface)',borderRadius:20,padding:28,maxWidth:480,width:'100%',boxShadow:'0 24px 80px rgba(0,0,0,.2)'}}
        onClick={e=>e.stopPropagation()}>
        <div className="font-display" style={{fontSize:'1.5rem',fontWeight:600,marginBottom:6}}>Connect GitHub</div>
        <p style={{fontSize:'.875rem',color:'var(--ink-3)',marginBottom:20,lineHeight:1.6}}>
          One-time setup. Your token is saved on this device only.
        </p>
        <ol style={{fontSize:'.8125rem',color:'var(--ink-3)',paddingLeft:18,lineHeight:2,marginBottom:18}}>
          <li>Go to <strong>github.com</strong> → Settings → Developer settings → Personal access tokens → <strong>Fine-grained tokens</strong></li>
          <li>Repository access → <strong>flcc-members-2026 only</strong></li>
          <li>Permissions → Contents → <strong>Read and write</strong> → Generate</li>
          <li>Copy the token and paste below</li>
        </ol>
        <input autoFocus type="password"
          style={{width:'100%',padding:'.6rem .8rem',borderRadius:10,border:'1.5px solid var(--border-2)',fontSize:'.9375rem',fontFamily:'Geist,sans-serif',outline:'none',marginBottom:12}}
          placeholder="github_pat_… or ghp_…"
          value={val} onChange={e=>setVal(e.target.value)} onKeyDown={e=>e.key==='Enter'&&save()}/>
        <div style={{display:'flex',gap:8,justifyContent:'flex-end'}}>
          <button className="btn btn-ghost" onClick={onClose}>Cancel</button>
          <button onClick={save} disabled={!val.trim()}
            style={{padding:'.55rem 1.25rem',borderRadius:10,background:'var(--success)',color:'#fff',border:'none',fontWeight:700,fontSize:'.9375rem',cursor:'pointer',opacity:val.trim()?1:.5,fontFamily:'Geist,sans-serif'}}>
            Connect →
          </button>
        </div>
      </div>
    </div>
  );
}

// ─── App ──────────────────────────────────────────────────────────────────────
function App(){
  const [fullData,    setFullData]    = useState(null);
  const [schedule,    setSchedule]    = useState([]);
  const [workers,     setWorkers]     = useState([]);
  const [themes,      setThemes]      = useState({});
  const [events,      setEvents]      = useState([]);
  const [loading,     setLoading]     = useState(true);
  const [error,       setError]       = useState('');
  const [activeTab,   setActiveTab]   = useState('schedule');
  const [activeMonth, setActiveMonth] = useState(MONTHS[new Date().getMonth()]);
  const [expandedId,  setExpandedId]  = useState(null);
  const [dirty,       setDirty]       = useState(false);
  const [toast,       setToast]       = useState(null);

  const [ghToken,      setGhToken]      = useState(()=>{try{return localStorage.getItem(GH_TOKEN_KEY)||'';}catch{return '';}});
  const [ghPublishing, setGhPublishing] = useState(false);
  const [ghStatus,     setGhStatus]     = useState('');
  const [showSetup,    setShowSetup]    = useState(false);

  useEffect(()=>{
    fetch(DATA_URL+'?t='+Date.now())
      .then(r=>r.json())
      .then(data=>{
        setFullData(data);
        setSchedule(data.schedule||[]);
        setWorkers(data.workers||[]);
        setThemes(data.themes||{});
        setEvents(data.events||[]);
        setLoading(false);
      })
      .catch(e=>{setError('Could not load data.json: '+e.message);setLoading(false);});
  },[]);

  const showToast = msg=>{setToast(msg);setTimeout(()=>setToast(null),3500);};
  const markDirty = useCallback(()=>setDirty(true),[]);

  const monthStats = useMemo(()=>{
    const map={};
    MONTHS.forEach((m,i)=>{map[m]=schedule.filter(s=>monthOf(s.date)===i).length;});
    return map;
  },[schedule]);

  const visibleEntries = useMemo(()=>{
    const mi=MONTHS.indexOf(activeMonth);
    return schedule.filter(s=>monthOf(s.date)===mi).sort((a,b)=>a.date.localeCompare(b.date));
  },[schedule,activeMonth]);

  const allFilled = useMemo(()=>
    visibleEntries.length>0&&visibleEntries.every(e=>ROLE_DEFS.every(r=>e.roles?.[r.key]))
  ,[visibleEntries]);

  const updateEntry = useCallback(updated=>{
    setSchedule(prev=>prev.map(s=>s.id===updated.id?updated:s));
    setDirty(true);
  },[]);

  const deleteEntry = useCallback(id=>{
    setSchedule(prev=>prev.filter(s=>s.id!==id));
    setDirty(true);setExpandedId(null);
  },[]);

  const addEntry = ()=>{
    const mi=MONTHS.indexOf(activeMonth)+1;
    const id=uid();
    setSchedule(prev=>[...prev,{
      id,date:`2026-${String(mi).padStart(2,'0')}-01`,service:'Friday',
      roles:{presider:'',songLeader:'',preacher:'',pastoralPrayer:'',communionAssistant1:'',communionAssistant2:'',foodInCharge:''},
      isSpecial:false,specialNote:'',swapped:false,swapPartner:null,swapNote:''
    }]);
    setExpandedId(id);setDirty(true);
  };

  const saveToken = v=>{
    setGhToken(v);try{localStorage.setItem(GH_TOKEN_KEY,v);}catch{}
    setShowSetup(false);showToast('✓ GitHub connected');
  };

  const publishToGitHub = async()=>{
    if(!ghToken){setShowSetup(true);return;}
    setGhPublishing(true);setGhStatus('');
    try{
      const updatedData={...fullData,schedule,workers,themes,events};
      const content=JSON.stringify(updatedData,null,2);
      const encoded=btoa(unescape(encodeURIComponent(content)));
      const getR=await fetch(`https://api.github.com/repos/${GH_REPO}/contents/${GH_FILE}`,{
        headers:{Authorization:`Bearer ${ghToken}`,Accept:'application/vnd.github+json'}
      });
      const existing=getR.ok?await getR.json():null;
      const putR=await fetch(`https://api.github.com/repos/${GH_REPO}/contents/${GH_FILE}`,{
        method:'PUT',
        headers:{Authorization:`Bearer ${ghToken}`,Accept:'application/vnd.github+json','Content-Type':'application/json'},
        body:JSON.stringify({message:`Update ${GH_FILE} (${activeTab}) — ${new Date().toLocaleDateString()}`,content:encoded,...(existing?.sha?{sha:existing.sha}:{})})
      });
      if(!putR.ok){const e=await putR.json().catch(()=>({}));throw new Error(e.message||`HTTP ${putR.status}`);}
      setGhStatus('ok');setDirty(false);
      showToast('🎉 Published! Members can see it now.');
      setTimeout(()=>setGhStatus(''),7000);
    }catch(e){
      alert(`Publish failed: ${e.message}`);
      setGhStatus('err');setTimeout(()=>setGhStatus(''),5000);
    }finally{setGhPublishing(false);}
  };

  if(loading) return (
    <div style={{display:'flex',alignItems:'center',justifyContent:'center',height:'100vh',flexDirection:'column',gap:16}}>
      <div style={{width:36,height:36,border:'3px solid var(--border)',borderTopColor:'var(--accent)',borderRadius:'50%'}} className="spin"/>
      <div style={{color:'var(--ink-3)',fontSize:'.9375rem'}}>Loading…</div>
    </div>
  );
  if(error) return <div style={{padding:32,color:'var(--danger)'}}>{error}</div>;

  const TAB_TITLES={schedule:`Schedule · ${activeMonth} 2026`,workers:'Workers',themes:'Monthly Themes',events:'Events'};

  return (
    <div className="app-shell">

      {/* ── Sidebar ── */}
      <aside className="sidebar">
        <div style={{marginBottom:20}}>
          <div className="font-display" style={{fontSize:'1.0625rem',fontWeight:600,color:'var(--ink)',marginBottom:2}}>📅 Schedule Editor</div>
          {/* Which church is being edited, and the file Publish overwrites. */}
          <div style={{fontSize:'.75rem',color:'var(--ink-4)'}}>
            <div style={{display:'flex',alignItems:'center',gap:6}}>
              <span style={{flex:'none',width:8,height:8,borderRadius:'50%',background:CHURCH.accent}} />
              <span style={{overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{CHURCH.name}</span>
            </div>
            <div title={GH_FILE} style={{fontFamily:'ui-monospace,monospace',fontSize:'.6875rem',marginTop:2,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{GH_FILE}</div>
          </div>
        </div>

        {/* Tab nav */}
        <div style={{marginBottom:4}}>
          {TABS.map(t=>(
            <button key={t.id} className={`nav-tab ${activeTab===t.id?'active':''}`} onClick={()=>setActiveTab(t.id)}>
              <span>{t.icon}</span>{t.label}
            </button>
          ))}
        </div>

        {/* Month list — schedule tab only */}
        {activeTab==='schedule'&&(
          <>
            <div style={{height:1,background:'var(--border)',margin:'8px 0 10px'}}/>
            <div style={{flex:1}}>
              {MONTHS.map(m=>(
                <button key={m} className={`month-item ${activeMonth===m?'active':''}`} onClick={()=>{setActiveMonth(m);setExpandedId(null);}}>
                  {m}
                  {monthStats[m]>0&&(
                    <span style={{fontSize:'.6875rem',padding:'1px 7px',borderRadius:999,background:activeMonth===m?'rgba(163,59,42,.15)':'var(--bg)',color:activeMonth===m?'var(--accent)':'var(--ink-4)',fontWeight:600,border:'1px solid var(--border)'}}>
                      {monthStats[m]}
                    </span>
                  )}
                </button>
              ))}
            </div>
          </>
        )}

        {/* Footer */}
        <div style={{marginTop:'auto',paddingTop:16}}>
          {ghToken?(
            <div style={{padding:'10px 12px',borderRadius:12,background:'var(--success-soft)',border:'1px solid #BBF7D0',fontSize:'.75rem',color:'var(--success)',fontWeight:500,marginBottom:10}}>
              ✓ GitHub connected
              <button onClick={()=>{setGhToken('');try{localStorage.removeItem(GH_TOKEN_KEY);}catch{};}} style={{display:'block',marginTop:4,fontSize:'.6875rem',color:'var(--ink-4)',background:'none',border:'none',cursor:'pointer',textDecoration:'underline',padding:0,fontFamily:'Geist,sans-serif'}}>Disconnect</button>
            </div>
          ):(
            <button className="btn btn-ghost" style={{width:'100%',justifyContent:'center',fontSize:'.8125rem'}} onClick={()=>setShowSetup(true)}>
              🔑 Connect GitHub
            </button>
          )}
          <a href={CHURCH.url('./index.html')} style={{display:'block',marginTop:8,fontSize:'.75rem',color:'var(--ink-4)',textDecoration:'none'}}>← Back to Members App</a>
        </div>
      </aside>

      {/* ── Main header ── */}
      <header className="main-header">
        <div style={{display:'flex',alignItems:'center',gap:12,justifyContent:'space-between',flexWrap:'wrap'}}>
          <div className="font-display" style={{fontSize:'1.5rem',fontWeight:700,color:'var(--ink)',lineHeight:1}}>
            {TAB_TITLES[activeTab]}
          </div>
          <div style={{display:'flex',alignItems:'center',gap:10}}>
            {dirty&&!ghPublishing&&(
              <span style={{fontSize:'.75rem',color:'var(--warning)',fontWeight:500,animation:'pulse 2s infinite'}}>● Unsaved</span>
            )}
            <button
              className={`publish-btn${ghPublishing?' loading':''}${ghStatus==='ok'?' ok':ghStatus==='err'?' err':''}`}
              onClick={publishToGitHub} disabled={ghPublishing}>
              {ghPublishing
                ?<><span style={{width:16,height:16,border:'2px solid rgba(255,255,255,.4)',borderTopColor:'#fff',borderRadius:'50%'}} className="spin"/><span>Publishing…</span></>
                :ghStatus==='ok'?'✓ Published!'
                :ghStatus==='err'?'⚠ Retry'
                :'☁ Update to GitHub'
              }
            </button>
          </div>
        </div>

        {/* Mobile month tabs — schedule tab only */}
        {activeTab==='schedule'&&(
          <div style={{display:'flex',gap:6,overflowX:'auto',marginTop:14,paddingBottom:2,scrollbarWidth:'none'}}>
            {MONTHS.map(m=>(
              <button key={m} className={`m-tab ${activeMonth===m?'active':'idle'}`} onClick={()=>{setActiveMonth(m);setExpandedId(null);}}>
                {m.slice(0,3)}{monthStats[m]>0?` ${monthStats[m]}`:''}
              </button>
            ))}
          </div>
        )}
      </header>

      {/* ── Main content ── */}
      <main className="main-content">

        {activeTab==='schedule'&&(
          <>
            {visibleEntries.length>0&&(
              <div className="fade-in" style={{display:'flex',gap:8,marginBottom:18,flexWrap:'wrap'}}>
                <div style={{padding:'5px 12px',borderRadius:999,background:'var(--friday-soft)',color:'var(--friday)',fontSize:'.8125rem',fontWeight:600}}>
                  📅 {visibleEntries.filter(e=>e.service==='Friday').length} Friday
                </div>
                <div style={{padding:'5px 12px',borderRadius:999,background:'var(--sunday-soft)',color:'var(--sunday)',fontSize:'.8125rem',fontWeight:600}}>
                  🙏 {visibleEntries.filter(e=>e.service==='Sunday').length} Sunday
                </div>
                {allFilled&&(
                  <div style={{padding:'5px 12px',borderRadius:999,background:'var(--success-soft)',color:'var(--success)',fontSize:'.8125rem',fontWeight:600,animation:'scaleIn .3s ease'}}>
                    ✅ All roles assigned
                  </div>
                )}
              </div>
            )}

            {visibleEntries.length===0?(
              <div style={{textAlign:'center',padding:'60px 20px'}}>
                <div style={{fontSize:'3rem',marginBottom:12}}>📋</div>
                <div className="font-display" style={{fontSize:'1.375rem',color:'var(--ink-2)',fontWeight:600}}>No services for {activeMonth}</div>
                <p style={{color:'var(--ink-4)',fontSize:'.9375rem',marginTop:6,marginBottom:20}}>Add the first service to get started.</p>
                <button onClick={addEntry} style={{padding:'.7rem 1.5rem',borderRadius:12,background:'var(--accent)',color:'#fff',border:'none',fontWeight:700,fontSize:'.9375rem',cursor:'pointer',boxShadow:'0 4px 18px rgba(163,59,42,.3)',fontFamily:'Geist,sans-serif'}}>
                  + Add service
                </button>
              </div>
            ):(
              <>
                {visibleEntries.map((e,i)=>(
                  <ServiceCard key={e.id} entry={e} index={i} workers={workers}
                    isOpen={expandedId===e.id}
                    onToggle={()=>setExpandedId(expandedId===e.id?null:e.id)}
                    onChange={updateEntry} onDelete={deleteEntry}/>
                ))}
                <div style={{textAlign:'center',marginTop:4}}>
                  <button onClick={addEntry}
                    style={{padding:'.55rem 1.25rem',borderRadius:10,background:'transparent',color:'var(--ink-3)',border:'1.5px dashed var(--border-2)',fontWeight:600,fontSize:'.875rem',cursor:'pointer',transition:'all .18s',fontFamily:'Geist,sans-serif'}}>
                    + Add service
                  </button>
                </div>
              </>
            )}
          </>
        )}

        {activeTab==='workers'&&<WorkersTab workers={workers} onChange={setWorkers} onDirty={markDirty}/>}
        {activeTab==='themes' &&<ThemesTab  themes={themes}   onChange={setThemes}  onDirty={markDirty}/>}
        {activeTab==='events' &&<EventsTab  events={events}   onChange={setEvents}  onDirty={markDirty}/>}
      </main>

      {showSetup&&<TokenModal onSave={saveToken} onClose={()=>setShowSetup(false)}/>}
      {toast&&<div className="toast">{toast}</div>}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
