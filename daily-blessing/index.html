<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="theme-color" content="#F8F9FB" />
<meta name="description" content="Daily Blessing — every day, discover God's encouragement in a beautiful experience." />
<title>Daily Blessing</title>
<link rel="manifest" href="manifest.json" />
<link rel="stylesheet" href="css/style.css" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
</head>
<body>
  <a href="../" class="back-link" aria-label="Back to FLCC Members app">&larr; Back</a>

  <div id="app-loading" class="app-loading" role="status" aria-live="polite">Preparing today's blessing…</div>

  <div id="app" class="app-shell" hidden>
    <main id="page-root" class="page-root" tabindex="-1"></main>

    <nav class="bottom-nav" aria-label="Primary">
      <button class="nav-btn" data-route="home" aria-current="page">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M4 11.5 12 4l8 7.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M6 10v9a1 1 0 0 0 1 1h10a1 1 0 0 0 1-1v-9" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span>Home</span>
      </button>
      <button class="nav-btn" data-route="journey">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M12 21c4-4.5 6-7.8 6-10.8A6 6 0 0 0 6 10.2C6 13.2 8 16.5 12 21Z" stroke-linejoin="round"/><path d="M12 12.5a2 2 0 1 0 0-4 2 2 0 0 0 0 4Z"/></svg>
        <span>Journey</span>
      </button>
      <button class="nav-btn" data-route="collection">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><rect x="5" y="4" width="11" height="15" rx="2"/><rect x="8.5" y="7.5" width="11" height="15" rx="2" fill="var(--bg,#F8F9FB)"/></svg>
        <span>Collection</span>
      </button>
      <button class="nav-btn" data-route="community">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><circle cx="9" cy="8.5" r="2.75"/><circle cx="16.5" cy="9.5" r="2.25"/><path d="M3.5 19c.5-3 2.7-4.8 5.5-4.8s5 1.8 5.5 4.8" stroke-linecap="round"/><path d="M14.5 14.6c2.2.3 3.8 1.9 4.2 4.4" stroke-linecap="round"/></svg>
        <span>Community</span>
      </button>
      <button class="nav-btn" data-route="profile">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><circle cx="12" cy="8.5" r="3.5"/><path d="M4.5 20c1-4 4-6 7.5-6s6.5 2 7.5 6" stroke-linecap="round"/></svg>
        <span>Profile</span>
      </button>
    </nav>
  </div>

  <script src="js/DateUtils.js"></script>
  <script src="js/Utils.js"></script>
  <script src="js/SaveManager.js"></script>
  <script src="js/Content.js"></script>
  <script src="js/Season.js"></script>
  <script src="js/Rewards.js"></script>
  <script src="js/AudioManager.js"></script>
  <script src="js/Router.js"></script>
  <script src="js/App.js"></script>
  <script src="js/components/GiftBox.js"></script>
  <script src="js/components/CharacterCard.js"></script>
  <script src="js/components/BlessingCard.js"></script>
  <script src="js/components/Streak.js"></script>
  <script src="js/pages/Home.js"></script>
  <script src="js/pages/Journey.js"></script>
  <script src="js/pages/Collection.js"></script>
  <script src="js/pages/Community.js"></script>
  <script src="js/pages/Profile.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
