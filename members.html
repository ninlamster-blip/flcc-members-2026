function ConflictModal({ entry, role, me, ministry, isPrayer, isMusic, onClose }) {
  const [reason, setReason] = useState(CONFLICT_REASONS[0]);
  const [note, setNote] = useState('');

  const message = useMemo(() => buildConflictMessage({
    memberName: workerDisplay(me),
    entry, role, reason, note,
    ministryHead: ministry.headName,
    isPrayer,
    isMusic,
    serviceTypeLabel: entry._musicServiceLabel,
    roleLabel: entry._musicRoleLabel,
  }), [me, entry, role, reason, note, ministry.headName, isPrayer, isMusic]);

  const subject = isMusic
    ? `Music ministry conflict · ${formatDateShort(entry.date)}`
    : isPrayer
    ? `Prayer schedule conflict · ${formatDateShort(entry.date)}`
    : `Schedule conflict · ${entry.service} ${formatDateShort(entry.date)}`;

  const channels = [
    {
      key: 'whatsapp', label: 'WhatsApp', icon: '💬', bg: '#25D366',
      enabled: !!ministry.whatsapp,
      url: () => whatsappURL(ministry.whatsapp, message),
    },
    {
      key: 'messenger', label: 'Messenger', icon: 'M', bg: '#0084FF',
      enabled: !!ministry.messenger,
      url: () => messengerURL(ministry.messenger),
      // Messenger doesn't accept prefilled message; we copy to clipboard then open
      preAction: () => navigator.clipboard?.writeText(message).catch(() => {}),
      hint: 'Message copied to clipboard — paste it into the Messenger chat',
    },
    {
      key: 'sms', label: 'SMS', icon: '📱', bg: '#34C759',
      enabled: !!ministry.phone,
      url: () => smsURL(ministry.phone, message),
    },
    {
      key: 'email', label: 'Email', icon: '✉', bg: '#EF4444',
      enabled: !!ministry.email,
      url: () => emailURL(ministry.email, subject, message),
    },
  ];

  const sendVia = (channel) => {
    if (channel.preAction) channel.preAction();
    window.open(channel.url(), '_blank');
    if (channel.hint) alert(channel.hint);
  };

  const copyMessage = () => {
    navigator.clipboard.writeText(message).then(() => alert('Message copied to clipboard!')).catch(() => alert('Copy failed.'));
  };

  return (
    <div className="modal-backdrop" onClick={onClose}>
      <div className="modal p-6 fade-in" onClick={e => e.stopPropagation()} style={{ maxWidth: 540 }}>
        <h3 className="font-display text-2xl font-semibold mb-1">Report a conflict</h3>
        <p className="text-sm ink-muted mb-4">
          {dayOfWeek(entry.date)} {formatDateShort(entry.date)} · {entry.service} · {ROLES.find(r => r.key === role)?.label}
        </p>

        <div className="space-y-3 mb-5">
          <div>
            <label className="text-xs font-medium tracking-widest uppercase ink-subtle">Reason</label>
            <select className="select mt-1" value={reason} onChange={e => setReason(e.target.value)}>
              {CONFLICT_REASONS.map(r => <option key={r} value={r}>{r}</option>)}
            </select>
          </div>
          <div>
            <label className="text-xs font-medium tracking-widest uppercase ink-subtle">Note <span className="ink-subtle italic font-normal" style={{ letterSpacing: 0, textTransform: 'none' }}>· optional</span></label>
            <textarea
              className="input mt-1"
              rows={3}
              value={note}
              onChange={e => setNote(e.target.value)}
              placeholder="Anything else Sis. Amazelle should know?"
            />
          </div>
        </div>

        <div className="card p-4 mb-5" style={{ background: 'var(--bg)' }}>
          <div className="text-xs font-medium tracking-widest uppercase ink-subtle mb-2">Preview</div>
          <pre className="text-xs whitespace-pre-wrap" style={{ fontFamily: 'inherit', lineHeight: 1.5 }}>{message}</pre>
        </div>

        <div className="text-xs font-medium tracking-widest uppercase ink-subtle mb-2">Send via</div>
        <div className="channel-grid mb-4">
          {channels.map(c => (
            <button
              key={c.key}
              className="channel-btn"
              disabled={!c.enabled}
              onClick={() => sendVia(c)}
              title={c.enabled ? '' : 'Not configured by ministry'}
            >
              <div className="channel-icon" style={{ background: c.enabled ? c.bg : '#E7E5DE', color: c.enabled ? 'white' : 'var(--ink-subtle)' }}>{c.icon}</div>
              <div>
                <div className="text-sm font-medium">{c.label}</div>
                <div className="text-xs ink-subtle">{c.enabled ? 'Tap to open' : 'Not available'}</div>
              </div>
            </button>
          ))}
        </div>

        <div className="flex justify-between gap-2">
          <button className="btn btn-ghost text-sm" onClick={copyMessage}>📋 Copy message</button>
          <button className="btn btn-soft" onClick={onClose}>Close</button>
        </div>
      </div>
    </div>
  );
}

function downloadPrayerMeetingICS(meeting, prayerData, churchName) {
  const meta = meetingTypeMeta(meeting.type);
  const presider = (prayerData.workers || []).find(w => w.id === meeting.presiderId);
  const exhorter = (prayerData.workers || []).find(w => w.id === meeting.exhorterId);
  const songLeader = (prayerData.workers || []).find(w => w.id === meeting.songLeaderId);
  const lines = [
    'BEGIN:VCALENDAR',
    'VERSION:2.0',
    'PRODID:-//FLCC Prayer OS//EN',
    'CALSCALE:GREGORIAN',
    'BEGIN:VEVENT',
    `UID:${meeting.id}@flcc-prayer`,
    `DTSTAMP:${formatICSStamp()}`,
  ];
  if (meeting.startTime) {
    const [y, m, d] = meeting.date.split('-').map(Number);
    const [sh, sm] = meeting.startTime.split(':').map(Number);
    lines.push(`DTSTART:${formatICSDateTime(y, m, d, sh, sm)}`);
    lines.push(`DTEND:${formatICSDateTime(y, m, d, sh + 1, sm + 30 > 60 ? sm - 30 : sm + 30)}`);
  } else {
    lines.push(`DTSTART;VALUE=DATE:${formatICSDate(meeting.date)}`);
    lines.push(`DTEND;VALUE=DATE:${formatICSDate(addDays(meeting.date, 1))}`);
  }
  lines.push(`SUMMARY:${escapeICS(`${churchName} · ${meta.label}`)}`);
  if (meeting.venue) lines.push(`LOCATION:${escapeICS(meeting.venue)}`);
  let desc = `${meta.label}`;
  if (['sectoral', 'corporate'].includes(meeting.type)) {
    desc += `\\nC/O ${meeting.coordinator || 'TBD'}`;
  } else {
    if (presider)   desc += `\\nPresider: ${workerDisplay(presider)}`;
    if (exhorter)   desc += `\\nExhorter: ${workerDisplay(exhorter)}`;
    if (songLeader) desc += `\\nSong Leader: ${workerDisplay(songLeader)}`;
  }
  if (meeting.foodInChargeText) desc += `\\nFood in charge: ${meeting.foodInChargeText}`;
  lines.push(`DESCRIPTION:${desc}`);
  lines.push('END:VEVENT', 'END:VCALENDAR');
  downloadICS(`flcc-prayer-${meeting.date}.ics`, lines.join('\r\n'));
}

function downloadIntercessoryICS(entry, prayerData, churchName) {
  const team = (prayerData.teams || []).find(t => t.id === entry.teamId);
  const lines = [
    'BEGIN:VCALENDAR',
    'VERSION:2.0',
    'PRODID:-//FLCC Prayer OS//EN',
    'CALSCALE:GREGORIAN',
    'BEGIN:VEVENT',
    `UID:${entry.id}@flcc-prayer`,
    `DTSTAMP:${formatICSStamp()}`,
  ];
  if (entry.startTime) {
    const [y, m, d] = entry.date.split('-').map(Number);
    const [sh, sm] = entry.startTime.split(':').map(Number);
    lines.push(`DTSTART:${formatICSDateTime(y, m, d, sh, sm)}`);
    if (entry.endTime) {
      const [eh, em] = entry.endTime.split(':').map(Number);
      lines.push(`DTEND:${formatICSDateTime(y, m, d, eh, em)}`);
    } else {
      lines.push(`DTEND:${formatICSDateTime(y, m, d, sh, sm + 15)}`);
    }
  }
  lines.push(`SUMMARY:${escapeICS(`${churchName} · Intercessory Prayer (${entry.service})`)}`);
  let desc = `Intercessory Prayer · ${entry.service} service`;
  if (team) desc += `\\nTeam: ${team.name}`;
  desc += `\\n\\nReminder: The Service Coordinator and Presider for this date should also join.`;
  lines.push(`DESCRIPTION:${desc}`);
  lines.push('END:VEVENT', 'END:VCALENDAR');
  downloadICS(`flcc-intercessory-${entry.date}-${entry.service.toLowerCase()}.ics`, lines.join('\r\n'));
}

                        <div key={entry.id} className="row-card flex items-center gap-3 flex-wrap">

                      <div><span className="ink-muted text-xs">Song Leader · </span>{songLeader ? <span style={{ color: myPrayerWorker?.id === songLeader.id ? 'var(--accent)' : 'inherit', fontWeight: myPrayerWorker?.id === songLeader.id ? 600 : 400 }}>{workerShort(songLeader)}{myPrayerWorker?.id === songLeader.id ? ' (you)' : ''}</span> : <span className="ink-subtle italic">TBD</span>}</div>

                        <button key={r} className="btn btn-ghost text-xs" style={{ color: 'var(--danger)' }} onClick={() => onConflict({

                        </button>
                      ))}
                    </div>
                  )}
                </div>
              );
            })}
          </div>
        )}
      </div>
    </div>
  );
}

function downloadMusicICS(entry, musicData, churchName) {
  const serviceType = (musicData.serviceTypes || []).find(s => s.key === entry.service);
  const serviceLabel = serviceType?.label || entry.service;
  const primary = musicData.workers.find(w => w.id === entry.assignments?.[musicData.settings?.primaryRole || 'lead']);
  const lines = [
    'BEGIN:VCALENDAR',
    'VERSION:2.0',
    'PRODID:-//FLCC Music OS//EN',
    'CALSCALE:GREGORIAN',
    'BEGIN:VEVENT',
    `UID:${entry.id}@flcc-music`,
    `DTSTAMP:${formatICSStamp()}`,
    `DTSTART;VALUE=DATE:${formatICSDate(entry.date)}`,
    `DTEND;VALUE=DATE:${formatICSDate(addDays(entry.date, 1))}`,
    `SUMMARY:${escapeICS(`${churchName} · Music: ${serviceLabel}`)}`,
  ];
  let desc = `🎵 Music Ministry · ${serviceLabel}`;
  if (primary) desc += `\\nLed by: ${primary.kind === 'group' ? primary.name : (primary.title ? primary.title + ' ' + primary.name : primary.name)}`;
  // Other roles
  for (const r of (musicData.roles || [])) {
    if (r.key === (musicData.settings?.primaryRole || 'lead')) continue;
    const w = musicData.workers.find(x => x.id === entry.assignments?.[r.key]);
    if (w) desc += `\\n${r.label}: ${w.kind === 'group' ? w.name : (w.title ? w.title + ' ' + w.name : w.name)}`;
  }
  lines.push(`DESCRIPTION:${desc}`);
  lines.push('END:VEVENT', 'END:VCALENDAR');
  downloadICS(`flcc-music-${entry.date}.ics`, lines.join('\r\n'));
}

function MusicTab({ data, musicData, me, currentMonth, setCurrentMonth, onConflict }) {
  const monthEntries = (musicData.entries || []).filter(e => monthKey(e.date) === currentMonth).sort((a, b) => a.date.localeCompare(b.date));
  const myMusicWorker = useMemo(() => musicData ? findMusicMatch(me, musicData.workers) : null, [me, musicData]);
  const primaryRoleKey = musicData.settings?.primaryRole || 'lead';

  return (
    <div className="fade-in">
      <SectionHeading eyebrow={musicData.ministry?.headName || 'Music Ministry'} title="Music Schedule">
        Who's leading worship and the music team for each service this month.
      </SectionHeading>

      <div className="card p-4 mb-6 flex items-center justify-center gap-3">
        <button className="btn btn-ghost" onClick={() => setCurrentMonth(prevMonth(currentMonth))}>←</button>
        <div className="font-display text-xl font-semibold">{formatMonthLabel(currentMonth)}</div>
        <button className="btn btn-ghost" onClick={() => setCurrentMonth(nextMonth(currentMonth))}>→</button>
      </div>

      {(musicData.serviceTypes || []).map(svc => {
        const svcEntries = monthEntries.filter(e => e.service === svc.key);
        if (svcEntries.length === 0) return null;
        return (
          <div key={svc.key} className="mb-6">
            <div className="text-xs font-medium tracking-widest uppercase ink-subtle mb-2 flex items-center gap-2">
              <span style={{ display: 'inline-block', width: 8, height: 8, borderRadius: '50%', background: svc.dot }}></span>
              {svc.label}
            </div>
            <div className="space-y-2">
              {svcEntries.map(entry => {
                const primary = musicData.workers.find(w => w.id === entry.assignments?.[primaryRoleKey]);
                const isPrimaryMe = myMusicWorker && primary && primary.id === myMusicWorker.id;
                // Check additional roles
                const myAdditionalRoles = [];
                if (myMusicWorker) {
                  for (const r of (musicData.roles || [])) {
                    if (r.key === primaryRoleKey) continue;
                    if (entry.assignments?.[r.key] === myMusicWorker.id) myAdditionalRoles.push(r);
                  }
                }
                const isMine = isPrimaryMe || myAdditionalRoles.length > 0;
                const allMyRoles = [
                  ...(isPrimaryMe ? [musicData.roles.find(r => r.key === primaryRoleKey)].filter(Boolean) : []),
                  ...myAdditionalRoles,
                ];

                return (
                  <div key={entry.id} className={`row-card ${isMine ? 'row-mine' : ''}`} style={{ borderLeftWidth: '3px', borderLeftColor: svc.dot }}>
                    <div className="flex items-start justify-between gap-3 mb-2 flex-wrap">
                      <div>
                        <div className="font-display text-lg font-semibold">{formatDateShort(entry.date)}</div>
                        <div className="text-xs ink-muted">{dayOfWeek(entry.date)} · {svc.label}</div>
                        {isMine && (
                          <div className="flex flex-wrap gap-1 mt-2">
                            {allMyRoles.map(r => <Pill key={r.key} tone="accent">You · {r.label}</Pill>)}
                          </div>
                        )}
                      </div>
                      <button className="btn btn-soft text-xs" onClick={() => downloadMusicICS(entry, musicData, data.meta.churchName)}>📅</button>
                    </div>
                    <div className="dotted-divider my-3" />
                    <div className="space-y-1 text-sm">
                      {(musicData.roles || []).map(r => {
                        const w = musicData.workers.find(x => x.id === entry.assignments?.[r.key]);
                        if (!w) return null;
                        const isMyRole = myMusicWorker && w.id === myMusicWorker.id;
                        return (
                          <div key={r.key}>
                            <span className="ink-muted text-xs">{r.label} · </span>
                            <span style={{ color: isMyRole ? MUSIC_ACCENT : 'inherit', fontWeight: isMyRole ? 600 : 400 }}>
                              {w.kind === 'group' ? <>🎵 {w.name}</> : workerShort(w)}{isMyRole ? ' (you)' : ''}
                            </span>
                          </div>
                        );
                      })}
                      {!(musicData.roles || []).some(r => entry.assignments?.[r.key]) && (
                        <div className="ink-subtle italic">No assignments yet.</div>
                      )}
                    </div>
                    {isMine && (
                      <div className="mt-3 flex flex-wrap gap-2">
                        {allMyRoles.map(r => (
                          <button key={r.key} className="btn btn-ghost text-xs" style={{ color: 'var(--danger)' }} onClick={() => onConflict({
                            entry: { ...entry, _musicServiceLabel: svc.label, _musicRoleLabel: r.label },
                            role: r.key,
                            isMusic: true,
                          })}>
                            ⚠ Report conflict
                          </button>
                        ))}
                      </div>
                    )}
                  </div>
                );
              })}
            </div>
          </div>
        );
      })}

      {monthEntries.length === 0 && (
        <div className="card p-6 text-center ink-subtle italic text-sm">No music assignments for {formatMonthLabel(currentMonth)} yet.</div>
      )}
    </div>
  );
}

// --- Equip storage helpers ---
function loadEquipProgress()  { try { return JSON.parse(localStorage.getItem(EQUIP_PROGRESS_KEY)  || '{}'); } catch { return {}; } }
function saveEquipProgress(p) { try { localStorage.setItem(EQUIP_PROGRESS_KEY,  JSON.stringify(p)); } catch {} }
function loadEquipBookmarks() { try { return JSON.parse(localStorage.getItem(EQUIP_BOOKMARKS_KEY) || '[]'); } catch { return []; } }
function saveEquipBookmarks(b){ try { localStorage.setItem(EQUIP_BOOKMARKS_KEY, JSON.stringify(b)); } catch {} }
function loadEquipActivity()  { try { return JSON.parse(localStorage.getItem(EQUIP_ACTIVITY_KEY)  || '[]'); } catch { return []; } }
function recordEquipActivity(date) {
  const a = loadEquipActivity();
  if (!a.includes(date)) { try { localStorage.setItem(EQUIP_ACTIVITY_KEY, JSON.stringify([...a, date])); } catch {} }
}

function getCourseProgress(courseId, progress, courses) {
  const list = courses || EQUIP_COURSES;
  const c = list.find(x => x.id === courseId);
  if (!c) return { status: 'not_started', percent: 0, completedLessons: [] };
  const p = progress[courseId] || {};
  const done = (p.completedLessons || []).length;
  const total = c.lessons.length;
  const percent = total ? Math.round((done / total) * 100) : 0;
  const status = done === total && total > 0 ? 'completed' : done > 0 ? 'in_progress' : 'not_started';
  return { status, percent, completedLessons: p.completedLessons || [], lessonDates: p.lessonDates || {}, startedAt: p.startedAt, completedAt: p.completedAt, notes: p.notes || '', mentor: p.mentor || '', lastActivityAt: p.lastActivityAt };
}

function computeStreak(activityDates) {
  if (!activityDates.length) return { current: 0, longest: 0 };
  const sorted = [...new Set(activityDates)].sort();
  const today = todayISO();
  const yesterday = addDays(today, -1);
  let longest = 0, streak = 1;
  for (let i = 1; i < sorted.length; i++) {
    const a = parseISODate(sorted[i-1]), b = parseISODate(sorted[i]);
    streak = (b - a) / 86400000 === 1 ? streak + 1 : 1;
    longest = Math.max(longest, streak);
  }
  if (sorted.length === 1) longest = 1;
  const last = sorted[sorted.length - 1];
  const current = (last === today || last === yesterday) ? streak : 0;
  return { current, longest: Math.max(longest, streak) };
}

function getEarnedBadges(progress, courses) {
  const list = courses || EQUIP_COURSES;
  return list.filter(c => getCourseProgress(c.id, progress, list).percent === 100)
    .map(c => ({ ...c, earnedAt: progress[c.id]?.completedAt }));
}

function getPathwayStage(progress, courses) {
  const list = courses || EQUIP_COURSES;
  let stage = 0;
  for (const s of LEADERSHIP_PATHWAY) {
    if (s.requiredCourses.every(cid => getCourseProgress(cid, progress, list).percent === 100)) stage = s.stage;
    else break;
  }
  return stage;
}

function EquipTab({ equipData }) {
  // Merge admin courses from equip.json with seed courses
  const allCourses = useMemo(() => {
    const adminCourses = (equipData?.courses || []);
    if (!adminCourses.length) return EQUIP_COURSES;
    const adminById = new Map(adminCourses.map(c => [c.id, c]));
    const merged = EQUIP_COURSES.map(c => adminById.has(c.id) ? adminById.get(c.id) : c);
    for (const ac of adminCourses) {
      if (!EQUIP_COURSES.find(c => c.id === ac.id)) merged.push(ac);
    }
    return merged;
  }, [equipData]);
  const [subTab, setSubTab] = useState('overview');
  const [progress, setProgressState] = useState(loadEquipProgress);
  const [bookmarks, setBookmarksState] = useState(loadEquipBookmarks);
  const [activity]  = useState(loadEquipActivity);
  const [selectedCourse, setSelectedCourse] = useState(null);
  const [resSearch, setResSearch] = useState('');
  const [resType, setResType] = useState('all');

  const setProgress  = p => { saveEquipProgress(p);  setProgressState(p); };
  const setBookmarks = b => { saveEquipBookmarks(b);  setBookmarksState(b); };

  const toggleLesson = (courseId, lessonId) => {
    const today = todayISO();
    recordEquipActivity(today);
    const course = allCourses.find(c => c.id === courseId);
    const prev = progress[courseId] || {};
    const done = [...(prev.completedLessons || [])];
    const lessonDates = { ...(prev.lessonDates || {}) };
    const idx = done.indexOf(lessonId);
    if (idx === -1) { done.push(lessonId); lessonDates[lessonId] = today; }
    else            { done.splice(idx, 1); delete lessonDates[lessonId]; }
    const full = course && done.length === course.lessons.length;
    setProgress({
      ...progress,
      [courseId]: {
        ...prev,
        completedLessons: done,
        lessonDates,
        status: full ? 'completed' : done.length ? 'in_progress' : 'not_started',
        startedAt:   prev.startedAt   || (done.length ? today : null),
        completedAt: full ? (prev.completedAt || today) : null,
        lastActivityAt: today,
      },
    });
  };

  const saveNotesMentor = (courseId, notes, mentor) => {
    const prev = progress[courseId] || {};
    setProgress({ ...progress, [courseId]: { ...prev, notes, mentor } });
  };

  const toggleBookmark = id => setBookmarks(bookmarks.includes(id) ? bookmarks.filter(b => b !== id) : [...bookmarks, id]);

  const streak      = useMemo(() => computeStreak(activity), [activity]);
  const badges      = useMemo(() => getEarnedBadges(progress, allCourses), [progress, allCourses]);
  const pathwayStage = useMemo(() => getPathwayStage(progress, allCourses), [progress, allCourses]);

  const subTabs = [
    { key: 'overview',   label: '🏠 Overview'  },
    { key: 'courses',    label: '📚 Courses'   },
    { key: 'resources',  label: '📁 Resources' },
    { key: 'progress',   label: '🏆 Progress'  },
    { key: 'admin',      label: '👁 Admin'      },
  ];

  return (
    <EquipCoursesCtx.Provider value={allCourses}>
    <div className="fade-in">
      {/* Module header */}
      <div className="mb-5">
        <div className="text-xs font-medium tracking-widest uppercase mb-1" style={{ color: EQUIP_ACCENT }}>FLCC · Equip Module</div>
        <h2 className="font-display text-3xl font-semibold">Equip</h2>
        <p className="text-sm ink-muted mt-1">Grow in faith, deepen your knowledge, and develop your calling.</p>
        {equipData && <div className="text-xs mt-1" style={{ color: EQUIP_ACCENT }}>✓ {allCourses.length} courses loaded</div>}
      </div>

      {/* Quick stats */}
      <div className="grid grid-cols-3 gap-2 mb-5">
        <div className="card p-3 text-center">
          <div className="font-display text-2xl font-semibold" style={{ color: streak.current > 0 ? '#F59E0B' : 'var(--ink)' }}>{streak.current}</div>
          <div className="text-xs ink-muted">Day streak 🔥</div>
        </div>
        <div className="card p-3 text-center">
          <div className="font-display text-2xl font-semibold" style={{ color: EQUIP_ACCENT }}>{badges.length}</div>
          <div className="text-xs ink-muted">Badges</div>
        </div>
        <div className="card p-3 text-center">
          <div className="font-display text-2xl font-semibold">
            {allCourses.filter(c => getCourseProgress(c.id, progress).percent === 100).length}<span className="text-sm ink-muted">/{allCourses.length}</span>
          </div>
          <div className="text-xs ink-muted">Completed</div>
        </div>
      </div>

      {/* Sub-nav pills */}
      <div className="flex overflow-x-auto gap-1.5 mb-6 pb-1" style={{ scrollbarWidth: 'none' }}>
        {subTabs.map(t => (
          <button key={t.key} onClick={() => setSubTab(t.key)} style={{
            background: subTab === t.key ? EQUIP_ACCENT : '#F4F4F0',
            color: subTab === t.key ? 'white' : 'var(--ink-muted)',
            border: 'none', cursor: 'pointer', borderRadius: 999,
            padding: '0.375rem 0.875rem', fontSize: '0.8125rem', fontWeight: subTab === t.key ? 600 : 400,
            whiteSpace: 'nowrap', transition: 'all 0.15s',

      {subTab === 'resources' && <EquipResources bookmarks={bookmarks} toggleBookmark={toggleBookmark} resSearch={resSearch} setResSearch={setResSearch} resType={resType} setResType={setResType} />}
      {subTab === 'progress'  && <EquipProgress  progress={progress} badges={badges} streak={streak} pathwayStage={pathwayStage} />}

  );

            <div className="text-xs font-medium tracking-widest uppercase ink-subtle mb-3">Lessons</div>
            <div className="space-y-2">
              {course.lessons.map((lesson, idx) => {
                const done = p.completedLessons.includes(lesson.id);
                const takenDate = p.lessonDates?.[lesson.id];
                const isOpen = openLesson === lesson.id;
                return (
                  <div key={lesson.id}>
                    <div className="flex items-center gap-3 p-3 rounded-xl" style={{ background: done ? EQUIP_TINT : '#F9F9F7', border: `1px solid ${done ? EQUIP_ACCENT + '40' : 'var(--border)'}` }}>
                      <button onClick={() => onToggleLesson(course.id, lesson.id)} className="flex-shrink-0 w-7 h-7 rounded-full flex items-center justify-center text-sm" style={{ background: done ? EQUIP_ACCENT : 'white', border: `2px solid ${done ? EQUIP_ACCENT : 'var(--border-strong)'}`, color: done ? 'white' : 'transparent', cursor: 'pointer' }}>✓</button>
                      <div className="flex-1 min-w-0">
                        <div className="text-sm font-medium truncate" style={{ color: done ? EQUIP_ACCENT : 'var(--ink)' }}>{idx + 1}. {lesson.title}</div>
                        <div className="text-xs ink-muted flex gap-2 mt-0.5">
                          <span>⏱ {lesson.duration} min</span>
                          {lesson.hasQuiz && <span>📝 Reflection</span>}
                          {done && takenDate && <span style={{ color: EQUIP_ACCENT }}>✓ {formatDateShort(takenDate)}</span>}
                        </div>
                      </div>
                      {lesson.hasQuiz && (
                        <button className="btn btn-soft text-xs flex-shrink-0" onClick={() => setOpenLesson(isOpen ? null : lesson.id)}>
                          {isOpen ? 'Hide' : 'Reflect'}
                        </button>
                      )}
                    </div>
                    {isOpen && (
                      <div className="p-4 rounded-xl mt-1 space-y-1" style={{ background: EQUIP_TINT, border: `1px solid ${EQUIP_ACCENT}30` }}>
                        <div className="text-xs font-medium mb-2" style={{ color: EQUIP_ACCENT }}>Reflection Questions</div>
                        {course.reflections.map((q, qi) => <div key={qi} className="text-xs ink-muted">• {q}</div>)}
                        <div className="text-xs ink-subtle mt-2 italic">Write your answers in the Notes section below.</div>
                      </div>
                    )}
                  </div>
                );
              })}
            </div>
          </div>

          {/* Notes & mentor */}
          <div>
            <div className="text-xs font-medium tracking-widest uppercase ink-subtle mb-3">Notes & Mentor</div>
            <div className="space-y-2">
              <div>
                <label className="text-xs ink-muted">Facilitator / Mentor</label>
                <input className="input mt-1" value={mentor} onChange={e => setMentor(e.target.value)} placeholder="Who is guiding you through this course?" />
              </div>
              <div>
                <label className="text-xs ink-muted">My Reflections & Notes</label>
                <textarea className="input mt-1" rows={4} value={notes} onChange={e => setNotes(e.target.value)} placeholder="Key insights, takeaways, personal reflections…" style={{ resize: 'vertical' }} />
              </div>
              <button className="btn btn-primary text-sm" onClick={() => { onSaveNotes(course.id, notes, mentor); }}>Save Notes</button>
            </div>
          </div>
        </div>
      </div>
    </div>
  );
}

// --- Resources sub-tab ---
function EquipResources({ bookmarks, toggleBookmark, resSearch, setResSearch, resType, setResType }) {
  const [showBookmarked, setShowBookmarked] = useState(false);
  const types = ['all', 'pdf', 'video', 'audio', 'devotional', 'guide', 'sermon-notes', 'playlist', 'external'];

  const filtered = useMemo(() => {
    let r = EQUIP_RESOURCES;
    if (resType !== 'all') r = r.filter(x => x.type === resType);
    if (showBookmarked) r = r.filter(x => bookmarks.includes(x.id));
    if (resSearch.trim()) {
      const q = resSearch.toLowerCase();
      r = r.filter(x => x.title.toLowerCase().includes(q) || x.description.toLowerCase().includes(q) || x.category.toLowerCase().includes(q));
    }
    return r;
  }, [resType, showBookmarked, resSearch, bookmarks]);

  const showFeatured = !resSearch && !showBookmarked && resType === 'all';

  return (
    <div>
      {showFeatured && (
        <div className="mb-5">
          <div className="text-xs font-medium tracking-widest uppercase ink-subtle mb-3">⭐ Featured</div>
          <div className="grid sm:grid-cols-2 gap-3">
            {EQUIP_RESOURCES.filter(r => r.featured).slice(0, 4).map(r => (
              <EquipResourceCard key={r.id} resource={r} isBookmarked={bookmarks.includes(r.id)} onToggle={() => toggleBookmark(r.id)} />
            ))}
          </div>
        </div>
      )}

      <div className="flex gap-2 mb-3">
        <input className="input flex-1" value={resSearch} onChange={e => setResSearch(e.target.value)} placeholder="Search resources…" />
        <button onClick={() => setShowBookmarked(b => !b)} className="btn text-xs flex-shrink-0" style={{ background: showBookmarked ? EQUIP_SOFT : '#F4F4F0', color: showBookmarked ? EQUIP_ACCENT : 'var(--ink-muted)', border: 'none' }}>
          🔖 {showBookmarked ? 'Saved' : 'Saved'}
        </button>
      </div>

      <div className="flex flex-wrap gap-1.5 mb-5">
        {types.map(t => {
          const m = RES_META[t];
          return (
            <button key={t} onClick={() => setResType(t)} style={{
              background: resType === t ? (m?.color || EQUIP_ACCENT) : '#F4F4F0',
              color: resType === t ? 'white' : 'var(--ink-muted)',
              border: 'none', cursor: 'pointer', borderRadius: 999,
              padding: '0.25rem 0.625rem', fontSize: '0.75rem', fontWeight: resType === t ? 600 : 400,
            }}>{m ? `${m.icon} ${m.label}` : 'All'}</button>
          );
        })}
      </div>

      {filtered.length === 0 ? (
        <div className="card p-6 text-center ink-subtle italic text-sm">No resources found.</div>
      ) : (
        <div className="grid sm:grid-cols-2 gap-3">
          {filtered.map(r => <EquipResourceCard key={r.id} resource={r} isBookmarked={bookmarks.includes(r.id)} onToggle={() => toggleBookmark(r.id)} />)}
        </div>
      )}
    </div>
  );
}

function EquipResourceCard({ resource, isBookmarked, onToggle }) {

  const m = RES_META[resource.type] || RES_META.external;
  const rel = resource.courseId ? COURSES.find(c => c.id === resource.courseId) : null;
  const actionLabel = { pdf: '↓ Download', audio: '▶ Listen', video: '▶ Watch', playlist: '▶ Play' }[resource.type] || '→ Open';
  return (
    <div className="card p-4 flex flex-col gap-2">
      <div className="flex items-start justify-between gap-2">
        <div className="flex items-start gap-2 flex-1">
          <div className="text-xl flex-shrink-0 mt-0.5">{m.icon}</div>
          <div className="flex-1">
            <div className="font-medium text-sm leading-snug">{resource.title}</div>
            <div className="text-xs ink-muted mt-0.5 leading-relaxed">{resource.description}</div>
          </div>
        </div>
        <button onClick={onToggle} style={{ background: 'none', border: 'none', cursor: 'pointer', fontSize: '1.125rem', color: isBookmarked ? '#F59E0B' : 'var(--ink-subtle)', transition: 'color 0.15s', flexShrink: 0 }} title={isBookmarked ? 'Remove bookmark' : 'Bookmark'}>
          🔖
        </button>

        <span className="pill text-xs" style={{ background: m.color + '20', color: m.color }}>{m.icon} {m.label}</span>
        {rel && <span className="pill text-xs pill-default">{rel.badge} {rel.title}</span>}
      </div>
      <a href={resource.url} target="_blank" rel="noopener noreferrer" className="btn btn-soft text-xs mt-auto" style={{ textDecoration: 'none', display: 'block', textAlign: 'center' }}>{actionLabel}</a>
    </div>
  );
}

// --- Progress sub-tab ---
function EquipProgress({ progress, badges, streak, pathwayStage }) {
  const COURSES = useEquipCourses();
  const totalLessons = COURSES.reduce((s, c) => s + c.lessons.length, 0);
  const doneLessons  = COURSES.reduce((s, c) => s + getCourseProgress(c.id, progress, COURSES).completedLessons.length, 0);
  const overall = totalLessons ? Math.round((doneLessons / totalLessons) * 100) : 0;

  return (
    <div className="space-y-5">
      {/* Streak */}
      <div className="card p-5">
        <div className="text-xs font-medium tracking-widest uppercase ink-subtle mb-4">🔥 Learning Streak</div>
        <div className="grid grid-cols-2 gap-4 text-center">
          <div>
            <div className="font-display text-5xl font-semibold" style={{ color: streak.current > 0 ? '#F59E0B' : 'var(--ink-subtle)' }}>{streak.current}</div>
            <div className="text-xs ink-muted mt-1">Current streak (days)</div>
          </div>
          <div>
            <div className="font-display text-5xl font-semibold">{streak.longest}</div>
            <div className="text-xs ink-muted mt-1">Personal best</div>
          </div>
        </div>
        {streak.current === 0 && <div className="text-xs ink-muted text-center mt-3 italic">Complete a lesson today to start your streak!</div>}
      </div>

      {/* Overall */}
      <div className="card p-5">
        <div className="text-xs font-medium tracking-widest uppercase ink-subtle mb-3">Overall Progress</div>
        <div className="flex items-baseline gap-2 mb-2">
          <div className="font-display text-3xl font-semibold" style={{ color: EQUIP_ACCENT }}>{overall}%</div>
          <div className="text-sm ink-muted">{doneLessons} of {totalLessons} lessons complete</div>
        </div>
        <div className="h-3 rounded-full" style={{ background: '#E5E7EB' }}>
          <div className="h-3 rounded-full" style={{ width: `${overall}%`, background: EQUIP_ACCENT, transition: 'width 0.5s ease' }} />
        </div>
      </div>

      {/* Leadership pathway */}
      <div className="card p-5">
        <div className="text-xs font-medium tracking-widest uppercase ink-subtle mb-4">Leadership Pathway</div>
        <div className="space-y-4">
          {LEADERSHIP_PATHWAY.map(stage => {
            const completed = pathwayStage >= stage.stage;
            const isCurrent = pathwayStage === stage.stage - 1;
            const stagePercent = Math.round(
              stage.requiredCourses.reduce((s, cid) => s + getCourseProgress(cid, progress, COURSES).percent, 0) / stage.requiredCourses.length
            );
            return (
              <div key={stage.stage} className="flex items-center gap-3">
                <div className="flex-shrink-0 w-11 h-11 rounded-full flex items-center justify-center text-xl"
                  style={{ background: completed ? stage.color : isCurrent ? stage.color + '18' : '#F4F4F0', border: `2px solid ${completed || isCurrent ? stage.color : 'var(--border)'}`, color: completed ? 'white' : 'inherit' }}>
                  {completed ? '✓' : stage.icon}
                </div>
                <div className="flex-1">
                  <div className="flex items-center justify-between mb-0.5">
                    <div className="text-sm font-medium" style={{ color: completed ? stage.color : 'var(--ink)' }}>{stage.name}</div>
                    <div className="text-xs ink-muted">{stagePercent}%</div>
                  </div>
                  <div className="text-xs ink-muted mb-1">{stage.description}</div>
                  {!completed && (
                    <div className="h-1 rounded-full" style={{ background: '#E5E7EB' }}>
                      <div className="h-1 rounded-full" style={{ width: `${stagePercent}%`, background: stage.color }} />
                    </div>
                  )}
                </div>
              </div>
            );
          })}
        </div>
      </div>

      {/* Badge wall */}
      <div className="card p-5">
        <div className="text-xs font-medium tracking-widest uppercase ink-subtle mb-4">🏅 Badges Earned</div>
        {badges.length === 0 ? (
          <div className="text-center ink-subtle italic text-sm py-4">Complete a course to earn your first badge!</div>
        ) : (
          <div className="grid grid-cols-3 sm:grid-cols-4 gap-3 mb-4">
            {badges.map(b => (
              <div key={b.id} className="text-center p-3 rounded-xl" style={{ background: EQUIP_TINT }}>
                <div className="text-3xl mb-1">{b.badge}</div>
                <div className="text-xs font-semibold" style={{ color: EQUIP_ACCENT }}>{b.badgeLabel}</div>
                {b.earnedAt && <div className="text-xs ink-subtle mt-0.5">{formatDateShort(b.earnedAt)}</div>}
              </div>
            ))}
          </div>
        )}
        {COURSES.filter(c => !badges.find(b => b.id === c.id)).length > 0 && (
          <>
            <div className="text-xs ink-subtle mb-2">{badges.length > 0 ? 'Locked:' : 'Earn these:'}</div>
            <div className="grid grid-cols-4 sm:grid-cols-7 gap-2">
              {COURSES.filter(c => !badges.find(b => b.id === c.id)).map(c => (
                <div key={c.id} className="text-center p-2 rounded-lg" style={{ filter: 'grayscale(1)', opacity: 0.4 }}>
                  <div className="text-2xl">{c.badge}</div>
                  <div className="text-xs ink-subtle mt-0.5" style={{ fontSize: '0.6rem' }}>{c.badgeLabel}</div>
                </div>
              ))}
            </div>
          </>
        )}
      </div>

      {/* Per-course stats */}
      <div className="card overflow-hidden">
        <div className="px-5 py-3" style={{ borderBottom: '1px solid var(--border)', background: '#FBFBF7' }}>
          <div className="text-xs font-medium tracking-widest uppercase ink-subtle">Course Breakdown</div>
        </div>
        <div className="divide-y" style={{ borderColor: 'var(--border)' }}>
          {COURSES.map(c => {
            const p = getCourseProgress(c.id, progress, COURSES);
            const tr = TRACK_META[c.track];
            return (
              <div key={c.id} className="px-5 py-3 flex items-center gap-3">
                <div className="text-xl flex-shrink-0">{c.badge}</div>
                <div className="flex-1 min-w-0">
                  <div className="text-sm font-medium truncate">{c.title}</div>
                  <div className="h-1.5 rounded-full mt-1.5" style={{ background: '#E5E7EB' }}>
                    <div className="h-1.5 rounded-full" style={{ width: `${p.percent}%`, background: p.percent === 100 ? EQUIP_ACCENT : tr.color }} />
                  </div>
                </div>
                <div className="text-xs font-mono ink-muted flex-shrink-0">{p.percent}%</div>
              </div>
            );
          })}
        </div>
      </div>
    </div>
  );
}

// --- Admin sub-tab ---
function EquipAdmin({ progress }) {
  const COURSES = useEquipCourses();
  const inProg    = COURSES.filter(c => { const p = getCourseProgress(c.id, progress, COURSES); return p.percent > 0 && p.percent < 100; });
  const completed = COURSES.filter(c => getCourseProgress(c.id, progress, COURSES).percent === 100);
  const notStart  = COURSES.filter(c => getCourseProgress(c.id, progress, COURSES).percent === 0);

  const exportReport = () => {
    const report = {
      generatedAt: new Date().toISOString(),
      summary: { total: COURSES.length, inProgress: inProg.length, completed: completed.length, notStarted: notStart.length },
      courses: COURSES.map(c => ({ course: c.title, track: c.track, ...getCourseProgress(c.id, progress, COURSES) })),
    };
    const blob = new Blob([JSON.stringify(report, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a'); a.href = url; a.download = `flcc-equip-report-${todayISO()}.json`; a.click(); URL.revokeObjectURL(url);
  };

  return (
    <div className="space-y-5">
      <div className="card p-5" style={{ background: EQUIP_TINT, borderColor: EQUIP_SOFT }}>
        <div className="text-xs font-medium tracking-widest uppercase mb-1" style={{ color: EQUIP_ACCENT }}>For Pastors & Ministry Leaders</div>
        <div className="font-display text-lg font-semibold mb-2">Admin Dashboard</div>
        <p className="text-sm ink-muted">This view shows the current device's learning data. Full multi-member monitoring, aggregate stats, and member-by-member tracking is planned for the upcoming <code className="font-mono text-xs px-1 rounded" style={{ background: EQUIP_SOFT }}>equip-admin.html</code> app.</p>
      </div>

      <div className="grid grid-cols-2 sm:grid-cols-4 gap-3">
        {[
          { label: 'Total Courses', value: COURSES.length,    color: 'var(--ink)' },
          { label: 'In Progress',   value: inProg.length,     color: '#B45309' },
          { label: 'Completed',     value: completed.length,  color: EQUIP_ACCENT },
          { label: 'Not Started',   value: notStart.length,   color: 'var(--ink-subtle)' },
        ].map(s => (
          <div key={s.label} className="card p-4 text-center">
            <div className="font-display text-3xl font-semibold" style={{ color: s.color }}>{s.value}</div>
            <div className="text-xs ink-muted mt-1">{s.label}</div>
          </div>
        ))}
      </div>

      <div className="card overflow-hidden">
        <div className="px-5 py-3" style={{ borderBottom: '1px solid var(--border)', background: '#FBFBF7' }}>
          <div className="text-xs font-medium tracking-widest uppercase ink-subtle">Course Status Table</div>
        </div>
        <table className="schedule-table">
          <thead><tr><th>Course</th><th>Track</th><th>Progress</th><th>Status</th></tr></thead>
          <tbody>
            {COURSES.map(c => {
              const p = getCourseProgress(c.id, progress, COURSES);
              const tr = TRACK_META[c.track];
              return (
                <tr key={c.id}>
                  <td className="text-sm font-medium">{c.badge} {c.title}</td>
                  <td><span className="pill text-xs" style={{ background: tr.color + '20', color: tr.color }}>{tr.label}</span></td>
                  <td>
                    <div className="flex items-center gap-2">
                      <div className="h-1.5 rounded-full" style={{ background: '#E5E7EB', minWidth: 60, flex: 1 }}>
                        <div className="h-1.5 rounded-full" style={{ width: `${p.percent}%`, background: p.percent === 100 ? EQUIP_ACCENT : tr.color }} />
                      </div>
                      <span className="text-xs font-mono ink-muted">{p.percent}%</span>
                    </div>
                  </td>
                  <td>
                    <span className="pill text-xs" style={{
                      background: p.percent === 100 ? EQUIP_SOFT : p.percent > 0 ? '#FEF3C7' : '#F4F4F0',
                      color: p.percent === 100 ? EQUIP_ACCENT : p.percent > 0 ? '#B45309' : 'var(--ink-subtle)',
                    }}>{p.percent === 100 ? '✓ Done' : p.percent > 0 ? 'In Progress' : 'Not Started'}</span>
                  </td>
                </tr>
              );
            })}
          </tbody>
        </table>
      </div>

      <div className="card p-5">
        <div className="font-display text-lg font-semibold mb-2">Export Report</div>
        <p className="text-sm ink-muted mb-4">Download a JSON progress report to share with your pastoral team or facilitator.</p>
        <button className="btn btn-primary" onClick={exportReport}>↓ Export Progress Report</button>
      </div>
    </div>
  );
}

const SN_NOTES_GREEN  = '#16A34A';
const SN_NOTES_SOFT   = '#DCFCE7';
const SN_NOTES_TINT   = '#F0FDF4';
const SERMON_NOTES_STORE_KEY = CHURCH.key('flcc-sermon-notes-v1');

function loadSermonNotes()       { try { return JSON.parse(localStorage.getItem(SERMON_NOTES_STORE_KEY) || '{}'); } catch { return {}; } }
function persistSermonNotes(n)   { try { localStorage.setItem(SERMON_NOTES_STORE_KEY, JSON.stringify(n)); } catch {} }
function makeNoteId(date, svc)   { return `${date}|${svc}`; }

function getEntryPreacher(entry, workers) {
  const w = (workers || []).find(x => x.id === entry?.roles?.preacher);
  return w ? (w.title ? `${w.title} ${w.name}` : w.name) : null;
}

function exportNoteToPDF(note, meta) {
  const sec = (label, val) => val
    ? `<div style="margin-bottom:18px"><div style="font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:${SN_NOTES_GREEN};margin-bottom:5px">${label}</div><div style="font-size:14px;line-height:1.7;white-space:pre-wrap;color:#18181B">${String(val).replace(/</g,'&lt;').replace(/>/g,'&gt;')}</div></div>` : '';
  const html = `<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Sermon Notes · ${meta.date}</title>
  <style>*{box-sizing:border-box}body{font-family:Georgia,'Times New Roman',serif;max-width:580px;margin:48px auto;padding:0 28px;color:#18181B;line-height:1.65}h1{font-size:26px;font-weight:600;margin:0 0 4px;letter-spacing:-.01em}.sub{font-size:13px;color:#52525B;margin:0 0 22px}.meta{display:flex;flex-wrap:wrap;gap:14px;font-size:12px;color:#71717A;border-top:1px solid #E5E7EB;border-bottom:1px solid #E5E7EB;padding:10px 0;margin-bottom:28px}.body-text{font-size:15px;line-height:1.8;margin-bottom:28px;color:#18181B}.ftr{margin-top:48px;font-size:11px;color:#A1A1AA;border-top:1px solid #E5E7EB;padding-top:10px}@media print{body{margin:0;padding:20px}}</style>
  </head><body>
  <h1>${note.title || 'Sermon Notes'}</h1>
  <div class="sub">${meta.dateLabel} · ${meta.service} Service</div>
  <div class="meta">
    ${meta.preacher ? `<span>🎤 ${meta.preacher}</span>` : ''}
    ${meta.myRole   ? `<span>🎭 ${meta.myRole}</span>` : ''}
    ${note.updatedAt ? `<span>Last edited: ${new Date(note.updatedAt).toLocaleString()}</span>` : ''}
  </div>
  ${note.body ? `<div class="body-text">${note.body}</div>` : ''}
  <div class="ftr">${CHURCH.name} · Personal Sermon Journal</div>
  </body></html>`;
  const win = window.open('', '_blank');
  if (win) { win.document.write(html); win.document.close(); setTimeout(() => win.print(), 350); }
}

function SermonNotesModal({ noteId, meta, sermonNotes, onSave, onDelete, onClose, onOpenNote, initialView }) {
  const existing  = sermonNotes[noteId] || {};
  const formRef   = useRef({
    title: existing.title || '', body: existing.body || '',
  });
  const [form, setFormState] = useState(formRef.current);
  const setForm = patch => { formRef.current = { ...formRef.current, ...patch }; setFormState(f => ({ ...f, ...patch })); };

  const [view,       setView]        = useState(initialView || 'editor');
  const [saveStatus, setSaveStatus]  = useState('');
  const [closing,    setClosing]     = useState(false);
  const [jSearch,    setJSearch]     = useState('');
  const saveTimer   = useRef(null);
  const bodyEditRef = useRef(null);

  // ── Camera / AI scan state ──────────────────────────────────────────────────
  const cameraInputRef = useRef(null);
  const [scanState,    setScanState]    = useState('idle');
  const [scanResult,   setScanResult]   = useState('');
  const [scanPreview,  setScanPreview]  = useState('');
  const [scanProgress, setScanProgress] = useState(0);
  const [scanMsg,      setScanMsg]      = useState('');

  // ── Image preprocessing — optimised for projected screen / slides ────────
  const preprocessImage = (file) => new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = ev => {
      const img = new Image();
      img.onload = () => {
        const MAX = 1920;
        const ratio = Math.min(MAX / img.width, MAX / img.height, 1);
        const W = Math.round(img.width  * ratio);
        const H = Math.round(img.height * ratio);

        const canvas = document.createElement('canvas');
        canvas.width = W; canvas.height = H;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, W, H);

        const imageData = ctx.getImageData(0, 0, W, H);
        const d = imageData.data;

        // ── Step 1: detect dark-background slide (projector screen) ──────
        // Sample ~500 pixels and measure average luminance
        let totalLum = 0, samples = 0;
        const step = Math.max(1, Math.floor(d.length / (4 * 500)));
        for (let i = 0; i < d.length; i += 4 * step) {
          totalLum += 0.2126 * d[i] + 0.7152 * d[i+1] + 0.0722 * d[i+2];
          samples++;
        }
        const avgLum = totalLum / (samples || 1);
        // Dark background if average luminance < 110
        const isDarkSlide = avgLum < 110;

        // ── Step 2: pixel-level processing ───────────────────────────────
        for (let i = 0; i < d.length; i += 4) {
          let r = d[i], g = d[i+1], b = d[i+2];

          // Boost yellow text first — very common in Tagalog church slides
          // Yellow: high R+G, low B
          if (r > 180 && g > 150 && b < 100) {
            r = 255; g = 255; b = 0;
          }

          // Weighted greyscale
          let grey = 0.2126 * r + 0.7152 * g + 0.0722 * b;

          if (isDarkSlide) {
            // INVERT so text becomes dark on white — Tesseract reads this best
            grey = 255 - grey;
            // Extra contrast: push text darker, background whiter
            if (grey < 140) grey = Math.max(0,   grey - 50);
            else            grey = Math.min(255, grey + 40);
          } else {
            // Light slide — normal contrast boost
            const contrast = 1.7;
            const f = (259 * (contrast + 255)) / (255 * (259 - contrast));
            grey = Math.max(0, Math.min(255, f * (grey - 128) + 128));
            if      (grey < 90)  grey = Math.max(0,   grey - 30);
            else if (grey > 180) grey = Math.min(255, grey + 30);
          }

          d[i] = d[i+1] = d[i+2] = grey;
          d[i+3] = 255;
        }

        ctx.putImageData(imageData, 0, 0);
        resolve({ dataUrl: canvas.toDataURL('image/png', 1.0), isDarkSlide });
      };
      img.onerror = () => reject(new Error('Could not load image'));
      img.src = ev.target.result;
    };
    reader.onerror = () => reject(new Error('Could not read file'));
    reader.readAsDataURL(file);
  });

  // ── Post-process OCR text — clean common recognition errors ───────────────
  const cleanOCRText = (raw) => raw
    .replace(/\f/g, '\n')
    .replace(/\r\n/g, '\n')
    .replace(/[ \t]+\n/g, '\n')
    .replace(/\n{3,}/g, '\n\n')
    .replace(/[|}{\\]/g, '')
    .replace(/(\w)\s*[：:]\s*(\d)/g, '$1:$2')   // fix "John 3 : 16" → "John 3:16"
    .replace(/\b0([A-Za-z])/g, 'O$1')            // 0God → OGod
    .replace(/l([A-Z][a-z])/g, 'I$1')            // lowercase l before capital → I
    .trim();

  // ── Main scan handler ──────────────────────────────────────────────────────
  const handleCameraCapture = async (e) => {
    const file = e.target.files?.[0];
    if (!file) return;
    e.target.value = '';   // allow same file to be re-scanned

    setScanState('scanning');
    setScanResult('');
    setScanPreview('');
    setScanProgress(0);
    setScanMsg('Preparing image…');

    // Tesseract.js v5 CDN URLs — all dependencies explicit so Safari doesn't lose them
    const TESS_CDN  = 'https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js';
    const WORK_PATH = 'https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/worker.min.js';
    const CORE_PATH = 'https://cdn.jsdelivr.net/npm/tesseract.js-core@5.1.0/tesseract-core-simd.wasm.js';
    const LANG_PATH = 'https://tessdata.projectnaptha.com/4.0.0';

    let worker = null;
    try {
      // ── Step 1: preprocess image ──────────────────────────────────────────
      setScanProgress(8);
      const { dataUrl, isDarkSlide } = await preprocessImage(file);
      setScanPreview(dataUrl);
      setScanMsg(isDarkSlide ? 'Detected projection screen — inverting…' : 'Detected light slide…');
      setScanProgress(15);

      // ── Step 2: load Tesseract.js from CDN (once, then cached) ───────────
      if (!window.Tesseract) {
        setScanMsg('Loading OCR engine… (first time only ~2 MB)');
        await new Promise((res, rej) => {
          const s = document.createElement('script');
          s.src = TESS_CDN;
          s.onload = res;
          s.onerror = () => rej(new Error('Failed to load OCR library. Check internet connection.'));
          document.head.appendChild(s);
        });
      }
      setScanProgress(22);
      setScanMsg('Initializing OCR engine…');

      // ── Step 3: create worker with all explicit CDN paths ─────────────────
      // This is the critical fix — v5 needs explicit paths when loaded from CDN
      // eng+fil: bilingual model handles English and Tagalog text on slides
      worker = await window.Tesseract.createWorker('eng+fil', 1, {
        workerPath: WORK_PATH,
        corePath:   CORE_PATH,
        langPath:   LANG_PATH,
        logger: m => {
          if (m.status === 'loading tesseract core') {
            setScanMsg('Loading OCR core…'); setScanProgress(25);
          } else if (m.status === 'initializing tesseract') {
            setScanMsg('Starting OCR…'); setScanProgress(32);
          } else if (m.status === 'loading language traineddata') {
            setScanMsg('Loading English + Filipino language data…'); setScanProgress(38);
          } else if (m.status === 'initializing api') {
            setScanMsg('Almost ready…'); setScanProgress(44);
          } else if (m.status === 'recognizing text') {
            const pct = Math.round(44 + m.progress * 50);
            setScanProgress(pct);
            setScanMsg(`Reading text… ${Math.round(m.progress * 100)}%`);
          }
        },
      });

      // PSM 3: fully automatic without OSD — more reliable for phone-angle photos of slides
      await worker.setParameters({
        tessedit_pageseg_mode:    '3',
        tessedit_char_blacklist:  '`~^',
        preserve_interword_spaces:'1',
      });

      setScanProgress(50);
      setScanMsg('Reading your notes…');

      // ── Step 4: run recognition ───────────────────────────────────────────
      const { data } = await worker.recognize(dataUrl);
      setScanProgress(96);

      const text = cleanOCRText(data.text || '');
      if (!text || text.length < 2) throw new Error('No readable text found. Try better lighting or hold the camera steady.');

      setScanResult(text);
      setScanState('result');
      setScanProgress(100);
      setScanMsg('');

    } catch (err) {
      console.error('Camera scan error:', err);
      setScanState('error');
      setScanMsg(err.message || 'Scan failed. Please try again.');
      setScanProgress(0);
    } finally {
      // Always terminate worker to free memory
      if (worker) {
        try { await worker.terminate(); } catch (_) {}
      }
    }
  };

  // Initialize contentEditable body on mount
  useEffect(() => {
    if (bodyEditRef.current) {
      const content = existing.body || '';
      const isHtml = /<[a-z][\s\S]*>/i.test(content);
      bodyEditRef.current.innerHTML = isHtml ? content : content.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\n/g,'<br>');
    }
  }, []);

  const applyScan = (mode) => {
    const scanHtml = scanResult.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\n/g,'<br>');
    const newBody = mode === 'replace'
      ? scanHtml
      : [formRef.current.body, scanHtml].filter(Boolean).join('<br><br>');
    if (bodyEditRef.current) bodyEditRef.current.innerHTML = newBody;
    setForm({ body: newBody });
    triggerSave({ body: newBody });
    setScanState('idle');
    setScanResult('');
    setScanPreview('');
  };

  const handleClose = () => { setClosing(true); setTimeout(onClose, 290); };

  const triggerSave = (patch = {}) => {
    if (saveTimer.current) clearTimeout(saveTimer.current);
    setSaveStatus('saving');
    saveTimer.current = setTimeout(() => {
      onSave(noteId, {
        ...existing, ...formRef.current, ...patch,
        updatedAt: new Date().toISOString(),
        createdAt: existing.createdAt || new Date().toISOString(),
      });
      setSaveStatus('saved');
      setTimeout(() => setSaveStatus(''), 2600);
    }, 700);
  };

  const allNotes = useMemo(() => {
    const q = jSearch.toLowerCase().trim();
    return Object.entries(sermonNotes)
      .map(([id, n]) => { const [d, s] = id.split('|'); return { id, date: d, service: s, ...n }; })
      .filter(n => !q || [n.title, (n.body || '').replace(/<[^>]*>/g, '')].some(v => (v || '').toLowerCase().includes(q)))
      .sort((a, b) => b.date.localeCompare(a.date));
  }, [sermonNotes, jSearch]);

  const byMonth = useMemo(() => {
    const m = new Map();
    for (const n of allNotes) {
      const mk = n.date.slice(0, 7);
      if (!m.has(mk)) m.set(mk, []);
      m.get(mk).push(n);
    }
    return m;
  }, [allNotes]);

  const wordCount   = (form.body || '').replace(/<[^>]*>/g, '').trim().split(/\s+/).filter(Boolean).length;
  const hasContent  = !!(form.body || form.title);
  const hasExisting = !!(existing.body || existing.title);

  const inputStyle = (extra = {}) => ({
    ...extra,
    width: '100%', border: 'none', outline: 'none', background: 'transparent',
    fontFamily: '"Geist", sans-serif', color: 'var(--ink)', boxSizing: 'border-box',
    transition: 'border-color .15s',
  });

  return ReactDOM.createPortal(
    <div
      style={{ position: 'fixed', inset: 0, zIndex: 70, display: 'flex', alignItems: 'flex-end', justifyContent: 'center', background: closing ? 'rgba(24,24,27,0)' : 'rgba(24,24,27,0.38)', backdropFilter: 'blur(7px)', transition: 'background .28s ease', padding: '0' }}
      onClick={handleClose}
    >
      <div className={`sn-sheet${closing ? ' closing' : ''}`} onClick={e => e.stopPropagation()}>

        {/* Drag handle */}
        <div style={{ display: 'flex', justifyContent: 'center', paddingTop: 11, paddingBottom: 4 }}>
          <div style={{ width: 42, height: 4, borderRadius: 2, background: 'var(--border-strong)', opacity: .6 }} />
        </div>

        {/* Header bar */}
        <div style={{ padding: '6px 18px 12px', display: 'flex', alignItems: 'center', justifyContent: 'space-between', borderBottom: '1px solid var(--border)', gap: 8 }}>
          <div style={{ display: 'flex', gap: 4 }}>
            {[['editor', '✏️ Notes'], ['journal', '📅 Journal']].map(([v, lbl]) => (
              <button key={v} onClick={() => setView(v)} style={{
                padding: '4px 13px', borderRadius: 999, border: 'none', cursor: 'pointer',
                fontSize: '0.8125rem', fontWeight: view === v ? 600 : 400,
                background: view === v ? 'var(--ink)' : '#F4F4F0',
                color: view === v ? 'white' : 'var(--ink-muted)',
                transition: 'all .22s cubic-bezier(.34,1.56,.64,1)',
                transform: view === v ? 'scale(1.03)' : 'scale(1)',
              }}>{lbl}</button>
            ))}
          </div>
          <div style={{ display: 'flex', alignItems: 'center', gap: 10 }}>
            {saveStatus === 'saving' && <span style={{ fontSize: '0.6875rem', color: 'var(--ink-subtle)', transition: 'opacity .2s' }}>Saving…</span>}
            {saveStatus === 'saved'  && <span style={{ fontSize: '0.6875rem', color: SN_NOTES_GREEN, animation: 'snSaveFlash 2.6s ease-out both' }}>✓ Saved</span>}
            <button onClick={handleClose} style={{ background: '#F4F4F0', border: 'none', borderRadius: 8, padding: '4px 10px', fontSize: '0.8125rem', cursor: 'pointer', color: 'var(--ink-muted)', transition: 'background .15s' }}
              onMouseEnter={e => e.currentTarget.style.background='#EBEBEB'}
              onMouseLeave={e => e.currentTarget.style.background='#F4F4F0'}
            >✕</button>
          </div>
        </div>

        {/* ─── EDITOR VIEW ─────────────────────────────────── */}
        {view === 'editor' && (
          <div style={{ overflowY: 'auto', flex: 1, padding: '20px 20px 36px', WebkitOverflowScrolling: 'touch' }}>
            {/* Service meta chip */}
            <div style={{ display: 'flex', gap: 10, alignItems: 'flex-start', padding: '11px 14px', borderRadius: 12, background: SN_NOTES_TINT, border: `1px solid ${SN_NOTES_GREEN}28`, marginBottom: 22, animation: 'snFadeUp .22s ease-out both' }}>
              <div style={{ fontSize: '1.25rem', marginTop: 1 }}>📖</div>
              <div>
                <div style={{ fontWeight: 600, fontSize: '0.875rem', color: 'var(--ink)' }}>{meta.dateLabel} · {meta.service} Service</div>
                {meta.preacher && <div style={{ fontSize: '0.8125rem', color: 'var(--ink-muted)', marginTop: 1 }}>🎤 {meta.preacher}</div>}
                {meta.myRole   && <div style={{ fontSize: '0.8125rem', color: 'var(--ink-muted)', marginTop: 1 }}>🎭 Your role: {meta.myRole}</div>}
              </div>
            </div>

            {/* Title input */}
            <input
              value={form.title}
              onChange={e => { setForm({ title: e.target.value }); triggerSave({ title: e.target.value }); }}
              placeholder="Sermon title or topic…"
              style={{ ...inputStyle({ fontSize: '1.25rem', fontFamily: '"Fraunces", Georgia, serif', fontWeight: 600, letterSpacing: '-.01em', padding: '0 0 10px', marginBottom: 20, borderBottom: '2px solid var(--border)' }) }}
              onFocus={e => e.target.style.borderBottomColor = SN_NOTES_GREEN}
              onBlur={e => e.target.style.borderBottomColor = 'var(--border)'}
            />

            {/* Notes label + camera scan button */}
            <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', marginBottom: 8 }}>
              <div style={{ fontSize: '0.6875rem', fontWeight: 700, letterSpacing: '.08em', textTransform: 'uppercase', color: 'var(--ink-subtle)' }}>Sermon Notes</div>
              <div style={{ display: 'flex', alignItems: 'center', gap: 8 }}>
                {scanState === 'idle' && (
                  <button
                    onClick={() => cameraInputRef.current?.click()}
                    title="Point at the presentation screen to scan slide text"
                    style={{ display: 'flex', alignItems: 'center', gap: 5, padding: '4px 11px', borderRadius: 999, background: '#F0FDF4', border: '1px solid #BBF7D0', color: '#15803D', fontSize: '0.75rem', fontWeight: 600, cursor: 'pointer', transition: 'all .15s' }}
                    onMouseEnter={e => e.currentTarget.style.background='#DCFCE7'}
                    onMouseLeave={e => e.currentTarget.style.background='#F0FDF4'}
                  >
                    <span style={{ fontSize: '0.875rem' }}>📷</span> Scan notes
                  </button>
                )}
                {scanState === 'scanning' && (
                  <div style={{ display: 'flex', flexDirection: 'column', gap: 4, minWidth: 180 }}>
                    <div style={{ display: 'flex', alignItems: 'center', gap: 6 }}>
                      <div style={{ width: 8, height: 8, borderRadius: 4, background: '#16A34A', animation: 'snPulse 1.2s ease-in-out infinite', flexShrink: 0 }} />
                      <span style={{ fontSize: '0.75rem', fontWeight: 600, color: '#15803D' }}>{scanMsg || 'Processing…'}</span>
                    </div>
                    <div style={{ height: 3, borderRadius: 2, background: '#DCFCE7', overflow: 'hidden' }}>
                      <div style={{ height: 3, borderRadius: 2, background: '#16A34A', width: `${scanProgress}%`, transition: 'width .4s ease' }} />
                    </div>
                  </div>
                )}
                {scanState === 'error' && (
                  <div style={{ display: 'flex', flexDirection: 'column', gap: 4 }}>
                    <div style={{ display: 'flex', alignItems: 'center', gap: 6 }}>
                      <span style={{ fontSize: '0.75rem', color: 'var(--danger)', fontWeight: 500 }}>⚠ {scanMsg || 'Scan failed'}</span>
                    </div>
                    <div style={{ display: 'flex', gap: 8 }}>
                      <button onClick={() => cameraInputRef.current?.click()} style={{ fontSize: '0.75rem', color: '#15803D', background: 'none', border: 'none', cursor: 'pointer', textDecoration: 'underline', padding: 0 }}>Try again</button>
                      <button onClick={() => { setScanState('idle'); setScanMsg(''); }} style={{ fontSize: '0.75rem', color: 'var(--ink-subtle)', background: 'none', border: 'none', cursor: 'pointer', padding: 0 }}>Dismiss</button>
                    </div>
                  </div>
                )}
              </div>
            </div>

            {/* Hidden camera input */}
            <input
              ref={cameraInputRef}
              type="file"
              accept="image/*"
              capture="environment"
              style={{ display: 'none' }}
              onChange={handleCameraCapture}
            />

            {/* Scan result pane */}
            {scanState === 'result' && (
              <div className="sn-scan-result" style={{ marginBottom: 14, borderRadius: 12, overflow: 'hidden', border: '1px solid #BBF7D0', background: '#F0FDF4' }}>
                {scanPreview && (
                  <div style={{ display: 'flex', justifyContent: 'center', background: '#DCFCE7', padding: '10px' }}>
                    <img src={scanPreview} alt="Captured notes" style={{ maxHeight: 120, maxWidth: '100%', borderRadius: 8, objectFit: 'contain', boxShadow: '0 2px 8px rgba(0,0,0,.12)' }} />
                  </div>
                )}
                <div style={{ padding: '12px 14px' }}>
                  <div style={{ display: 'flex', alignItems: 'center', gap: 6, marginBottom: 8 }}>
                    <span style={{ fontSize: '0.6875rem', fontWeight: 700, letterSpacing: '.08em', textTransform: 'uppercase', color: '#15803D' }}>✦ Slide Transcription</span>
                    <span style={{ fontSize: '0.6875rem', color: 'var(--ink-subtle)' }}>— review &amp; edit before adding</span>
                  </div>
                  <textarea
                    value={scanResult}
                    onChange={e => setScanResult(e.target.value)}
                    rows={5}
                    style={{ width: '100%', border: 'none', outline: 'none', background: 'transparent', fontFamily: '"Geist", sans-serif', fontSize: '0.875rem', color: 'var(--ink)', lineHeight: 1.7, resize: 'vertical', boxSizing: 'border-box' }}
                  />
                  <div style={{ display: 'flex', gap: 8, marginTop: 10, flexWrap: 'wrap' }}>
                    <button
                      onClick={() => applyScan('append')}
                      style={{ padding: '6px 14px', borderRadius: 8, background: '#16A34A', color: 'white', border: 'none', fontSize: '0.8125rem', fontWeight: 600, cursor: 'pointer', transition: 'background .15s' }}
                      onMouseEnter={e => e.currentTarget.style.background='#15803D'}
                      onMouseLeave={e => e.currentTarget.style.background='#16A34A'}
                    >+ Add to notes</button>
                    <button
                      onClick={() => applyScan('replace')}
                      style={{ padding: '6px 14px', borderRadius: 8, background: '#F4F4F0', color: 'var(--ink)', border: 'none', fontSize: '0.8125rem', fontWeight: 500, cursor: 'pointer' }}
                    >↺ Replace notes</button>
                    <button
                      onClick={() => cameraInputRef.current?.click()}
                      style={{ padding: '6px 14px', borderRadius: 8, background: '#F4F4F0', color: 'var(--ink)', border: 'none', fontSize: '0.8125rem', fontWeight: 500, cursor: 'pointer' }}
                    >📷 Scan again</button>
                    <button
                      onClick={() => { setScanState('idle'); setScanResult(''); setScanPreview(''); }}
                      style={{ padding: '6px 10px', borderRadius: 8, background: 'none', color: 'var(--ink-subtle)', border: 'none', fontSize: '0.8125rem', cursor: 'pointer', marginLeft: 'auto' }}
                    >Discard</button>
                  </div>
                </div>
              </div>
            )}

            {/* Body editor */}
            <div style={{ marginBottom: 8 }}>
              {/* Formatting toolbar */}
              <div style={{ display: 'flex', alignItems: 'center', gap: 4, flexWrap: 'wrap', marginBottom: 6 }}>
                <button
                  onMouseDown={e => { e.preventDefault(); document.execCommand('bold'); }}
                  title="Bold selected text"
                  style={{ padding: '3px 9px', borderRadius: 6, border: '1px solid var(--border)', background: '#FFF', cursor: 'pointer', fontSize: '0.75rem', fontWeight: 700, color: 'var(--ink)' }}>B</button>
                <button
                  onMouseDown={e => { e.preventDefault(); document.execCommand('hiliteColor', false, '#FEF08A'); }}
                  title="Highlight selected text"
                  style={{ display: 'flex', alignItems: 'center', gap: 3, padding: '3px 9px', borderRadius: 6, border: '1px solid var(--border)', background: '#FFFBEB', cursor: 'pointer', fontSize: '0.75rem', fontWeight: 600, color: '#92400E' }}
                ><span style={{ background: '#FEF08A', padding: '1px 3px', borderRadius: 2 }}>A</span> Highlight</button>
                <div style={{ width: 1, height: 14, background: 'var(--border)', margin: '0 2px' }} />
                <button onMouseDown={e => { e.preventDefault(); document.execCommand('justifyLeft'); }} title="Align left"
                  style={{ padding: '3px 8px', borderRadius: 6, border: '1px solid var(--border)', background: '#FFF', cursor: 'pointer', fontSize: '0.75rem', color: 'var(--ink-muted)' }}>Left</button>
                <button onMouseDown={e => { e.preventDefault(); document.execCommand('justifyCenter'); }} title="Center"
                  style={{ padding: '3px 8px', borderRadius: 6, border: '1px solid var(--border)', background: '#FFF', cursor: 'pointer', fontSize: '0.75rem', color: 'var(--ink-muted)' }}>Center</button>
                <button onMouseDown={e => { e.preventDefault(); document.execCommand('justifyRight'); }} title="Align right"
                  style={{ padding: '3px 8px', borderRadius: 6, border: '1px solid var(--border)', background: '#FFF', cursor: 'pointer', fontSize: '0.75rem', color: 'var(--ink-muted)' }}>Right</button>
              </div>
              <div
                ref={bodyEditRef}
                className="sn-body-edit"
                contentEditable
                suppressContentEditableWarning
                data-placeholder="Write your sermon notes here…"
                onFocus={e => e.currentTarget.style.borderBottomColor = SN_NOTES_GREEN}
                onBlur={e => e.currentTarget.style.borderBottomColor = 'var(--border)'}
                onInput={() => {
                  const html = bodyEditRef.current?.innerHTML || '';
                  setForm({ body: html });
                  triggerSave({ body: html });
                }}
                style={{ outline: 'none', minHeight: 152, fontSize: '0.9375rem', lineHeight: 1.78, padding: '4px 0 12px', borderBottom: '1px solid var(--border)', color: 'var(--ink)', wordBreak: 'break-word', fontFamily: '"Geist", sans-serif', transition: 'border-color .15s', cursor: 'text' }}
              />
              {wordCount > 0 && <div style={{ textAlign: 'right', fontSize: '0.6875rem', color: 'var(--ink-subtle)', marginTop: 3 }}>{wordCount} words</div>}
            </div>

            {/* Footer actions */}
            <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', flexWrap: 'wrap', gap: 8, marginTop: 20, paddingTop: 16, borderTop: '1px solid var(--border)' }}>
              <div style={{ fontSize: '0.6875rem', color: 'var(--ink-subtle)' }}>
                {existing.updatedAt
                  ? `Last edited ${new Date(existing.updatedAt).toLocaleDateString('en-US', { month: 'short', day: 'numeric' })} at ${new Date(existing.updatedAt).toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' })}`
                  : hasContent ? 'Not saved yet — type to auto-save' : ''}
              </div>
              <div style={{ display: 'flex', gap: 8, flexWrap: 'wrap' }}>
                {hasContent && (
                  <button className="btn btn-soft text-xs" onClick={() => exportNoteToPDF({ ...formRef.current }, { ...meta })}>↗ Export PDF</button>
                )}
                {hasExisting && (
                  <button className="btn btn-ghost text-xs" style={{ color: 'var(--danger)' }}
                    onClick={() => { if (confirm('Delete this note? This cannot be undone.')) { onDelete(noteId); } }}>
                    Delete
                  </button>
                )}
              </div>
            </div>
          </div>
        )}

        {/* ─── JOURNAL VIEW ───────────────────────────────── */}
        {view === 'journal' && (
          <div style={{ overflowY: 'auto', flex: 1, padding: '16px 20px 36px', WebkitOverflowScrolling: 'touch' }}>
            <input
              className="input" value={jSearch}
              onChange={e => setJSearch(e.target.value)}
              placeholder="Search your sermon notes…"
              autoFocus
              style={{ marginBottom: 20 }}
            />

            {allNotes.length === 0 ? (
              <div style={{ textAlign: 'center', paddingTop: 48, color: 'var(--ink-subtle)', fontSize: '0.875rem' }}>
                <div style={{ fontSize: '2rem', marginBottom: 12 }}>📓</div>
                {jSearch ? 'No notes match your search.' : 'No sermon notes yet.\nSwitch to Notes to write your first entry.'}
              </div>
            ) : (
              <div style={{ animation: 'snFadeUp .22s ease-out both' }}>
                {Array.from(byMonth.entries()).map(([mk, notes]) => (
                  <div key={mk} style={{ marginBottom: 28 }}>
                    <div style={{ fontSize: '0.6875rem', fontWeight: 700, letterSpacing: '.08em', textTransform: 'uppercase', color: 'var(--ink-subtle)', marginBottom: 10 }}>
                      {formatMonthLabel(mk)}
                    </div>
                    <div style={{ display: 'flex', flexDirection: 'column', gap: 8 }}>
                      {notes.map(n => {
                        const preview   = (n.body || '').replace(/<[^>]*>/g, '').slice(0, 110).trim();
                        const isCurrent = n.id === noteId;
                        return (
                          <div key={n.id}
                            onClick={() => { if (!isCurrent && onOpenNote) { onOpenNote({ id: n.id, meta: { date: n.date, service: n.service, dateLabel: formatDateLong(n.date) } }); } else if (!isCurrent) { handleClose(); } }}
                            style={{ padding: '14px 16px', borderRadius: 14, background: isCurrent ? SN_NOTES_TINT : 'var(--bg)', border: `1px solid ${isCurrent ? SN_NOTES_GREEN + '50' : 'var(--border)'}`, transition: 'border-color .2s, background .15s', cursor: isCurrent ? 'default' : 'pointer' }}
                            onMouseEnter={e => { if (!isCurrent) e.currentTarget.style.background = '#FAFAF9'; }}
                            onMouseLeave={e => { if (!isCurrent) e.currentTarget.style.background = 'var(--bg)'; }}
                          >
                            <div style={{ display: 'flex', justifyContent: 'space-between', gap: 8, marginBottom: 4, flexWrap: 'wrap' }}>
                              <div style={{ fontWeight: 600, fontSize: '0.875rem', color: isCurrent ? SN_NOTES_GREEN : 'var(--ink)' }}>
                                {n.title || <span style={{ fontStyle: 'italic', color: 'var(--ink-subtle)', fontWeight: 400 }}>Untitled</span>}
                              </div>
                              <div style={{ fontSize: '0.75rem', color: 'var(--ink-subtle)', flexShrink: 0 }}>
                                {formatDateShort(n.date)} · {n.service}
                              </div>
                            </div>
                            {preview && <div style={{ fontSize: '0.8125rem', color: 'var(--ink-muted)', lineHeight: 1.55, marginBottom: 8 }}>{preview}{(n.body||'').length > 110 ? '…' : ''}</div>}
                            <div style={{ display: 'flex', gap: 5, flexWrap: 'wrap' }}>
                              {isCurrent && <span className="pill" style={{ fontSize: '0.6875rem', background: SN_NOTES_SOFT, color: SN_NOTES_GREEN }}>← current</span>}
                            </div>
                          </div>
                        );
                      })}
                    </div>
                  </div>
                ))}
                <div style={{ textAlign: 'center', fontSize: '0.75rem', color: 'var(--ink-subtle)', marginTop: 12 }}>
                  {allNotes.length} note{allNotes.length !== 1 ? 's' : ''} · tap any entry to open and edit
                </div>
              </div>
            )}
          </div>
        )}
      </div>
    </div>,
    document.body
  );
}

function loadGamesState()  { try { return JSON.parse(localStorage.getItem(GAMES_KEY)||'{}'); } catch { return {}; } }
function saveGamesState(s) { try { localStorage.setItem(GAMES_KEY, JSON.stringify(s)); } catch {} }

function buildWSGrid(words, SIZE = 10) {
  const DIRS = [[0,1],[1,0],[1,1],[0,-1],[-1,0],[-1,-1],[1,-1],[-1,1]];
  const grid = Array.from({length:SIZE}, () => Array(SIZE).fill(''));
  const placed = [];
  const ALPHA = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
  const sorted = [...words].filter(w => w.length <= SIZE).sort((a,b) => b.length - a.length);
  for (const word of sorted) {
    let ok = false;
    for (let t = 0; t < 80 && !ok; t++) {
      const [dr,dc] = DIRS[Math.floor(Math.random()*DIRS.length)];
      const r = Math.floor(Math.random()*SIZE), c = Math.floor(Math.random()*SIZE);
      let fits = true;
      const cells = [];
      for (let i = 0; i < word.length; i++) {
        const nr = r+dr*i, nc = c+dc*i;
        if (nr<0||nr>=SIZE||nc<0||nc>=SIZE||(grid[nr][nc]!==''&&grid[nr][nc]!==word[i])){fits=false;break;}
        cells.push([nr,nc]);
      }
      if (fits) { cells.forEach(([nr,nc],i)=>{ grid[nr][nc]=word[i]; }); placed.push({word,cells}); ok=true; }
    }
  }
  for (let r=0;r<SIZE;r++) for(let c=0;c<SIZE;c++) if(!grid[r][c]) grid[r][c]=ALPHA[Math.floor(Math.random()*26)];
  return { grid, placed };
}
