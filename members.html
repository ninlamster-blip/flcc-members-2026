// ─── GAME: Bible Trivia ────────────────────────────────────────────────────────
function BibleTrivia({ gState, setGState }) {
  const [diff,   setDiff]     = useState(null);
  const [qs,     setQs]       = useState([]);
  const [qIdx,   setQIdx]     = useState(0);
  const [score,  setScore]    = useState(0);
  const [ans,    setAns]      = useState(null);
  const [sel,    setSel]      = useState(null);
  const [done,   setDone]     = useState(false);

  const start = d => {
    setQs([...TRIVIA[d]].sort(()=>Math.random()-.5).slice(0,10));
    setDiff(d); setQIdx(0); setScore(0); setAns(null); setSel(null); setDone(false);
  };

  const pick = opt => {
    if (ans) return;
    setSel(opt);
    const ok = opt === qs[qIdx].a;
    setAns(ok?'correct':'wrong');
    const pts = diff==='easy'?10:diff==='medium'?20:30;
    const newScore = score + (ok?pts:0);
    setTimeout(()=>{
      if (qIdx+1 >= qs.length) {
        const prev = gState.trivia||{};
        if (newScore > (prev.highScore||0)) setGState({...gState,trivia:{...prev,highScore:newScore}});
        setScore(newScore); setDone(true);
      } else {
        setScore(newScore); setQIdx(i=>i+1); setAns(null); setSel(null);
      }
    }, 1100);
  };

  if (!diff) return (
    <div style={{padding:20}}>
      <div className="font-display" style={{fontSize:'1.25rem',fontWeight:600,marginBottom:6}}>Choose Difficulty</div>
      <div style={{fontSize:'0.875rem',color:'var(--ink-muted)',marginBottom:20}}>10 questions per round. Higher difficulty = more points per correct answer.</div>
      {[{k:'easy',l:'🌱 Easy',d:'Bible basics · 10 pts each',c:'#16A34A'},
        {k:'medium',l:'📖 Medium',d:'Deeper knowledge · 20 pts each',c:'#0284C7'},
        {k:'hard',l:'🔥 Hard',d:'Scholar level · 30 pts each',c:'#BE123C'}].map(x=>(
        <div key={x.k} onClick={()=>start(x.k)} style={{padding:'16px 18px',borderRadius:12,border:`1px solid ${x.c}30`,marginBottom:10,cursor:'pointer',background:x.c+'0A',transition:'background .15s'}}
          onMouseEnter={e=>e.currentTarget.style.background=x.c+'18'} onMouseLeave={e=>e.currentTarget.style.background=x.c+'0A'}>
          <div style={{fontWeight:600,color:x.c}}>{x.l}</div>
          <div style={{fontSize:'0.8125rem',color:'var(--ink-muted)',marginTop:2}}>{x.d}</div>
        </div>
      ))}
      {gState.trivia?.highScore>0 && <div style={{textAlign:'center',fontSize:'0.8125rem',color:'var(--ink-muted)',marginTop:8}}>Best score: <strong style={{color:'#0284C7'}}>{gState.trivia.highScore}</strong></div>}
    </div>
  );

  if (done) {
    const max = 10*(diff==='easy'?10:diff==='medium'?20:30);
    const pct = Math.round((score/max)*100);
    return (
      <div style={{padding:24,textAlign:'center'}}>
        <div style={{fontSize:'3rem',marginBottom:12}}>{pct>=90?'🏆':pct>=70?'🌟':pct>=50?'📖':'🙏'}</div>
        <div className="font-display" style={{fontSize:'2.25rem',fontWeight:600,marginBottom:4}}>{score} pts</div>
        <div style={{fontSize:'0.875rem',color:'var(--ink-muted)',marginBottom:8}}>{pct>=90?'Bible Scholar!':pct>=70?'Great job!':pct>=50?'Keep studying!':'Keep reading your Bible!'}</div>
        {gState.trivia?.highScore===score&&score>0&&<div style={{color:'#F59E0B',fontWeight:600,marginBottom:16}}>⭐ New high score!</div>}
        <button onClick={()=>setDiff(null)} style={{padding:'10px 24px',borderRadius:999,background:'var(--ink)',color:'white',border:'none',cursor:'pointer',fontSize:'0.875rem',fontWeight:600}}>Play again</button>
      </div>
    );
  }

  const q = qs[qIdx];
  return (
    <div style={{padding:20}}>
      <div style={{display:'flex',justifyContent:'space-between',marginBottom:10}}>
        <div style={{fontSize:'0.75rem',color:'var(--ink-muted)'}}>Q {qIdx+1}/10 · {diff}</div>
        <div style={{fontSize:'0.875rem',fontWeight:600,color:'#0284C7'}}>{score} pts</div>
      </div>
      <div style={{height:4,borderRadius:2,background:'var(--border)',marginBottom:20}}>
        <div style={{height:4,borderRadius:2,background:'#0284C7',width:`${((qIdx)/10)*100}%`,transition:'width .3s'}}/>
      </div>
      <div className="font-display" style={{fontSize:'1.125rem',fontWeight:600,lineHeight:1.5,marginBottom:24,minHeight:56}}>{q.q}</div>
      <div style={{display:'flex',flexDirection:'column',gap:10}}>
        {q.o.map(opt=>{
          let bg='#F9F9F7',border='var(--border)',color='var(--ink)';
          if(ans){
            if(opt===q.a){bg='#F0FDF4';border='#16A34A';color='#15803D';}
            else if(opt===sel&&sel!==q.a){bg='#FEF2F2';border='#DC2626';color='#DC2626';}
          }
          return (
            <button key={opt} onClick={()=>pick(opt)} disabled={!!ans}
              style={{padding:'14px 16px',borderRadius:12,border:`2px solid ${border}`,background:bg,color,textAlign:'left',cursor:ans?'default':'pointer',fontSize:'0.9375rem',fontWeight:500,transition:'all .2s',display:'flex',justifyContent:'space-between',alignItems:'center'}}>
              {opt}
              {ans&&opt===q.a&&<span>✓</span>}
              {ans&&opt===sel&&sel!==q.a&&<span>✗</span>}
            </button>
          );
        })}
      </div>
    </div>
  );
}

// ─── GAME: Bible Wordle ────────────────────────────────────────────────────────
function BibleWordle({ gState, setGState }) {
  const today = todayISO();
  const ANSWER = W_WORDS[parseInt(today.replace(/-/g,'')) % W_WORDS.length];
  const ws     = gState.wordle||{};
  const init   = ws.date===today ? (ws.guesses||[]) : [];

  const [guesses, setGuesses] = useState(init);
  const [cur,     setCur]     = useState('');
  const [shake,   setShake]   = useState(false);
  const [won,  setWon]  = useState(init.some(g=>g===ANSWER));
  const [lost, setLost] = useState(!init.some(g=>g===ANSWER) && init.length>=6);

  const KEYS = ['QWERTYUIOP','ASDFGHJKL','ZXCVBNM'];

  const letterState = useMemo(()=>{
    const s={};
    for(const g of guesses) for(let i=0;i<5;i++){
      const ch=g[i];
      if(ANSWER[i]===ch) s[ch]='correct';
      else if(ANSWER.includes(ch)&&s[ch]!=='correct') s[ch]='present';
      else if(!s[ch]) s[ch]='absent';
    }
    return s;
  },[guesses,ANSWER]);

  const cellColor=(g,col)=>{
    if(ANSWER[col]===g[col]) return '#16A34A';
    if(ANSWER.includes(g[col])) return '#D97706';
    return '#6B7280';
  };

  const submit=()=>{
    if(cur.length<5){setShake(true);setTimeout(()=>setShake(false),500);return;}
    const ng=[...guesses,cur];
    setGuesses(ng); setCur('');
    const w=cur===ANSWER, l=!w&&ng.length>=6;
    if(w)setWon(true); if(l)setLost(true);
    const prev=gState.wordle||{};
    const streak=w?((prev.date===addDays(today,-1))?(prev.streak||0)+1:1):0;
    setGState({...gState,wordle:{date:today,guesses:ng,streak:w?streak:prev.streak||0,bestStreak:Math.max(streak,prev.bestStreak||0)}});
  };

  const handleKey=k=>{
    if(won||lost)return;
    if(k==='ENTER'){submit();return;}
    if(k==='DEL'){setCur(c=>c.slice(0,-1));return;}
    if(/^[A-Z]$/.test(k)&&cur.length<5)setCur(c=>c+k);
  };

  useEffect(()=>{
    const fn=e=>{
      const k=e.key.toUpperCase();
      if(k==='ENTER'||k==='BACKSPACE'||/^[A-Z]$/.test(k)) handleKey(k==='BACKSPACE'?'DEL':k);
    };
    window.addEventListener('keydown',fn);
    return ()=>window.removeEventListener('keydown',fn);
  });

  const kbColor=k=>{
    const st=letterState[k];
    return st==='correct'?'#16A34A':st==='present'?'#D97706':st==='absent'?'#9CA3AF':'#E5E7EB';
  };
  const kbText=k=>letterState[k]?'white':'var(--ink)';

  return (
    <div style={{padding:'14px 16px'}}>
      <div style={{textAlign:'center',fontSize:'0.75rem',color:'var(--ink-muted)',marginBottom:10}}>
        📅 Daily word · {today}{ws.streak>0?` · 🔥 ${ws.streak}-day streak`:''}
      </div>

      {/* Grid */}
      <div style={{display:'flex',flexDirection:'column',alignItems:'center',gap:5,marginBottom:14}}>
        {Array.from({length:6},(_,row)=>(
          <div key={row} style={{display:'flex',gap:5}}>
            {Array.from({length:5},(_,col)=>{
              const g=guesses[row]; const revealed=!!g;
              const ch=g?g[col]:(row===guesses.length?cur[col]:'');
              let bg='transparent',border='#D1D5DB',color='var(--ink)';
              if(revealed){bg=cellColor(g,col);border=bg;color='white';}
              else if(ch)border='#6B7280';
              return (
                <div key={col} style={{width:50,height:50,display:'flex',alignItems:'center',justifyContent:'center',border:`2px solid ${border}`,borderRadius:8,fontWeight:700,fontSize:'1.375rem',background:bg,color,fontFamily:'Geist Mono,monospace',
                  animation:(!revealed&&row===guesses.length&&shake)?'snShakeX .4s ease':'none',transition:'background .3s'}}>
                  {ch||''}
                </div>
              );
            })}
          </div>
        ))}
      </div>

      {(won||lost)&&(
        <div style={{textAlign:'center',padding:'10px 14px',borderRadius:10,background:won?'#F0FDF4':'#FEF2F2',marginBottom:12}}>
          <div style={{fontWeight:700,color:won?'#16A34A':'#DC2626'}}>{won?`✓ ${ANSWER} — Well done! 🎉`:`The word was: ${ANSWER}`}</div>
          <div style={{fontSize:'0.75rem',color:'var(--ink-muted)',marginTop:3}}>Come back tomorrow for a new word!</div>
        </div>
      )}

      {/* Keyboard */}
      <div style={{display:'flex',flexDirection:'column',alignItems:'center',gap:5}}>
        {KEYS.map((row,ri)=>(
          <div key={ri} style={{display:'flex',gap:4}}>
            {ri===2&&<button onClick={()=>handleKey('ENTER')} style={{padding:'13px 6px',borderRadius:7,background:'#374151',color:'white',border:'none',fontSize:'0.625rem',fontWeight:700,cursor:'pointer',letterSpacing:'.04em'}}>ENTER</button>}
            {row.split('').map(k=>(
              <button key={k} onClick={()=>handleKey(k)} style={{width:30,height:42,borderRadius:7,background:kbColor(k),color:kbText(k),border:'none',fontSize:'0.875rem',fontWeight:700,cursor:'pointer',transition:'background .2s'}}>{k}</button>
            ))}
            {ri===2&&<button onClick={()=>handleKey('DEL')} style={{padding:'13px 6px',borderRadius:7,background:'#374151',color:'white',border:'none',fontSize:'0.625rem',fontWeight:700,cursor:'pointer'}}>DEL</button>}
          </div>
        ))}
      </div>
    </div>
  );
}

// ─── GAME: Memory Match ────────────────────────────────────────────────────────
function MemoryMatch({ gState, setGState }) {
  const [diff,   setDiff]  = useState(null);
  const [cards,  setCards] = useState([]);
  const [flip,   setFlip]  = useState([]);
  const [match,  setMatch] = useState([]);
  const [moves,  setMoves] = useState(0);
  const [t0,     setT0]    = useState(null);
  const [elapsed,setElapsed]=useState(0);
  const [done,   setDone]  = useState(false);
  const block = useRef(false);

  useEffect(()=>{
    if(t0&&!done){const iv=setInterval(()=>setElapsed(Math.floor((Date.now()-t0)/1000)),1000);return()=>clearInterval(iv);}
  },[t0,done]);

  const start=d=>{
    const n=d==='easy'?4:d==='medium'?8:12;
    const pairs=[...VERSE_PAIRS].sort(()=>Math.random()-.5).slice(0,n);
    const cs=[...pairs.map((p,i)=>({id:i*2,type:'verse',text:p.v,pid:i})),
              ...pairs.map((p,i)=>({id:i*2+1,type:'ref',text:p.r,pid:i}))].sort(()=>Math.random()-.5);
    setDiff(d);setCards(cs);setFlip([]);setMatch([]);setMoves(0);setT0(Date.now());setElapsed(0);setDone(false);
  };

  const tap=id=>{
    if(block.current||flip.includes(id)||match.includes(id))return;
    const nf=[...flip,id];
    setFlip(nf);
    if(nf.length===2){
      setMoves(m=>m+1); block.current=true;
      const [a,b]=nf.map(x=>cards.find(c=>c.id===x));
      if(a.pid===b.pid){
        const nm=[...match,...nf];
        setMatch(nm); setFlip([]); block.current=false;
        if(nm.length===cards.length){
          setDone(true);
          const el=Math.floor((Date.now()-t0)/1000);
          setElapsed(el);
          const prev=gState.match||{};
          const bt=prev.bestTime||{};
          if(!bt[diff]||el<bt[diff]) setGState({...gState,match:{...prev,bestTime:{...bt,[diff]:el}}});
        }
      } else { setTimeout(()=>{setFlip([]);block.current=false;},900); }
    }
  };

  if(!diff) return (
    <div style={{padding:20}}>
      <div className="font-display" style={{fontSize:'1.25rem',fontWeight:600,marginBottom:6}}>Memory Match</div>
      <div style={{fontSize:'0.875rem',color:'var(--ink-muted)',marginBottom:20}}>Flip cards to match Bible verses with their scripture references.</div>
      {[{k:'easy',l:'🌱 Easy — 4 pairs',c:'#16A34A'},{k:'medium',l:'📖 Medium — 8 pairs',c:'#0284C7'},{k:'hard',l:'🔥 Hard — 12 pairs',c:'#BE123C'}].map(x=>(
        <div key={x.k} onClick={()=>start(x.k)} style={{padding:'14px 18px',borderRadius:12,border:`1px solid ${x.c}30`,marginBottom:10,cursor:'pointer',background:x.c+'0A',transition:'background .15s'}}
          onMouseEnter={e=>e.currentTarget.style.background=x.c+'18'} onMouseLeave={e=>e.currentTarget.style.background=x.c+'0A'}>
          <div style={{fontWeight:600,color:x.c}}>{x.l}</div>
          {gState.match?.bestTime?.[x.k]&&<div style={{fontSize:'0.75rem',color:'var(--ink-muted)',marginTop:2}}>Best: {gState.match.bestTime[x.k]}s</div>}
        </div>
      ))}
    </div>
  );

  if(done) return (
    <div style={{padding:24,textAlign:'center'}}>
      <div style={{fontSize:'3rem',marginBottom:12}}>🎉</div>
      <div className="font-display" style={{fontSize:'1.75rem',fontWeight:600,marginBottom:4}}>Complete!</div>
      <div style={{fontSize:'0.875rem',color:'var(--ink-muted)',marginBottom:16}}>{moves} moves · {elapsed} seconds</div>
      <button onClick={()=>setDiff(null)} style={{padding:'10px 24px',borderRadius:999,background:'var(--ink)',color:'white',border:'none',cursor:'pointer',fontSize:'0.875rem',fontWeight:600}}>Play again</button>
    </div>
  );

  const cols=diff==='easy'?4:4;
  return (
    <div style={{padding:14}}>
      <div style={{display:'flex',justifyContent:'space-between',marginBottom:12,fontSize:'0.8125rem',color:'var(--ink-muted)'}}>
        <span>🃏 {match.length/2}/{cards.length/2} matched</span>
        <span>{moves} moves · {elapsed}s</span>
      </div>
      <div style={{display:'grid',gridTemplateColumns:`repeat(${cols},1fr)`,gap:8}}>
        {cards.map(card=>{
          const isFlip=flip.includes(card.id)||match.includes(card.id);
          const isMatch=match.includes(card.id);
          return (
            <div key={card.id} onClick={()=>tap(card.id)} style={{
              aspectRatio:'2/3',borderRadius:10,cursor:'pointer',padding:8,
              display:'flex',alignItems:'center',justifyContent:'center',textAlign:'center',
              background:isMatch?'#F0FDF4':isFlip?(card.type==='verse'?'#EFF6FF':G_TINT):'#1E293B',
              border:`2px solid ${isMatch?'#16A34A':isFlip?G_ACCENT:'#334155'}`,
              color:isFlip?'var(--ink)':'transparent',
              fontSize:diff==='hard'?'0.5625rem':'0.625rem',
              lineHeight:1.35,fontWeight:500,
              transition:'all .25s ease',
              boxShadow:isFlip?'0 2px 8px rgba(0,0,0,.08)':'0 2px 8px rgba(0,0,0,.2)',
            }}>
              {isFlip?card.text:'✝️'}
            </div>
          );
        })}
      </div>
    </div>
  );
}

// ─── GAME: Word Search ─────────────────────────────────────────────────────────
function WordSearch({ gState, setGState }) {
  const [themeIdx, setThemeIdx] = useState(null);
  const [gd,       setGd]       = useState(null);
  const [found,    setFound]    = useState([]); // [{word,cells}]
  const [sel,      setSel]      = useState(null); // start cell
  const [hover,    setHover]    = useState(null);
  const [wonMsg,   setWonMsg]   = useState('');

  const startTheme = idx => {
    setThemeIdx(idx);
    setGd(buildWSGrid(WS_THEMES[idx].words, 10));
    setFound([]); setSel(null); setHover(null); setWonMsg('');
  };

  const getPath=(s,e)=>{
    if(!s||!e)return[];
    const [r1,c1]=s,[r2,c2]=e;
    const dr=r2-r1,dc=c2-c1,len=Math.max(Math.abs(dr),Math.abs(dc));
    if(len===0)return[s];
    if(dr!==0&&dc!==0&&Math.abs(dr)!==Math.abs(dc))return[];
    const sr=dr===0?0:dr/Math.abs(dr),sc=dc===0?0:dc/Math.abs(dc);
    return Array.from({length:len+1},(_,i)=>[r1+sr*i,c1+sc*i]);
  };

  const tryWord=end=>{
    if(!sel)return;
    const path=getPath(sel,end);
    const w=path.map(([r,c])=>gd.grid[r][c]).join('');
    const wr=w.split('').reverse().join('');
    const target=gd.placed.find(p=>p.word===w||p.word===wr);
    if(target&&!found.some(f=>f.word===target.word)){
      const nf=[...found,target];
      setFound(nf);
      if(nf.length===gd.placed.length)setWonMsg('🎉 All words found! Well done!');
    }
    setSel(null);setHover(null);
  };

  const foundCells=useMemo(()=>{
    const s=new Set();
    found.forEach(f=>f.cells.forEach(([r,c])=>s.add(`${r},${c}`)));
    return s;
  },[found]);

  const pathCells=useMemo(()=>{
    const path=getPath(sel,hover||sel);
    return new Set(path.map(([r,c])=>`${r},${c}`));
  },[sel,hover]);

  if(themeIdx===null) return (
    <div style={{padding:20}}>
      <div className="font-display" style={{fontSize:'1.25rem',fontWeight:600,marginBottom:6}}>Word Search</div>
      <div style={{fontSize:'0.875rem',color:'var(--ink-muted)',marginBottom:20}}>Tap a letter to start, tap the end letter to select a word. Horizontal, vertical, and diagonal.</div>
      <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:10}}>
        {WS_THEMES.map((t,i)=>(
          <div key={i} onClick={()=>startTheme(i)} style={{padding:14,borderRadius:12,border:'1px solid var(--border)',cursor:'pointer',transition:'background .15s'}}
            onMouseEnter={e=>e.currentTarget.style.background='#F4F4F0'} onMouseLeave={e=>e.currentTarget.style.background=''}>
            <div style={{fontWeight:600,fontSize:'0.9375rem',marginBottom:2}}>{t.name}</div>
            <div style={{fontSize:'0.75rem',color:'var(--ink-muted)'}}>{t.words.length} words</div>
          </div>
        ))}
      </div>
    </div>
  );

  return (
    <div style={{padding:'12px 14px'}}>
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:10}}>
        <div style={{fontSize:'0.8125rem',fontWeight:600}}>{WS_THEMES[themeIdx].name}</div>
        <div style={{fontSize:'0.8125rem',color:'var(--ink-muted)'}}>{found.length}/{gd.placed.length} found</div>
      </div>

      {wonMsg&&<div style={{textAlign:'center',padding:'8px 14px',borderRadius:8,background:'#F0FDF4',color:'#16A34A',fontWeight:700,marginBottom:10,fontSize:'0.875rem'}}>
        {wonMsg} <button onClick={()=>setThemeIdx(null)} style={{marginLeft:8,fontSize:'0.75rem',background:'none',border:'none',cursor:'pointer',textDecoration:'underline',color:'#16A34A'}}>Play another</button>
      </div>}

      <div style={{display:'flex',flexWrap:'wrap',gap:5,marginBottom:12}}>
        {gd.placed.map(p=>(
          <span key={p.word} style={{fontSize:'0.6875rem',fontWeight:600,padding:'2px 8px',borderRadius:999,
            background:found.some(f=>f.word===p.word)?'#F0FDF4':'#F4F4F0',
            color:found.some(f=>f.word===p.word)?'#16A34A':'var(--ink-muted)',
            textDecoration:found.some(f=>f.word===p.word)?'line-through':'none',letterSpacing:'.04em'}}>{p.word}</span>
        ))}
      </div>

      <div style={{display:'inline-grid',gridTemplateColumns:'repeat(10,1fr)',gap:2,touchAction:'none',userSelect:'none'}}>
        {gd.grid.map((row,r)=>row.map((ch,c)=>{
          const key=`${r},${c}`;
          const isF=foundCells.has(key),isP=pathCells.has(key),isS=sel&&sel[0]===r&&sel[1]===c;
          return (
            <div key={key}
              onPointerDown={e=>{e.currentTarget.setPointerCapture(e.pointerId);setSel([r,c]);setHover([r,c]);}}
              onPointerEnter={()=>{if(sel)setHover([r,c]);}}
              onPointerUp={()=>tryWord([r,c])}
              style={{width:28,height:28,display:'flex',alignItems:'center',justifyContent:'center',
                borderRadius:6,fontWeight:700,fontSize:'0.8125rem',fontFamily:'Geist Mono,monospace',cursor:'pointer',
                background:isF?'#F0FDF4':isS?G_ACCENT:isP?G_SOFT:'#F9F9F7',
                color:isF?'#16A34A':isS?'white':isP?G_ACCENT:'var(--ink)',
                border:`1px solid ${isF?'#BBF7D0':isP?G_ACCENT:'var(--border)'}`,
                transition:'background .08s',}}>
              {ch}
            </div>
          );
        }))}
      </div>

      <button onClick={()=>setThemeIdx(null)} style={{marginTop:14,fontSize:'0.8125rem',color:'var(--ink-muted)',background:'none',border:'none',cursor:'pointer',textDecoration:'underline',display:'block'}}>← Choose another theme</button>
    </div>
  );
}

// ─── GAME: Fill in the Blank ───────────────────────────────────────────────────
function FillBlank({ gState, setGState }) {
  const [qs]    = useState(()=>[...FITB].sort(()=>Math.random()-.5).slice(0,10));
  const [qIdx,  setQIdx]  = useState(0);
  const [score, setScore] = useState(0);
  const [ans,   setAns]   = useState(null);
  const [sel,   setSel]   = useState(null);
  const [done,  setDone]  = useState(false);

  const q=qs[qIdx];
  const pick=opt=>{
    if(ans)return;
    setSel(opt);
    const ok=opt===q.b;
    setAns(ok?'correct':'wrong');
    const ns=score+(ok?10:0);
    setTimeout(()=>{
      if(qIdx+1>=qs.length){
        const prev=gState.fitb||{};
        if(ns>(prev.highScore||0))setGState({...gState,fitb:{...prev,highScore:ns}});
        setScore(ns);setDone(true);
      } else {setScore(ns);setQIdx(i=>i+1);setAns(null);setSel(null);}
    },1100);
  };

  if(done){
    const pct=Math.round((score/100)*100);
    return (
      <div style={{padding:24,textAlign:'center'}}>
        <div style={{fontSize:'3rem',marginBottom:12}}>{pct>=80?'🏆':pct>=60?'🌟':'📖'}</div>
        <div className="font-display" style={{fontSize:'2.25rem',fontWeight:600,marginBottom:4}}>{score}/100</div>
        <div style={{fontSize:'0.875rem',color:'var(--ink-muted)',marginBottom:16}}>{pct>=80?'Scripture Scholar!':pct>=60?'Keep memorizing!':'Keep reading your Bible!'}</div>
        {gState.fitb?.highScore===score&&score>0&&<div style={{color:'#F59E0B',fontWeight:600,marginBottom:16}}>⭐ New high score!</div>}
        <button onClick={()=>{setQIdx(0);setScore(0);setAns(null);setSel(null);setDone(false);}} style={{padding:'10px 24px',borderRadius:999,background:'var(--ink)',color:'white',border:'none',cursor:'pointer',fontSize:'0.875rem',fontWeight:600}}>Play again</button>
      </div>
    );
  }

  const parts=q.t.split('___');
  return (
    <div style={{padding:20}}>
      <div style={{display:'flex',justifyContent:'space-between',marginBottom:10}}>
        <div style={{fontSize:'0.75rem',color:'var(--ink-muted)'}}>Verse {qIdx+1}/10</div>
        <div style={{fontSize:'0.875rem',fontWeight:600,color:G_ACCENT}}>{score} pts</div>
      </div>
      <div style={{height:4,borderRadius:2,background:'var(--border)',marginBottom:20}}>
        <div style={{height:4,borderRadius:2,background:G_ACCENT,width:`${(qIdx/10)*100}%`,transition:'width .3s'}}/>
      </div>

      <div style={{padding:'18px',borderRadius:14,background:G_TINT,border:`1px solid ${G_SOFT}`,marginBottom:20,lineHeight:1.8,fontSize:'1.0625rem'}}>
        <span style={{fontStyle:'italic',color:'var(--ink)'}}>
          "{parts[0]}
          <span style={{display:'inline-block',borderBottom:`2px solid ${G_ACCENT}`,minWidth:56,height:26,marginBottom:-6,background:ans?G_SOFT:'transparent',color:G_ACCENT,fontWeight:700,textAlign:'center',padding:'0 6px',transition:'background .3s'}}>
            {ans?q.b:'　'}
          </span>
          {parts[1]}"
        </span>
        <div style={{fontSize:'0.75rem',color:'var(--ink-muted)',marginTop:8,fontStyle:'normal'}}>— {q.r}</div>
      </div>

      <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:10}}>
        {q.o.map(opt=>{
          let bg='#F9F9F7',border='var(--border)',color='var(--ink)';
          if(ans){if(opt===q.b){bg='#F0FDF4';border='#16A34A';color='#15803D';}else if(opt===sel&&sel!==q.b){bg='#FEF2F2';border='#DC2626';color='#DC2626';}}
          return (
            <button key={opt} onClick={()=>pick(opt)} disabled={!!ans}
              style={{padding:'14px',borderRadius:12,border:`2px solid ${border}`,background:bg,color,fontSize:'0.9375rem',fontWeight:600,cursor:ans?'default':'pointer',transition:'all .2s'}}>
              {opt}{ans&&opt===q.b?' ✓':''}{ans&&opt===sel&&sel!==q.b?' ✗':''}
            </button>
          );
        })}
      </div>
    </div>
  );
}

// =============================================================================
// PERSONAL ATTENDANCE — member sees own history from attendance.json
// =============================================================================

const ATT_BLUE = '#0284C7';

// Find this member's records in attendance.json by name matching
function matchAttendanceRecord(me, attendanceData) {
  if (!me || !attendanceData?.sessions) return null;
  const norm = s => (s || '').trim().toLowerCase();
  const myName = norm(me.name);
  const myFull = norm((me.title ? me.title + ' ' : '') + me.name);

  // Look through all sessions to find records for this member.
  // Skip services this member is not on the roster for — a Sunday-only member
  // is never taken at a Friday service, so counting those as absences would
  // report someone with perfect attendance at ~50%.
  const myRecords = [];
  for (const sess of attendanceData.sessions) {
    if (me.sundayOnly && sess.service === 'Friday') continue;
    if (me.fridayOnly && sess.service === 'Sunday') continue;
    const rec = (sess.records || []).find(r =>
      norm(r.memberName) === myName ||
      norm(r.memberName) === myFull ||
      r.memberId === me.id
    );
    myRecords.push({
      date:         sess.date,
      service:      sess.service,
      serviceLabel: sess.serviceLabel || sess.service,
      status:       rec?.status || 'absent',  // not found in records = absent
    });
  }
  return myRecords.sort((a, b) => b.date.localeCompare(a.date));
}

function getMyAttendanceStats(myRecords) {
  if (!myRecords || !myRecords.length) return null;
  const fridays = myRecords.filter(r => r.service === 'Friday');
  const sundays = myRecords.filter(r => r.service === 'Sunday');

  const pct = list => list.length
    ? Math.round(list.filter(r => r.status === 'present').length / list.length * 100)
    : null;

  return {
    overall:        pct(myRecords),
    friday:         pct(fridays),
    sunday:         pct(sundays),
    totalSessions:  myRecords.length,
    fridaySessions: fridays.length,
    sundaySessions: sundays.length,
    recent10:       myRecords.slice(0, 10),
    streak: (() => {
      let streak = 0;
      for (const r of myRecords) {
        if (r.status === 'present') streak++;
        else break;
      }
      return streak;
    })(),
  };
}

// ── number to words (KWD) ───────────────────────────────────────────────────
const G_ONES=['','One','Two','Three','Four','Five','Six','Seven','Eight','Nine','Ten','Eleven','Twelve','Thirteen','Fourteen','Fifteen','Sixteen','Seventeen','Eighteen','Nineteen'];
const G_TENS=['','','Twenty','Thirty','Forty','Fifty','Sixty','Seventy','Eighty','Ninety'];
function gChunk(n){ if(n<=0)return''; if(n<20)return G_ONES[n]; if(n<100)return G_TENS[Math.floor(n/10)]+(n%10?' '+G_ONES[n%10]:''); return G_ONES[Math.floor(n/100)]+' Hundred'+(n%100?' '+gChunk(n%100):'') }
function gWords(amt){ const w=Math.floor(amt),f=Math.round((amt-w)*1000); let p=[]; if(w>0){if(w>=1000)p.push(gChunk(Math.floor(w/1000))+' Thousand'); if(w%1000)p.push(gChunk(w%1000)); p.push('Dinar'+(w!==1?'s':''));} if(f>0)p.push(gChunk(f)+' Fils'); return(p.join(' ')||'Zero')+' Only'; }

    try { return localStorage.getItem(ME_KEY); } catch { return null; }
  });
  const [showPicker, setShowPicker] = useState(false);
  const [activeTab, setActiveTab] = useState('home');
  const [currentMonth, setCurrentMonth] = useState(monthKey(todayISO()));
  const [conflictTarget, setConflictTarget] = useState(null);
  const [lastLoaded, setLastLoaded] = useState(null);
  const [refreshing, setRefreshing] = useState(false);
  const [personalEvents, setPersonalEventsState] = useState(() => loadPersonalEvents());
  const [showAddPersonal, setShowAddPersonal] = useState(false);
  const [editingPersonal, setEditingPersonal] = useState(null);
  const [sermonNotes, setSermonNotesState]     = useState(loadSermonNotes);
  const [openingNote, setOpeningNote]          = useState(null);
  const [showGames,   setShowGames]            = useState(false);   // { id, meta }

  const setPersonalEvents = (evs) => { savePersonalEvents(evs); setPersonalEventsState(evs); };
  const handleSaveSermonNote = (id, note) => {
    const updated = { ...sermonNotes, [id]: note };
    persistSermonNotes(updated);
    setSermonNotesState(updated);
  };
  const handleDeleteSermonNote = (id) => {
    const updated = { ...sermonNotes };
    delete updated[id];
    persistSermonNotes(updated);
    setSermonNotesState(updated);
    setOpeningNote(null);
  };

  // Load data (silent variant when called from visibility change)
  const loadData = (silent = false) => {
    if (!silent) setError(null);
    setRefreshing(true);
    let pendingDone = 0;
    const checkDone = () => {
      pendingDone += 1;
      if (pendingDone >= 6) setRefreshing(false);
    };
    // Required: data.json
    fetch(`${DATA_URL}?t=${Date.now()}`)
      .then(res => {
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        return res.json();
      })
      .then(d => {
        if (!d.workers || !d.schedule) throw new Error('Data file is missing workers or schedule.');
        setData(d);
        setLastLoaded(Date.now());
      })
      .catch(err => {
        if (!silent) setError(err.message || 'Network error');
      })
      .finally(checkDone);
    // Optional: prayer.json
    fetch(`${PRAYER_DATA_URL}?t=${Date.now()}`)
      .then(res => { if (!res.ok) throw new Error(`HTTP ${res.status}`); return res.json(); })
      .then(p => {
        if (p && (p.intercessory || p.meetings)) setPrayerData(p);
        else setPrayerData(false);
      })
      .catch(() => setPrayerData(false))
      .finally(checkDone);
    // Optional: music.json
    fetch(`${MUSIC_DATA_URL}?t=${Date.now()}`)
      .then(res => { if (!res.ok) throw new Error(`HTTP ${res.status}`); return res.json(); })
      .then(m => {
        if (m && m.entries) setMusicData(m);
        else setMusicData(false);
      })
      .catch(() => setMusicData(false))
      .finally(checkDone);
    // Optional: equip.json
    fetch(`${EQUIP_DATA_URL}?t=${Date.now()}`)
      .then(res => { if (!res.ok) throw new Error(`HTTP ${res.status}`); return res.json(); })
      .then(e => {
        if (e && (Array.isArray(e.courses) || Array.isArray(e.ministries))) setEquipData(e);
        else setEquipData(false);
      })
      .catch(() => setEquipData(false))
      .finally(checkDone);
    // Optional: attendance.json
    fetch(`${ATTENDANCE_DATA_URL}?t=${Date.now()}`)
      .then(res => { if (!res.ok) throw new Error(`HTTP ${res.status}`); return res.json(); })
      .then(a => {
        if (a && Array.isArray(a.sessions)) setAttendanceData(a);
        else setAttendanceData(false);
      })
      .catch(() => setAttendanceData(false))
      .finally(checkDone);
    // Optional: finance-members.json
    fetch(`${GIVING_DATA_URL}?t=${Date.now()}`)
      .then(res => { if (!res.ok) throw new Error(`HTTP ${res.status}`); return res.json(); })
      .then(g => {
        if (g && Array.isArray(g.members)) setGivingData(g);
        else setGivingData(false);
      })
      .catch(() => setGivingData(false))
      .finally(checkDone);
  };

  useEffect(() => loadData(false), []);

  // Silent refresh when the user comes back to the app (tab regains focus or visibility)
  useEffect(() => {
    const onVisibility = () => {
      if (document.visibilityState === 'visible') {
        // Only if it's been at least 30 seconds since last load (avoid hammering)
        if (!lastLoaded || (Date.now() - lastLoaded) > 30000) {
          loadData(true);
        }
      }
    };
    document.addEventListener('visibilitychange', onVisibility);
    window.addEventListener('focus', onVisibility);
    return () => {
      document.removeEventListener('visibilitychange', onVisibility);
      window.removeEventListener('focus', onVisibility);
    };
  }, [lastLoaded]);

  // Resolve me from meId once data is loaded
  useEffect(() => {
    if (!data || !meId) return;
    const w = data.workers.find(x => x.id === meId);
    if (w) {
      setMe(w);
      setActiveTab('home');
    } else {
      // ID stale (worker deleted) — clear it
      try { localStorage.removeItem(ME_KEY); } catch {}
      setMeId(null);
    }
  }, [data, meId]);

  // First-time visitors: show picker if data loaded but no me
  useEffect(() => {
    if (data && !meId && !showPicker) {
      // Check if user has explicitly skipped before
      let skipped = false;
      try { skipped = localStorage.getItem(ME_KEY + '-skipped') === '1'; } catch {}
      if (!skipped) setShowPicker(true);
    }
  }, [data, meId, showPicker]);

  const pickMe = (id) => {
    try { localStorage.setItem(ME_KEY, id); localStorage.removeItem(ME_KEY + '-skipped'); } catch {}
    setMeId(id);
    setShowPicker(false);
  };

  const skipPicker = () => {
    try { localStorage.setItem(ME_KEY + '-skipped', '1'); } catch {}
    setShowPicker(false);
  };

  const changeName = () => {
    try { localStorage.removeItem(ME_KEY); } catch {}
    setMe(null);
    setMeId(null);
    setShowPicker(true);
  };

  if (error) return <ErrorScreen error={error} onRetry={() => loadData(false)} />;
  if (!data) return <LoadingScreen />;
  if (showPicker) return <NamePicker workers={data.workers} onPick={pickMe} onSkip={skipPicker} churchName={data.meta.churchName} />;

  const visibleTabs = TABS.filter(t => {
    if (t.requiresMe && !me) return false;
    if (t.requiresPrayer && !prayerData) return false;
    if (t.requiresMusic && !musicData) return false;
    if (t.requiresGiving && !givingData) return false;
    return true;
  });
  const currentTab = visibleTabs.find(t => t.key === activeTab) ? activeTab : 'home';

  const formatLoadedAgo = () => {
    if (!lastLoaded) return '';
    const seconds = Math.floor((Date.now() - lastLoaded) / 1000);
    if (seconds < 60) return 'just now';
    const mins = Math.floor(seconds / 60);
    if (mins < 60) return `${mins}m ago`;
    const hours = Math.floor(mins / 60);
    if (hours < 24) return `${hours}h ago`;
    return new Date(lastLoaded).toLocaleDateString();
  };

  return (
    <div className="min-h-screen bg-app">
      <header style={{ backdropFilter: 'blur(10px)', position: 'sticky', top: 0, zIndex: 20, borderBottom: '1px solid var(--border)' }}>
        <div className="hdr-strip" />
        <div className="max-w-5xl mx-auto px-4 sm:px-6 pt-5 pb-0">
          <div className="flex items-baseline justify-between gap-4 flex-wrap">
            <div>
              <div className="text-xs font-medium tracking-widest uppercase" style={{ color: 'var(--accent)' }}>{data.meta.churchName}</div>
              <h1 className="font-display text-2xl sm:text-3xl font-semibold mt-1 greeting-h1">
                {me ? `Hello, ${me.name}` : 'Schedule'}
              </h1>
            </div>
            <div className="text-xs ink-muted text-right flex flex-col items-end gap-1">
              <a
                href="ask.html"
                style={{
                  display: 'inline-flex', alignItems: 'center', gap: '0.4rem',
                  padding: '0.45rem 0.875rem', borderRadius: 9,
                  background: 'var(--accent)', color: '#fff',
                  border: 'none', fontWeight: 600,
                  textDecoration: 'none', fontSize: '0.875rem', lineHeight: 1,
                  transition: 'background 0.15s, transform 0.1s',
                  boxShadow: '0 2px 8px rgba(163,59,42,0.25)',
                  letterSpacing: '-0.01em',
                }}
                onMouseEnter={e => { e.currentTarget.style.background = 'var(--accent-hover)'; e.currentTarget.style.transform = 'scale(1.03)'; }}
                onMouseLeave={e => { e.currentTarget.style.background = 'var(--accent)'; e.currentTarget.style.transform = 'scale(1)'; }}
              >
                💬 Ask FLCC
              </a>
              {data.meta.publishedAt && (
                <div>Published {new Date(data.meta.publishedAt).toLocaleDateString()}</div>
              )}
              <button className="text-xs underline ink-muted hover:ink" onClick={() => loadData(false)} disabled={refreshing}>
                {refreshing ? '↻ refreshing…' : `↻ ${formatLoadedAgo() || 'refresh'}`}
              </button>
            </div>
          </div>
          <div style={{ position: 'relative' }}>
            <nav style={{ display: 'flex', flexWrap: 'nowrap', overflowX: 'auto', overflowY: 'visible', marginTop: '1rem', paddingBottom: '3px', paddingRight: '32px', msOverflowStyle: 'none', scrollbarWidth: 'none', WebkitOverflowScrolling: 'touch' }}>
              {visibleTabs.map(t => (
                <button key={t.key} className={`tab ${currentTab === t.key ? 'tab-active' : ''}`} onClick={() => setActiveTab(t.key)}>
                  {t.label}
                </button>
              ))}
            </nav>
            {/* Right fade — indicates more tabs to scroll */}
            <div style={{ position: 'absolute', right: 0, top: 0, bottom: 0, width: 36, background: 'linear-gradient(to right, transparent, rgba(250,250,245,0.95))', pointerEvents: 'none' }} />
          </div>
        </div>
      </header>

      <main className="max-w-5xl mx-auto px-4 sm:px-6 py-8">
        <div key={currentTab} className="tab-content-area">
          {currentTab === 'home' && <HomeTab data={data} prayerData={prayerData} musicData={musicData} me={me} setActiveTab={setActiveTab} setCurrentMonth={setCurrentMonth} onConflict={setConflictTarget} personalEvents={personalEvents} onEditPersonal={setEditingPersonal} attendanceData={attendanceData} />}
          {currentTab === 'mine' && me && <MyScheduleTab data={data} prayerData={prayerData} musicData={musicData} me={me} onConflict={setConflictTarget} personalEvents={personalEvents} onEditPersonal={setEditingPersonal} sermonNotes={sermonNotes} onOpenNote={setOpeningNote} attendanceData={attendanceData} />}
          {currentTab === 'month' && <ThisMonthTab data={data} prayerData={prayerData} musicData={musicData} me={me} currentMonth={currentMonth} setCurrentMonth={setCurrentMonth} onConflict={setConflictTarget} personalEvents={personalEvents} onEditPersonal={setEditingPersonal} sermonNotes={sermonNotes} onOpenNote={setOpeningNote} />}
          {currentTab === 'prayer' && prayerData && <PrayerTab data={data} prayerData={prayerData} me={me} currentMonth={currentMonth} setCurrentMonth={setCurrentMonth} onConflict={setConflictTarget} />}
          {currentTab === 'music' && musicData && <MusicTab data={data} musicData={musicData} me={me} currentMonth={currentMonth} setCurrentMonth={setCurrentMonth} onConflict={setConflictTarget} />}
          {currentTab === 'equip'      && <EquipTab equipData={equipData} />}
          {currentTab === 'bible'      && <BibleTab />}
          {currentTab === 'verses'     && <IframeTab src="./verse-lookup.html" title="Verse Lookup" />}
          {currentTab === 'worldwatch' && <IframeTab src="./wwl2026.html" title="World Watch List 2026" />}
          {currentTab === 'faithmap'   && <IframeTab src="./faith-map.html" title="Global Faith & Intercession" />}
          {currentTab === 'prayermap'  && <IframeTab src="./flcc-gmpi-prayer-map.html" title="FLCC-GMPI Prayer Map Philippines" />}
          {currentTab === 'giving'     && <GivingTab givingData={givingData} me={me} />}
          {currentTab === 'calendar' && <CalendarTab data={data} prayerData={prayerData} musicData={musicData} currentMonth={currentMonth} setCurrentMonth={setCurrentMonth} me={me} personalEvents={personalEvents} onEditPersonal={setEditingPersonal} />}
          {currentTab === 'about' && <AboutTab data={data} prayerData={prayerData} musicData={musicData} equipData={equipData} me={me} onChangeName={changeName} />}
        </div>
      </main>

      {/* Sermon Notes Modal */}
      {openingNote && (
        <SermonNotesModal
          key={openingNote.id}
          noteId={openingNote.id}
          meta={openingNote.meta}
          initialView={openingNote.initialView}
          sermonNotes={sermonNotes}
          onSave={handleSaveSermonNote}
          onDelete={handleDeleteSermonNote}
          onClose={() => setOpeningNote(null)}
          onOpenNote={setOpeningNote}
        />
      )}

      {conflictTarget && (
        <ConflictModal
          entry={conflictTarget.entry}
          role={conflictTarget.role}
          me={me}
          ministry={
            conflictTarget.isMusic && musicData?.ministry ? musicData.ministry :
            conflictTarget.isPrayer && prayerData?.ministry ? prayerData.ministry :
            (data.ministry || {})
          }
          isPrayer={conflictTarget.isPrayer}
          isMusic={conflictTarget.isMusic}
          onClose={() => setConflictTarget(null)}
        />
      )}

      {/* Personal event modals */}
      {(showAddPersonal || editingPersonal) && (() => {
        const myPrayerWorker = prayerData ? findPrayerMatch(me, prayerData.workers) : null;
        const myMusicWorker = musicData ? findMusicMatch(me, musicData.workers) : null;
        const conflictDates = buildMyAssignmentDates(me, data, prayerData, musicData, myPrayerWorker, myMusicWorker);
        return (
          <PersonalEventModal
            initialEvent={editingPersonal || null}
            conflictDates={conflictDates}
            onSave={(saved) => {
              setPersonalEvents(
                editingPersonal
                  ? personalEvents.map(e => e.id === saved.id ? saved : e)
                  : [...personalEvents, saved]
              );
              setShowAddPersonal(false);
              setEditingPersonal(null);
            }}
            onDelete={(id) => {
              setPersonalEvents(personalEvents.filter(e => e.id !== id));
              setEditingPersonal(null);
            }}
            onClose={() => { setShowAddPersonal(false); setEditingPersonal(null); }}
          />
        );
      })()}

      {/* Games FAB — bottom left */}
      <button
        className="fab-live"
        onClick={() => setShowGames(true)}
        style={{
          position: 'fixed', bottom: 28, left: 24,
          width: 54, height: 54, borderRadius: '50%',
          background: G_ACCENT, color: 'white',
          border: 'none', cursor: 'pointer',
          display: 'flex', alignItems: 'center', justifyContent: 'center',
          fontSize: '1.375rem', lineHeight: 1,
          boxShadow: '0 4px 20px rgba(124,58,237,0.38)',
          zIndex: 25,
        }}
        title="Bible games"
        aria-label="Open Bible games"
      >🎮</button>

      {/* Personal events FAB — bottom right */}
      <button
        className="fab-live"
        onClick={() => setShowAddPersonal(true)}
        style={{
          position: 'fixed', bottom: 28, right: 24,
          width: 54, height: 54, borderRadius: '50%',
          background: 'var(--ink)', color: 'white',
          border: 'none', cursor: 'pointer',
          display: 'flex', alignItems: 'center', justifyContent: 'center',
          fontSize: '1.5rem', lineHeight: 1,
          boxShadow: '0 4px 20px rgba(0,0,0,0.22)',
          zIndex: 25,
        }}
        title="Add personal event"
        aria-label="Add personal event"
      >+</button>

      {/* Game Hub */}
      {showGames && <GameHub onClose={() => setShowGames(false)} />}

      <footer className="max-w-5xl mx-auto px-4 sm:px-6 py-12 text-xs ink-subtle text-center">
        FLCC Schedule OS · Members View · Data fetched live from <code className="font-mono">data.json</code>
      </footer>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
